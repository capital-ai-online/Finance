services:
  - type: web
    name: Finance
    runtime: docker
    repo: https://github.com/SvenKulessa/Finance
    branch: main
    region: frankfurt
    plan: starter
    numInstances: 1
    autoDeployTrigger: checksPass
    healthCheckPath: /healthz
    # ADR-0037: stay below Render's 30s default termination window so the application can
    # stop scheduling work, drain HTTP requests and exit before a forced termination.
    maxShutdownDelaySeconds: 30
    # Deploy-Härtung: echte Secrets (API-Keys, Service-Role-Key, Stripe-Secret/Webhook-Key,
    # TOTP-Verschlüsselungsschlüssel, SMTP-Passwort, OAuth-Client-Secrets ...) leben NICHT
    # mehr als einzelne `envVars`, sondern gebündelt in dieser Secret File. Der Inhalt wird
    # ausschließlich im Render-Dashboard gepflegt (Environment -> Secret Files), niemals hier
    # im Repo. Vollständige Schlüsselliste: scripts/security/secretFileManifest.ts
    # (Single Source of Truth, auch für den Boot-Validator server/validateRuntimeSecrets.ts
    # und das Env-Var-Abdeckungs-Gate in scripts/automation/verifyDeploymentReadiness.ts).
    secretFiles:
      - name: finance-secrets.env
    envVars:
      # Nur nicht-vertrauliche Konfiguration: clientseitig ohnehin sichtbare VITE_*-Werte,
      # öffentliche Publishable/Anon-Keys, OAuth-Client-IDs (das *_SECRET-Gegenstück liegt in
      # der Secret File oben) sowie reine Kennungen/Konfigurationswerte ohne Geheimnischarakter.
      - key: VITE_GA_MEASUREMENT_ID
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      # Canonical production billing contract. Monthly/yearly variables are the authoritative
      # keys used by server/stripe.ts. Legacy monthly aliases remain declared temporarily for
      # backwards compatibility and can be retired in a separately reviewed cleanup.
      - key: STRIPE_PRICE_ID_STARTER_MONTHLY
        sync: false
      - key: STRIPE_PRICE_ID_STARTER_YEARLY
        sync: false
      - key: STRIPE_PRICE_ID_PRO_MONTHLY
        sync: false
      - key: STRIPE_PRICE_ID_PRO_YEARLY
        sync: false
      - key: STRIPE_ID_FOUNDER
        sync: false
      - key: STRIPE_PRICE_ID_EXPORT_PDF
        sync: false
      - key: STRIPE_PRICE_ID_STARTER
        sync: false
      - key: STRIPE_PRICE_ID_PRO
        sync: false
      - key: STRIPE_PRICE_ID_ENTERPRISE
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: YOUTUBE_CLIENT_ID
        sync: false
      - key: TIKTOK_CLIENT_ID
        sync: false
      - key: INSTAGRAM_CLIENT_ID
        sync: false
      - key: X_CLIENT_ID
        sync: false
      - key: FACEBOOK_CLIENT_ID
        sync: false
      # ADR-0088 — Gemini Research Evidence Shadow. Default-off by Blueprint; no public route,
      # no score/ranking impact. GEMINI_API_KEY itself stays exclusively in finance-secrets.env.
      - key: GEMINI_RESEARCH_SHADOW_ENABLED
        value: "false"
      - key: GEMINI_RESEARCH_MODEL
        sync: false
      - key: GEMINI_RESEARCH_INPUT_USD_PER_M
        sync: false
      - key: GEMINI_RESEARCH_OUTPUT_USD_PER_M
        sync: false
      - key: GEMINI_RESEARCH_SEARCH_USD_PER_1K
        sync: false
      - key: GEMINI_RESEARCH_DAILY_COST_BUDGET_USD
        sync: false
      - key: GEMINI_RESEARCH_REQUESTS_PER_MINUTE
        value: "3"
      - key: GEMINI_RESEARCH_DAILY_REQUEST_BUDGET
        value: "50"
      - key: GEMINI_RESEARCH_DAILY_TOKEN_BUDGET
        value: "250000"
      - key: GEMINI_RESEARCH_TIMEOUT_MS
        value: "8000"
      - key: GEMINI_RESEARCH_CIRCUIT_FAILURE_THRESHOLD
        value: "3"
      - key: GEMINI_RESEARCH_CIRCUIT_COOLDOWN_MS
        value: "60000"
      - key: GEMINI_RESEARCH_MAX_OUTPUT_TOKENS
        value: "1200"
      - key: GEMINI_RESEARCH_THINKING_LEVEL
        value: "low"
