services:
  - type: web
    name: Finance
    runtime: docker
    repo: https://github.com/capital-ai-online/Finance
    branch: main
    region: frankfurt
    plan: starter
    numInstances: 1
    # Production deploy authority is GitHub CI: verified main -> supply-chain attestation ->
    # exact-SHA Render deploy hook -> post-deploy identity verification. Keep Render auto-deploy
    # off to avoid a second, un-attested deployment control plane.
    autoDeployTrigger: off
    healthCheckPath: /healthz
    maxShutdownDelaySeconds: 30
    # Production runtime configuration is sourced exclusively from Render environment variables.
    # Secret values remain Dashboard-managed and are declared here only as sync:false keys.
    envVars:
      - key: VITE_GA_MEASUREMENT_ID
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
      # Passkey activation remains gated by the owner's post-registration user test.
      - key: VITE_NATIVE_PASSKEY_LOGIN_ENABLED
        value: "false"
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_PRICE_ID_STARTER_MONTHLY
        sync: false
      - key: STRIPE_PRICE_ID_STARTER_YEARLY
        sync: false
      - key: STRIPE_PRICE_ID_PRO_MONTHLY
        sync: false
      - key: STRIPE_PRICE_ID_PRO_YEARLY
        sync: false
      - key: STRIPE_ID_FOUNDER
        sync: false
      - key: STRIPE_PRICE_ID_EXPORT_PDF
        sync: false
      - key: STRIPE_PRICE_ID_STARTER
        sync: false
      - key: STRIPE_PRICE_ID_PRO
        sync: false
      - key: STRIPE_PRICE_ID_ENTERPRISE
        sync: false
      # Server-only secrets. Values are configured in the Render Dashboard and never committed.
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Server-only management credential used for idempotent Auth config/template readback.
      - key: SUPABASE_MANAGEMENT_ACCESS_TOKEN
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: TOTP_ENCRYPTION_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ALPACA_API_KEY_ID
        sync: false
      - key: ALPACA_API_SECRET_KEY
        sync: false
      - key: ALPHA_VANTAGE_API_KEY
        sync: false
      - key: COIN_API_KEY
        sync: false
      - key: EODHD_API_KEY
        sync: false
      - key: TWELVEDATA_API_KEY
        sync: false
      - key: FRED_API_KEY
        sync: false
      - key: FMP_API_KEY
        sync: false
      - key: CAPITAL_AI_EDGE_TRUST_SECRET
        sync: false
      - key: DUNE_API_KEY
        sync: false
      - key: GOPLUS_API_KEY
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: METRICS_TOKEN
        sync: false
      # Server-only Google Analytics MCP readback. The service-account JSON is
      # materialized only into the runtime-private temp directory and never exposed.
      - key: GA4_MCP_SERVICE_ACCOUNT_KEY_JSON
        sync: false
      - key: GA4_MCP_PROJECT_ID
        sync: false
      - key: GA4_PID
        sync: false
      # Server-only GitHub Enterprise Actions settings readback. The PAT value is
      # configured in Render and is never committed or exposed to the frontend.
      - key: CAPITAL_AI_GITHUB_ENTERPRISE_SLUG
        value: "capital-ai-online"
      - key: CAPITAL_AI_GITHUB_ENTERPRISE_READ_PAT
        sync: false
      - key: YOUTUBE_CLIENT_SECRET
        sync: false
      - key: TIKTOK_CLIENT_SECRET
        sync: false
      - key: INSTAGRAM_CLIENT_SECRET
        sync: false
      - key: X_CLIENT_SECRET
        sync: false
      - key: FACEBOOK_CLIENT_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: YOUTUBE_CLIENT_ID
        sync: false
      - key: TIKTOK_CLIENT_ID
        sync: false
      - key: INSTAGRAM_CLIENT_ID
        sync: false
      - key: X_CLIENT_ID
        sync: false
      - key: FACEBOOK_CLIENT_ID
        sync: false
      # ADR-0089/ADR-0090 — server-only Gemini Research Shadow + Free-Tier-only hardening.
      # Gemini quotas are project-scoped, not API-key-scoped; no second key is configured merely
      # to multiply Free-Tier capacity.
      - key: GEMINI_RESEARCH_SHADOW_ENABLED
        value: "true"
      - key: GEMINI_RESEARCH_FREE_TIER_ONLY
        value: "true"
      - key: GEMINI_RESEARCH_FREE_TIER_ATTESTED
        value: "false"
      - key: GEMINI_RESEARCH_REQUESTS_PER_MINUTE
        value: "3"
      - key: GEMINI_RESEARCH_DAILY_REQUEST_BUDGET
        value: "50"
      - key: GEMINI_RESEARCH_DAILY_TOKEN_BUDGET
        value: "250000"
      - key: GEMINI_RESEARCH_TIMEOUT_MS
        value: "8000"
      - key: GEMINI_RESEARCH_CIRCUIT_FAILURE_THRESHOLD
        value: "3"
      - key: GEMINI_RESEARCH_CIRCUIT_COOLDOWN_MS
        value: "60000"
      - key: GEMINI_RESEARCH_MAX_OUTPUT_TOKENS
        value: "1200"
      - key: GEMINI_RESEARCH_THINKING_LEVEL
        value: "low"
      # SC-4 Dune evidence. DUNE_API_KEY is a server-only Render environment variable.
      # Default remains fail-closed FREE_TIER until entitlement is explicitly attested.
      # TRIAL_14D is supported only with explicit start/end timestamps + Owner attestation and
      # automatically blocks at expiry. Dataset entitlement never relaxes semantic query governance.
      - key: DUNE_ACCESS_MODE
        value: "FREE_TIER"
      - key: DUNE_FREE_TIER_ATTESTED
        value: "false"
      - key: DUNE_TRIAL_ATTESTED
        value: "false"
      - key: DUNE_TRIAL_STARTED_AT
        value: ""
      - key: DUNE_TRIAL_ENDS_AT
        value: ""
      # Semantic query keys are the single numeric query-ID authority. The provider derives its
      # allowlist from these values; there is no separate DUNE_ALLOWED_QUERY_IDS variable.
      - key: DUNE_QUERY_AAVE_ACTIVE_ADDRESSES
        value: "5833540"
      - key: DUNE_QUERY_AAVE_TREASURY
        value: "27230"
      - key: DUNE_QUERY_AAVE_ORACLE_RAW
        value: ""
      - key: DUNE_QUERY_AAVE_ADDRESS_RETENTION
        value: ""
      - key: DUNE_QUERY_AAVE_TOKEN_EMISSIONS
        value: ""
      - key: DUNE_QUERY_AAVE_LP_CONCENTRATION
        value: ""
      - key: DUNE_MAX_RESULT_ROWS
        value: "25"
