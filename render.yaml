services:
  - type: web
    name: capital-ai
    runtime: docker
    healthCheckPath: /healthz
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ALPHA_VANTAGE_KEY
        sync: false
      - key: NEWS_API_KEY
        sync: false
      - key: COINMARKETCAP_API_KEY
        sync: false
      # ARCH-AUDIT-0002 (J1-Folge): echte Index-Kurse/-Historie (server/fmpIndices.ts) - ohne
      # gesetzten Wert bleiben Indizes auf dem statischen Fallback-Snapshot (fail-open,
      # dataSource:'fallback' bleibt korrekt bestehen, kein Fehler).
      - key: FMP_API_KEY
        sync: false
      # ARCH-AUDIT-0002 (J3): providerübergreifender Rückfall auf Anthropic Claude, wenn beide
      # Gemini-Modelle fehlschlagen (server/anthropicClient.ts). Ohne gesetzten Wert bleibt der
      # Rückfall fail-open inaktiv - Agenten verhalten sich wie vor J3 (Gemini-only).
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: STRIPE_PRICE_ID_STARTER
        sync: false
      - key: STRIPE_PRICE_ID_PRO
        sync: false
      - key: STRIPE_PRICE_ID_ENTERPRISE
        sync: false
      # ADR-0003.5 Step-Up-Authentication: ohne diesen Wert schlaegt jede
      # TOTP-Ver-/Entschluesselung fehl (fail-closed, server/iam/secretCrypto.ts).
      - key: TOTP_ENCRYPTION_KEY
        sync: false
      # SMTP fuer System-E-Mails (Abo-Aktivierungsbestaetigungen, server/mailer.ts).
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      # ADR-0009 CORS Hardening: nur wirksam ausserhalb NODE_ENV=production.
      - key: AI_STUDIO_ORIGIN
        sync: false
      # ARCH-AUDIT-0002 (H6): statisches Bearer-Token fuer GET /metrics (Prometheus-
      # Exposition-Format, server/metrics.ts). Ohne gesetzten Wert ist /metrics
      # deaktiviert (fail-closed) - kein Default, kein Fallback auf "offen".
      - key: METRICS_TOKEN
        sync: false
      # ADR-0020 Social Media Direct Publishing: OAuth-2.0-Client-Credentials pro Plattform.
      # Setup je Plattform: docs/runbooks/SOCIAL_MEDIA_OAUTH_SETUP.md
      - key: YOUTUBE_CLIENT_ID
        sync: false
      - key: YOUTUBE_CLIENT_SECRET
        sync: false
      - key: TIKTOK_CLIENT_ID
        sync: false
      - key: TIKTOK_CLIENT_SECRET
        sync: false
      - key: INSTAGRAM_CLIENT_ID
        sync: false
      - key: INSTAGRAM_CLIENT_SECRET
        sync: false
      - key: X_CLIENT_ID
        sync: false
      - key: X_CLIENT_SECRET
        sync: false
      - key: FACEBOOK_CLIENT_ID
        sync: false
      - key: FACEBOOK_CLIENT_SECRET
        sync: false
