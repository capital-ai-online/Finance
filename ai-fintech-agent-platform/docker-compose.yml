version: '3.8'

services:
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - EVENT_BUS_PROVIDER=nats
      - NATS_URL=nats://nats:4222
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      - redis
      - nats

  platform-director:
    build:
      context: .
      dockerfile: Dockerfile
    command: npm run dev --workspace=platform-director
    ports:
      - "3005:3005"
    environment:
      - NODE_ENV=production
      - PORT_DIRECTOR=3005
      - REDIS_URL=redis://redis:6379
      - NATS_URL=nats://nats:4222
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      - redis
      - nats

  master-supervisor:
    build:
      context: .
      dockerfile: Dockerfile
    command: npm run dev --workspace=master-supervisor
    ports:
      - "3100:3100"
    environment:
      - NODE_ENV=production
      - PORT_SUPERVISOR=3100
      - REDIS_URL=redis://redis:6379
      - NATS_URL=nats://nats:4222
    depends_on:
      - redis
      - nats

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    command: npm run dev --workspace=dashboard
    ports:
      - "3015:3015"
    environment:
      - NODE_ENV=production
      - PORT_DASHBOARD=3015
      - REDIS_URL=redis://redis:6379
      - NATS_URL=nats://nats:4222
    depends_on:
      - redis
      - nats

  redis:
    image: redis:7-alpine
    container_name: fintech-redis-cache
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  nats:
    image: nats:2.10-alpine
    container_name: fintech-nats-eventbus
    ports:
      - "4222:4222"
      - "8222:8222"

volumes:
  redis_data:
