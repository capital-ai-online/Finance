component:
  name: Vocabulary
  displayName: Canonical Vocabulary Registry
  version: 1.0.0
  status: implemented
  lifecycle: Operational
  health: Unknown
  owner: Platform Director
  category: platform
  layer: CrossCutting
  repository: Finance

purposeDE: >
  Zentrale kanonische Registry fuer Terminologie, Naming, zweisprachige Wortwahl,
  Aliase und verbotene Begriffe innerhalb von CAPITAL-AI.
purposeEN: >
  Central canonical registry for terminology, naming, bilingual wording, aliases
  and forbidden terms across CAPITAL-AI.

responsibilities:
  - Canonical concept identities
  - German and English display mappings
  - Alias and forbidden-term governance
  - Deterministic collision detection
  - Read-only terminology resolution for downstream components

notResponsibleFor:
  - Active code renames
  - Event routing
  - Knowledge Graph storage
  - Traceability storage
  - Documentation generation

structure:
  Domain: Canonical concept contracts
  Interfaces: Public registry interfaces
  Registry: Canonical in-memory registry and seed concepts
  Services: Read-oriented terminology access
  Validators: Concept and collision validation
  Tests: Contract tests

dependencies:
  allowed: []
  forbidden:
    - src/platform/EventMesh/Core
    - src/platform/Knowledge
    - src/platform/Traceability
    - src/platform/Documentary

interfaces:
  - IVocabularyRegistry

references:
  ess:
    - ESS-0001-CONTRACTS
    - ESS-0012
    - ESS-0013
    - ESS-0017
    - ESS-0017-CONTRACTS
  adr:
    - ADR-0046
  documentation:
    - docs/architecture/VOCABULARY_GOVERNANCE_MIGRATION_ROADMAP.md

implementationStatusDE: >
  Phase-2-Kern implementiert. Keine aktiven Renames und keine neuen Event-Typen.
implementationStatusEN: >
  Phase 2 core implemented. No active renames and no new event types.
