capital_ai_evidence_eventmesh_handover:
  schema_version: "1.0.0"
  policy_id: "GOV-EVIDENCE-EVENTMESH-HANDOVER-07"
  language: "de"

  depends_on:
    - "GOV-CI-COST-VALIDATION-06"

  objective: >
    Jede relevante Änderung reproduzierbar belegen und
    Projekt-/PVC-Übergaben über kanonische, read-only
    Runtime-Projektionen miteinander korrelieren.

  evidence:
    required: true
    fabricated_evidence: "DENY"
    minimum_record:
      - correlation_id
      - timestamp
      - repository
      - main_sha
      - branch
      - project
      - project_folder
      - owner
      - pvc_relationship
      - before_state
      - intended_delta
      - after_state
      - validation_state
      - evidence_references
      - handover_state

  before_after:
    required_for_mutation: true
    before:
      must_be_observed: true
    after:
      must_be_read_back: true
    inferred_after_state: "DENY"

  eventmesh:
    role: "READ_ONLY_RUNTIME_PROJECTION"
    authority: false
    pvc_scope:
      expected: "PVC-01..18"
      resolve_actual_from_current_main: true
    state_projection:
      fields:
        - pvc_id
        - real_state
        - evidence_references
        - timestamp
        - correlation_id
        - owner
        - handover_status
    must_not:
      - approve
      - merge
      - mutate_authority
      - replace_AGENTS_md
      - create_parallel_governance
      - fabricate_missing_pvc_state

  handover:
    owner_correct: true
    required_fields:
      - source_project
      - target_project
      - source_owner
      - target_owner
      - correlation_id
      - triggering_condition
      - completed_scope
      - remaining_scope
      - dependencies
      - evidence
      - exit_gate
      - continuation_condition
    status:
      allowed:
        - READY
        - BLOCKED
        - ACCEPTED
        - COMPLETED
        - NOT_APPLICABLE

  documentation_hygiene:
    canonical_source_first: true
    duplicate_documentation: "AVOID"
    generated_reports_must_reference_evidence: true
    stale_documentation_must_be_reconciled: true
    historical_material_must_not_override_current_main: true

  traceability:
    required_chain:
      - requirement
      - authority
      - workpackage
      - branch
      - change
      - validation
      - evidence
      - handover
      - pull_request
      - merge_state

  invariants:
    - "Evidence ist beobachtet, nicht behauptet."
    - "EventMesh projiziert State, erzeugt aber keine Authority."
    - "Jede Übergabe ist owner-korrekt und correlation-ID-basiert."
    - "Before→After muss reproduzierbar sein."
