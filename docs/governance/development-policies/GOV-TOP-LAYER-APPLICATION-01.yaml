capital_ai_top_layer_governance:
  schema_version: "1.0.0"
  policy_id: "GOV-TOP-LAYER-APPLICATION-01"
  suite_id: "GOV-AUTONOMOUS-DEVELOPMENT-SUITE-01"
  status: "ACTIVE_AFTER_HUMAN_MERGE"
  language: "de"

  trust_root:
    source: "/AGENTS.md"
    resolution: "CURRENT_MAIN_ONLY"
    fail_closed: true

  applicability:
    scope: "ALL_CANONICAL_PROJECT_FOLDERS_EXCEPT_EXPLICIT_EXCEPTIONS"
    dynamic: true
    canonical_sources:
      - "docs/projects/README.md"
      - "docs/projects/PROJECT_VALUE_CHAIN.md"
    exceptions:
      - "CAPITAL-AI-SEC"
      - "CAPITAL-AI-QM"
      - "CAPITAL-AI-FINTECH"
      - "CAPITAL-AI-COMP"
    exception_policies:
      CAPITAL-AI-SEC: "GOV-SEC-AUTHORITY-EXCEPTION-01"
      CAPITAL-AI-QM: "GOV-QM-AUTHORITY-EXCEPTION-01"
      CAPITAL-AI-FINTECH: "GOV-FINTECH-AUTHORITY-EXCEPTION-01"
      CAPITAL-AI-COMP: "GOV-COMP-SUPPLYCHAIN-AUTHORITY-EXCEPTION-01"

  governing_principle:
    name: "USER_VISIBLE_TOP_LAYER_FIRST"
    intent: >
      Fuer alle nicht ausgenommenen Projektordner beginnt Priorisierung und
      End-to-End-Bewertung bei der real wahrnehmbaren Nutzeroberflaeche und dem
      nutzerwirksamen Ergebnis. Untere technische Layer dienen diesem Ziel,
      ohne bestehende Domain-, Security-, Daten-, Scoring- oder Plattform-
      Authority zu uebernehmen.

  hierarchy:
    - "USER_EXPERIENCE"
    - "USER_VISIBLE_CAPABILITY"
    - "DOMAIN_AND_AI_LOGIC"
    - "DATA_AND_PLATFORM"
    - "FOUNDATION_AND_GOVERNANCE"

  mandatory_context:
    - current_main_sha
    - current_project
    - current_project_folder
    - primary_owner
    - productive_pvc_relationship
    - project_roadmap_or_explicit_owner_scope
    - applicable_adr
    - applicable_ess
    - applicable_domain_contracts
    - affected_user_journey
    - affected_capabilities
    - cross_project_dependencies

  decision_rules:
    isolated_technical_optimization: "DENY_UNLESS_USER_VALUE_AND_E2E_CORRELATED"
    cross_cutting_project_pvc_invention: "DENY"
    parallel_architecture: "DENY"
    open_pr_as_authority: false
    historical_state_as_authority: false

  output:
    require:
      - user_visible_before_state
      - desired_user_visible_after_state
      - capability_impact
      - end_to_end_dependency_map
      - owner_correct_execution_scope
      - objective_exit_gate
