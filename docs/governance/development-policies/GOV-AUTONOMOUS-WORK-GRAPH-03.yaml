capital_ai_autonomous_work_graph:
  schema_version: "1.0.0"
  policy_id: "GOV-AUTONOMOUS-WORK-GRAPH-03"
  language: "de"

  depends_on:
    - "GOV-AUTONOMOUS-TRUST-ROOT-01"
    - "GOV-DYNAMIC-SCOPE-RESOLUTION-02"

  objective: >
    Repository-Arbeit wird nicht als starre DevelopmentChain,
    sondern als dynamischer, dependency-korrekter und
    eventgetriebener Work Graph ausgeführt.

  planning:
    source_of_truth: "CURRENT_MAIN"
    before_work:
      - discover_existing_implementation
      - discover_existing_open_source_solution
      - inspect_existing_controls
      - inspect_existing_tests
      - inspect_open_pull_request_correlations
      - inspect_active_writers
      - identify_dependencies
      - identify_owner_boundaries
      - identify_exit_evidence
    decomposition:
      unit: "ATOMIC_WORKPACKAGE"
      every_workpackage_requires:
        - id
        - owner
        - project_folder
        - pvc_relationship
        - trigger
        - dependencies
        - mutation_scope
        - exit_gate
        - evidence
        - handover_target

  execution_graph:
    ordering: "DEPENDENCY_FIRST"
    serial_when:
      - same_file_write_collision
      - same_authority_boundary
      - schema_dependency
      - migration_dependency
      - security_dependency
      - previous_exit_gate_required
    parallel_when:
      - independent_owner
      - independent_files
      - independent_controls
      - no_shared_mutation

  triggers:
    supported:
      - prerequisite_passed
      - evidence_materialized
      - dependency_merged
      - contract_available
      - owner_handover_received
      - external_state_changed

  no_wait_architecture:
    artificial_waits: false
    sleep_steps: false
    arbitrary_poll_delays: false
    blocked_work:
      action:
        - mark_BLOCKED
        - materialize_exact_unblock_condition
        - continue_independent_workpackages

  continuation:
    automatic_within_authorized_scope: true
    stop_only_on:
      - authority_conflict
      - required_human_approval
      - unresolved_security_boundary
      - unavailable_required_credential
      - destructive_action_not_authorized
      - no_safe_convergence_path

  duplicate_prevention:
    parallel_authorities: "DENY"
    duplicate_handover_systems: "DENY"
    duplicate_routing_layers: "DENY"
    duplicate_scoring_authorities: "DENY"
    duplicate_ci_control_planes: "DENY"

  roadmap_semantics:
    roadmap_is:
      - executable
      - event_triggered
      - owner_correct
      - evidence_driven
      - handover_ready
    roadmap_is_not:
      - passive_todo_list
      - fixed_wait_sequence
      - authority_source

  invariants:
    - "Abhängigkeiten bestimmen Reihenfolge, nicht historische Chat-Reihenfolge."
    - "Unabhängige Arbeit darf parallelisiert werden."
    - "Blockierte Arbeit erzeugt keine künstlichen Wartezeiten."
    - "Roadmaps werden als ausführbare Graphen behandelt."
