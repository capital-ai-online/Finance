capital_ai_top_layer_authority_hardening:
  schema_version: "1.0.0"
  policy_id: "GOV-TOP-LAYER-AUTHORITY-HARDENING-01"
  suite_id: "GOV-AUTONOMOUS-DEVELOPMENT-SUITE-01"
  status: "ACTIVE_AFTER_HUMAN_MERGE"
  language: "de"

  trust_root:
    source: "/AGENTS.md"
    resolution: "CURRENT_MAIN_ONLY"
    fail_closed: true

  supersession:
    mode: "GLOBAL_DEVELOPMENT_PROCEDURE_REPLACEMENT"
    supersedes:
      - "AUTH-GOV-DEVELOPMENT-CHAIN-EXECUTION"
      - "DevelopmentChain lifecycle and phase procedures"
      - "DevelopmentChain branch-lifecycle procedures"
      - "DevelopmentChain mutation-handoff procedures"
      - "DevelopmentChain documentation-freeze procedures"
      - "DevelopmentChain responsibility matrices"
      - "DevelopmentChain execution runbooks"
      - "DevelopmentChain roadmap/status procedure"
    preserved:
      - applicable_law_and_contractual_obligations
      - human_owner_decisions
      - accepted_adr_authority
      - active_ess_and_domain_contracts
      - security_and_compliance_controls
      - project_and_pvc_ownership
      - supply_chain_contracts
      - human_codeowner_merge
      - protected_external_mutation_boundaries
    stale_reference_behavior: "HISTORICAL_NON_AUTHORIZING"

  exclusivity:
    sole_development_policy_count: 8
    additional_development_policy_without_owner_decision: "DENY"
    provider_specific_policy_mirror: "DENY"
    parallel_control_plane: "DENY"
    parallel_project_router: "DENY"
    parallel_pvc_registry: "DENY"
    parallel_scoring_authority: "DENY"
    parallel_security_authority: "DENY"

  authority_resolution:
    current_main_only: true
    open_prs: "CORRELATION_INPUT_ONLY"
    branches: "CORRELATION_INPUT_ONLY"
    historical_documents: "SEARCH_OR_EVIDENCE_ONLY"
    ambiguity: "STOP"

  self_healing_governance:
    detect:
      - stale_developmentchain_reference
      - duplicate_development_policy
      - contradictory_project_mapping
      - stale_branch_baseline
      - duplicate_or_parallel_authority_claim
      - policy_path_drift
      - evidence_identity_drift
    auto_repair_when:
      - repair_is_reversible
      - no_owner_or_domain_authority_changes
      - no_security_or_compliance_control_is_weakened
      - no_protected_external_mutation_occurs
      - exact_repair_is_derivable_from_current_main
    action:
      - apply_smallest_repair
      - preserve_audit_trace
      - revalidate
      - recorrelate
    otherwise: "BLOCK_AND_ROUTE_TO_HUMAN_OR_OWNER_CORRECT_DOMAIN"

  conflict_rule:
    on_conflict_with_old_developmentchain: "THIS_SUITE_WINS_AFTER_HUMAN_MERGE"
    on_conflict_with_higher_law_contract_or_accepted_adr: "STOP_AND_ESCALATE"
    on_conflict_between_project_and_exception_policy: "EXCEPTION_POLICY_WINS_FOR_ITS_EXACT_SCOPE"

  no_self_bootstrap:
    introducing_pr_governed_by_previous_current_main_rules: true
    candidate_policy_may_authorize_own_merge: false
