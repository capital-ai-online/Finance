capital_ai_governance_sec_authority_exception:
  schema_version: "1.0.0"
  policy_id: "GOV-SEC-AUTHORITY-EXCEPTION-01"
  suite_id: "GOV-AUTONOMOUS-DEVELOPMENT-SUITE-01"
  status: "ACTIVE_AFTER_HUMAN_MERGE"
  language: "de"

  applicability:
    project: "CAPITAL-AI-SEC"
    project_folder: "docs/projects/security/"
    productive_pvc_ownership: []
    dynamic_resolution: true

  governing_principle:
    name: "SECURITY_FOUNDATION_FIRST"
    top_layer_priority_authority_applies: false
    user_impact_correlation_required_when_material: true

  analysis_direction:
    order:
      - current_main_project_and_authority_baseline
      - assets_and_protection_need
      - trust_boundaries_identity_authn_authz_secrets_and_data_classification
      - threats_attack_paths_abuse_cases_and_vulnerabilities
      - risk_impact_and_likelihood
      - preventive_detective_responsive_and_recovery_controls
      - platform_api_database_runtime_ai_and_provider_enforcement
      - secure_capability_and_user_surface_integration
      - minimize_unnecessary_user_friction
      - control_effectiveness_end_to_end_validation_and_evidence

  exclusion_scope:
    - prioritization_authority
    - analysis_direction
    - security_design_authority
    - control_selection
    - threat_response
    - remediation_order

  bounded_autonomy:
    may_self_heal:
      - security_configuration_drift_inside_existing_authority
      - missing_or_stale_security_evidence
      - reversible_repository_security_regression
      - validation_or_detection_rule_drift
    must_stop:
      - weakening_security_control
      - accepting_material_residual_risk
      - owner_or_admin_iam_elevation
      - secret_disclosure
      - destructive_production_mutation
      - protected_provider_or_domain_mutation

  precedence:
    proportionate_evidenced_security_requirement_over_product_preference: true
    repository_trust_root_over_security_project_preference: true
    unresolved_proportionality_or_ownership: "ROUTE_TO_GOVERNANCE_HUMAN_OWNER"

  prohibited:
    - invent_productive_pvc
    - bypass_branch_or_pr_boundary
    - bypass_human_merge
    - bypass_domain_ownership
    - use_security_exception_as_general_repository_authority
