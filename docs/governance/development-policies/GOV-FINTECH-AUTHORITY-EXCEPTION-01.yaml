capital_ai_governance_fintech_authority_exception:
  schema_version: "1.0.0"
  policy_id: "GOV-FINTECH-AUTHORITY-EXCEPTION-01"
  suite_id: "GOV-AUTONOMOUS-DEVELOPMENT-SUITE-01"
  status: "ACTIVE_AFTER_HUMAN_MERGE"
  language: "de"

  applicability:
    project: "CAPITAL-AI-FINTECH"
    project_folder: "docs/projects/fintech/"
    productive_pvc_ownership:
      - "PVC-12"
      - "PVC-13"
      - "PVC-14"
      - "PVC-15"
      - "PVC-16"
      - "PVC-17"
    dynamic_resolution: true

  governing_principle:
    name: "DOMAIN_SCORING_VALUE_CHAIN_FIRST"
    top_layer_priority_authority_applies: false
    user_visible_effect_is_integration_output_not_methodology_authority: true

  canonical_inputs:
    - "SC-MD-SPT-0001"
    - "ADR-0087"
    - "ADR-0032"
    - "ADR-0041"
    - "ESS-0016"
    - "applicable current FINTECH ADR/ESS/contracts"

  analysis_direction:
    order:
      - current_main_fintech_scope_and_owner
      - financial_domain_semantics
      - scoring_or_valuation_methodology
      - source_data_provenance_and_freshness
      - transformations_and_model_contracts
      - decision_chain_and_thresholds
      - reproducibility_and_explainability
      - downstream_api_and_ui_projection
      - end_to_end_user_effect_and_evidence

  bounded_autonomy:
    may_self_heal:
      - stale_provider_mapping_within_existing_contract
      - deterministic_scoring_pipeline_drift_without_methodology_change
      - evidence_or_version_metadata_drift
      - reversible_integration_regression_with_known_owner_correct_contract
    must_stop:
      - new_or_changed_scoring_methodology_without_authority
      - threshold_or_weight_change_without_domain_authority
      - synthetic_score_generation
      - unverified_market_data_substitution
      - money_billing_or_live_entitlement_mutation
      - ownership_transfer

  integrity_rules:
    frontend_may_represent_but_not_define_financial_semantics: true
    scoring_ui_must_match_scoring_engine_contract: true
    provider_failure_must_not_fabricate_financial_result: true
    technical_vc_and_organizational_pvc_must_remain_distinct: true

  prohibited:
    - top_layer_override_of_financial_methodology
    - parallel_scoring_authority
    - invented_financial_value_chain
    - unversioned_methodology_change
    - human_merge_bypass
