capital_ai_pr_closure_authority:
  schema_version: "1.0.0"
  policy_id: "GOV-PR-CLOSURE-AUTHORITY-08"
  language: "de"

  depends_on:
    - "GOV-AUTONOMOUS-TRUST-ROOT-01"
    - "GOV-DYNAMIC-SCOPE-RESOLUTION-02"
    - "GOV-AUTONOMOUS-WORK-GRAPH-03"
    - "GOV-ATOMIC-BRANCH-EXECUTION-04"
    - "GOV-SELF-HEALING-CONVERGENCE-05"
    - "GOV-CI-COST-VALIDATION-06"
    - "GOV-EVIDENCE-EVENTMESH-HANDOVER-07"

  pull_request:
    required_for_repository_change: true
    direct_main_change: "DENY"
    creation_gate:
      requires:
        - atomic_delta_complete
        - local_readback_complete
        - create_correlation_pass
        - current_main_recorrelated
        - owner_correct
        - intended_scope_only
    initial_state:
      preferred: "DRAFT"
    title:
      project_prefix_required: true
      pattern: "[<PROJECT>] <change-description>"

  review:
    human_review_preserved: true
    codeowner_review_preserved: true
    autonomous_system_must_not:
      - self_approve
      - bypass_required_review
      - dismiss_required_control
      - remove_branch_protection
      - weaken_required_check

  merge:
    auto_merge_by_guideline: false
    merge_authority: "EXTERNAL_REPOSITORY_GOVERNANCE"
    pre_merge_required:
      - required_checks_pass
      - required_reviews_pass
      - exact_head_valid
      - no_stale_main_conflict
      - evidence_complete
      - no_unresolved_security_issue
      - no_unresolved_owner_violation

  post_merge:
    verify:
      - merge_commit_or_main_sha
      - expected_files_present
      - expected_contract_state
      - production_identity_if_applicable
      - handover_completion

  closure:
    allowed_status:
      - COMPLETED
      - PARTIALLY_COMPLETED
      - BLOCKED
      - SUPERSEDED
    completed_requires:
      - intended_delta_materialized
      - required_validation_complete
      - evidence_materialized
      - required_handover_complete
      - repository_state_recorrelated

  chatgpt_execution:
    execution_surface: "CHATGPT_CHAT"
    autonomous_within_authority: true
    behavior:
      - resolve_context_before_action
      - execute_all_safe_available_steps
      - do_not_repeat_resolved_questions
      - do_not_create_artificial_waits
      - do_not_pause_between_deterministic_steps
      - continue_independent_work_when_other_work_is_blocked
      - prefer_smallest_executable_next_step
      - materialize_exact_blocker_when_blocked
      - correlate_result_back_to_current_main
    no_background_claims: true
    no_future_work_promises: true

  next_step_selection:
    order:
      - unresolved_required_control
      - blocking_dependency
      - highest_value_executable_delta
      - owner_correct_handover
      - evidence_completion
      - production_readback
    must_not_select:
      - preservation_only_work_when_excluded
      - already_completed_work
      - superseded_work
      - foreign_owner_mutation
      - unverified_historical_task
      - task_based_only_on_unmerged_pr_payload

  final_output:
    required:
      - current_main_reference
      - completed_scope
      - validation_status
      - evidence_status
      - remaining_blockers
      - owner_correct_next_step
    before_after_matrix:
      required_for_branch_work: true

  canonicality:
    these_8_policies_form:
      "CAPITAL_AI_AUTONOMOUS_DEVELOPMENT_GUIDELINE"
    legacy_development_chain:
      authority: false
      execution_role: false
      fallback_role: false
    single_development_model:
      enabled: true

  final_invariants:
    - "/AGENTS.md@CURRENT_MAIN bleibt oberste Repository-Authority."
    - "Die alte DevelopmentChain besitzt keine Ausführungsautorität mehr."
    - "Die acht Policies bilden gemeinsam die Entwicklungsrichtlinie."
    - "Branch-only bleibt verpflichtend."
    - "Self-Healing darf niemals Governance umgehen."
    - "Human-/CODEOWNER-Merge-Gates bleiben bestehen."
