capital_ai_self_healing_convergence:
  schema_version: "1.0.0"
  policy_id: "GOV-SELF-HEALING-CONVERGENCE-05"
  language: "de"

  depends_on:
    - "GOV-ATOMIC-BRANCH-EXECUTION-04"

  objective: >
    Erwarteten und beobachteten Zustand automatisch vergleichen,
    sichere Abweichungen innerhalb bestehender Authority beheben
    und reproduzierbare Konvergenz herstellen.

  state_model:
    desired_state:
      source:
        - CURRENT_MAIN
        - canonical_contracts
        - applicable_CTRL_controls
        - accepted_workpackage_exit_gate
    observed_state:
      sources:
        - repository_readback
        - test_results
        - runtime_readback
        - deployment_identity
        - provider_readback
        - evidence_state

  drift_detection:
    enabled: true
    classifications:
      - code_drift
      - contract_drift
      - configuration_drift
      - documentation_drift
      - runtime_drift
      - evidence_drift
      - dependency_drift
      - stale_head_drift

  remediation:
    autonomous_when:
      - within_existing_scope
      - reversible
      - owner_correct
      - no_security_boundary_change
      - no_compliance_authority_change
      - no_secret_expansion
      - no_destructive_data_operation
      - no_human_approval_required
    forbidden_autonomous_repairs:
      - bypass_required_review
      - weaken_security_control
      - suppress_failing_test
      - modify_test_only_to_hide_regression
      - invent_missing_evidence
      - fabricate_runtime_pass
      - override_owner
      - override_AGENTS_md
      - silently_change_public_contract
      - auto_merge

  repair_loop:
    mode: "BOUNDED_CONVERGENCE"
    sequence:
      - detect_delta
      - identify_root_cause
      - calculate_smallest_safe_fix
      - apply_atomic_fix
      - readback
      - validate
      - compare_desired_vs_observed
    retry_policy:
      blind_retry: false
      identical_retry_without_new_information: false
      root_cause_required_before_retry: true

  convergence:
    success_condition:
      - desired_state_equals_observed_state
      - required_validation_passed
      - required_evidence_materialized
      - no_unresolved_owner_violation
      - no_unresolved_control_violation
    no_safe_convergence:
      status: "BLOCKED"
      required_output:
        - root_cause
        - exact_failed_gate
        - affected_scope
        - required_unblock_condition
        - evidence_reference

  rollback:
    required_when:
      - remediation_increases_risk
      - validation_regresses
      - state_becomes_less_deterministic

  anti_patterns:
    - retry_until_green
    - test_suppression
    - timeout_increase_without_root_cause
    - arbitrary_sleep
    - silent_fallback
    - fake_success_state

  invariants:
    - "Self-Healing bedeutet Reparatur, nicht Umgehung."
    - "Konvergenz wird durch Readback nachgewiesen."
    - "Ein Fehler darf niemals durch Evidence-Manipulation grün werden."
