<!doctype html>
<html lang="de">
  <head>
    <!-- ADR-0042: CookieHub remains the consent source of truth. The first-party
         bridge sets Google Consent Mode v2 defaults to denied before CookieHub is
         initialized and injects GA4/AdSense only after the matching opt-in. -->
    <script
      nonce="__CSP_NONCE__"
      src="https://cdn.cookiehub.eu/c2/75f66920.js"
      data-consent-platform="CookieHub"
    ></script>
    <meta name="privacy-consent-manager" content="CookieHub" />
    <meta name="google-consent-mode" content="basic-v2" />
    <meta name="ga-measurement-id" content="%VITE_GA_MEASUREMENT_ID%" />
    <meta name="adsense-publisher-id" content="ca-pub-1353017943074018" />
    <script nonce="__CSP_NONCE__" src="/google-analytics-consent.js"></script>
    <script nonce="__CSP_NONCE__" src="/cookiehub-init.js"></script>
    <!-- ADR-0040: AMP Auto Ads belongs only on a separately validated AMP document.
         This React/Vite SPA uses the consent-gated normal AdSense loader above. -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Meta Tags -->
    <title>CAPITAL-AI Portal</title>
    <meta name="title" content="CAPITAL-AI Portal" />
    <meta name="description" content="Offizielles CAPITAL-AI Portal (Version 0.6.0) – Sichere quantitative Analysen, Compliance-Management, Asset-Scoring und automatisierte DSGVO-Dokumentation." />
    <meta name="keywords" content="Capital-AI, Sven Kulessa, Compliance, Audit, Finanzanalyse, quantitative Analyse, Datenschutz, Datenschutzerklärung, Impressum, Asset-Scoring, Multi-Agenten, ADR" />
    <meta name="author" content="Sven Kulessa" />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />

    <!-- SEO Q2: Canonical (preferred URL without trailing slash) -->
    <link rel="canonical" href="https://capital-ai.online/" />

    <!-- SEO Q3: Google Search Console verification — Owner inserts token after property creation.
         Example: <meta name="google-site-verification" content="YOUR_TOKEN_HERE" />
         DNS verification is an equally valid alternative and preferred when available. -->

    <!-- SEO D1: JSON-LD structured data (Rich-Results-DoD: ImageObject logo + SoftwareApplication offers) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://capital-ai.online/#organization",
          "name": "CAPITAL-AI",
          "url": "https://capital-ai.online/",
          "logo": {
            "@type": "ImageObject",
            "url": "https://capital-ai.online/favicon.svg",
            "contentUrl": "https://capital-ai.online/favicon.svg"
          },
          "founder": {
            "@type": "Person",
            "name": "Sven Kulessa"
          }
        },
        {
          "@type": "WebSite",
          "@id": "https://capital-ai.online/#website",
          "url": "https://capital-ai.online/",
          "name": "CAPITAL-AI Portal",
          "publisher": { "@id": "https://capital-ai.online/#organization" },
          "inLanguage": "de-DE"
        },
        {
          "@type": "SoftwareApplication",
          "@id": "https://capital-ai.online/#app",
          "name": "CAPITAL-AI Portal",
          "applicationCategory": "FinanceApplication",
          "operatingSystem": "Web",
          "url": "https://capital-ai.online/",
          "description": "Quantitative Analysen, Compliance-Management, Asset-Scoring und DSGVO-Dokumentation.",
          "publisher": { "@id": "https://capital-ai.online/#organization" },
          "image": "https://capital-ai.online/og-image.svg",
          "offers": {
            "@type": "Offer",
            "price": "0",
            "priceCurrency": "EUR",
            "availability": "https://schema.org/InStock"
          }
        }
      ]
    }
    </script>

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://capital-ai.online/" />
    <meta property="og:title" content="CAPITAL-AI Portal – Enterprise Compliance & AI Orchestration" />
    <meta property="og:description" content="Offizielles CAPITAL-AI Portal (Version 0.6.0) – Sichere quantitative Analysen, Compliance-Management, Asset-Scoring und automatisierte DSGVO-Dokumentation." />
    <meta property="og:image" content="https://capital-ai.online/og-image.svg" />
    <meta property="og:locale" content="de_DE" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />

    <meta property="twitter:title" content="CAPITAL-AI Portal – Enterprise Compliance & AI Orchestration" />
    <meta property="twitter:description" content="Offizielles CAPITAL-AI Portal (Version 0.6.0) – Sichere quantitative Analysen, Compliance-Management, Asset-Scoring und automatisierte DSGVO-Dokumentation." />
    <meta property="twitter:image" content="https://capital-ai.online/og-image.svg" />
