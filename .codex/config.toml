# CAPITAL-AI — OpenAI Codex project-scoped MCP execution-host configuration.
# Repository authority remains /AGENTS.md. This file configures execution mechanics only.
#
# Credential JSON is never stored here. Codex Cloud setup materializes encrypted setup-only
# secrets through .codex/setup-google-mcp-credentials.sh into ~/.capital-ai/*.json.

[mcp_servers.ga4-analytics]
command = "bash"
args = ["-lc", 'export GOOGLE_APPLICATION_CREDENTIALS="$HOME/.capital-ai/ga4-mcp-credentials.json"; export GOOGLE_PROJECT_ID="${GA4_MCP_PROJECT_ID:-}"; exec uvx --from analytics-mcp==0.7.0 analytics-mcp']
enabled = true
startup_timeout_sec = 30
tool_timeout_sec = 60

[mcp_servers.search-console]
command = "bash"
args = ["-lc", 'export GOOGLE_APPLICATION_CREDENTIALS="$HOME/.capital-ai/gsc-mcp-credentials.json"; exec npx -y @vmandic/searchconsole-mcp@1.1.1']
enabled = true
startup_timeout_sec = 30
tool_timeout_sec = 60
