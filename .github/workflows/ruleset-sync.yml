name: Ruleset Readback (main-production-protection)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ruleset-sync.yml'
      - 'scripts/security/rulesetSync.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ruleset-readback
  cancel-in-progress: false

# Owner decision 2026-08-30:
# - the repository-owned canonical desired ruleset is retired;
# - the current live GitHub ruleset remains in force;
# - this workflow performs provider readback only and has no apply mode.
#
# The RULESET secret is retained only because GitHub ruleset readback requires repository
# administration authority. No write request is implemented by scripts/security/rulesetSync.mjs.
jobs:
  readback:
    name: Aktiven Ruleset read-only auslesen
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: ruleset-admin
    permissions:
      contents: read
    steps:
      - name: Repository auschecken
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: main
          persist-credentials: false

      - name: Node.js einrichten
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0 / Node 24 action runtime
        with:
          node-version: '24.18.0'

      - name: Aktiven Provider-Zustand auslesen
        env:
          GH_TOKEN: ${{ secrets.RULESET }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          node scripts/security/rulesetSync.mjs plan >> "$GITHUB_STEP_SUMMARY"
