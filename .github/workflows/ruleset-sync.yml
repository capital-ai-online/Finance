name: Ruleset Sync (main-production-protection)

on:
  push:
    branches: [main]
    paths:
      - '.github/policies/main-production-protection.expected.json'
      - '.github/workflows/ruleset-sync.yml'
      - 'scripts/security/rulesetSync.mjs'
      - 'scripts/security/rulesetAdminEnvironment.mjs'
  workflow_dispatch:
    inputs:
      mode:
        description: 'plan = nur Diff; package_a = freigegebene Kernhaertung; full = kompletter Sollzustand'
        type: choice
        options:
          - plan
          - package_a
          - full
        default: plan

permissions:
  actions: read
  contents: read

concurrency:
  group: ruleset-sync
  cancel-in-progress: false

# Dieser Workflow ist bewusst NICHT zeitgesteuert. Ein Push auf main erzeugt ausschliesslich
# einen Plan/Diff. Administrative GitHub-Aenderungen sind nur ueber einen expliziten manuellen
# workflow_dispatch erlaubt. package_a ist absichtlich enger als full, damit eine Freigabe der
# Kernhaertung keine noch nicht freigegebenen Actions-/Security-Einstellungen mitsetzt.
#
# Trust boundary:
# - github.token mit actions:read liest ausschliesslich das ruleset-admin Environment.
# - RULESET bleibt der separate administrative Token fuer Ruleset-/Repository-Reads und Writes
#   sowie Environment-Writes in expliziten Apply-Modi.
# - Plan darf keine Environment-Mutation ausfuehren und benoetigt fuer Environment-Readback keine
#   Actions-Berechtigung auf dem administrativen RULESET-Token.
jobs:
  sync:
    name: Ruleset lesen, Diff anzeigen, ggf. anwenden
    # Environment-Secrets duerfen niemals an eine Branch-Version dieses Workflows gelangen.
    # Auch workflow_dispatch wird deshalb ausschliesslich auf dem geschuetzten main ausgefuehrt.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: ruleset-admin
    permissions:
      actions: read
      contents: read
    steps:
      - name: Repository auschecken
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: main
          persist-credentials: false

      - name: Node.js einrichten
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0 / Node 24 action runtime
        with:
          node-version: '24.18.0'

      - name: Ruleset lesen, Diff anzeigen, ggf. anwenden
        env:
          RULESET_ADMIN_READ_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ secrets.RULESET }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          MODE=plan
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            case "${{ inputs.mode }}" in
              package_a) MODE=apply-package-a ;;
              full) MODE=apply ;;
              plan) MODE=plan ;;
              *) echo 'Unbekannter ruleset-sync Modus' >&2; exit 1 ;;
            esac
          fi

          ENV_MODE=plan
          if [ "$MODE" != 'plan' ]; then
            ENV_MODE=apply
          fi
          node scripts/security/rulesetAdminEnvironment.mjs "$ENV_MODE" >> "$GITHUB_STEP_SUMMARY"
          node scripts/security/rulesetSync.mjs "$MODE" >> "$GITHUB_STEP_SUMMARY"
