name: Ruleset Sync (main-production-protection)

on:
  push:
    branches: [main]
    paths:
      - '.github/policies/main-production-protection.expected.json'
      - '.github/workflows/ruleset-sync.yml'
      - 'scripts/security/rulesetSync.mjs'
  workflow_dispatch:
    inputs:
      mode:
        description: 'plan = nur Diff; package_a = freigegebene Kernhaertung; full = kompletter Sollzustand'
        type: choice
        options:
          - plan
          - package_a
          - full
        default: plan

permissions:
  contents: read

concurrency:
  group: ruleset-sync
  cancel-in-progress: false

# Dieser Workflow ist bewusst NICHT zeitgesteuert. Ein Push auf main erzeugt ausschliesslich
# einen Plan/Diff. Administrative GitHub-Aenderungen sind nur ueber einen expliziten manuellen
# workflow_dispatch erlaubt. package_a ist absichtlich enger als full, damit eine Freigabe der
# Kernhaertung keine noch nicht freigegebenen Actions-/Security-Einstellungen mitsetzt.
jobs:
  sync:
    name: Ruleset lesen, Diff anzeigen, ggf. anwenden
    # Environment-Secrets duerfen niemals an eine Branch-Version dieses Workflows gelangen.
    # Auch workflow_dispatch wird deshalb ausschliesslich auf dem geschuetzten main ausgefuehrt.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: ruleset-admin
    permissions:
      contents: read
    steps:
      - name: Repository auschecken
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: main
          persist-credentials: false

      - name: Ruleset lesen, Diff anzeigen, ggf. anwenden
        env:
          GH_TOKEN: ${{ secrets.RULESET }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          MODE=plan
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            case "${{ inputs.mode }}" in
              package_a) MODE=apply-package-a ;;
              full) MODE=apply ;;
              plan) MODE=plan ;;
              *) echo 'Unbekannter ruleset-sync Modus' >&2; exit 1 ;;
            esac
          fi
          node scripts/security/rulesetSync.mjs "$MODE" >> "$GITHUB_STEP_SUMMARY"
