name: Controlled PR CI Autofix
run-name: >-
  CI #${{ github.event.workflow_run.run_number }} – deterministic PR autofix

# Privileged post-CI controller. The productive slice is intentionally limited
# to one deterministic repository-owned repair. Untrusted PR code is never
# executed in the contents:write job. The historical self-heal workflow stays
# suspended and no agentic/provider fixer is installed at runtime.
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions: {}

concurrency:
  group: controlled-pr-ci-autofix-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  plan:
    name: Read-only Failure-Plan
    if: >-
      github.event.workflow_run.repository.full_name == github.repository &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.path == '.github/workflows/ci.yml' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      skip: ${{ steps.pr.outputs.skip }}
      pr_number: ${{ steps.pr.outputs.pr_number }}
      base_sha: ${{ steps.pr.outputs.base_sha }}
      base_ref: ${{ steps.pr.outputs.base_ref }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
      head_ref: ${{ steps.pr.outputs.head_ref }}
      head_repo: ${{ steps.pr.outputs.head_repo }}
      changed_files_json: ${{ steps.pr.outputs.changed_files_json }}
      failed_steps_json: ${{ steps.pr.outputs.failed_steps_json }}
      attempts: ${{ steps.pr.outputs.attempts }}
      eligible: ${{ steps.autofix_plan.outputs.eligible }}
      engine: ${{ steps.autofix_plan.outputs.engine }}
      failure_class: ${{ steps.autofix_plan.outputs.failure_class }}
      attempt: ${{ steps.autofix_plan.outputs.attempt }}
      reason: ${{ steps.autofix_plan.outputs.reason }}
      run_readme_check: ${{ steps.autofix_plan.outputs.run_readme_check }}
    steps:
      - name: Exakten offenen PR und fehlgeschlagene CI-Schritte read-only auflösen
        id: pr
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0 / Node 24
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const repository = `${owner}/${repo}`;
            const run = context.payload.workflow_run;
            const headSha = run.head_sha;

            let candidates = run.pull_requests ?? [];
            if (candidates.length === 0) {
              candidates = await github.paginate(
                github.rest.repos.listPullRequestsAssociatedWithCommit,
                { owner, repo, commit_sha: headSha, per_page: 100 },
              );
            }

            const open = [];
            for (const candidate of candidates) {
              if (!candidate.number) continue;
              const { data: pr } = await github.rest.pulls.get({
                owner,
                repo,
                pull_number: candidate.number,
              });
              if (
                pr.state === 'open' &&
                pr.base.ref === 'main' &&
                pr.head.sha === headSha &&
                pr.head.repo?.full_name === repository
              ) {
                open.push(pr);
              }
            }

            if (open.length !== 1) {
              core.notice(`Controlled PR CI Autofix skipped: expected exactly one open same-repository PR for ${headSha}; observed=${open.length}.`);
              core.setOutput('skip', 'true');
              return;
            }

            const pr = open[0];
            const files = await github.paginate(
              github.rest.pulls.listFiles,
              { owner, repo, pull_number: pr.number, per_page: 100 },
            );
            const changedFiles = files.map((entry) => entry.filename);
            if (changedFiles.some((file) => /[\r\n]/.test(file))) {
              throw new Error('Changed-file name contains CR/LF; autofix identity encoding fails closed.');
            }

            const jobs = await github.paginate(
              github.rest.actions.listJobsForWorkflowRun,
              { owner, repo, run_id: run.id, filter: 'latest', per_page: 100 },
            );
            const buildAndTest = jobs.find((job) => job.name === 'build-and-test');
            if (!buildAndTest || buildAndTest.conclusion !== 'failure') {
              core.notice('Controlled PR CI Autofix skipped: build-and-test is not the failed job.');
              core.setOutput('skip', 'true');
              return;
            }
            const failedSteps = (buildAndTest.steps ?? [])
              .filter((step) => step.conclusion === 'failure')
              .map((step) => step.name);

            const commits = await github.paginate(
              github.rest.pulls.listCommits,
              { owner, repo, pull_number: pr.number, per_page: 100 },
            );
            const attempts = commits.filter((entry) =>
              String(entry.commit?.message ?? '').startsWith('fix(ci-autofix): attempt '),
            ).length;

            core.setOutput('skip', 'false');
            core.setOutput('pr_number', String(pr.number));
            core.setOutput('base_sha', pr.base.sha);
            core.setOutput('base_ref', pr.base.ref);
            core.setOutput('head_sha', pr.head.sha);
            core.setOutput('head_ref', pr.head.ref);
            core.setOutput('head_repo', pr.head.repo.full_name);
            core.setOutput('changed_files_json', JSON.stringify(changedFiles));
            core.setOutput('failed_steps_json', JSON.stringify(failedSteps));
            core.setOutput('attempts', String(attempts));

      - name: Trusted Autofix-Policy aus exaktem PR-Base-Snapshot auschecken
        if: steps.pr.outputs.skip != 'true'
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0 / Node 24
        with:
          ref: ${{ steps.pr.outputs.base_sha }}
          path: policy
          fetch-depth: 1
          persist-credentials: false

      - name: Node.js für trusted Planner einrichten
        if: steps.pr.outputs.skip != 'true'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0 / Node 24
        with:
          node-version: '24.18.0'

      - name: Fehlgeschlagene CI-Logs read-only und begrenzt erfassen
        id: failure_log
        if: steps.pr.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          raw="$RUNNER_TEMP/pr-ci-autofix-failed.raw.log"
          tail_file="$RUNNER_TEMP/pr-ci-autofix-failed.tail.log"
          safe="$RUNNER_TEMP/pr-ci-autofix-failed.safe.log"
          if ! gh run view "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed > "$raw" 2>/dev/null; then
            : > "$raw"
          fi
          tail -n 500 "$raw" > "$tail_file"
          head -c 100000 "$tail_file" | \
            perl -pe 's/\e\[[0-9;]*[A-Za-z]//g; s/(gh[pousr]_|github_pat_)[A-Za-z0-9_]{20,}/[REDACTED_GITHUB_TOKEN]/g; s/sk-(?:proj-)?[A-Za-z0-9_-]{20,}/[REDACTED_API_TOKEN]/g' \
            > "$safe"
          echo "path=$safe" >> "$GITHUB_OUTPUT"

      - name: Failure-Klasse und Autofix-Sicherheitskorridor bestimmen
        id: autofix_plan
        if: steps.pr.outputs.skip != 'true'
        working-directory: policy
        env:
          CHANGED_FILES_JSON: ${{ steps.pr.outputs.changed_files_json }}
          FAILED_STEPS_JSON: ${{ steps.pr.outputs.failed_steps_json }}
          FAILURE_LOG_PATH: ${{ steps.failure_log.outputs.path }}
          AUTOFIX_ATTEMPTS: ${{ steps.pr.outputs.attempts }}
          PR_BASE_REF: ${{ steps.pr.outputs.base_ref }}
          PR_HEAD_REF: ${{ steps.pr.outputs.head_ref }}
          PR_HEAD_REPO: ${{ steps.pr.outputs.head_repo }}
          REPOSITORY: ${{ github.repository }}
        run: node scripts/pr/planPrCiAutofix.mjs

      - name: Autofix-Plan zusammenfassen
        if: steps.pr.outputs.skip != 'true'
        env:
          ELIGIBLE: ${{ steps.autofix_plan.outputs.eligible }}
          ENGINE: ${{ steps.autofix_plan.outputs.engine }}
          FAILURE_CLASS: ${{ steps.autofix_plan.outputs.failure_class }}
          ATTEMPT: ${{ steps.autofix_plan.outputs.attempt }}
          REASON: ${{ steps.autofix_plan.outputs.reason }}
        shell: bash
        run: |
          {
            echo '## Controlled PR CI Autofix — Plan'
            echo
            echo "- eligible: \`$ELIGIBLE\`"
            echo "- engine: \`$ENGINE\`"
            echo "- failure_class: \`$FAILURE_CLASS\`"
            echo "- attempt: \`$ATTEMPT\` / 2"
            echo "- reason: \`$REASON\`"
            echo '- productive fixer: `deterministic-readme` only'
            echo '- agentic/provider fixer: `NOT_MATERIALIZED / HELD`'
            echo
            echo 'Human/CODEOWNER merge authority is unchanged. No synthetic build-and-test result is created.'
          } >> "$GITHUB_STEP_SUMMARY"

  deterministic-patch:
    name: Deterministic Patch erzeugen
    needs: [plan]
    if: >-
      needs.plan.result == 'success' &&
      needs.plan.outputs.skip != 'true' &&
      needs.plan.outputs.eligible == 'true' &&
      needs.plan.outputs.engine == 'deterministic-readme'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      patch_sha: ${{ steps.bundle.outputs.patch_sha }}
    steps:
      - name: Trusted Base-Policy auschecken
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0 / Node 24
        with:
          ref: ${{ needs.plan.outputs.base_sha }}
          path: policy
          fetch-depth: 1
          persist-credentials: false

      - name: Exakten PR-Head ohne Write-Credential auschecken
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0 / Node 24
        with:
          ref: ${{ needs.plan.outputs.head_sha }}
          path: work
          fetch-depth: 1
          persist-credentials: false

      - name: Node.js einrichten
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0 / Node 24
        with:
          node-version: '24.18.0'

      - name: Reproduzierbare Toolchain ohne Lifecycle-Skripte installieren
        working-directory: work
        run: npm ci --ignore-scripts

      - name: Deterministische README-Projektion aus trusted Base reparieren
        working-directory: work
        run: npx --no-install tsx ../policy/scripts/automation/syncReadmeVersions.ts

      - name: Patch gegen trusted-base Autofix-Policy prüfen
        env:
          WORKTREE: work
          AUTOFIX_ENGINE: deterministic-readme
        run: node policy/scripts/pr/verifyPrCiAutofixPatch.mjs

      - name: Patch und finale README als kurzlebiges Bundle materialisieren
        id: bundle
        shell: bash
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/pr-ci-autofix-bundle"
          mkdir -p "$bundle"
          git -C work diff --binary HEAD -- > "$bundle/pr-ci-autofix.patch"
          test -s "$bundle/pr-ci-autofix.patch"
          cp work/README.md "$bundle/README.md"
          sha="$(sha256sum "$bundle/pr-ci-autofix.patch" | awk '{print $1}')"
          echo "patch_sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Kurzlebiges validierbares Bundle hochladen
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-ci-autofix-${{ github.event.workflow_run.id }}
          path: ${{ runner.temp }}/pr-ci-autofix-bundle/
          if-no-files-found: error
          retention-days: 1

  validate:
    name: Patch in read-only Runner revalidieren
    needs: [plan, deterministic-patch]
    if: >-
      needs.plan.result == 'success' &&
      needs.deterministic-patch.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    outputs:
      validated_tree: ${{ steps.identity.outputs.validated_tree }}
      validated_blob: ${{ steps.identity.outputs.validated_blob }}
    steps:
      - name: Trusted Base-Policy auschecken
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0 / Node 24
        with:
          ref: ${{ needs.plan.outputs.base_sha }}
          path: policy
          fetch-depth: 1
          persist-credentials: false

      - name: Exakten PR-Head ohne Write-Credential auschecken
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0 / Node 24
        with:
          ref: ${{ needs.plan.outputs.head_sha }}
          path: work
          fetch-depth: 1
          persist-credentials: false

      - name: Validierungs-Bundle laden
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pr-ci-autofix-${{ github.event.workflow_run.id }}
          path: ${{ runner.temp }}/pr-ci-autofix

      - name: Patch-Hash verifizieren und anwenden
        env:
          EXPECTED_PATCH_SHA: ${{ needs.deterministic-patch.outputs.patch_sha }}
        shell: bash
        run: |
          set -euo pipefail
          patch="$RUNNER_TEMP/pr-ci-autofix/pr-ci-autofix.patch"
          observed="$(sha256sum "$patch" | awk '{print $1}')"
          test "$observed" = "$EXPECTED_PATCH_SHA"
          git -C work apply --check "$patch"
          git -C work apply "$patch"
          cmp --silent work/README.md "$RUNNER_TEMP/pr-ci-autofix/README.md"

      - name: Angewendeten Patch erneut gegen trusted-base Policy prüfen
        env:
          WORKTREE: work
          AUTOFIX_ENGINE: deterministic-readme
        run: node policy/scripts/pr/verifyPrCiAutofixPatch.mjs

      - name: Node.js einrichten
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0 / Node 24
        with:
          node-version: '24.18.0'

      - name: Reproduzierbare Toolchain ohne Lifecycle-Skripte installieren
        working-directory: work
        shell: bash
        run: |
          set -euo pipefail
          env -u GITHUB_TOKEN -u GH_TOKEN -u ACTIONS_RUNTIME_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_URL -u ACTIONS_CACHE_URL -u ACTIONS_RESULTS_URL npm ci --ignore-scripts

      - name: Deterministische README-Projektion revalidieren
        working-directory: work
        shell: bash
        run: env -u GITHUB_TOKEN -u GH_TOKEN -u ACTIONS_RUNTIME_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_URL -u ACTIONS_CACHE_URL -u ACTIONS_RESULTS_URL npm run readme:check

      - name: Exakten validierten Git-Tree und README-Blob binden
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          git -C work add README.md
          tree="$(git -C work write-tree)"
          blob="$(git -C work hash-object README.md)"
          echo "validated_tree=$tree" >> "$GITHUB_OUTPUT"
          echo "validated_blob=$blob" >> "$GITHUB_OUTPUT"

  apply-and-push:
    name: Validierten README-Tree atomar auf PR-Branch schreiben
    needs: [plan, deterministic-patch, validate]
    if: >-
      needs.plan.result == 'success' &&
      needs.deterministic-patch.result == 'success' &&
      needs.validate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: write
      pull-requests: read
    concurrency:
      group: capital-ai-pr-writer-${{ needs.plan.outputs.pr_number }}
      cancel-in-progress: false
    steps:
      - name: Validiertes Bundle ohne PR-Checkout laden
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pr-ci-autofix-${{ github.event.workflow_run.id }}
          path: ${{ runner.temp }}/pr-ci-autofix

      - name: Exact-Head revalidieren und ausschließlich den validierten Tree schreiben
        id: write
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0 / Node 24
        env:
          PR_NUMBER: ${{ needs.plan.outputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ needs.plan.outputs.head_sha }}
          EXPECTED_HEAD_REF: ${{ needs.plan.outputs.head_ref }}
          EXPECTED_BASE_SHA: ${{ needs.plan.outputs.base_sha }}
          EXPECTED_HEAD_REPO: ${{ needs.plan.outputs.head_repo }}
          EXPECTED_PATCH_SHA: ${{ needs.deterministic-patch.outputs.patch_sha }}
          EXPECTED_VALIDATED_TREE: ${{ needs.validate.outputs.validated_tree }}
          EXPECTED_VALIDATED_BLOB: ${{ needs.validate.outputs.validated_blob }}
          ATTEMPT: ${{ needs.plan.outputs.attempt }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          ARTIFACT_DIR: ${{ runner.temp }}/pr-ci-autofix
        with:
          script: |
            const fs = require('fs');
            const crypto = require('crypto');
            const path = require('path');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pullNumber = Number(process.env.PR_NUMBER);

            const patchPath = path.join(process.env.ARTIFACT_DIR, 'pr-ci-autofix.patch');
            const readmePath = path.join(process.env.ARTIFACT_DIR, 'README.md');
            const patchBytes = fs.readFileSync(patchPath);
            const readme = fs.readFileSync(readmePath, 'utf8');
            const observedPatchSha = crypto.createHash('sha256').update(patchBytes).digest('hex');
            if (observedPatchSha !== process.env.EXPECTED_PATCH_SHA) throw new Error('Patch artifact SHA-256 drift.');

            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: pullNumber });
            const { data: main } = await github.rest.repos.getBranch({ owner, repo, branch: 'main' });
            if (pr.state !== 'open' || pr.base.ref !== 'main') throw new Error('PR is no longer open against main.');
            if (pr.head.sha !== process.env.EXPECTED_HEAD_SHA) throw new Error(`PR head drift: expected=${process.env.EXPECTED_HEAD_SHA} observed=${pr.head.sha}`);
            if (pr.head.ref !== process.env.EXPECTED_HEAD_REF) throw new Error('PR head branch changed.');
            if (pr.head.repo?.full_name !== process.env.EXPECTED_HEAD_REPO) throw new Error('PR head repository changed.');
            if (pr.base.sha !== process.env.EXPECTED_BASE_SHA) throw new Error(`PR base snapshot drift: expected=${process.env.EXPECTED_BASE_SHA} observed=${pr.base.sha}`);
            if (main.commit.sha !== process.env.EXPECTED_BASE_SHA) throw new Error(`current main drift: expected=${process.env.EXPECTED_BASE_SHA} observed=${main.commit.sha}`);

            const { data: ref } = await github.rest.git.getRef({ owner, repo, ref: `heads/${pr.head.ref}` });
            if (ref.object.sha !== process.env.EXPECTED_HEAD_SHA) throw new Error('Branch ref drift before write.');

            const { data: headCommit } = await github.rest.git.getCommit({ owner, repo, commit_sha: process.env.EXPECTED_HEAD_SHA });
            const { data: blob } = await github.rest.git.createBlob({ owner, repo, content: readme, encoding: 'utf-8' });
            if (blob.sha !== process.env.EXPECTED_VALIDATED_BLOB) throw new Error(`Validated README blob mismatch: expected=${process.env.EXPECTED_VALIDATED_BLOB} observed=${blob.sha}`);

            const { data: tree } = await github.rest.git.createTree({
              owner,
              repo,
              base_tree: headCommit.tree.sha,
              tree: [{ path: 'README.md', mode: '100644', type: 'blob', sha: blob.sha }],
            });
            if (tree.sha !== process.env.EXPECTED_VALIDATED_TREE) throw new Error(`Validated tree mismatch: expected=${process.env.EXPECTED_VALIDATED_TREE} observed=${tree.sha}`);

            const { data: commit } = await github.rest.git.createCommit({
              owner,
              repo,
              message: `fix(ci-autofix): attempt ${process.env.ATTEMPT} for CI run ${process.env.SOURCE_RUN_ID}`,
              tree: tree.sha,
              parents: [process.env.EXPECTED_HEAD_SHA],
            });
            await github.rest.git.updateRef({
              owner,
              repo,
              ref: `heads/${pr.head.ref}`,
              sha: commit.sha,
              force: false,
            });
            core.setOutput('new_head_sha', commit.sha);

      - name: Ergebnis zusammenfassen
        env:
          PREVIOUS_HEAD: ${{ needs.plan.outputs.head_sha }}
          NEW_HEAD: ${{ steps.write.outputs.new_head_sha }}
        shell: bash
        run: |
          {
            echo '## Controlled PR CI Autofix — deterministic write complete'
            echo
            echo "- previous PR head: \`$PREVIOUS_HEAD\`"
            echo "- new PR head: \`$NEW_HEAD\`"
            echo '- patch: SHA-256 + Git-tree + README-blob bound before write'
            echo '- privileged job: no PR checkout and no PR/dependency code execution'
            echo '- merge: still Human/CODEOWNER-only'
            echo '- required check: no synthetic `build-and-test` PASS was created'
            echo '- autonomous CI retrigger: not claimed; `GITHUB_TOKEN` recursion behavior remains a separate controller concern'
          } >> "$GITHUB_STEP_SUMMARY"
