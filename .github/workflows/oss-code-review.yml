name: OSS Code Review (SUPERSEDED)
run-name: OSS Code Review — SUPERSEDED / no runner

# OWNER-DIRECTED SUPERSESSION — 2026-09-21
#
# The former automatic semantic OSS review lane is retired
# because its pull-request fan-out consumed disproportionate GitHub Actions runner
# minutes. This file is intentionally retained as a fail-closed tombstone instead
# of deleting a previously automatic workflow through the workflow-deletion gate.
#
# Invariants:
# - no pull_request, pull_request_target, push, schedule, workflow_run or other
#   automatic trigger;
# - no repository/model/write permission;
# - the only job is statically false and therefore allocates no hosted runner;
# - historical OSS review evidence remains historical evidence only;
# - independent required Security, Quality, Governance and build controls remain
#   outside this superseded workflow.
on:
  workflow_dispatch:

permissions: {}

jobs:
  superseded:
    name: OSS review retired — no runner allocation
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: Inert supersession marker
        run: echo "OSS Code Review is superseded; this step is intentionally unreachable."
