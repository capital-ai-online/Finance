name: PR859 Dependency Audit Fix

on:
  push:
    branches:
      - agent/operations-edge-telemetry-product-intel-20260910

permissions:
  contents: write

concurrency:
  group: pr859-dependency-audit-fix
  cancel-in-progress: false

jobs:
  materialize-lockfile-fix:
    name: Materialize audited lockfile fix
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: agent/operations-edge-telemetry-product-intel-20260910
          fetch-depth: 1
          persist-credentials: false

      - name: Set up repository Node baseline
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24.18.0'
          registry-url: 'https://registry.npmjs.org'

      - name: Update only targeted production dependencies in lockfile
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
          NPM_CONFIG_IGNORE_SCRIPTS: 'true'
        run: |
          set -euo pipefail
          npm update multer nodemailer --package-lock-only

          if ! git diff --quiet -- package.json; then
            echo 'package.json changed unexpectedly' >&2
            git diff -- package.json >&2
            exit 1
          fi

          mapfile -t CHANGED < <(git diff --name-only)
          if [[ "${#CHANGED[@]}" -ne 1 || "${CHANGED[0]}" != 'package-lock.json' ]]; then
            printf 'Unexpected dependency update surface:\n' >&2
            printf ' - %s\n' "${CHANGED[@]}" >&2
            exit 1
          fi

          node <<'NODE'
          const lock = require('./package-lock.json');
          const packages = lock.packages || {};
          const expected = {
            'node_modules/multer': '2.3.0',
            'node_modules/nodemailer': '9.1.1',
          };
          for (const [key, version] of Object.entries(expected)) {
            if (packages[key]?.version !== version) {
              throw new Error(`${key} expected ${version}, observed ${packages[key]?.version ?? '<missing>'}`);
            }
          }
          NODE

      - name: Verify production dependency audit
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
          NPM_CONFIG_IGNORE_SCRIPTS: 'true'
        run: npm audit --omit=dev --audit-level=high

      - name: Commit lockfile and self-remove helper workflow
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_BRANCH: agent/operations-edge-telemetry-product-intel-20260910
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add package-lock.json
          git rm -- .github/workflows/pr859-dependency-audit-fix.yml

          mapfile -t STAGED < <(git diff --cached --name-only)
          if [[ "${#STAGED[@]}" -ne 2 ]]; then
            printf 'Unexpected staged surface:\n' >&2
            printf ' - %s\n' "${STAGED[@]}" >&2
            exit 1
          fi

          git diff --cached --check
          git commit -m 'fix(security): update multer and nodemailer lock'

          AUTH_HEADER="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH_HEADER" \
            push origin "HEAD:refs/heads/$TARGET_BRANCH"
