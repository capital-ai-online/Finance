name: Container Security

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write

concurrency:
  group: dependency-readme-finalizer-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  image-security:
    if: github.head_ref == 'agent/operations-runtime-deps-20260917'
    name: Temporary README dependency projection finalizer
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Configure Node 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24.20.0'
          cache: npm

      - name: Synchronize deterministic README projection
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run readme:sync
          npm run readme:check

      - name: Restore workflow and commit README projection
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git show "$BASE_SHA:.github/workflows/container-security.yml" > .github/workflows/container-security.yml
          git add README.md .github/workflows/container-security.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '[CAPITAL-AI-OPS] sync dependency version projection'
          git push origin "HEAD:$HEAD_BRANCH"
