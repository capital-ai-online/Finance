name: Container Security

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_ghcr:
        description: 'Publish the exact scanned main image to private GHCR after all security gates pass'
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

concurrency:
  # PR cancellation is scoped to the exact event snapshot so a late stale event cannot cancel a newer head/base run.
  group: >-
    ${{ github.event_name == 'pull_request'
        && format('container-security-pr-{0}-{1}-{2}', github.event.pull_request.number, github.event.pull_request.head.sha, github.event.pull_request.base.sha)
        || format('container-security-{0}', github.ref) }}
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  TRIVY_VERSION: v0.74.0
  GHCR_IMAGE: ghcr.io/capital-ai-online/finance

jobs:
  image-security:
    name: Hardened image / HIGH+CRITICAL CVE gate
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: PR-Snapshot gegen Live-Head/Base korrelieren
        id: snapshot
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0 / Node 24
        env:
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        with:
          script: |
            const normalizeSha = (value) => String(value || '').trim().toLowerCase();
            const prNumber = Number(process.env.EVENT_PR_NUMBER);
            const eventHead = normalizeSha(process.env.EVENT_HEAD_SHA);
            const eventBase = normalizeSha(process.env.EVENT_BASE_SHA);
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            const liveHead = normalizeSha(pr.head?.sha);
            const liveBase = normalizeSha(pr.base?.sha);
            const currentSnapshot = pr.state === 'open' && liveHead === eventHead && liveBase === eventBase;
            core.setOutput('current_snapshot', currentSnapshot ? 'true' : 'false');
            if (!currentSnapshot) {
              core.notice(`Stale PR event ignored before checkout/container work: event head/base=${eventHead.slice(0, 12)}/${eventBase.slice(0, 12)}, live=${liveHead.slice(0, 12)}/${liveBase.slice(0, 12)}.`);
            }

      - name: Stale PR-Event kostensparend beenden
        if: github.event_name == 'pull_request' && steps.snapshot.outputs.current_snapshot == 'false'
        run: echo 'Stale PR-Snapshot erkannt; kein Checkout, Docker-Build oder CVE-Scan für veraltete Evidence.'

      - name: Repository auschecken
        if: github.event_name != 'pull_request' || steps.snapshot.outputs.current_snapshot == 'true'
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Container-Security-Scope kostensparend bestimmen
        id: scope
        if: github.event_name != 'pull_request' || steps.snapshot.outputs.current_snapshot == 'true'
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          GHCR_PUBLISH_ENABLED: ${{ vars.GHCR_DIGEST_PUBLISH_ENABLED }}
        run: |
          set -euo pipefail
          required=true
          if [ "$EVENT_NAME" = 'pull_request' ]; then
            required=false
            while IFS= read -r path; do
              case "$path" in
                Dockerfile|.dockerignore|package.json|package-lock.json|server/runtime/viteProductionDisabled.ts|scripts/security/verifyDockerHardening.mjs|.github/workflows/container-security.yml)
                  required=true
                  break
                  ;;
              esac
            done < <(git diff --name-only "$BASE_SHA...$SOURCE_SHA")
          elif [ "$EVENT_NAME" = 'push' ] && [ "$GHCR_PUBLISH_ENABLED" != 'true' ]; then
            required=false
            if ! [[ "$BEFORE_SHA" =~ ^[0-9a-f]{40}$ ]] || [ "$BEFORE_SHA" = '0000000000000000000000000000000000000000' ]; then
              required=true
            else
              while IFS= read -r path; do
                case "$path" in
                  Dockerfile|.dockerignore|package.json|package-lock.json|server/runtime/viteProductionDisabled.ts|scripts/security/verifyDockerHardening.mjs|.github/workflows/container-security.yml)
                    required=true
                    break
                    ;;
                esac
              done < <(git diff --name-only "$BEFORE_SHA...$SOURCE_SHA")
            fi
          fi
          echo "required=$required" >> "$GITHUB_OUTPUT"
          echo "Container security heavy path required=$required"

      - name: Kostensparpfad — kein Container-Scope
        if: (github.event_name != 'pull_request' || steps.snapshot.outputs.current_snapshot == 'true') && steps.scope.outputs.required != 'true'
        run: echo 'Kein containerrelevanter Diff; Required-Check-Kontext bleibt PASS ohne Docker-Build/CVE-Scan.'

      - name: Docker-Hardening-Invarianten prüfen
        if: steps.scope.outputs.required == 'true'
        run: node scripts/security/verifyDockerHardening.mjs

      - name: Lockfile-Identität und exakten Production-Graph erfassen
        if: steps.scope.outputs.required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/container-security
          sha256sum package-lock.json | tee artifacts/container-security/package-lock.sha256
          npm ci --omit=dev --ignore-scripts
          npm ls --omit=dev --all --json --package-lock-only > artifacts/container-security/npm-production-graph.json
          sha256sum artifacts/container-security/npm-production-graph.json | tee artifacts/container-security/npm-production-graph.sha256

      - name: Lockfile-/Production-Graph gegen aktuelle npm Advisories prüfen
        if: steps.scope.outputs.required == 'true'
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p artifacts/container-security
          npm audit --omit=dev --json > artifacts/container-security/npm-audit-production.json
          status=$?
          NPM_AUDIT_STATUS="$status" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const report = JSON.parse(fs.readFileSync('artifacts/container-security/npm-audit-production.json', 'utf8'));
          const auditStatus = Number(process.env.NPM_AUDIT_STATUS);
          if (!Number.isInteger(auditStatus) || auditStatus < 0) {
            throw new Error(`Invalid npm audit exit status: ${String(process.env.NPM_AUDIT_STATUS)}`);
          }
          if (report?.error || report?.statusCode || report?.message && !report?.metadata?.vulnerabilities) {
            throw new Error(`npm audit returned an advisory-service error response: ${JSON.stringify({
              statusCode: report?.statusCode ?? null,
              error: report?.error ?? null,
              message: report?.message ?? null,
            })}`);
          }
          const v = report?.metadata?.vulnerabilities;
          if (!v || typeof v !== 'object' || Array.isArray(v)) {
            throw new Error('npm audit response is missing metadata.vulnerabilities; refusing false-clean evidence.');
          }
          const fields = ['critical', 'high', 'moderate', 'low', 'total'];
          for (const field of fields) {
            if (!Number.isFinite(Number(v[field])) || Number(v[field]) < 0) {
              throw new Error(`npm audit response has invalid vulnerabilities.${field}: ${String(v[field])}`);
            }
          }
          const summary = {
            critical: Number(v.critical),
            high: Number(v.high),
            moderate: Number(v.moderate),
            low: Number(v.low),
            total: Number(v.total),
          };

          const vulnerabilities = Object.entries(report.vulnerabilities ?? {})
            .map(([name, finding]) => ({
              name,
              severity: String(finding?.severity ?? 'unknown'),
              isDirect: Boolean(finding?.isDirect),
              fixAvailable: finding?.fixAvailable ?? false,
              via: Array.isArray(finding?.via)
                ? finding.via.map(item => typeof item === 'string' ? item : {
                    source: item?.source ?? null,
                    name: item?.name ?? null,
                    severity: item?.severity ?? null,
                    title: item?.title ?? null,
                    url: item?.url ?? null,
                  })
                : [],
            }))
            .sort((a, b) => a.name.localeCompare(b.name));

          const remediationCandidates = vulnerabilities
            .filter(item => item.fixAvailable !== false)
            .map(item => ({
              ...item,
              codeRelevant: item.isDirect || ['moderate', 'high', 'critical'].includes(item.severity),
              requiresReview: true,
            }));

          fs.writeFileSync(
            'artifacts/container-security/npm-audit-summary.json',
            JSON.stringify(summary, null, 2) + '\n',
          );
          fs.writeFileSync(
            'artifacts/container-security/npm-audit-remediation-candidates.json',
            JSON.stringify({
              schemaVersion: '1.0.0',
              policy: {
                ignoreCodeRelevantSuggestions: false,
                autoForceFix: false,
                blockingSeverities: ['high', 'critical'],
                reviewRule: 'All fixAvailable findings are evidence; code-relevant candidates require explicit remediation review.',
              },
              candidates: remediationCandidates,
            }, null, 2) + '\n',
          );

          for (const item of remediationCandidates.filter(item => item.codeRelevant)) {
            console.warn(`::warning::npm audit remediation candidate: ${item.name} severity=${item.severity} direct=${item.isDirect} fixAvailable=${JSON.stringify(item.fixAvailable)}`);
          }

          if (auditStatus !== 0 && summary.total === 0) {
            throw new Error(`npm audit exited ${auditStatus} without vulnerability evidence; advisory check did not complete cleanly.`);
          }
          if (auditStatus > 1) {
            throw new Error(`npm audit exited with unexpected status ${auditStatus}; refusing to classify infrastructure/tool failure as vulnerability-only output.`);
          }
          if (summary.critical > 0 || summary.high > 0) {
            console.error(`::error::Production lock graph contains ${summary.critical} CRITICAL and ${summary.high} HIGH npm advisories.`);
            process.exit(1);
          }
          NODE
          node_status=$?
          if [ "$node_status" -ne 0 ]; then exit "$node_status"; fi
          # npm audit may use a non-zero code for vulnerability classes already evaluated above.
          # Any malformed/unavailable report is caught by the JSON parser and fails closed.
          printf 'npm audit exit code: %s\n' "$status" > artifacts/container-security/npm-audit-exit-code.txt

      - name: Produktionsimage aus exakt diesem Commit bauen und OCI-Metadaten erfassen
        if: steps.scope.outputs.required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$SOURCE_SHA" = "$(git rev-parse HEAD)"
          mkdir -p artifacts/container-security
          docker buildx build \
            --load \
            --build-arg RELEASE_SOURCE_COMMIT="$SOURCE_SHA" \
            --metadata-file artifacts/container-security/buildx-metadata.json \
            --iidfile artifacts/container-security/image-id.txt \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$SOURCE_SHA" \
            --tag "capital-ai-security:$SOURCE_SHA" \
            .
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const metadata = JSON.parse(fs.readFileSync('artifacts/container-security/buildx-metadata.json', 'utf8'));
          const digest = metadata['containerimage.digest'];
          if (typeof digest !== 'string' || !/^sha256:[0-9a-f]{64}$/.test(digest)) {
            throw new Error(`Missing/invalid OCI containerimage.digest: ${String(digest)}`);
          }
          fs.writeFileSync('artifacts/container-security/oci-image-digest.txt', `${digest}\n`);
          NODE
          printf '%s\n' "$SOURCE_SHA" > artifacts/container-security/source-sha.txt

      - name: Runtime-Metadaten und Angriffsfläche fail-closed prüfen
        if: steps.scope.outputs.required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          image="capital-ai-security:$SOURCE_SHA"
          test "$(docker image inspect "$image" --format '{{.Config.User}}')" = 'capitalai'
          test "$(docker image inspect "$image" --format '{{json .Config.Cmd}}')" = '["node","dist/server.cjs"]'
          test "$(docker image inspect "$image" --format '{{json .Config.ExposedPorts}}')" = '{"10000/tcp":{}}'
          docker image inspect "$image" --format '{{range .Config.Env}}{{println .}}{{end}}' | grep -Fxq 'NODE_ENV=production'
          docker image inspect "$image" --format '{{json .Config.Healthcheck.Test}}' | grep -Fq '${PORT:-10000}/healthz'
          docker run --rm --entrypoint sh "$image" -c '
            set -eu
            test "$(id -u)" != "0"
            for path in /app/node_modules /app/dist /app/server /app/package.json /app/package-lock.json; do
              test "$(stat -c "%U:%G" "$path")" = "root:root"
              test ! -w "$path"
            done
            test -z "$(find /app/node_modules /app/dist /app/server \( -type f -o -type d \) -perm -0002 -print -quit)"
            test -w /app/uploads
            test -w /tmp/capitalai
            test ! -e /app/dist/server.cjs.map
            test ! -e /app/node_modules/esbuild
            test ! -e /app/node_modules/@esbuild
            test ! -e /app/node_modules/vite
            test ! -e /app/node_modules/@vitejs
            test ! -e /app/node_modules/@tailwindcss
            test ! -e /app/node_modules/tailwindcss
            grep -Fq VITE_DEV_SERVER_DISABLED_IN_PRODUCTION_BUNDLE /app/dist/server.cjs
            for path in /usr/local/lib/node_modules/npm /usr/local/lib/node_modules/corepack /usr/local/bin/npm /usr/local/bin/npx /usr/local/bin/corepack /usr/local/bin/yarn /usr/local/bin/yarnpkg /usr/local/bin/pnpm /usr/local/bin/pnpx; do
              test ! -e "$path"
              test ! -L "$path"
            done
          '

      - name: Backend-Sourcemap aus allen finalen Image-Layern ausschließen
        if: steps.scope.outputs.required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          image="capital-ai-security:$SOURCE_SHA"
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          docker image save "$image" -o "$tmpdir/image.tar"
          tar -xf "$tmpdir/image.tar" -C "$tmpdir"
          mapfile -t layers < <(jq -r '.[0].Layers[]' "$tmpdir/manifest.json")
          for layer in "${layers[@]}"; do
            if tar -tf "$tmpdir/$layer" | grep -Eq '(^|/)app/dist/server\.cjs\.map$'; then
              echo "::error::Backend source map is recoverable from final image layer $layer"
              exit 1
            fi
          done

      - name: CycloneDX-SBOM aus dem finalen geprunten Runtime-Image erzeugen
        if: steps.scope.outputs.required == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: capital-ai-security:${{ env.SOURCE_SHA }}
          format: cyclonedx
          output: artifacts/container-security/runtime-image-sbom.cdx.json
          vuln-type: 'os,library'

      - name: Gepinnte Trivy-CLI-Version fail-closed verifizieren
        if: steps.scope.outputs.required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          actual="$(trivy --version | sed -n 's/^Version: //p' | head -n 1)"
          expected="${TRIVY_VERSION#v}"
          test -n "$actual"
          test "$actual" = "$expected"
          printf 'Verified Trivy CLI %s\n' "$actual" | tee artifacts/container-security/trivy-version.txt

      - name: Final-SBOM hashen und Source/Lock/OCI-Kette beweisbar binden
        if: steps.scope.outputs.required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sha256sum artifacts/container-security/runtime-image-sbom.cdx.json | tee artifacts/container-security/runtime-image-sbom.sha256
          node --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          const sha256 = (path) => crypto.createHash('sha256').update(fs.readFileSync(path)).digest('hex');
          const sourceSha = fs.readFileSync('artifacts/container-security/source-sha.txt', 'utf8').trim();
          const lockSha = sha256('package-lock.json');
          const graphSha = sha256('artifacts/container-security/npm-production-graph.json');
          const sbomSha = sha256('artifacts/container-security/runtime-image-sbom.cdx.json');
          const ociDigest = fs.readFileSync('artifacts/container-security/oci-image-digest.txt', 'utf8').trim();
          const evidence = {
            schemaVersion: '1.0.0',
            sourceCommit: sourceSha,
            packageLockSha256: lockSha,
            productionGraphSha256: graphSha,
            finalSbomSha256: sbomSha,
            ociImageDigest: ociDigest,
            chain: [
              'package-lock.json',
              'npm ci --omit=dev',
              'Dockerfile hardening/pruning',
              'FINAL CycloneDX SBOM',
              'SBOM SHA-256',
              'OCI image digest',
              'Git SHA / Release Manifest',
            ],
          };
          if (!/^[0-9a-f]{40}$/.test(sourceSha)) throw new Error('invalid source commit binding');
          if (!/^sha256:[0-9a-f]{64}$/.test(ociDigest)) throw new Error('invalid OCI digest binding');
          fs.writeFileSync('artifacts/container-security/final-supply-chain-binding.json', JSON.stringify(evidence, null, 2) + '\n');
          NODE

      - name: Vollständige CVE-Evidence für finales OCI-Image erzeugen
        if: steps.scope.outputs.required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          image="capital-ai-security:$SOURCE_SHA"
          trivy image \
            --scanners vuln \
            --vuln-type os,library \
            --format json \
            --output artifacts/container-security/trivy-runtime-vulnerabilities.json \
            "$image"
          sha256sum artifacts/container-security/trivy-runtime-vulnerabilities.json | tee artifacts/container-security/trivy-runtime-vulnerabilities.sha256

      - name: Fixbare HIGH/CRITICAL Schwachstellen im finalen Image blockieren
        if: steps.scope.outputs.required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          trivy image \
            --scanners vuln \
            --vuln-type os,library \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            --format table \
            "capital-ai-security:$SOURCE_SHA"

      - name: Exakt geprüftes Main-Image für privilegierten Publisher serialisieren
        if: github.ref == 'refs/heads/main' && vars.GHCR_DIGEST_PUBLISH_ENABLED == 'true' && steps.scope.outputs.required == 'true' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.actor == 'SvenKulessa' && inputs.publish_ghcr == true))
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/production-image
          docker save "capital-ai-security:$SOURCE_SHA" | gzip -1 > artifacts/production-image/image.tar.gz
          cp artifacts/container-security/oci-image-digest.txt artifacts/production-image/
          cp artifacts/container-security/source-sha.txt artifacts/production-image/
          cp artifacts/container-security/runtime-image-sbom.cdx.json artifacts/production-image/
          cp artifacts/container-security/runtime-image-sbom.sha256 artifacts/production-image/
          cp artifacts/container-security/final-supply-chain-binding.json artifacts/production-image/

      - name: Exakt geprüftes Main-Image kurzlebig an Publisher übergeben
        if: github.ref == 'refs/heads/main' && vars.GHCR_DIGEST_PUBLISH_ENABLED == 'true' && steps.scope.outputs.required == 'true' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.actor == 'SvenKulessa' && inputs.publish_ghcr == true))
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-image-${{ env.SOURCE_SHA }}
          path: artifacts/production-image/
          retention-days: 1
          if-no-files-found: error

      - name: Container-Security-Evidence unveränderlich zum Run ablegen
        if: always() && steps.scope.outputs.required == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-security-${{ env.SOURCE_SHA }}
          path: artifacts/container-security/
          retention-days: 90
          if-no-files-found: error

  publish-ghcr:
    name: Signed private GHCR image / exact digest
    needs: image-security
    if: ${{ needs.image-security.result == 'success' && github.ref == 'refs/heads/main' && vars.GHCR_DIGEST_PUBLISH_ENABLED == 'true' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.actor == 'SvenKulessa' && inputs.publish_ghcr == true)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Repository auschecken
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Exakt geprüftes Image-Artefakt laden
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: production-image-${{ github.sha }}
          path: artifacts/production-image

      - name: Build-Identität vor Registry-Mutation fail-closed prüfen
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat artifacts/production-image/source-sha.txt)" = "$GITHUB_SHA"
          expected_digest="$(cat artifacts/production-image/oci-image-digest.txt)"
          test "${expected_digest#sha256:}" != "$expected_digest"
          test "${#expected_digest}" -eq 71
          gunzip -c artifacts/production-image/image.tar.gz | docker load
          test "$(docker image inspect "capital-ai-security:$GITHUB_SHA" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$GITHUB_SHA"
          test "$(docker image inspect "capital-ai-security:$GITHUB_SHA" --format '{{ index .Config.Labels "org.opencontainers.image.source" }}')" = "https://github.com/$GITHUB_REPOSITORY"

      - name: GHCR mit repository-scoped GITHUB_TOKEN authentifizieren
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Exakt geprüftes Image ohne latest-Authority publizieren
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          expected_digest="$(cat artifacts/production-image/oci-image-digest.txt)"
          docker tag "capital-ai-security:$GITHUB_SHA" "$GHCR_IMAGE:$GITHUB_SHA"
          docker push "$GHCR_IMAGE:$GITHUB_SHA" | tee artifacts/production-image/ghcr-push.txt
          pushed_digest="$(sed -n 's/.*digest: \(sha256:[0-9a-f]\{64\}\).*/\1/p' artifacts/production-image/ghcr-push.txt | tail -n 1)"
          test -n "$pushed_digest"
          test "$pushed_digest" = "$expected_digest"
          printf '%s\n' "$pushed_digest" > artifacts/production-image/ghcr-image-digest.txt
          echo "digest=$pushed_digest" >> "$GITHUB_OUTPUT"

      - name: Private GHCR-Package und Digest-Pull verifizieren
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY%%/*}"
          package_name="finance"
          visibility="$(gh api -H 'Accept: application/vnd.github+json' "/orgs/$owner/packages/container/$package_name" --jq '.visibility')"
          test "$visibility" = 'private'
          image_ref="$GHCR_IMAGE@$IMAGE_DIGEST"
          docker image rm "$GHCR_IMAGE:$GITHUB_SHA" "capital-ai-security:$GITHUB_SHA" >/dev/null
          docker pull "$image_ref"
          test "$(docker image inspect "$image_ref" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$GITHUB_SHA"
          printf '%s\n' "$image_ref" > artifacts/production-image/ghcr-image-reference.txt
          printf 'PASS\n' > artifacts/production-image/ghcr-private-pull.txt

      - name: Gepinnten Cosign-Installer verwenden
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: SLSA-Provenance-Predicate für exakten Image-Digest erzeugen
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          const sha256 = (path) => crypto.createHash('sha256').update(fs.readFileSync(path)).digest('hex');
          const predicate = {
            buildDefinition: {
              buildType: 'https://capital-ai.online/build-types/github-actions-container/v1',
              externalParameters: {
                repository: process.env.GITHUB_REPOSITORY,
                sourceCommit: process.env.GITHUB_SHA,
                workflowRef: process.env.GITHUB_WORKFLOW_REF,
                image: process.env.GHCR_IMAGE,
                imageDigest: process.env.IMAGE_DIGEST,
              },
              internalParameters: {},
              resolvedDependencies: [{
                uri: `git+https://github.com/${process.env.GITHUB_REPOSITORY}@${process.env.GITHUB_SHA}`,
                digest: { gitCommit: process.env.GITHUB_SHA },
              }],
            },
            runDetails: {
              builder: {
                id: `https://github.com/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}/attempts/${process.env.GITHUB_RUN_ATTEMPT}`,
              },
              metadata: {
                invocationId: `https://github.com/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}/attempts/${process.env.GITHUB_RUN_ATTEMPT}`,
              },
              byproducts: [{
                name: 'runtime-image-sbom.cdx.json',
                digest: { sha256: sha256('artifacts/production-image/runtime-image-sbom.cdx.json') },
              }],
            },
          };
          fs.writeFileSync(
            'artifacts/production-image/ghcr-slsa-provenance.json',
            JSON.stringify(predicate, null, 2) + '\n',
          );
          NODE

      - name: Image keyless signieren und Provenance/SBOM attestieren
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          image_ref="$GHCR_IMAGE@$IMAGE_DIGEST"
          cosign sign --yes "$image_ref"
          cosign attest --yes --type slsaprovenance1 \
            --predicate artifacts/production-image/ghcr-slsa-provenance.json \
            "$image_ref"
          cosign attest --yes --type cyclonedx \
            --predicate artifacts/production-image/runtime-image-sbom.cdx.json \
            "$image_ref"

      - name: Signatur und Attestations fail-closed verifizieren
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          image_ref="$GHCR_IMAGE@$IMAGE_DIGEST"
          identity="https://github.com/$GITHUB_REPOSITORY/.github/workflows/container-security.yml@refs/heads/main"
          issuer="https://token.actions.githubusercontent.com"
          cosign verify \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer "$issuer" \
            "$image_ref" > artifacts/production-image/cosign-signature-verification.json
          cosign verify-attestation \
            --type slsaprovenance1 \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer "$issuer" \
            "$image_ref" > artifacts/production-image/cosign-provenance-verification.json
          cosign verify-attestation \
            --type cyclonedx \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer "$issuer" \
            "$image_ref" > artifacts/production-image/cosign-sbom-verification.json
          printf 'PASS\n' > artifacts/production-image/cosign-signature.txt
          printf 'PASS\n' > artifacts/production-image/provenance-attestation.txt
          printf 'PASS\n' > artifacts/production-image/sbom-attestation.txt

      - name: Render-Digest-Referenz vorbereiten, aber nicht deployen
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          node scripts/operations/renderDigestImageReference.mjs \
            --image "$GHCR_IMAGE" \
            --digest "$IMAGE_DIGEST" \
            > artifacts/production-image/render-image-reference.txt

      - name: GHCR-/Digest-Evidence unveränderlich ablegen
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ghcr-digest-evidence-${{ github.sha }}
          path: artifacts/production-image/
          retention-days: 90
          if-no-files-found: error