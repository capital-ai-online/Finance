name: Container Security

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write

concurrency:
  group: dependency-lock-finalizer-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  image-security:
    if: github.head_ref == 'agent/operations-runtime-deps-20260917'
    name: Temporary dependency lock finalizer
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Configure Node 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24.20.0'
          cache: npm

      - name: Resolve exact npm lock and validate
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts
          npm ci --ignore-scripts
          npm ls --all
          npm run lint
          npm run build:raw

      - name: Restore temporary workflow surfaces and commit generated lockfile
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git show "$BASE_SHA:.github/workflows/container-security.yml" > .github/workflows/container-security.yml
          git show "$BASE_SHA:.github/workflows/capital-ai-ci-shadow.yml" > .github/workflows/capital-ai-ci-shadow.yml
          rm -f .github/workflows/tmp-dependency-lock-resolve.yml
          git add package-lock.json .github/workflows/container-security.yml .github/workflows/capital-ai-ci-shadow.yml .github/workflows/tmp-dependency-lock-resolve.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '[CAPITAL-AI-OPS] materialize npm-resolved dependency lockfile'
          git push origin "HEAD:$HEAD_BRANCH"
