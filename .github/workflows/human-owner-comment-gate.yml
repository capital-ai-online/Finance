name: Human Owner Comment Gate
run-name: >-
  ${{ github.event_name == 'issue_comment'
      && format('PR #{0} – Human-/Owner-Verifikation', github.event.issue.number)
      || format('Human-Gate nach Governance-Run #{0}', github.event.workflow_run.id) }}

on:
  workflow_run:
    workflows: ["PR Governance"]
    types: [completed]
  issue_comment:
    types: [edited]

# Kein globales Schreibrecht. Jeder Job erhält nur die für seinen exakten
# Trust-Boundary-Schritt erforderlichen Berechtigungen.
permissions: {}

concurrency:
  group: human-owner-comment-gate-${{ github.event.issue.number || github.event.workflow_run.pull_requests[0].number || github.run_id }}
  cancel-in-progress: false

jobs:
  seed-or-reset:
    name: Human-Gate-Kommentar erzeugen / zurücksetzen
    if: >-
      ${{
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.pull_requests[0].number != null
      }}
    permissions:
      contents: read
      issues: read
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Head-gebundenen Approval-Kommentar synchronisieren
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          PR_HEAD_SHA: ${{ github.event.workflow_run.pull_requests[0].head.sha }}
          PR_BASE_REF: ${{ github.event.workflow_run.pull_requests[0].base.ref }}
          GOVERNANCE_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          test "$PR_BASE_REF" = "main"
          printf '%s' "$PR_HEAD_SHA" | grep -Eq '^[0-9a-f]{40}$'
          test "$PR_HEAD_SHA" = "$GOVERNANCE_HEAD_SHA"

          # Trusted workflow_run liefert PR und Head bereits im Event-Payload. Hier wird bewusst
          # kein PR-Kandidatencode ausgeführt und keine zusätzliche Pull-Request-API-Abfrage benötigt.
          body="$(cat <<EOF
          <!-- CAPITAL_AI_HUMAN_GATE -->
          <!-- CAPITAL_AI_HUMAN_GATE_HEAD_SHA: ${PR_HEAD_SHA} -->
          ## Human / Owner Verifikation

          > Nur diese zwei Häkchen setzt der Human/Owner. Der Kommentar ist an den aktuellen PR-Head gebunden. Ein neuer Commit setzt ihn nach erfolgreichem Governance-Run automatisch zurück. Vor dem zweiten Haken muss für denselben Head ein Owner-Review mit exakt \`💪\` oder \`okay\` vorliegen.

          - [ ] Human/Owner: vollständigen PR-Diff geprüft.
          - [ ] Human/Owner: alle geänderten Dateien im Tab Files changed als Viewed markiert.
          EOF
          )"

          comment_id="$(
            gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" \
              --jq '.[] | select((.body // "") | contains("<!-- CAPITAL_AI_HUMAN_GATE -->")) | .id' \
              | head -n 1
          )"

          if [ -n "$comment_id" ]; then
            gh api --method PATCH \
              "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" \
              -f body="$body" >/dev/null
            echo "Human-Gate-Kommentar #${comment_id} auf Head ${PR_HEAD_SHA} zurückgesetzt."
          else
            gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
              -f body="$body" >/dev/null
            echo "Human-Gate-Kommentar für PR #${PR_NUMBER}@${PR_HEAD_SHA} erzeugt."
          fi

  human-verification:
    name: Human-/Owner-Verifikation
    if: >-
      ${{
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        github.actor == 'SvenKulessa' &&
        contains(github.event.comment.body, '<!-- CAPITAL_AI_HUMAN_GATE -->') &&
        (
          contains(github.event.comment.body, '- [x] Human/Owner: vollständigen PR-Diff geprüft.') ||
          contains(github.event.comment.body, '- [X] Human/Owner: vollständigen PR-Diff geprüft.')
        ) &&
        (
          contains(github.event.comment.body, '- [x] Human/Owner: alle geänderten Dateien im Tab Files changed als Viewed markiert.') ||
          contains(github.event.comment.body, '- [X] Human/Owner: alle geänderten Dateien im Tab Files changed als Viewed markiert.')
        )
      }}
    permissions:
      actions: write
      checks: write
      contents: read
      issues: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Human-Evidence head-genau verifizieren und Checks reservieren
        id: verify
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
          COMMENT_ID: ${{ github.event.comment.id }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          EXPECTED_OWNER: SvenKulessa
          EVENT_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          test "$EVENT_ACTOR" = "$EXPECTED_OWNER"

          read -r current_head base_ref pr_state <<< "$(
            gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
              --jq '[.head.sha, .base.ref, .state] | @tsv'
          )"
          test "$base_ref" = "main"
          test "$pr_state" = "open"

          approval_head="$(
            python3 - <<'PY'
          import os, re
          body = os.environ['COMMENT_BODY']
          match = re.search(r'<!--\s*CAPITAL_AI_HUMAN_GATE_HEAD_SHA:\s*([0-9a-f]{40})\s*-->', body, re.I)
          if not match:
              raise SystemExit(1)
          print(match.group(1).lower())
          PY
          )"
          test "$approval_head" = "$current_head"

          live_body="$(gh api "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}" --jq '.body // ""')"
          test "$live_body" = "$COMMENT_BODY"

          review_id="$(
            PR_HEAD_SHA="$current_head" gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews?per_page=100" \
              --jq '.[] | select(.user.login == env.EXPECTED_OWNER and .commit_id == env.PR_HEAD_SHA and (((((.body // "") | gsub("^[[:space:]]+|[[:space:]]+$"; "")) | ascii_downcase) == "okay") or (((.body // "") | gsub("^[[:space:]]+|[[:space:]]+$"; "")) == "💪"))) | .id' \
              | head -n 1
          )"
          test -n "$review_id"

          # Die One-Shot-Reservierung wird ausschließlich über die vom Gate selbst gesetzte
          # external_id identifiziert. Der gleichnamige `build-and-test`-Job aus ci.yml liegt
          # auf demselben Head und darf die Reservierung weder belegen noch verdrängen.
          # `filter=all` ist zwingend: der Endpunkt liefert per Default nur den jeweils
          # letzten Check-Run je Name und würde die eigene Reservierung sonst verdecken.
          one_shot_id="capital-ai-human-gate-one-shot:${PR_NUMBER}:${current_head}"

          blocking="$(
            ONE_SHOT_ID="$one_shot_id" gh api -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/commits/${current_head}/check-runs?check_name=build-and-test&filter=all&per_page=100" \
              --jq '.check_runs[]
                      | select(
                          .name == "build-and-test"
                          and (.external_id // "") == env.ONE_SHOT_ID
                          and (.app.slug // "") == "github-actions"
                          and (.status != "completed" or .conclusion == "success")
                        )
                      | [(.id | tostring), .status, (.conclusion // "null")] | @tsv' \
              | head -n 1
          )"
          if [ -n "$blocking" ]; then
            echo "One-Shot für PR #${PR_NUMBER}@${current_head} läuft bereits oder ist erfolgreich verbraucht: ${blocking}. Kein zweiter Build."
            echo "dispatch=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          human_check_id="$(
            gh api --method POST -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/check-runs" \
              -f name='Human-/Owner-Verifikation' \
              -f head_sha="$current_head" \
              -f status='completed' \
              -f conclusion='success' \
              -f "output[title]=Human-/Owner-Verifikation PASS" \
              -f "output[summary]=Owner, aktueller Head, Live-Kommentar, beide Attestations und current-head Review wurden verifiziert." \
              --jq '.id'
          )"
          test -n "$human_check_id"

          build_check_id="$(
            gh api --method POST -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/check-runs" \
              -f name='build-and-test' \
              -f head_sha="$current_head" \
              -f external_id="$one_shot_id" \
              -f status='in_progress' \
              -f "output[title]=build-and-test läuft" \
              -f "output[summary]=Trusted-main Build/Test wurde durch head-genaue Human-Evidence autorisiert." \
              --jq '.id'
          )"
          test -n "$build_check_id"

          echo "dispatch=true" >> "$GITHUB_OUTPUT"
          echo "head_sha=$current_head" >> "$GITHUB_OUTPUT"
          echo "build_check_run_id=$build_check_id" >> "$GITHUB_OUTPUT"
          echo "Human-/Owner-Verifikation PASS: PR #${PR_NUMBER}@${current_head}, Review=${review_id}, Comment=${COMMENT_ID}, HumanCheck=${human_check_id}, BuildCheck=${build_check_id}."

      - name: Genau einen trusted-main Build/Test für den verifizierten Head auslösen
        if: ${{ steps.verify.outputs.dispatch == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
          PR_HEAD_SHA: ${{ steps.verify.outputs.head_sha }}
          APPROVAL_COMMENT_ID: ${{ github.event.comment.id }}
          BUILD_CHECK_RUN_ID: ${{ steps.verify.outputs.build_check_run_id }}
        run: |
          set -euo pipefail
          if ! gh workflow run pr-build-and-test.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f pr_number="$PR_NUMBER" \
            -f head_sha="$PR_HEAD_SHA" \
            -f approval_comment_id="$APPROVAL_COMMENT_ID" \
            -f build_check_run_id="$BUILD_CHECK_RUN_ID"; then
            gh api --method PATCH -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/check-runs/${BUILD_CHECK_RUN_ID}" \
              -f status='completed' \
              -f conclusion='failure' \
              -f "output[title]=build-and-test konnte nicht gestartet werden" \
              -f "output[summary]=Der trusted-main Workflow-Dispatch ist fehlgeschlagen." >/dev/null || true
            exit 1
          fi
          echo "Trusted-main Build/Test für PR #${PR_NUMBER}@${PR_HEAD_SHA} angefordert; PR-Head-Check=${BUILD_CHECK_RUN_ID}."
