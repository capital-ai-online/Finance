name: OSS Quality Assurance
run-name: PR #${{ github.event.pull_request.number }} - OSS Quality Assurance

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'src/**'
      - 'server/**'
      - 'server.ts'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'knip.json'
      - '.jscpd.json'
      - '.github/workflows/oss-quality-assurance.yml'

permissions: {}

concurrency:
  group: oss-quality-assurance-pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}-${{ github.event.pull_request.base.sha }}
  cancel-in-progress: true

jobs:
  quality-assurance:
    name: OSS quality evidence
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      GITLEAKS_VERSION: '8.30.1'
      GITLEAKS_LINUX_X64_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
      OSV_SCANNER_VERSION: '2.6.0'
      KNIP_VERSION: '6.31.0'
      JSCPD_VERSION: '5.0.12'
      VITEST_VERSION: '4.1.11'

    steps:
      - name: Checkout exact PR head without persisted credentials
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact source and base identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git cat-file -e "$BASE_SHA^{commit}"
          test "$SOURCE_SHA" != "$BASE_SHA"
          mkdir -p artifacts/oss-quality .quality

      - name: Install pinned Gitleaks CLI
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          bin_dir="$RUNNER_TEMP/gitleaks-bin"
          mkdir -p "$bin_dir"
          curl --fail-with-body --silent --show-error --location             "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"             --output "$archive"
          printf '%s  %s\n' "$GITLEAKS_LINUX_X64_SHA256" "$archive" | sha256sum --check --strict -
          tar -xzf "$archive" -C "$bin_dir" gitleaks
          test "$("$bin_dir/gitleaks" version)" = "$GITLEAKS_VERSION"
          echo "$bin_dir" >> "$GITHUB_PATH"

      - name: Scan PR commit range for secrets
        id: gitleaks
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          gitleaks git .             --log-opts="$BASE_SHA..$SOURCE_SHA"             --redact             --report-format json             --report-path artifacts/oss-quality/gitleaks.json

      - name: Materialize clean Gitleaks evidence
        if: always() && steps.gitleaks.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s artifacts/oss-quality/gitleaks.json ]; then
            printf '[]\n' > artifacts/oss-quality/gitleaks.json
          fi

      - name: Checkout exact base snapshot for OSV comparison
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$BASE_SHA"
          test "$(git rev-parse HEAD)" = "$BASE_SHA"

      - name: Scan base dependency graph with pinned OSV Scanner
        id: osv_base
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@7f58dd6750d78fc29a900ba64b1a0f946f62fba4
        with:
          scan-args: |-
            --format=json
            --output=artifacts/oss-quality/osv-base.json
            --lockfile=package-lock.json

      - name: Restore exact PR head
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Scan head dependency graph with pinned OSV Scanner
        id: osv_head
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@7f58dd6750d78fc29a900ba64b1a0f946f62fba4
        with:
          scan-args: |-
            --format=json
            --output=artifacts/oss-quality/osv-head.json
            --lockfile=package-lock.json

      - name: Setup repository Node runtime
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24.18.0'
          cache: npm

      - name: Install locked repository dependencies
        run: npm ci

      - name: Generate real Vitest V8 coverage
        id: coverage
        shell: bash
        run: |
          set -euo pipefail
          npm exec --yes             --package="vitest@${VITEST_VERSION}"             --package="@vitest/coverage-v8@${VITEST_VERSION}"             -- vitest run               --coverage               --coverage.provider=v8               --coverage.reporter=json-summary               --coverage.reportsDirectory=.quality
          test -s .quality/coverage-summary.json

      - name: Run pinned Knip maintainability analysis
        id: knip
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          npx --yes "knip@${KNIP_VERSION}"             --config knip.json             --reporter json             > artifacts/oss-quality/knip.json

      - name: Run pinned jscpd duplicate analysis
        id: jscpd
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          npx --yes "jscpd@${JSCPD_VERSION}"             src server scripts             --config .jscpd.json
          test -s artifacts/oss-quality/jscpd/jscpd-report.json

      - name: Normalize OSS findings into one commit-bound contract
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          npx tsx scripts/quality/normalizeOssQualityFindings.ts
          test -s artifacts/oss-quality/unified-findings.json

      - name: Project real coverage through the existing Quality Center
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s .quality/coverage-summary.json
          npm run repository:quality:snapshot
          test -s .quality/quality-center-report.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const report = JSON.parse(fs.readFileSync('.quality/quality-center-report.json', 'utf8'));
          if (report.coverage?.codeCoverage?.status !== 'AVAILABLE') {
            throw new Error('Quality Center did not consume real coverage evidence.');
          }
          NODE

      - name: Enforce new secret, dependency and evidence regressions
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'artifacts/oss-quality/unified-findings.json';
          if (!fs.existsSync(path)) throw new Error('Unified OSS quality evidence is missing.');
          const report = JSON.parse(fs.readFileSync(path, 'utf8'));
          const unavailable = (report.tools ?? []).filter((tool) => tool.status === 'NOT_AVAILABLE');
          const newSecrets = (report.findings ?? []).filter(
            (finding) => finding.sourceTool === 'gitleaks' && finding.newInPr,
          );
          const newVulnerabilities = (report.findings ?? []).filter(
            (finding) => finding.sourceTool === 'osv-scanner' && finding.newInPr,
          );
          const coverageMissing = (report.findings ?? []).filter(
            (finding) => finding.sourceTool === 'vitest-coverage' && finding.ruleId === 'coverage/not-available',
          );
          const advisory = (report.findings ?? []).filter(
            (finding) => finding.sourceTool === 'knip' || finding.sourceTool === 'jscpd',
          );
          console.log(JSON.stringify({
            sourceSha: report.sourceSha,
            baseSha: report.baseSha,
            unavailableTools: unavailable.map((tool) => tool.tool),
            newSecrets: newSecrets.length,
            newDependencyVulnerabilities: newVulnerabilities.length,
            advisoryMaintainabilityFindings: advisory.length,
            coverage: report.measurements?.coverage ?? null,
            duplication: report.measurements?.duplication ?? null,
          }, null, 2));
          if (unavailable.length > 0) {
            throw new Error('Required OSS quality tool evidence unavailable: ' + unavailable.map((tool) => tool.tool).join(', '));
          }
          if (newSecrets.length > 0) throw new Error(`New Gitleaks findings: ${newSecrets.length}`);
          if (newVulnerabilities.length > 0) throw new Error(`New OSV dependency vulnerabilities: ${newVulnerabilities.length}`);
          if (coverageMissing.length > 0) throw new Error('Real Vitest coverage evidence is missing or incomplete.');
          NODE

      - name: Upload commit-bound OSS quality evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oss-quality-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: |
            artifacts/oss-quality/
            .quality/coverage-summary.json
            .quality/quality-center-report.json
          retention-days: 14
          if-no-files-found: error
