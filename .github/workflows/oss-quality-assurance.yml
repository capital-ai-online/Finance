name: OSS Quality Assurance
run-name: PR #${{ github.event.pull_request.number }} - OSS Quality Fast Assurance

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'src/**'
      - 'server/**'
      - 'server.ts'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'knip.json'
      - '.jscpd.json'
      - '.github/workflows/oss-quality-assurance.yml'
      - '.github/workflows/oss-quality-deep-assurance.yml'

permissions: {}

concurrency:
  group: oss-quality-fast-pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}-${{ github.event.pull_request.base.sha }}
  cancel-in-progress: true

jobs:
  quality-assurance:
    name: OSS quality PR fast evidence
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      OSS_QUALITY_PROFILE: PR_FAST
      GITLEAKS_VERSION: '8.30.1'
      GITLEAKS_LINUX_X64_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
      OSV_SCANNER_VERSION: '2.6.0'

    steps:
      - name: Checkout exact PR head without persisted credentials
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact source and base identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git cat-file -e "$BASE_SHA^{commit}"
          test "$SOURCE_SHA" != "$BASE_SHA"
          mkdir -p artifacts/oss-quality

      - name: Install pinned Gitleaks CLI
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          bin_dir="$RUNNER_TEMP/gitleaks-bin"
          mkdir -p "$bin_dir"
          curl --fail-with-body --silent --show-error --location             "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"             --output "$archive"
          printf '%s  %s\n' "$GITLEAKS_LINUX_X64_SHA256" "$archive" | sha256sum --check --strict -
          tar -xzf "$archive" -C "$bin_dir" gitleaks
          actual_version="$("$bin_dir/gitleaks" version | tr -d '\r\n')"
          case "$actual_version" in
            "$GITLEAKS_VERSION"|"v$GITLEAKS_VERSION") ;;
            *) echo "Unexpected Gitleaks version: $actual_version" >&2; exit 1 ;;
          esac
          echo "$bin_dir" >> "$GITHUB_PATH"

      - name: Scan PR commit range for secrets
        id: gitleaks
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          gitleaks git .             --log-opts="$BASE_SHA..$SOURCE_SHA"             --redact             --report-format json             --report-path artifacts/oss-quality/gitleaks.json

      - name: Materialize clean Gitleaks evidence
        if: always() && steps.gitleaks.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s artifacts/oss-quality/gitleaks.json ]; then
            printf '[]\n' > artifacts/oss-quality/gitleaks.json
          fi

      - name: Checkout exact base snapshot for OSV comparison
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$BASE_SHA"
          test "$(git rev-parse HEAD)" = "$BASE_SHA"

      - name: Scan base dependency graph with pinned OSV Scanner
        id: osv_base
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@7f58dd6750d78fc29a900ba64b1a0f946f62fba4
        with:
          scan-args: |-
            --format=json
            --output=artifacts/oss-quality/osv-base.json
            --lockfile=package-lock.json

      - name: Restore exact PR head
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Scan head dependency graph with pinned OSV Scanner
        id: osv_head
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@7f58dd6750d78fc29a900ba64b1a0f946f62fba4
        with:
          scan-args: |-
            --format=json
            --output=artifacts/oss-quality/osv-head.json
            --lockfile=package-lock.json

      - name: Setup bounded Node runtime for evidence normalization
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24.18.0'

      - name: Normalize fast OSS findings without repository dependency install
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          npm exec --yes --package=tsx@4.21.0 -- tsx scripts/quality/normalizeOssQualityFindings.ts
          test -s artifacts/oss-quality/unified-findings.json

      - name: Enforce only PR-introduced blocking regressions
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'artifacts/oss-quality/unified-findings.json';
          if (!fs.existsSync(path)) throw new Error('Unified OSS quality evidence is missing.');
          const report = JSON.parse(fs.readFileSync(path, 'utf8'));
          if (report.profile !== 'PR_FAST') throw new Error('Unexpected OSS quality profile: ' + report.profile);
          const tools = new Map((report.tools ?? []).map((tool) => [tool.tool, tool]));
          const unavailable = ['gitleaks', 'osv-scanner'].filter(
            (tool) => !tools.has(tool) || tools.get(tool)?.status === 'NOT_AVAILABLE' || tools.get(tool)?.status === 'NOT_APPLICABLE',
          );
          const misplacedDeepTools = ['vitest-coverage', 'knip', 'jscpd'].filter(
            (tool) => tools.get(tool)?.status !== 'NOT_APPLICABLE',
          );
          const newSecrets = (report.findings ?? []).filter(
            (finding) => finding.sourceTool === 'gitleaks' && finding.newInPr,
          );
          const newVulnerabilities = (report.findings ?? []).filter(
            (finding) => finding.sourceTool === 'osv-scanner' && finding.newInPr,
          );
          console.log(JSON.stringify({
            profile: report.profile,
            sourceSha: report.sourceSha,
            baseSha: report.baseSha,
            unavailableFastTools: unavailable,
            newSecrets: newSecrets.length,
            newDependencyVulnerabilities: newVulnerabilities.length,
            deferredDeepTools: ['vitest-coverage', 'knip', 'jscpd'],
          }, null, 2));
          if (unavailable.length > 0) {
            throw new Error('Required PR-fast evidence unavailable: ' + unavailable.join(', '));
          }
          if (misplacedDeepTools.length > 0) {
            throw new Error('Deep-only tools unexpectedly executed in PR_FAST: ' + misplacedDeepTools.join(', '));
          }
          if (newSecrets.length > 0) throw new Error(`New Gitleaks findings: ${newSecrets.length}`);
          if (newVulnerabilities.length > 0) throw new Error(`New OSV dependency vulnerabilities: ${newVulnerabilities.length}`);
          NODE

      - name: Upload compact commit-bound PR quality evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oss-quality-fast-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: artifacts/oss-quality/
          retention-days: 7
          if-no-files-found: error
