name: Apply Render Runtime Remediation

on:
  push:
    branches:
      - agent/render-runtime-remediation-adr0037
    paths:
      - .github/workflows/render-runtime-remediation-apply.yml

permissions:
  contents: write

concurrency:
  group: render-runtime-remediation-apply
  cancel-in-progress: false

jobs:
  apply:
    name: Apply exact server.ts remediation patch
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: agent/render-runtime-remediation-adr0037
          fetch-depth: 0
          persist-credentials: true

      - name: Apply verified exact replacements
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('server.ts')
          source = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str, label: str) -> None:
              global source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              source = source.replace(old, new, 1)

          replace_once(
              "import { metricsMiddleware, renderMetrics } from './server/metrics';",
              "import { metricsMiddleware, renderMetrics } from './server/metrics';\nimport { getStripeConfigurationStatus, hasFiniteScoreValues, resolveHeuristicCryptoScore, resolveRuntimePort } from './server/runtime/renderRuntimeSafety';",
              'runtime safety import',
          )

          replace_once(
              'const PORT = 3000;',
              "const PORT = resolveRuntimePort(getCleanEnv('PORT'));",
              'Render PORT contract',
          )

          replace_once(
              "      const seedScores = await generateCryptoScores(s, change24h);\n      const payload = {",
              "      const seedScores = await generateCryptoScores(s, change24h);\n\n      // ADR-0037 runtime remediation: the scoring engine remains fail-closed when no\n      // verified feature set exists. The market-data aggregator may retain an already\n      // finite upstream/base score only as an explicitly labelled heuristic result, so one\n      // unsupported CMC symbol cannot reject the entire Promise.all refresh batch.\n      if (!hasFiniteScoreValues(seedScores as Record<string, unknown>)) {\n        const heuristicScore = resolveHeuristicCryptoScore(baseScore);\n        if (heuristicScore !== null) {\n          return { score: heuristicScore, basis: 'heuristic' };\n        }\n      }\n\n      const payload = {",
              'crypto batch availability fallback',
          )

          replace_once(
              '  app.listen(PORT, "0.0.0.0", () => {',
              "  let marketDataRefreshTimer: NodeJS.Timeout | null = null;\n  let shutdownStarted = false;\n\n  const httpServer = app.listen(PORT, \"0.0.0.0\", () => {",
              'HTTP server handle',
          )

          replace_once(
              '    setInterval(async () => {',
              '    marketDataRefreshTimer = setInterval(async () => {',
              'background refresh timer handle',
          )

          old_diagnostics = '''    // Secure run-time diagnostics for Stripe integration
    const sk = getCleanEnv('STRIPE_SECRET_KEY');
    const pk = getCleanEnv('STRIPE_PUBLISHABLE_KEY');
    const wh = getCleanEnv('STRIPE_WEBHOOK_SECRET');
    const priceStarter = getCleanEnv('STRIPE_PRICE_ID_STARTER');
    const pricePro = getCleanEnv('STRIPE_PRICE_ID_PRO');
    const priceEnterprise = getCleanEnv('STRIPE_PRICE_ID_ENTERPRISE');

    console.log("=== [Stripe Server Diagnostics] ===");
    console.log(`STRIPE_SECRET_KEY: ${sk ? `Configured (Length: ${sk.length}, Prefix: ${sk.substring(0, 7)})` : 'Missing'}`);
    console.log(`STRIPE_PUBLISHABLE_KEY: ${pk ? `Configured (Length: ${pk.length}, Prefix: ${pk.substring(0, 7)})` : 'Missing'}`);
    console.log(`STRIPE_WEBHOOK_SECRET: ${wh ? `Configured (Length: ${wh.length}, Prefix: ${wh.substring(0, 6)})` : 'Missing'}`);
    console.log(`STRIPE_PRICE_ID_STARTER: ${priceStarter ? `Configured (Length: ${priceStarter.length}, Val: ${priceStarter.substring(0, 10)}...)` : 'Missing'}`);
    console.log(`STRIPE_PRICE_ID_PRO: ${pricePro ? `Configured (Length: ${pricePro.length}, Val: ${pricePro.substring(0, 10)}...)` : 'Missing'}`);
    console.log(`STRIPE_PRICE_ID_ENTERPRISE: ${priceEnterprise ? `Configured (Length: ${priceEnterprise.length}, Val: ${priceEnterprise.substring(0, 10)}...)` : 'Missing'}`);
    console.log("====================================");'''
          new_diagnostics = '''    // ADR-0037 / security hardening: diagnostics expose configuration presence only.
    // Never log key prefixes, lengths or partial Price IDs in production telemetry.
    serverLogger.info('Stripe configuration validation', getStripeConfigurationStatus(getCleanEnv));'''
          replace_once(old_diagnostics, new_diagnostics, 'Stripe metadata disclosure removal')

          replace_once(
              '  });\n}\n\nstartServer();',
              '''  });

  // ADR-0037: Render sends SIGTERM during deploy/restart. Stop periodic work first, then
  // drain the HTTP server. A bounded force-exit stays below Render's 30 second shutdown
  // window so the old instance cannot linger indefinitely.
  const shutdown = (signal: 'SIGTERM' | 'SIGINT') => {
    if (shutdownStarted) return;
    shutdownStarted = true;
    serverLogger.info('Graceful shutdown initiated', { signal });

    if (marketDataRefreshTimer) {
      clearInterval(marketDataRefreshTimer);
      marketDataRefreshTimer = null;
    }

    const forceExitTimer = setTimeout(() => {
      serverLogger.error('Graceful shutdown timeout exceeded', { signal, timeoutMs: 25_000 });
      process.exit(1);
    }, 25_000);
    forceExitTimer.unref();

    httpServer.close((error?: Error) => {
      clearTimeout(forceExitTimer);
      if (error) {
        serverLogger.error('HTTP server close failed during shutdown', { signal, error: error.message });
        process.exit(1);
      }
      serverLogger.info('Graceful shutdown completed', { signal });
      process.exit(0);
    });
  };

  process.once('SIGTERM', () => shutdown('SIGTERM'));
  process.once('SIGINT', () => shutdown('SIGINT'));
}

startServer();''',
              'graceful shutdown registration',
          )

          path.write_text(source, encoding='utf-8')
          PY

      - name: Verify patched invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -F "resolveRuntimePort(getCleanEnv('PORT'))" server.ts
          grep -F "basis: 'heuristic'" server.ts
          grep -F "Stripe configuration validation" server.ts
          grep -F "Graceful shutdown initiated" server.ts
          if grep -F "Configured (Length:" server.ts; then
            echo 'Sensitive Stripe diagnostic metadata still present' >&2
            exit 1
          fi

      - name: Commit patch and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/render-runtime-remediation-apply.yml
          git add server.ts
          git config user.name 'capital-ai-governance-bot'
          git config user.email 'capital-ai-governance-bot@users.noreply.github.com'
          git commit -m 'fix: harden Render production runtime'
          git push origin HEAD:agent/render-runtime-remediation-adr0037
