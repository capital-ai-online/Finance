name: SEC Class R Pre-PR Validation

on:
  push:
    branches:
      - agent/security-dependabot-version-floors-20260910

permissions:
  contents: write

concurrency:
  group: sec-class-r-prepr-validation
  cancel-in-progress: false

jobs:
  validate-class-r:
    name: Validate exact final SEC branch head
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact SEC branch
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: agent/security-dependabot-version-floors-20260910
          fetch-depth: 0
          persist-credentials: false

      - name: Self-remove helper and materialize final branch head
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_BRANCH: agent/security-dependabot-version-floors-20260910
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -- .github/workflows/sec-class-r-prepr-validation.yml
          git diff --cached --check
          git commit -m 'chore(security): remove transient class-R validator'
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH_HEADER" \
            push origin "HEAD:refs/heads/$TARGET_BRANCH"
          FINAL_SHA="$(git rev-parse HEAD)"
          echo "VALIDATED_SHA=$FINAL_SHA" >> "$GITHUB_ENV"
          echo "RELEASE_SOURCE_COMMIT=$FINAL_SHA" >> "$GITHUB_ENV"
          echo "Validating exact final branch head: $FINAL_SHA"

      - name: Set up repository Node baseline
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24.18.0'
          cache: 'npm'

      - name: Repository identity and dependency graph precheck
        run: |
          set -euo pipefail
          test "$VALIDATED_SHA" = "$(git rev-parse HEAD)"
          test "$RELEASE_SOURCE_COMMIT" = "$VALIDATED_SHA"
          node --version
          npm --version
          node <<'NODE'
          const fs = require('node:fs');
          const manifest = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const packages = lock.packages || {};
          const version = (key) => packages[key]?.version;
          const floor = '4.1.11';
          const gte = (a, b) => {
            const av = String(a || '').replace(/^[^0-9]*/, '').split('.').map(Number);
            const bv = b.split('.').map(Number);
            for (let i = 0; i < 3; i += 1) {
              if ((av[i] || 0) > (bv[i] || 0)) return true;
              if ((av[i] || 0) < (bv[i] || 0)) return false;
            }
            return true;
          };
          if (!gte(manifest.devDependencies?.vitest, floor)) throw new Error('package.json Vitest floor below 4.1.11');
          if (!gte(packages['']?.devDependencies?.vitest, floor)) throw new Error('package-lock root Vitest floor below 4.1.11');
          if (!gte(version('node_modules/vitest'), floor)) throw new Error('locked Vitest below 4.1.11');
          if (!gte(version('node_modules/@vitest/mocker'), floor)) throw new Error('locked @vitest/mocker below 4.1.11');
          const stale = Object.entries(packages).filter(([, m]) => m?.version === '4.1.10').map(([k]) => k);
          if (stale.length) throw new Error(`4.1.10 remains in lock graph: ${stale.join(', ')}`);
          NODE

      - name: Repository integrity
        run: |
          set -euo pipefail
          git rev-parse --verify 'HEAD^{commit}' >/dev/null
          git fsck --strict --no-dangling
          git diff --check

      - name: Install exact dependencies
        run: npm ci

      - name: Dependency audits
        run: |
          npm audit --omit=dev --audit-level=high
          npm audit --audit-level=high

      - name: Focused dependency, README and PDF projection tests
        run: npx vitest run tests/unit/dependencySecurity.test.ts tests/unit/readmeVersionProjection.test.ts tests/unit/pdfBrandFinalization.test.ts

      - name: TypeScript lint
        run: npm run lint

      - name: Full unit and governance test suite
        run: npm test

      - name: Production build
        run: npm run build

      - name: Production CSP test
        env:
          NODE_ENV: production
          CSP_MODE: report-only
        run: npx vitest run tests/unit/securityResponse.production.test.ts

      - name: Production config and predeploy readiness
        run: |
          npx tsx scripts/security/verifyProductionConfigInvariants.ts
          npm run predeploy:check

      - name: Docker hardening
        run: node scripts/security/verifyDockerHardening.mjs

      - name: Production Docker image build and inspection
        run: |
          set -euo pipefail
          test "$RELEASE_SOURCE_COMMIT" = "$(git rev-parse HEAD)"
          docker build \
            --build-arg RELEASE_SOURCE_COMMIT="$RELEASE_SOURCE_COMMIT" \
            --tag "capital-ai-prepr:$RELEASE_SOURCE_COMMIT" \
            .
          test "$(docker image inspect "capital-ai-prepr:$RELEASE_SOURCE_COMMIT" --format '{{.Config.User}}')" = "capitalai"
          test "$(docker image inspect "capital-ai-prepr:$RELEASE_SOURCE_COMMIT" --format '{{json .Config.Cmd}}')" = '["node","dist/server.cjs"]'
          docker image inspect "capital-ai-prepr:$RELEASE_SOURCE_COMMIT" --format '{{json .Config.Healthcheck.Test}}' | grep -q '/healthz'

      - name: Validation summary
        run: |
          echo "Exact final branch head validated: $VALIDATED_SHA"
          echo "Class R pre-PR validation completed successfully."
