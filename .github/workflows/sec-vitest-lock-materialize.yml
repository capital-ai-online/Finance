name: SEC Vitest Lock Materialization

on:
  push:
    branches:
      - agent/security-dependabot-version-floors-20260910

permissions:
  contents: write

concurrency:
  group: sec-vitest-lock-materialize
  cancel-in-progress: false

jobs:
  materialize-vitest-lock:
    name: Materialize npm-generated Vitest 4.1.11 lockfile
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact SEC branch
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: agent/security-dependabot-version-floors-20260910
          fetch-depth: 1
          persist-credentials: false

      - name: Set up repository Node baseline
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24.18.0'
          registry-url: 'https://registry.npmjs.org'

      - name: Materialize only Vitest 4.1.11 lock graph
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
          NPM_CONFIG_IGNORE_SCRIPTS: 'true'
        run: |
          set -euo pipefail
          node --version
          npm --version
          npm install --package-lock-only --ignore-scripts --save-dev vitest@4.1.11

          if ! git diff --quiet -- package.json; then
            echo 'package.json changed unexpectedly' >&2
            git diff -- package.json >&2
            exit 1
          fi

          mapfile -t CHANGED < <(git diff --name-only)
          if [[ "${#CHANGED[@]}" -ne 1 || "${CHANGED[0]}" != 'package-lock.json' ]]; then
            printf 'Unexpected dependency update surface:\n' >&2
            printf ' - %s\n' "${CHANGED[@]}" >&2
            exit 1
          fi

          node <<'NODE'
          const fs = require('node:fs');
          const manifest = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const packages = lock.packages || {};

          const parse = (value) => String(value || '').replace(/^[^0-9]*/, '').split('.').map(Number);
          const gte = (value, floor) => {
            const a = parse(value);
            const b = parse(floor);
            for (let i = 0; i < Math.max(a.length, b.length); i += 1) {
              const av = a[i] || 0;
              const bv = b[i] || 0;
              if (av > bv) return true;
              if (av < bv) return false;
            }
            return true;
          };

          const rootSpec = manifest.devDependencies?.vitest;
          const lockRootSpec = packages['']?.devDependencies?.vitest;
          const vitest = packages['node_modules/vitest'];
          const mocker = packages['node_modules/@vitest/mocker'];

          if (!gte(rootSpec, '4.1.11')) throw new Error(`package.json vitest floor too low: ${rootSpec}`);
          if (!gte(lockRootSpec, '4.1.11')) throw new Error(`package-lock root vitest floor too low: ${lockRootSpec}`);
          if (!gte(vitest?.version, '4.1.11')) throw new Error(`locked vitest too low: ${vitest?.version ?? '<missing>'}`);
          if (!gte(mocker?.version, '4.1.11')) throw new Error(`locked @vitest/mocker too low: ${mocker?.version ?? '<missing>'}`);

          const stale = Object.entries(packages)
            .filter(([, meta]) => meta && meta.version === '4.1.10')
            .map(([name]) => name);
          if (stale.length) throw new Error(`4.1.10 remains in lock graph: ${stale.join(', ')}`);

          for (const [name, meta] of Object.entries(packages)) {
            if (!meta || typeof meta !== 'object') continue;
            if (meta.version && /^4\.1\.11$/.test(meta.version) && name.startsWith('node_modules/')) {
              if (!meta.resolved || !meta.integrity) {
                throw new Error(`missing npm resolution metadata for ${name}@${meta.version}`);
              }
            }
          }
          NODE

          git diff --check

      - name: Commit npm lockfile and self-remove helper workflow
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_BRANCH: agent/security-dependabot-version-floors-20260910
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add package-lock.json
          git rm -- .github/workflows/sec-vitest-lock-materialize.yml

          mapfile -t STAGED < <(git diff --cached --name-only)
          if [[ "${#STAGED[@]}" -ne 2 ]]; then
            printf 'Unexpected staged surface:\n' >&2
            printf ' - %s\n' "${STAGED[@]}" >&2
            exit 1
          fi

          git diff --cached --check
          git commit -m 'fix(security): materialize Vitest 4.1.11 lock graph'

          AUTH_HEADER="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH_HEADER" \
            push origin "HEAD:refs/heads/$TARGET_BRANCH"
