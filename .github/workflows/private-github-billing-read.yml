name: Private GitHub Billing Read

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: private-github-billing-read
  cancel-in-progress: false

jobs:
  private-billing-read:
    name: Private single-user billing smoke read
    if: github.actor == 'SvenKulessa'
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Repository auschecken
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false

      - name: Node.js 24 einrichten
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'

      - name: Private GitHub App Konfiguration fail-closed prüfen
        env:
          APP_CLIENT_ID: ${{ vars.CAPITAL_AI_GITHUB_APP_CLIENT_ID }}
          ENTERPRISE_SLUG: ${{ vars.CAPITAL_AI_GITHUB_ENTERPRISE_SLUG }}
          APP_PRIVATE_KEY: ${{ secrets.CAPITAL_AI_GITHUB_APP_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${APP_CLIENT_ID}" ]]; then
            echo "::error::Repository/Organization variable CAPITAL_AI_GITHUB_APP_CLIENT_ID fehlt."
            exit 1
          fi
          if [[ -z "${ENTERPRISE_SLUG}" ]]; then
            echo "::error::Repository/Organization variable CAPITAL_AI_GITHUB_ENTERPRISE_SLUG fehlt."
            exit 1
          fi
          if [[ -z "${APP_PRIVATE_KEY}" ]]; then
            echo "::error::Repository/Organization secret CAPITAL_AI_GITHUB_APP_PRIVATE_KEY fehlt."
            exit 1
          fi

          key_path="${RUNNER_TEMP}/capital-ai-github-app-private-key.pem"
          umask 077
          printf '%s' "${APP_PRIVATE_KEY}" > "${key_path}"
          echo "CAPITAL_AI_GITHUB_APP_PRIVATE_KEY_PATH=${key_path}" >> "${GITHUB_ENV}"

      - name: Read-only Enterprise Billing Inventory
        id: enterprise_billing
        continue-on-error: true
        env:
          CAPITAL_AI_GITHUB_APP_CLIENT_ID: ${{ vars.CAPITAL_AI_GITHUB_APP_CLIENT_ID }}
          CAPITAL_AI_GITHUB_ENTERPRISE_SLUG: ${{ vars.CAPITAL_AI_GITHUB_ENTERPRISE_SLUG }}
          CAPITAL_AI_GITHUB_BILLING_EVIDENCE_PATH: ${{ runner.temp }}/capital-ai-github-billing-evidence.json
        run: node scripts/operations/runPrivateGitHubBillingRead.mjs

      - name: Read-only Organization and Finance Repository Billing
        id: organization_billing
        continue-on-error: true
        env:
          CAPITAL_AI_GITHUB_APP_CLIENT_ID: ${{ vars.CAPITAL_AI_GITHUB_APP_CLIENT_ID }}
          CAPITAL_AI_GITHUB_ENTERPRISE_SLUG: ${{ vars.CAPITAL_AI_GITHUB_ENTERPRISE_SLUG }}
          CAPITAL_AI_GITHUB_ORG_LOGIN: ${{ github.repository_owner }}
          CAPITAL_AI_GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/operations/runPrivateGitHubOrganizationBillingRead.mjs

      - name: Read-only Enterprise License Usage Attribution
        id: enterprise_license
        continue-on-error: true
        env:
          CAPITAL_AI_GITHUB_APP_CLIENT_ID: ${{ vars.CAPITAL_AI_GITHUB_APP_CLIENT_ID }}
          CAPITAL_AI_GITHUB_ENTERPRISE_SLUG: ${{ vars.CAPITAL_AI_GITHUB_ENTERPRISE_SLUG }}
          CAPITAL_AI_GITHUB_ORG_LOGIN: ${{ github.repository_owner }}
          CAPITAL_AI_GITHUB_ENTERPRISE_READ_PAT: ${{ secrets.CAPITAL_AI_GITHUB_ENTERPRISE_READ_PAT }}
        run: node scripts/operations/runPrivateGitHubLicenseUsageRead.mjs

      - name: Read-only GitHub Actions Variable Evidence
        id: actions_variable
        continue-on-error: true
        env:
          CAPITAL_AI_GITHUB_APP_CLIENT_ID: ${{ vars.CAPITAL_AI_GITHUB_APP_CLIENT_ID }}
          CAPITAL_AI_GITHUB_ENTERPRISE_SLUG: ${{ vars.CAPITAL_AI_GITHUB_ENTERPRISE_SLUG }}
          CAPITAL_AI_GITHUB_ORG_LOGIN: ${{ github.repository_owner }}
          CAPITAL_AI_GITHUB_REPOSITORY: ${{ github.repository }}
          CAPITAL_AI_GITHUB_VARIABLE_NAME: GHCR_DIGEST_PUBLISH_ENABLED
        run: node scripts/operations/runPrivateGitHubVariablesRead.mjs

      - name: Read-only GitHub Settings and Retention Inventory
        id: settings_inventory
        continue-on-error: true
        env:
          CAPITAL_AI_GITHUB_APP_CLIENT_ID: ${{ vars.CAPITAL_AI_GITHUB_APP_CLIENT_ID }}
          CAPITAL_AI_GITHUB_ENTERPRISE_SLUG: ${{ vars.CAPITAL_AI_GITHUB_ENTERPRISE_SLUG }}
          CAPITAL_AI_GITHUB_ORG_LOGIN: ${{ github.repository_owner }}
          CAPITAL_AI_GITHUB_REPOSITORY: ${{ github.repository }}
          CAPITAL_AI_GITHUB_ENTERPRISE_READ_PAT: ${{ secrets.CAPITAL_AI_GITHUB_ENTERPRISE_READ_PAT }}
          CAPITAL_AI_GITHUB_USER_READ_PAT: ${{ secrets.CAPITAL_AI_GITHUB_USER_READ_PAT }}
          CAPITAL_AI_GITHUB_SETTINGS_EVIDENCE_PATH: ${{ runner.temp }}/capital-ai-github-settings-evidence.json
          CAPITAL_AI_GITHUB_SETTINGS_MARKDOWN_PATH: ${{ runner.temp }}/capital-ai-github-settings-evidence.md
        run: node scripts/operations/runPrivateGitHubSettingsInventoryRead.mjs

      - name: Redacted Settings Export in Job Summary anzeigen
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          export_path="${RUNNER_TEMP}/capital-ai-github-settings-evidence.md"
          if [[ -f "${export_path}" ]]; then
            cat "${export_path}" >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "GitHub Settings Markdown Export: NOT_OBSERVABLE" >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Zero-cost Storage Capability korrelieren
        id: storage_capability
        continue-on-error: true
        env:
          CAPITAL_AI_GITHUB_BILLING_EVIDENCE_PATH: ${{ runner.temp }}/capital-ai-github-billing-evidence.json
          CAPITAL_AI_GITHUB_SETTINGS_EVIDENCE_PATH: ${{ runner.temp }}/capital-ai-github-settings-evidence.json
        run: node scripts/operations/runPrivateGitHubStorageCapabilityReport.mjs

      - name: Read-only Evidence Completion Gate
        if: always()
        shell: bash
        env:
          ENTERPRISE_BILLING_OUTCOME: ${{ steps.enterprise_billing.outcome }}
          ORGANIZATION_BILLING_OUTCOME: ${{ steps.organization_billing.outcome }}
          ENTERPRISE_LICENSE_OUTCOME: ${{ steps.enterprise_license.outcome }}
          ACTIONS_VARIABLE_OUTCOME: ${{ steps.actions_variable.outcome }}
          SETTINGS_INVENTORY_OUTCOME: ${{ steps.settings_inventory.outcome }}
          STORAGE_CAPABILITY_OUTCOME: ${{ steps.storage_capability.outcome }}
        run: |
          set -euo pipefail

          failures=()
          check_outcome() {
            local label="$1"
            local outcome="$2"
            if [[ "${outcome}" != "success" ]]; then
              failures+=("${label}=${outcome}")
            fi
          }

          check_outcome "enterprise-billing" "${ENTERPRISE_BILLING_OUTCOME}"
          check_outcome "organization-billing" "${ORGANIZATION_BILLING_OUTCOME}"
          check_outcome "enterprise-license" "${ENTERPRISE_LICENSE_OUTCOME}"
          check_outcome "actions-variable" "${ACTIONS_VARIABLE_OUTCOME}"
          check_outcome "settings-inventory" "${SETTINGS_INVENTORY_OUTCOME}"
          check_outcome "storage-capability" "${STORAGE_CAPABILITY_OUTCOME}"

          if (( ${#failures[@]} > 0 )); then
            printf '::error::Read-only evidence stages failed independently: %s\n' "${failures[*]}"
            exit 1
          fi
      - name: Private Key aus Runner-Dateisystem entfernen
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${CAPITAL_AI_GITHUB_APP_PRIVATE_KEY_PATH:-}" ]]; then
            rm -f -- "${CAPITAL_AI_GITHUB_APP_PRIVATE_KEY_PATH}"
          fi
          rm -f --             "${RUNNER_TEMP}/capital-ai-github-billing-evidence.json"             "${RUNNER_TEMP}/capital-ai-github-settings-evidence.json"             "${RUNNER_TEMP}/capital-ai-github-settings-evidence.md"
