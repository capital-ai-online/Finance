name: Node Toolchain Write-Boundary Supersession
run-name: Node 24.20.0 Supersession aus trusted main

on:
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: Exakter aktueller main SHA, gegen den die Remediation gebunden wird
        required: true
        type: string
      confirmation:
        description: Muss exakt SUPERSEDE NODE TOOLCHAIN TO 24.20.0 lauten
        required: true
        type: string

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: node-toolchain-write-boundary-supersession
  cancel-in-progress: false

jobs:
  create-remediation-branch:
    name: Exakt begrenzten Node-24.20-Remediation-Branch erzeugen
    if: github.ref == 'refs/heads/main' && github.actor == 'SvenKulessa'
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Trusted main ohne persistierte Zugangsdaten auschecken
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Node.js für den deterministischen Supersession-Transformer einrichten
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24.20.0'

      - name: Owner-, Repository- und Exact-Main-Bindung fail-closed prüfen
        shell: bash
        env:
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'SvenKulessa/Finance'
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$GITHUB_ACTOR" = 'SvenKulessa'
          test "$CONFIRMATION" = 'SUPERSEDE NODE TOOLCHAIN TO 24.20.0'
          [[ "$EXPECTED_MAIN_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN_SHA"
          remote_main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          test "$remote_main" = "$EXPECTED_MAIN_SHA"

      - name: Initiale Parallel-Writer-Korrelation
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const targets = new Set([
              '.nvmrc',
              'package.json',
              'package-lock.json',
              '.github/workflows/ci.yml',
              '.github/workflows/pr-production-baseline-refresh.yml',
              '.github/workflows/pr-governance.yml',
              '.github/workflows/google-marketing-protected-change.yml',
              '.github/workflows/ionos-dns-admin.yml',
              '.github/workflows/systemadmin-work-package-runner.yml',
              '.github/workflows/systemadmin-roadmap-executor.yml',
              'tests/unit/productionCiRunnerConsolidation.test.ts',
              'tests/unit/nodeToolchainBaseline.test.ts',
            ]);

            const pulls = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              base: 'main',
              per_page: 100,
            });

            const conflicts = [];
            for (const pr of pulls) {
              const files = await github.paginate(github.rest.pulls.listFiles, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                per_page: 100,
              });
              const overlap = files.map((file) => file.filename).filter((file) => targets.has(file));
              if (overlap.length > 0) conflicts.push({ pr: pr.number, overlap });
            }

            if (conflicts.length > 0) {
              throw new Error(`Parallel-Writer-Konflikt auf Node-Supersession-Scope: ${JSON.stringify(conflicts)}`);
            }
            core.info(`Keine offene PR überschneidet die ${targets.size} Supersession-Zielpfade.`);

      - name: Deterministischen Transformer isoliert testen
        run: node --test scripts/security/applyNodeToolchainSupersession.test.mjs

      - name: Vollständig alte erwartete Baseline bestätigen
        run: node scripts/security/applyNodeToolchainSupersession.mjs --preflight

      - name: Remediation lokal erzeugen und exact-scope committen
        id: remediation
        shell: bash
        run: |
          set -euo pipefail
          branch="security/node-toolchain-24-20-remediation-${GITHUB_RUN_ID}"
          git switch -c "$branch"

          node scripts/security/applyNodeToolchainSupersession.mjs --write
          node scripts/security/applyNodeToolchainSupersession.mjs --check

          node scripts/security/applyNodeToolchainSupersession.mjs --print-targets | sort > "$RUNNER_TEMP/expected-targets.txt"
          {
            git diff --name-only
            git ls-files --others --exclude-standard
          } | sort -u > "$RUNNER_TEMP/actual-targets.txt"
          diff -u "$RUNNER_TEMP/expected-targets.txt" "$RUNNER_TEMP/actual-targets.txt"

          mapfile -t targets < "$RUNNER_TEMP/expected-targets.txt"
          git add -- "${targets[@]}"
          git diff --cached --check

          git config user.name 'capital-ai-governance[bot]'
          git config user.email 'capital-ai-governance[bot]@users.noreply.github.com'
          git commit -m '[Capital-AI][SECURITY] Node-Toolchain 24.20.0 Supersession anwenden'

          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Main und Parallel-Writer unmittelbar vor Persistenz erneut korrelieren
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
        with:
          script: |
            const normalize = (value) => String(value || '').trim().toLowerCase();
            const expectedMain = normalize(process.env.EXPECTED_MAIN_SHA);
            const { data: main } = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: 'main',
            });
            const liveMain = normalize(main.commit?.sha);
            if (liveMain !== expectedMain) {
              throw new Error(`main änderte sich während der Supersession: ${liveMain} != ${expectedMain}`);
            }

            const targets = new Set([
              '.nvmrc',
              'package.json',
              'package-lock.json',
              '.github/workflows/ci.yml',
              '.github/workflows/pr-production-baseline-refresh.yml',
              '.github/workflows/pr-governance.yml',
              '.github/workflows/google-marketing-protected-change.yml',
              '.github/workflows/ionos-dns-admin.yml',
              '.github/workflows/systemadmin-work-package-runner.yml',
              '.github/workflows/systemadmin-roadmap-executor.yml',
              'tests/unit/productionCiRunnerConsolidation.test.ts',
              'tests/unit/nodeToolchainBaseline.test.ts',
            ]);

            const pulls = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              base: 'main',
              per_page: 100,
            });
            const conflicts = [];
            for (const pr of pulls) {
              const files = await github.paginate(github.rest.pulls.listFiles, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                per_page: 100,
              });
              const overlap = files.map((file) => file.filename).filter((file) => targets.has(file));
              if (overlap.length > 0) conflicts.push({ pr: pr.number, overlap });
            }
            if (conflicts.length > 0) {
              throw new Error(`Neuer Parallel-Writer-Konflikt vor Persistenz: ${JSON.stringify(conflicts)}`);
            }

      - name: Remediation-Branch mit ephemerer Git-Autorisierung pushen
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_NAME: ${{ steps.remediation.outputs.branch }}
          EXPECTED_HEAD_SHA: ${{ steps.remediation.outputs.head }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test "$(git branch --show-current)" = "$BRANCH_NAME"
          [[ "$BRANCH_NAME" =~ ^security/node-toolchain-24-20-remediation-[0-9]+$ ]]

          auth_header="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth_header}" \
            push --set-upstream origin "$BRANCH_NAME"
          unset auth_header

      - name: Branch-only Ergebnis dokumentieren
        shell: bash
        env:
          REPORT_BRANCH: ${{ steps.remediation.outputs.branch }}
          REPORT_HEAD: ${{ steps.remediation.outputs.head }}
          REPORT_EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
        run: |
          {
            echo '## Node Toolchain Write-Boundary Supersession'
            echo
            echo '- Ergebnis: Remediation-Branch erzeugt'
            echo "- Branch: \`$REPORT_BRANCH\`"
            echo "- Head: \`$REPORT_HEAD\`"
            echo "- Base: \`$REPORT_EXPECTED_MAIN_SHA\`"
            echo '- Zielbaseline: Node `24.20.0`'
            echo '- Pull Request: **nicht erstellt**'
            echo '- Merge: **nicht durchgeführt**'
            echo '- Production-/Provider-Mutation: **keine**'
            echo
            echo 'Vor einer PR-Erstellung muss der Human/Owner den dann aktuellen main-/Open-PR-Stand erneut korrelieren und die PR-Erstellung separat freigeben.'
          } >> "$GITHUB_STEP_SUMMARY"
