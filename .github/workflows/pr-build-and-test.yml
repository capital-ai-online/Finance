name: PR Build and Test
run-name: "PR #${{ inputs.pr_number }} – trusted build/test @ ${{ inputs.head_sha }}"

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull-Request-Nummer
        required: true
        type: string
      head_sha:
        description: Exakt freigegebener PR-Head-SHA
        required: true
        type: string
      approval_comment_id:
        description: Head-gebundener Human-Gate-Kommentar
        required: true
        type: string
      build_check_run_id:
        description: Bereits auf dem PR-Head reservierter build-and-test Check-Run
        required: true
        type: string

permissions: {}

concurrency:
  group: pr-build-and-test-${{ inputs.pr_number }}-${{ inputs.head_sha }}
  cancel-in-progress: false

jobs:
  owner-evidence:
    name: Human-/Owner-Evidence erneut verifizieren
    permissions:
      contents: read
      issues: read
      pull-requests: read
      checks: read
    runs-on: ubuntu-latest
    timeout-minutes: 4
    outputs:
      base_sha: ${{ steps.verify.outputs.base_sha }}
    steps:
      - name: Kommentar, Head, Owner-Review und Check-Reservation fail-closed prüfen
        id: verify
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ inputs.head_sha }}
          APPROVAL_COMMENT_ID: ${{ inputs.approval_comment_id }}
          BUILD_CHECK_RUN_ID: ${{ inputs.build_check_run_id }}
          EXPECTED_OWNER: SvenKulessa
        run: |
          set -euo pipefail
          test "$PR_NUMBER" -gt 0
          printf '%s' "$EXPECTED_HEAD_SHA" | grep -Eq '^[0-9a-f]{40}$'
          test "$APPROVAL_COMMENT_ID" -gt 0
          test "$BUILD_CHECK_RUN_ID" -gt 0

          read -r current_head base_ref base_sha pr_state <<< "$(
            gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
              --jq '[.head.sha, .base.ref, .base.sha, .state] | @tsv'
          )"
          test "$current_head" = "$EXPECTED_HEAD_SHA"
          test "$base_ref" = "main"
          test "$pr_state" = "open"

          comment_body="$(
            gh api "repos/${GITHUB_REPOSITORY}/issues/comments/${APPROVAL_COMMENT_ID}" \
              --jq '.body // ""'
          )"

          COMMENT_BODY="$comment_body" EXPECTED_HEAD_SHA="$EXPECTED_HEAD_SHA" python3 - <<'PY'
          import os
          import re

          body = os.environ['COMMENT_BODY']
          expected_head = os.environ['EXPECTED_HEAD_SHA'].lower()
          if '<!-- CAPITAL_AI_HUMAN_GATE -->' not in body:
              raise SystemExit('Human-Gate-Marker fehlt.')
          match = re.search(r'<!--\s*CAPITAL_AI_HUMAN_GATE_HEAD_SHA:\s*([0-9a-f]{40})\s*-->', body, re.I)
          if not match or match.group(1).lower() != expected_head:
              raise SystemExit('Human-Gate-Kommentar ist nicht an den aktuellen Head gebunden.')

          required = {
              'Human/Owner: vollständigen PR-Diff geprüft.',
              'Human/Owner: alle geänderten Dateien im Tab Files changed als Viewed markiert.',
          }
          found = set()
          in_fence = False
          for raw in body.replace('\r\n', '\n').replace('\r', '\n').split('\n'):
              line = raw.strip()
              if re.match(r'^(?:```|~~~)', line):
                  in_fence = not in_fence
                  continue
              if in_fence or line.startswith('>'):
                  continue
              m = re.fullmatch(r'-\s*\[\s*[xX]\s*\]\s+(.+?)\s*', line)
              if m:
                  found.add(' '.join(m.group(1).split()))
          if not required.issubset(found):
              raise SystemExit('Beide Human-/Owner-Attestations müssen gesetzt sein.')
          PY

          review_id="$(
            PR_HEAD_SHA="$EXPECTED_HEAD_SHA" gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews?per_page=100" \
              --jq '.[] | select(.user.login == env.EXPECTED_OWNER and .commit_id == env.PR_HEAD_SHA and (((((.body // "") | gsub("^[[:space:]]+|[[:space:]]+$"; "")) | ascii_downcase) == "okay") or (((.body // "") | gsub("^[[:space:]]+|[[:space:]]+$"; "")) == "💪"))) | .id' \
              | head -n 1
          )"
          test -n "$review_id"

          # Die Reservierung muss exakt die vom Human-Gate erzeugte One-Shot-Identität tragen.
          # Ein gleichnamiger ci.yml-Job auf demselben Head kann diese Prüfung nicht bestehen.
          ONE_SHOT_ID="capital-ai-human-gate-one-shot:${PR_NUMBER}:${EXPECTED_HEAD_SHA}"

          EXPECTED_HEAD_SHA="$EXPECTED_HEAD_SHA" BUILD_CHECK_RUN_ID="$BUILD_CHECK_RUN_ID" ONE_SHOT_ID="$ONE_SHOT_ID" \
            gh api -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/check-runs/${BUILD_CHECK_RUN_ID}" \
              --jq '. as $check | select(.id == (env.BUILD_CHECK_RUN_ID | tonumber) and .name == "build-and-test" and .head_sha == env.EXPECTED_HEAD_SHA and (.external_id // "") == env.ONE_SHOT_ID and .status == "in_progress" and (.app.slug // "") == "github-actions") | .id' \
              | grep -qx "$BUILD_CHECK_RUN_ID"

          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "Human-/Owner-Evidence PASS: PR #${PR_NUMBER}@${EXPECTED_HEAD_SHA}, Review=${review_id}, Comment=${APPROVAL_COMMENT_ID}, BuildCheck=${BUILD_CHECK_RUN_ID}."

  build-and-test-executor:
    name: Build/Test Executor (trusted-main)
    needs: [owner-evidence]
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Primär-Volltest autorisiert
        run: >-
          echo "Primär-Volltest für PR #${{ inputs.pr_number }}@${{ inputs.head_sha }} ist durch head-genaue Human-Evidence autorisiert."

      - name: Repository exakt auf freigegebenem Head auschecken
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ inputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prüfumfang bestimmen
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ needs.owner-evidence.outputs.base_sha }}
          HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          set -euo pipefail
          git rev-parse --verify "${BASE_SHA}^{commit}" >/dev/null
          git rev-parse --verify "${HEAD_SHA}^{commit}" >/dev/null
          changed_files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          printf '%s\n' "$changed_files"

          full=false
          docker=false
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              docs/*|.ai/*|*.md) ;;
              *) full=true ;;
            esac
            case "$file" in
              Dockerfile|.dockerignore|package.json|package-lock.json|server.ts|server/*|render.yaml|render.yml|scripts/security/*Docker*|scripts/security/*docker*|scripts/security/*Runtime*|scripts/security/*runtime*|.github/workflows/*) docker=true ;;
            esac
          done <<< "$changed_files"

          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "docker=$docker" >> "$GITHUB_OUTPUT"

      - name: Repository-Integrität prüfen
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ inputs.head_sha }}"
          git fsck --strict --no-dangling

      - name: Dokumentations-Fast-Path
        if: ${{ steps.scope.outputs.full != 'true' }}
        run: echo "Nur Dokumentation betroffen; Software-Build und Tests sind nicht erforderlich."

      - name: Node.js einrichten
        if: ${{ steps.scope.outputs.full == 'true' }}
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24.18.0'
          cache: npm

      - name: Abhängigkeiten installieren
        if: ${{ steps.scope.outputs.full == 'true' }}
        run: npm ci

      - name: Repository-Konventionen blocking prüfen
        if: ${{ steps.scope.outputs.full == 'true' }}
        run: npm run repository:validate

      - name: Produktionsabhängigkeiten prüfen
        if: ${{ steps.scope.outputs.full == 'true' }}
        run: npm audit --omit=dev --audit-level=high

      - name: TypeScript prüfen
        if: ${{ steps.scope.outputs.full == 'true' }}
        run: npm run lint

      - name: Unit-Tests ausführen
        if: ${{ steps.scope.outputs.full == 'true' }}
        run: npm test

      - name: Produktions-Build erstellen
        if: ${{ steps.scope.outputs.full == 'true' }}
        run: npm run build

      - name: Produktions-CSP-Auslieferung nach Build prüfen
        if: ${{ steps.scope.outputs.full == 'true' }}
        env:
          NODE_ENV: production
          CSP_MODE: report-only
        run: npx vitest run tests/unit/securityResponse.production.test.ts

      - name: Produktionskonfiguration und Deployment-Bereitschaft prüfen
        if: ${{ steps.scope.outputs.full == 'true' }}
        run: |
          npx tsx scripts/security/verifyProductionConfigInvariants.ts
          npm run predeploy:check

      - name: Docker-Hardening prüfen
        if: ${{ steps.scope.outputs.docker == 'true' }}
        run: node scripts/security/verifyDockerHardening.mjs

      - name: Produktions-Docker-Image bauen und prüfen
        if: ${{ steps.scope.outputs.docker == 'true' }}
        shell: bash
        env:
          IMAGE_SHA: ${{ inputs.head_sha }}
        run: |
          set -euo pipefail
          docker build --tag "capital-ai-ci:${IMAGE_SHA}" .
          test "$(docker image inspect "capital-ai-ci:${IMAGE_SHA}" --format '{{.Config.User}}')" = "capitalai"
          test "$(docker image inspect "capital-ai-ci:${IMAGE_SHA}" --format '{{json .Config.Cmd}}')" = '["node","dist/server.cjs"]'
          docker image inspect "capital-ai-ci:${IMAGE_SHA}" --format '{{json .Config.Healthcheck.Test}}' | grep -q '/healthz'

      - name: Produktions-Docker-Container starten und /healthz prüfen
        if: ${{ steps.scope.outputs.docker == 'true' }}
        shell: bash
        env:
          IMAGE_SHA: ${{ inputs.head_sha }}
        run: |
          set -euo pipefail
          container_name="capital-ai-pr-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            docker logs "$container_name" 2>/dev/null || true
            docker rm -f "$container_name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run -d \
            --name "$container_name" \
            -p 127.0.0.1::3000 \
            -e PORT=3000 \
            -e SUPABASE_SECRET_KEY=ci-smoke-nonsecret \
            -e STRIPE_SECRET_KEY=sk_test_ci_runtime_smoke \
            -e STRIPE_WEBHOOK_SECRET=whsec_ci_runtime_smoke \
            -e TOTP_ENCRYPTION_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef \
            "capital-ai-ci:${IMAGE_SHA}" >/dev/null

          host_port="$(docker port "$container_name" 3000/tcp | sed -E 's/.*:([0-9]+)$/\1/' | head -n 1)"
          test -n "$host_port"

          health_ok=false
          for _attempt in $(seq 1 30); do
            if curl --fail --silent --show-error "http://127.0.0.1:${host_port}/healthz" >/dev/null; then
              health_ok=true
              break
            fi
            if [ "$(docker inspect --format '{{.State.Running}}' "$container_name")" != 'true' ]; then
              break
            fi
            sleep 1
          done

          test "$health_ok" = 'true'
          echo "Docker Runtime Smoke Test PASS: /healthz antwortet für Image capital-ai-ci:${IMAGE_SHA}."

  report-pr-head-check:
    name: PR-Head build-and-test Status berichten
    needs: [owner-evidence, build-and-test-executor]
    if: ${{ always() }}
    permissions:
      checks: write
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Reservierten PR-Head-Check abschließen
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          BUILD_CHECK_RUN_ID: ${{ inputs.build_check_run_id }}
          EXPECTED_HEAD_SHA: ${{ inputs.head_sha }}
          OWNER_RESULT: ${{ needs.owner-evidence.result }}
          BUILD_RESULT: ${{ needs.build-and-test-executor.result }}
        run: |
          set -euo pipefail
          test "$PR_NUMBER" -gt 0
          test "$BUILD_CHECK_RUN_ID" -gt 0
          printf '%s' "$EXPECTED_HEAD_SHA" | grep -Eq '^[0-9a-f]{40}$'

          ONE_SHOT_ID="capital-ai-human-gate-one-shot:${PR_NUMBER}:${EXPECTED_HEAD_SHA}"

          EXPECTED_HEAD_SHA="$EXPECTED_HEAD_SHA" BUILD_CHECK_RUN_ID="$BUILD_CHECK_RUN_ID" ONE_SHOT_ID="$ONE_SHOT_ID" \
            gh api -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/check-runs/${BUILD_CHECK_RUN_ID}" \
              --jq '. as $check | select(.id == (env.BUILD_CHECK_RUN_ID | tonumber) and .name == "build-and-test" and .head_sha == env.EXPECTED_HEAD_SHA and (.external_id // "") == env.ONE_SHOT_ID and (.app.slug // "") == "github-actions") | .id' \
              | grep -qx "$BUILD_CHECK_RUN_ID"

          conclusion=failure
          title='build-and-test FAIL'
          summary="Human-Evidence=${OWNER_RESULT}; Build/Test=${BUILD_RESULT}."
          if [ "$OWNER_RESULT" = 'success' ] && [ "$BUILD_RESULT" = 'success' ]; then
            conclusion=success
            title='build-and-test PASS'
          fi

          gh api --method PATCH -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/check-runs/${BUILD_CHECK_RUN_ID}" \
            -f status='completed' \
            -f conclusion="$conclusion" \
            -f "output[title]=$title" \
            -f "output[summary]=$summary" >/dev/null

          echo "PR-Head-Check ${BUILD_CHECK_RUN_ID} für ${EXPECTED_HEAD_SHA} abgeschlossen: ${conclusion}."
