name: Code Scanning — Controlled Autofix
run-name: Controlled CodeQL Autofix — ${{ github.run_id }}

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: code-scanning-controlled-autofix
  cancel-in-progress: false

jobs:
  generate:
    name: Autofix isoliert erzeugen
    if: >-
      github.ref == 'refs/heads/main' &&
      github.repository == 'capital-ai-online/Finance' &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' && github.actor == 'SvenKulessa'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
      security-events: write
    outputs:
      candidate_created: ${{ steps.autofix.outputs.candidate_created }}
      candidate_safe: ${{ steps.autofix.outputs.candidate_safe }}
      branch: ${{ steps.autofix.outputs.branch }}
      commit_sha: ${{ steps.autofix.outputs.commit_sha }}
      base_sha: ${{ steps.autofix.outputs.base_sha }}
      alert_number: ${{ steps.autofix.outputs.alert_number }}
      languages: ${{ steps.autofix.outputs.languages }}
      decision: ${{ steps.autofix.outputs.decision }}
      reason: ${{ steps.autofix.outputs.reason }}

    steps:
      - name: Trusted main auschecken
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Node.js einrichten
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24.18.0'

      - name: Autofix-Guard vor jeder Write-Mutation testen
        run: |
          set -euo pipefail
          node --check scripts/security/runCodeScanningAutofix.mjs
          node --test tests/unit/codeScanningAutofixPolicy.test.mjs

      - name: Controlled CodeQL Autofix erzeugen
        id: autofix
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/security/runCodeScanningAutofix.mjs

      - name: Nicht-sensitive Entscheidungs-Evidence materialisieren
        if: always()
        env:
          CANDIDATE_CREATED: ${{ steps.autofix.outputs.candidate_created }}
          CANDIDATE_SAFE: ${{ steps.autofix.outputs.candidate_safe }}
          BRANCH: ${{ steps.autofix.outputs.branch }}
          COMMIT_SHA: ${{ steps.autofix.outputs.commit_sha }}
          BASE_SHA: ${{ steps.autofix.outputs.base_sha }}
          ALERT_NUMBER: ${{ steps.autofix.outputs.alert_number }}
          LANGUAGES: ${{ steps.autofix.outputs.languages }}
          DECISION: ${{ steps.autofix.outputs.decision }}
          REASON: ${{ steps.autofix.outputs.reason }}
        run: |
          set -euo pipefail
          mkdir -p .autofix-evidence
          node scripts/security/writeCodeScanningAutofixEvidence.mjs .autofix-evidence/decision.json

      - name: Entscheidungs-Evidence hochladen
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: controlled-autofix-decision-${{ github.run_id }}
          path: .autofix-evidence/decision.json
          if-no-files-found: error
          retention-days: 30

  validate:
    name: Autofix technisch validieren
    needs: generate
    if: needs.generate.outputs.candidate_safe == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Isolierten Autofix-Branch auschecken
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ needs.generate.outputs.branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Exakten Autofix-Head verifizieren
        env:
          EXPECTED_SHA: ${{ needs.generate.outputs.commit_sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SHA"

      - name: Node.js einrichten
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24.18.0'
          cache: npm

      - name: Abhängigkeiten reproduzierbar installieren
        run: npm ci

      - name: TypeScript prüfen
        run: npm run lint

      - name: Unit-Tests ausführen
        run: npx vitest run

      - name: Production Build prüfen
        run: npm run build

      - name: Exakte CodeQL-Candidate-Evidence lesen
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CANDIDATE_REF: refs/heads/${{ needs.generate.outputs.branch }}
          ALERT_NUMBER: ${{ needs.generate.outputs.alert_number }}
        run: |
          set -euo pipefail
          mkdir -p .autofix-provider
          if ! gh api --method GET \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/${REPOSITORY}/code-scanning/alerts/${ALERT_NUMBER}" \
            > .autofix-provider/alert.json; then
            : > .autofix-provider/alert.json
          fi
          if ! gh api --method GET \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            -f "ref=${CANDIDATE_REF}" \
            -F per_page=100 \
            "repos/${REPOSITORY}/code-scanning/alerts/${ALERT_NUMBER}/instances" \
            > .autofix-provider/instances.json; then
            : > .autofix-provider/instances.json
          fi

      - name: Kanonische CodeQL-Provider-Authority verifizieren
        id: codeql_provider
        env:
          CANDIDATE_REF: refs/heads/${{ needs.generate.outputs.branch }}
          CANDIDATE_SHA: ${{ needs.generate.outputs.commit_sha }}
          BASE_SHA: ${{ needs.generate.outputs.base_sha }}
          ALERT_NUMBER: ${{ needs.generate.outputs.alert_number }}
          CODEQL_ALERT_JSON: .autofix-provider/alert.json
          CODEQL_INSTANCES_JSON: .autofix-provider/instances.json
        run: node scripts/security/verifyControlledAutofixCodeqlProvider.mjs

      - name: Ergebnis zusammenfassen
        env:
          ALERT_NUMBER: ${{ needs.generate.outputs.alert_number }}
          BRANCH: ${{ needs.generate.outputs.branch }}
          COMMIT_SHA: ${{ needs.generate.outputs.commit_sha }}
          BASE_SHA: ${{ needs.generate.outputs.base_sha }}
          CODEQL_STATUS: ${{ steps.codeql_provider.outputs.codeql_status }}
          CODEQL_REASON: ${{ steps.codeql_provider.outputs.codeql_reason }}
        run: |
          {
            echo "## Controlled CodeQL Autofix — technische Validierung"
            echo
            echo "- Alert: #${ALERT_NUMBER}"
            echo "- Provider Evidence Authority Ref: \`refs/heads/${BRANCH}\`"
            echo "- Provider Evidence Authority SHA: \`${COMMIT_SHA}\`"
            echo "- Provenance Base SHA: \`${BASE_SHA}\`"
            echo "- TypeScript/Lint: **PASS**"
            echo "- Unit Tests: **PASS**"
            echo "- Production Build: **PASS**"
            echo "- CodeQL Provider Evidence: \`${CODEQL_STATUS}\`"
            echo "- CodeQL Reason: \`${CODEQL_REASON}\`"
            echo
            echo "Kein Pull Request wurde erzeugt. PR-Erstellung bleibt ein separates Owner-Gate."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Provider-CodeQL-Gate fail-closed
        if: steps.codeql_provider.outputs.codeql_status != 'PASS'
        env:
          CODEQL_STATUS: ${{ steps.codeql_provider.outputs.codeql_status }}
          CODEQL_REASON: ${{ steps.codeql_provider.outputs.codeql_reason }}
        run: |
          echo "::error::Kanonische CodeQL-Provider-Evidence ist nicht PASS: $CODEQL_STATUS ($CODEQL_REASON)"
          exit 1
