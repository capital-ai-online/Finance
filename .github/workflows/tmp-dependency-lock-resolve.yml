name: Temporary Dependency Lock Resolver

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  resolve-lock:
    if: github.head_ref == 'agent/operations-runtime-deps-20260917'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Configure Node 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24.20.0'
          cache: npm

      - name: Resolve lockfile from package.json
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts
          npm ci --ignore-scripts
          npm ls --all

      - name: Validate TypeScript and production build
        shell: bash
        run: |
          set -euo pipefail
          npm run lint
          npm run build:raw

      - name: Upload resolved lockfile
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-lock-slice-1-${{ github.event.pull_request.head.sha }}
          path: package-lock.json
          retention-days: 1
          if-no-files-found: error
