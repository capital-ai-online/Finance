name: Selective CodeQL
run-name: >-
  ${{ github.event_name == 'pull_request'
      && format('PR #{0} – selektive CodeQL-Analyse', github.event.pull_request.number)
      || format('{0} – vollständige CodeQL-Analyse', github.event_name) }}

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  schedule:
    - cron: '19 3 1 * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: selective-codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Trusted-base CodeQL-Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      codeql_mode: ${{ steps.validation_plan.outputs.codeql_mode }}
      codeql_languages: ${{ steps.validation_plan.outputs.codeql_languages }}
      codeql_matrix: ${{ steps.matrix.outputs.matrix }}
      default_setup_active: ${{ steps.provider.outputs.default_setup_active }}
      reason: ${{ steps.validation_plan.outputs.reason }}
    steps:
      - name: PR-Dateien und GitHub-Default-Setup read-only korrelieren
        id: provider
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0 / Node 24
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const isPr = context.eventName === 'pull_request';
            let files = [];

            if (isPr) {
              const prNumber = context.payload.pull_request.number;
              const changed = await github.paginate(
                github.rest.pulls.listFiles,
                { owner, repo, pull_number: prNumber, per_page: 100 },
              );
              files = changed.map((entry) => entry.filename);
            }

            let defaultSetupActive = true;
            try {
              const workflows = await github.paginate(
                github.rest.actions.listRepoWorkflows,
                { owner, repo, per_page: 100 },
              );
              const dynamicCodeql = workflows.find(
                (workflow) => workflow.path === 'dynamic/github-code-scanning/codeql',
              );
              defaultSetupActive = dynamicCodeql?.state === 'active';
              core.info(
                dynamicCodeql
                  ? `GitHub CodeQL Default Setup: path=${dynamicCodeql.path} state=${dynamicCodeql.state}`
                  : 'Kein dynamischer GitHub-CodeQL-Workflow gefunden; Advanced Setup darf nach Planner-Entscheidung laufen.',
              );
            } catch (error) {
              core.warning(`Default-Setup-State nicht reproduzierbar lesbar; Advanced CodeQL bleibt fail-closed gesperrt: ${error.message}`);
              defaultSetupActive = true;
            }

            core.setOutput('default_setup_active', String(defaultSetupActive));
            core.setOutput('changed_files', files.join('\n'));

      - name: Trusted Policy-Snapshot aus PR-Base bzw. aktuellem main auschecken
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
          path: policy
          fetch-depth: 1
          persist-credentials: false

      - name: Node.js für den kanonischen Planner einrichten
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24.18.0'

      - name: Diff-basierten CodeQL-Plan aus trusted base bestimmen
        id: validation_plan
        working-directory: policy
        env:
          EVENT_NAME: ${{ github.event_name }}
          CI_FORCE_FULL: ${{ github.event_name == 'pull_request' && 'false' || 'true' }}
          CHANGED_FILES: ${{ steps.provider.outputs.changed_files }}
        run: node scripts/pr/planPrValidation.mjs

      - name: Sprachmatrix materialisieren
        id: matrix
        env:
          CODEQL_LANGUAGES: ${{ steps.validation_plan.outputs.codeql_languages }}
        shell: bash
        run: |
          set -euo pipefail
          matrix="$(node -e 'const v=(process.env.CODEQL_LANGUAGES||"").split(",").filter(Boolean); process.stdout.write(JSON.stringify(v))')"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

      - name: CodeQL-Entscheidung protokollieren
        env:
          CODEQL_MODE: ${{ steps.validation_plan.outputs.codeql_mode }}
          CODEQL_LANGUAGES: ${{ steps.validation_plan.outputs.codeql_languages }}
          DEFAULT_SETUP_ACTIVE: ${{ steps.provider.outputs.default_setup_active }}
          PLAN_REASON: ${{ steps.validation_plan.outputs.reason }}
        run: |
          echo "codeql_mode=$CODEQL_MODE"
          echo "codeql_languages=$CODEQL_LANGUAGES"
          echo "default_setup_active=$DEFAULT_SETUP_ACTIVE"
          echo "reason=$PLAN_REASON"
          if [ "$DEFAULT_SETUP_ACTIVE" = "true" ]; then
            echo "GitHub Default Setup ist aktiv; Advanced CodeQL bleibt für diesen Lauf absichtlich deaktiviert."
          fi

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: [plan]
    if: needs.plan.outputs.codeql_mode != 'none' && needs.plan.outputs.default_setup_active != 'true'
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.plan.outputs.codeql_matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Exakten Analyse-Snapshot auschecken
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: CodeQL initialisieren
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4 @ 2026-09-09
        with:
          languages: ${{ matrix.language }}

      - name: CodeQL analysieren
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4 @ 2026-09-09
        with:
          category: /language:${{ matrix.language }}/scope:${{ needs.plan.outputs.codeql_mode }}
