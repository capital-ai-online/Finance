name: Selective CodeQL
run-name: Manuelle CodeQL-Analyse

# OPS-02-CI-01 cost invariant:
# Automatic PR/push/schedule fan-out is intentionally retired. CodeQL is not a
# Required Check in the live main ruleset. Repository CI must not allocate an
# optional hosted runner merely to discover `codeql_mode=none` or an already
# active GitHub Default Setup. A Human may explicitly dispatch this fallback;
# provider-side Code Security/Default Setup state remains a separate protected
# setting and is not mutated by this workflow.
on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: selective-codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Trusted-base CodeQL-Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      codeql_mode: ${{ steps.validation_plan.outputs.codeql_mode }}
      codeql_languages: ${{ steps.validation_plan.outputs.codeql_languages }}
      codeql_matrix: ${{ steps.matrix.outputs.matrix }}
      default_setup_active: ${{ steps.provider.outputs.default_setup_active }}
      reason: ${{ steps.validation_plan.outputs.reason }}
    steps:
      - name: GitHub-Default-Setup read-only korrelieren
        id: provider
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0 / Node 24
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            let defaultSetupActive = true;
            try {
              const workflows = await github.paginate(
                github.rest.actions.listRepoWorkflows,
                { owner, repo, per_page: 100 },
              );
              const dynamicCodeql = workflows.find(
                (workflow) => workflow.path === 'dynamic/github-code-scanning/codeql',
              );
              defaultSetupActive = dynamicCodeql?.state === 'active';
              core.info(
                dynamicCodeql
                  ? `GitHub CodeQL Default Setup: path=${dynamicCodeql.path} state=${dynamicCodeql.state}`
                  : 'Kein dynamischer GitHub-CodeQL-Workflow gefunden; manueller Advanced-Setup-Fallback darf nach Planner-Entscheidung laufen.',
              );
            } catch (error) {
              core.warning(`Default-Setup-State nicht reproduzierbar lesbar; Advanced CodeQL bleibt fail-closed gesperrt: ${error.message}`);
              defaultSetupActive = true;
            }

            core.setOutput('default_setup_active', String(defaultSetupActive));

      - name: Trusted Policy-Snapshot aus aktuellem main auschecken
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: main
          path: policy
          fetch-depth: 1
          persist-credentials: false

      - name: Node.js für den kanonischen Planner einrichten
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24.18.0'

      - name: Manuellen vollständigen CodeQL-Plan bestimmen
        id: validation_plan
        working-directory: policy
        env:
          EVENT_NAME: workflow_dispatch
          CI_FORCE_FULL: 'true'
        run: node scripts/pr/planPrValidation.mjs --force-full

      - name: Sprachmatrix materialisieren
        id: matrix
        env:
          CODEQL_LANGUAGES: ${{ steps.validation_plan.outputs.codeql_languages }}
        shell: bash
        run: |
          set -euo pipefail
          matrix="$(node -e 'const v=(process.env.CODEQL_LANGUAGES||"").split(",").filter(Boolean); process.stdout.write(JSON.stringify(v))')"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

      - name: CodeQL-Entscheidung protokollieren
        env:
          CODEQL_MODE: ${{ steps.validation_plan.outputs.codeql_mode }}
          CODEQL_LANGUAGES: ${{ steps.validation_plan.outputs.codeql_languages }}
          DEFAULT_SETUP_ACTIVE: ${{ steps.provider.outputs.default_setup_active }}
          PLAN_REASON: ${{ steps.validation_plan.outputs.reason }}
        run: |
          echo "codeql_mode=$CODEQL_MODE"
          echo "codeql_languages=$CODEQL_LANGUAGES"
          echo "default_setup_active=$DEFAULT_SETUP_ACTIVE"
          echo "reason=$PLAN_REASON"
          if [ "$DEFAULT_SETUP_ACTIVE" = "true" ]; then
            echo "GitHub Default Setup ist aktiv; manueller Advanced CodeQL bleibt für diesen Lauf absichtlich deaktiviert."
          fi

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: [plan]
    if: needs.plan.outputs.codeql_mode != 'none' && needs.plan.outputs.default_setup_active != 'true'
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.plan.outputs.codeql_matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Exakten main-Snapshot auschecken
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: CodeQL initialisieren
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4 @ 2026-09-09
        with:
          languages: ${{ matrix.language }}

      - name: CodeQL analysieren
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4 @ 2026-09-09
        with:
          category: /language:${{ matrix.language }}/scope:manual-full
