name: PR Auto-Status
run-name: >-
  PR-Auto-Status nach ${{ github.event.workflow_run.name }} #${{ github.event.workflow_run.id }}

on:
  workflow_run:
    workflows: ["PR Governance", "PR Build and Test"]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write

concurrency:
  group: pr-auto-status-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.display_title }}
  cancel-in-progress: true

jobs:
  sync:
    name: PR-Klasse und Evidence synchronisieren
    if: >-
      ${{
        (
          github.event.workflow_run.name == 'PR Governance' &&
          github.event.workflow_run.event == 'pull_request' &&
          github.event.workflow_run.pull_requests[0].number != null
        ) || (
          github.event.workflow_run.name == 'PR Build and Test' &&
          github.event.workflow_run.event == 'workflow_dispatch'
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: PR-Nummer fail-closed ermitteln
        id: pr
        shell: bash
        env:
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          PAYLOAD_PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          RUN_TITLE: ${{ github.event.workflow_run.display_title }}
        run: |
          set -euo pipefail
          pr_number="$PAYLOAD_PR_NUMBER"
          if [ "$WORKFLOW_NAME" = 'PR Build and Test' ]; then
            if [[ "$RUN_TITLE" =~ ^PR[[:space:]]#([1-9][0-9]*)[[:space:]]–[[:space:]]trusted[[:space:]]build/test[[:space:]]@[[:space:]]([0-9a-f]{40})$ ]]; then
              pr_number="${BASH_REMATCH[1]}"
            else
              echo 'Unerwarteter PR-Build-Run-Titel; Status-Sync verweigert.' >&2
              exit 1
            fi
          fi
          [[ "$pr_number" =~ ^[1-9][0-9]*$ ]]
          echo "number=$pr_number" >> "$GITHUB_OUTPUT"

      - name: Vertrauenswürdigen main-Stand auschecken
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Node.js einrichten
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24.18.0'

      - name: Changed Files klassifizieren
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: node scripts/pr/updatePrClassification.mjs

      - name: Human- und CI-Evidence für aktuellen Head synchronisieren
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: node scripts/pr/syncPrEvidence.mjs
