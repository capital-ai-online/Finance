name: Documentary Change Impact

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: documentary-change-impact-main
  cancel-in-progress: true

jobs:
  analyze:
    name: Main-Änderung auf Dokumentationsfolgen korrelieren
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    outputs:
      current: ${{ steps.freshness.outputs.current }}
      state: ${{ steps.impact.outputs.state }}
      autosync_patches: ${{ steps.impact.outputs.autosync_patches }}
      patchable: ${{ steps.impact.outputs.patchable }}
      review_only: ${{ steps.impact.outputs.review_only }}

    steps:
      - name: Exakten Main-Stand auschecken
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0 / Node 24
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Before-Snapshot ohne persistierte Zugangsdaten auschecken
        if: github.event.before != '0000000000000000000000000000000000000000'
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0 / Node 24
        with:
          ref: ${{ github.event.before }}
          path: before-snapshot
          fetch-depth: 1
          persist-credentials: false

      - name: Node.js einrichten
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0 / Node 24 action runtime
        with:
          node-version: '24.18.0'
          cache: npm

      - name: Stalen Main-Run per GitHub-API verwerfen
        id: freshness
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0 / Node 24
        env:
          PUSH_SHA: ${{ github.sha }}
        with:
          script: |
            const normalizeSha = (value) => String(value || '').trim().toLowerCase();
            const pushSha = normalizeSha(process.env.PUSH_SHA);
            const { data: main } = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: 'main',
            });
            const liveMain = normalizeSha(main.commit?.sha);
            if (pushSha !== liveMain) {
              core.setOutput('current', 'false');
              core.notice(`Staler Documentary-Impact-Run: push=${pushSha} current_main=${liveMain}`);
              return;
            }
            core.setOutput('current', 'true');

      - name: Abhängigkeiten für trusted Analyse installieren
        if: steps.freshness.outputs.current == 'true'
        run: npm ci --ignore-scripts

      - name: Documentary-Komponentenversion fail-closed verifizieren
        if: steps.freshness.outputs.current == 'true'
        run: npm run documentary:version:verify

      - name: Vollständige Archive-Integrität und historische Provenance fail-closed verifizieren
        if: steps.freshness.outputs.current == 'true'
        run: npm run documentary:archive:verify

      - name: Exakten before..after Impact-Plan erzeugen
        if: steps.freshness.outputs.current == 'true'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          zero="0000000000000000000000000000000000000000"
          base="$BEFORE_SHA"
          if [ -z "$base" ] || [ "$base" = "$zero" ]; then
            base="$(git rev-parse "$AFTER_SHA^")"
          else
            git fetch --no-tags before-snapshot "$base:refs/remotes/documentary/before"
            test "$(git rev-parse refs/remotes/documentary/before)" = "$base"
          fi
          rm -rf before-snapshot
          npm run documentary:impact:plan -- \
            --base="$base" \
            --head="$AFTER_SHA" \
            --output=artifacts/documentary/change-impact.json

      - name: Deterministischen AUTO_SYNC-Plan erzeugen und lokal anwenden
        if: steps.freshness.outputs.current == 'true'
        run: |
          npm run documentary:autosync:plan -- \
            --head="${GITHUB_SHA}" \
            --output=artifacts/documentary/autosync-plan.json \
            --apply

      - name: Kandidaten-Hygiene nach AUTO_SYNC fail-closed prüfen
        if: steps.freshness.outputs.current == 'true'
        run: npm run docs:hygiene:check

      - name: Impact-Zustand klassifizieren
        if: steps.freshness.outputs.current == 'true'
        id: impact
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const impact = JSON.parse(fs.readFileSync('artifacts/documentary/change-impact.json', 'utf8'));
          const autoSync = JSON.parse(fs.readFileSync('artifacts/documentary/autosync-plan.json', 'utf8'));
          const patchable = Number(impact.patchableDocumentationPaths?.length || 0);
          const reviewOnly = Number(impact.reviewOnlyDocumentationPaths?.length || 0);
          const autosync = Number(autoSync.patches?.length || 0);
          const state = autosync > 0
            ? 'AUTO_SYNC'
            : patchable > 0
              ? 'MAINTENANCE_CANDIDATE'
              : reviewOnly > 0
                ? 'REVIEW_ONLY'
                : 'NO_ACTION';
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `state=${state}\npatchable=${patchable}\nreview_only=${reviewOnly}\nautosync_patches=${autosync}\n`);
          console.log(JSON.stringify({ state, patchable, reviewOnly, autosync }, null, 2));
          NODE

      - name: Deterministische Maintenance-Handoff-Evidence erzeugen
        if: steps.freshness.outputs.current == 'true'
        run: |
          npm run documentary:handoff:build -- \
            --impact=artifacts/documentary/change-impact.json \
            --autosync=artifacts/documentary/autosync-plan.json \
            --output=artifacts/documentary/maintenance-handoff.json

      - name: WP-06E Self-Healing-Convergence-Evidence erzeugen
        if: steps.freshness.outputs.current == 'true'
        run: |
          npm run documentary:convergence:evidence -- \
            --impact=artifacts/documentary/change-impact.json \
            --autosync=artifacts/documentary/autosync-plan.json \
            --handoff=artifacts/documentary/maintenance-handoff.json \
            --output=artifacts/documentary/convergence-evidence.json \
            --current-main=true \
            --concurrency-key=documentary-change-impact-main

      - name: Impact-, AUTO_SYNC- und Handoff-Evidence hochladen
        if: steps.freshness.outputs.current == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: documentary-change-impact-${{ github.sha }}
          path: artifacts/documentary/
          if-no-files-found: error
          retention-days: 7

      - name: Ergebnis zusammenfassen
        if: steps.freshness.outputs.current == 'true'
        env:
          IMPACT_STATE: ${{ steps.impact.outputs.state }}
          AUTOSYNC_PATCHES: ${{ steps.impact.outputs.autosync_patches }}
          PATCHABLE: ${{ steps.impact.outputs.patchable }}
          REVIEW_ONLY: ${{ steps.impact.outputs.review_only }}
        run: |
          {
            echo "## Documentary Change Impact"
            echo
            echo "- Source commit: `${GITHUB_SHA}`"
            echo "- State: `${IMPACT_STATE}`"
            echo "- Deterministic AUTO_SYNC patches: `${AUTOSYNC_PATCHES}`"
            echo "- Semantic patch candidates: `${PATCHABLE}`"
            echo "- Review-only candidates: `${REVIEW_ONLY}`"
            echo "- Self-Healing parent: `OPS-08-B-SH-02`"
            echo "- Evidence role: `EVIDENCE_PROJECTION_ONLY`"
            echo "- Trigger model: `MAIN_PUSH_EVENT_DRIVEN`"
            echo "- Stale-main policy: `ABORT_AND_RESTART_ON_NEXT_MAIN_PUSH`"
            echo "- Concurrency: `documentary-change-impact-main / cancel-in-progress=true`"
            echo "- Branch collision: `IDEMPOTENT_REUSE_AFTER_EXACT_TREE_AND_CLAIM_VERIFICATION`"
            echo
            echo "WP-06 evidence is subordinate to SH-02 and does not create Finding/Action/Budget authority. AUTO_SYNC may enter only the validated isolated-branch lane. Semantic maintenance remains bound to Supervisor -> Platform Director APPROVED -> Agent IAM."
          } >> "$GITHUB_STEP_SUMMARY"

  autosync-branch:
    name: Validierten Documentary AUTO_SYNC-Branch materialisieren
    needs: analyze
    if: needs.analyze.outputs.current == 'true' && needs.analyze.outputs.state == 'AUTO_SYNC'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    outputs:
      branch: ${{ steps.write.outputs.branch }}
      commit: ${{ steps.write.outputs.commit }}

    steps:
      - name: Validierte AUTO_SYNC-/Handoff-Evidence laden
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: documentary-change-impact-${{ github.sha }}
          path: ${{ runner.temp }}/documentary-autosync

      - name: Exact-Main, Handoff und Patch-Hashes revalidieren und Branch schreiben
        id: write
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0 / Node 24
        env:
          SOURCE_SHA: ${{ github.sha }}
          ARTIFACT_DIR: ${{ runner.temp }}/documentary-autosync
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const crypto = require('crypto');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sourceSha = String(process.env.SOURCE_SHA || '').toLowerCase();
            if (!/^[0-9a-f]{40}$/.test(sourceSha)) throw new Error('Invalid source SHA.');

            const plan = JSON.parse(fs.readFileSync(path.join(process.env.ARTIFACT_DIR, 'autosync-plan.json'), 'utf8'));
            const handoff = JSON.parse(fs.readFileSync(path.join(process.env.ARTIFACT_DIR, 'maintenance-handoff.json'), 'utf8'));

            if (String(plan.sourceCommit || '').toLowerCase() !== sourceSha) {
              throw new Error('AUTO_SYNC plan/source SHA mismatch.');
            }
            if (String(handoff.sourceCommit || '').toLowerCase() !== sourceSha || handoff.state !== 'AUTO_SYNC_DRAFT_PR') {
              throw new Error('Maintenance handoff is not bound to this AUTO_SYNC source/state.');
            }
            if (!Array.isArray(plan.patches) || plan.patches.length < 1 || plan.patches.length > 10) {
              throw new Error('AUTO_SYNC patch count is outside the bounded write corridor.');
            }

            const allowed = new Set([
              'docs/projects/README.md',
              'docs/projects/PROJECT_VALUE_CHAIN.md',
              'docs/roadmaps/ROADMAP_CONSOLIDATION_MASTER_INDEX.md',
            ]);
            const sha256 = value => crypto.createHash('sha256').update(value, 'utf8').digest('hex');

            const { data: main } = await github.rest.repos.getBranch({ owner, repo, branch: 'main' });
            if (String(main.commit.sha).toLowerCase() !== sourceSha) {
              throw new Error(`CURRENT_MAIN drift before AUTO_SYNC write: expected=${sourceSha} observed=${main.commit.sha}`);
            }

            const branch = `agent/documentary-autosync-${sourceSha.slice(0, 12)}`;
            const claimId = `DOCUMENTARY-AUTOSYNC-${sourceSha.slice(0, 12).toUpperCase()}`;
            const claimPath = `.ai/work-claims/${claimId}.json`;
            const expectedChangedPaths = [...plan.patches.map(patch => patch.path), claimPath].sort();
            const sameStrings = (left, right) =>
              JSON.stringify([...(Array.isArray(left) ? left : [])].map(String).sort()) ===
              JSON.stringify([...(Array.isArray(right) ? right : [])].map(String).sort());

            let existingRef = null;
            try {
              const { data: ref } = await github.rest.git.getRef({ owner, repo, ref: `heads/${branch}` });
              existingRef = ref;
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            if (existingRef) {
              const existingSha = String(existingRef.object?.sha || '').toLowerCase();
              if (!/^[0-9a-f]{40}$/.test(existingSha)) {
                throw new Error('Existing AUTO_SYNC branch resolved to an invalid commit SHA.');
              }

              const { data: existingCommit } = await github.rest.git.getCommit({
                owner,
                repo,
                commit_sha: existingSha,
              });
              const parents = Array.isArray(existingCommit.parents)
                ? existingCommit.parents.map(parent => String(parent.sha || '').toLowerCase())
                : [];
              if (parents.length !== 1 || parents[0] !== sourceSha) {
                throw new Error('Existing AUTO_SYNC branch is not a single commit over exact source SHA.');
              }

              const { data: comparison } = await github.request(
                'GET /repos/{owner}/{repo}/compare/{basehead}',
                { owner, repo, basehead: `${sourceSha}...${existingSha}` },
              );
              if (
                comparison.status !== 'ahead' ||
                Number(comparison.ahead_by) !== 1 ||
                Number(comparison.behind_by) !== 0
              ) {
                throw new Error('Existing AUTO_SYNC branch is not an exact one-commit descendant of CURRENT_MAIN.');
              }
              const observedChangedPaths = (comparison.files || [])
                .map(file => String(file.filename || ''))
                .filter(Boolean)
                .sort();
              if (!sameStrings(observedChangedPaths, expectedChangedPaths)) {
                throw new Error(
                  `Existing AUTO_SYNC branch changed-file set does not match the fresh plan: expected=${expectedChangedPaths.join(',')} observed=${observedChangedPaths.join(',')}`,
                );
              }

              for (const patch of plan.patches) {
                if (!allowed.has(patch.path)) {
                  throw new Error(`AUTO_SYNC path is not allowlisted: ${patch.path}`);
                }
                const { data: sourceFile } = await github.rest.repos.getContent({
                  owner,
                  repo,
                  path: patch.path,
                  ref: sourceSha,
                });
                if (Array.isArray(sourceFile) || sourceFile.type !== 'file' || !sourceFile.content) {
                  throw new Error(`AUTO_SYNC source is not a regular repository file: ${patch.path}`);
                }
                const sourceContent = Buffer.from(
                  sourceFile.content,
                  sourceFile.encoding || 'base64',
                ).toString('utf8');
                if (sha256(sourceContent) !== patch.previousSha256) {
                  throw new Error(`Source hash drift: ${patch.path}`);
                }
                if (sha256(patch.proposedContent) !== patch.proposedSha256) {
                  throw new Error(`Proposed hash mismatch: ${patch.path}`);
                }

                const { data: branchFile } = await github.rest.repos.getContent({
                  owner,
                  repo,
                  path: patch.path,
                  ref: existingSha,
                });
                if (Array.isArray(branchFile) || branchFile.type !== 'file' || !branchFile.content) {
                  throw new Error(`Existing AUTO_SYNC target is not a regular repository file: ${patch.path}`);
                }
                const branchContent = Buffer.from(
                  branchFile.content,
                  branchFile.encoding || 'base64',
                ).toString('utf8');
                if (sha256(branchContent) !== patch.proposedSha256) {
                  throw new Error(`Existing AUTO_SYNC branch patch content mismatch: ${patch.path}`);
                }
              }

              const { data: claimFile } = await github.rest.repos.getContent({
                owner,
                repo,
                path: claimPath,
                ref: existingSha,
              });
              if (Array.isArray(claimFile) || claimFile.type !== 'file' || !claimFile.content) {
                throw new Error('Existing AUTO_SYNC branch is missing its exact work claim.');
              }
              const existingClaim = JSON.parse(
                Buffer.from(claimFile.content, claimFile.encoding || 'base64').toString('utf8'),
              );
              const claimMatches =
                existingClaim.claimId === claimId &&
                existingClaim.status === 'active' &&
                existingClaim.exclusive === true &&
                existingClaim.branch === branch &&
                existingClaim.projectId === 'CAPITAL-AI-DOC' &&
                existingClaim.projectFolder === 'docs/projects/documentary/' &&
                String(existingClaim.baseSha || '').toLowerCase() === sourceSha &&
                sameStrings(existingClaim.claimedPaths, expectedChangedPaths) &&
                sameStrings(existingClaim.semanticPatchCandidates, handoff.semanticPatchPaths || []) &&
                sameStrings(existingClaim.reviewRequiredPaths, handoff.reviewRequiredPaths || []) &&
                existingClaim.maintenanceHandoff?.version === handoff.handoffVersion &&
                existingClaim.maintenanceHandoff?.state === handoff.state &&
                existingClaim.maintenanceHandoff?.correlationId === handoff.correlationId;
              if (!claimMatches) {
                throw new Error('Existing AUTO_SYNC branch claim mismatch against the fresh maintenance handoff.');
              }

              core.notice(
                `AUTO_SYNC branch already exists and matches the fresh plan: ${branch}; verified idempotent reuse.`,
              );
              core.setOutput('branch', branch);
              core.setOutput('commit', existingSha);
              return;
            }

            const { data: sourceCommit } = await github.rest.git.getCommit({ owner, repo, commit_sha: sourceSha });
            const treeItems = [];
            const claimedPaths = [];

            for (const patch of plan.patches) {
              if (!allowed.has(patch.path)) throw new Error(`AUTO_SYNC path is not allowlisted: ${patch.path}`);
              const { data: currentFile } = await github.rest.repos.getContent({ owner, repo, path: patch.path, ref: sourceSha });
              if (Array.isArray(currentFile) || currentFile.type !== 'file' || !currentFile.content) {
                throw new Error(`AUTO_SYNC target is not a regular repository file: ${patch.path}`);
              }
              const current = Buffer.from(currentFile.content, currentFile.encoding || 'base64').toString('utf8');
              if (sha256(current) !== patch.previousSha256) throw new Error(`Source hash drift: ${patch.path}`);
              if (sha256(patch.proposedContent) !== patch.proposedSha256) throw new Error(`Proposed hash mismatch: ${patch.path}`);

              const { data: blob } = await github.rest.git.createBlob({
                owner, repo, content: patch.proposedContent, encoding: 'utf-8',
              });
              treeItems.push({ path: patch.path, mode: '100644', type: 'blob', sha: blob.sha });
              claimedPaths.push(patch.path);
            }

            const claim = {
              schemaVersion: '1.0.0',
              claimId,
              status: 'active',
              exclusive: true,
              branch,
              project: 'CAPITAL-AI-DOC',
              projectFolder: 'documentary',
              agent: {
                provider: 'github-actions',
                model: 'deterministic',
                executionSurface: 'Documentary Change Impact / AUTO_SYNC',
              },
              workItem: 'Apply bounded deterministic Documentary AUTO_SYNC rules derived from exact CURRENT_MAIN.',
              workItemDE: 'Deterministische Documentary-AUTO_SYNC-Korrektur aus exaktem CURRENT_MAIN materialisieren.',
              priority: 'P2',
              priorityReason: 'Deterministische, reversible Dokumentationskonvergenz ohne Runtime- oder Production-Mutation.',
              projectId: 'CAPITAL-AI-DOC',
              projectFolder: 'docs/projects/documentary/',
              projectStage: 'PVC-03',
              semanticPatchCandidates: Array.isArray(handoff.semanticPatchPaths) ? handoff.semanticPatchPaths : [],
              startedAt: new Date().toISOString(),
              baseBranch: 'main',
              baseSha: sourceSha,
              claimedPaths: [...claimedPaths, claimPath].sort(),
              reviewRequiredPaths: Array.isArray(handoff.reviewRequiredPaths) ? handoff.reviewRequiredPaths : [],
              maintenanceHandoff: {
                version: handoff.handoffVersion,
                state: handoff.state,
                correlationId: handoff.correlationId,
              },
              releaseCondition: 'Release on Human/CODEOWNER merge, PR close, supersession or abandonment; automation has no merge authority.',
            };

            const { data: claimBlob } = await github.rest.git.createBlob({
              owner, repo, content: JSON.stringify(claim, null, 2) + '\n', encoding: 'utf-8',
            });
            treeItems.push({ path: claimPath, mode: '100644', type: 'blob', sha: claimBlob.sha });

            const { data: tree } = await github.rest.git.createTree({
              owner, repo, base_tree: sourceCommit.tree.sha, tree: treeItems,
            });
            const { data: commit } = await github.rest.git.createCommit({
              owner,
              repo,
              message: `docs(documentary): deterministic auto-sync ${sourceSha.slice(0, 12)}`,
              tree: tree.sha,
              parents: [sourceSha],
            });
            await github.rest.git.createRef({
              owner, repo, ref: `refs/heads/${branch}`, sha: commit.sha,
            });
            core.setOutput('branch', branch);
            core.setOutput('commit', commit.sha);

      - name: Write-Lane zusammenfassen
        env:
          BRANCH: ${{ steps.write.outputs.branch }}
          COMMIT: ${{ steps.write.outputs.commit }}
        run: |
          {
            echo "## Documentary deterministic AUTO_SYNC"
            echo
            echo "- branch: `${BRANCH}`"
            echo "- commit: `${COMMIT:-EXISTING_BRANCH}`"
            echo "- main mutation: `NO`"
            echo "- Draft-PR handoff: `READY`"
            echo "- merge/deploy: `NOT_AUTHORIZED`"
          } >> "$GITHUB_STEP_SUMMARY"

  autosync-draft-pr:
    name: AUTO_SYNC-Branch an bestehenden Draft-PR-Pfad übergeben
    needs: autosync-branch
    if: needs.autosync-branch.outputs.branch != ''
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: ./.github/workflows/open-agent-draft-pr.yml
    with:
      head_branch: ${{ needs.autosync-branch.outputs.branch }}
      trusted_handoff: documentary-autosync

  semantic-handoff:
    name: Semantischen Maintenance-Handoff fail-closed ausweisen
    needs: analyze
    if: needs.analyze.outputs.current == 'true' && needs.analyze.outputs.state == 'MAINTENANCE_CANDIDATE'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Autorisierungsgrenze zusammenfassen
        env:
          PATCHABLE: ${{ needs.analyze.outputs.patchable }}
          REVIEW_ONLY: ${{ needs.analyze.outputs.review_only }}
        run: |
          {
            echo "## Documentary Semantic Maintenance Handoff"
            echo
            echo "- state: `SEMANTIC_AUTHORIZATION_REQUIRED`"
            echo "- patchable candidates: `${PATCHABLE}`"
            echo "- review-only candidates: `${REVIEW_ONLY}`"
            echo "- required chain: `Supervisor -> Platform Director APPROVED -> Agent IAM`"
            echo "- synthetic approval: `FORBIDDEN`"
            echo "- execution entry point: `scripts/automation/runDocumentaryMaintenanceControlLoop.ts`"
          } >> "$GITHUB_STEP_SUMMARY"
