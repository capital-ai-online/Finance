name: Cleanup merged branches

on:
  schedule:
    - cron: '41 3 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Nur Kandidaten protokollieren, keine Branches löschen'
        required: true
        type: boolean
        default: true
      grace_days:
        description: 'Mindestalter des letzten Branch-Commits in Tagen'
        required: true
        type: string
        default: '14'

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: cleanup-merged-branches
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Repository auschecken
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Gemergte Branches fail-closed prüfen und bereinigen
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_CLEANUP_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
          BRANCH_CLEANUP_GRACE_DAYS: ${{ github.event_name == 'workflow_dispatch' && inputs.grace_days || '14' }}
        run: |
          node scripts/governance/cleanupMergedBranches.mjs \
            --dry-run="${BRANCH_CLEANUP_DRY_RUN}" \
            --grace-days="${BRANCH_CLEANUP_GRACE_DAYS}"
