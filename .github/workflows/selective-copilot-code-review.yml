name: Selective Copilot Code Review
run-name: >-
  PR #${{ inputs.pr_number }} – manuelles Copilot Code Review

# OPS-02-CI-01 cost invariant:
# Automatic post-CI Copilot fan-out is intentionally retired. Copilot Code
# Review is optional provider work and must not allocate a hosted planning
# runner for every successful PR CI merely to discover review_mode=none.
# A Human may explicitly dispatch this workflow for one concrete open PR.
# No repository checkout, candidate execution, API key, provider permission or
# license mutation occurs here.
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Open Finance PR number targeting main'
        required: true
        type: number

permissions: {}

concurrency:
  group: selective-copilot-review-${{ inputs.pr_number }}
  cancel-in-progress: true

jobs:
  request-review:
    name: Copilot Review manuell anfordern
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Exakten offenen PR validieren und Copilot-Review dedupliziert anfordern
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0 / Node 24
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pullNumber = Number(process.env.PR_NUMBER);
            if (!Number.isSafeInteger(pullNumber) || pullNumber <= 0) {
              core.setFailed(`Ungueltige PR-Nummer: ${process.env.PR_NUMBER}`);
              return;
            }

            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: pullNumber,
            });

            if (pr.state !== 'open') {
              core.setFailed(`PR #${pullNumber} ist nicht offen.`);
              return;
            }
            if (pr.base.ref !== 'main') {
              core.setFailed(`PR #${pullNumber} zielt auf ${pr.base.ref} statt main.`);
              return;
            }
            if (pr.head.repo?.full_name !== context.payload.repository.full_name) {
              core.setFailed(`PR #${pullNumber} stammt nicht aus demselben Repository.`);
              return;
            }

            const bot = 'copilot-pull-request-reviewer[bot]';
            const [reviews, requested] = await Promise.all([
              github.paginate(
                github.rest.pulls.listReviews,
                { owner, repo, pull_number: pullNumber, per_page: 100 },
              ),
              github.rest.pulls.listRequestedReviewers({
                owner,
                repo,
                pull_number: pullNumber,
              }),
            ]);

            const alreadyReviewed = reviews.some(
              (review) => review.user?.login === bot && review.commit_id === pr.head.sha,
            );
            const alreadyPending = (requested.data.users ?? []).some(
              (user) => user.login === bot,
            );

            if (alreadyReviewed || alreadyPending) {
              core.notice(`Copilot-Review nicht erneut angefordert: PR #${pullNumber}, head=${pr.head.sha}.`);
              return;
            }

            try {
              await github.rest.pulls.requestReviewers({
                owner,
                repo,
                pull_number: pullNumber,
                reviewers: [bot],
              });
              core.notice(`Copilot-Code-Review manuell angefordert: PR #${pullNumber}, head=${pr.head.sha}.`);
            } catch (error) {
              if (error.status === 403 || error.status === 404 || error.status === 422) {
                core.warning(`Copilot-Code-Review ist im aktuellen Provider-/Lizenzzustand nicht anforderbar; keine Review-Evidence wird behauptet: ${error.message}`);
                return;
              }
              throw error;
            }
