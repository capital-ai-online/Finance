name: Agenten-Draft-PR öffnen oder aktualisieren
run-name: >-
  Agenten-Draft-PR für ${{ inputs.head_branch }} vorbereiten

on:
  workflow_dispatch:
    inputs:
      head_branch:
        description: 'Agenten-Branch mit genau einem neuen .ai/work-claims/*.json-Claim'
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: open-agent-draft-pr-${{ inputs.head_branch }}
  cancel-in-progress: false

jobs:
  preflight-and-open:
    name: Vertrauenswürdige Vorprüfung und Draft-PR-Erstellung
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Vertrauenswürdige Richtlinie aus main auschecken
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { ref: main, path: policy, fetch-depth: 1, persist-credentials: false }
      - name: Node.js einrichten
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '22' }
      - name: Angeforderten Agenten-Branch validieren
        working-directory: policy
        env: { HEAD_BRANCH: "${{ inputs.head_branch }}" }
        run: |
          set -euo pipefail
          git check-ref-format --branch "$HEAD_BRANCH" >/dev/null
          case "$HEAD_BRANCH" in agent/*|claude/*|gemini/*|copilot/*|ai/*) ;; *) echo "Agenten-Branch muss einen freigegebenen Präfix verwenden." >&2; exit 1 ;; esac
      - name: Kandidaten ohne persistierte Zugangsdaten auschecken
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { ref: "${{ inputs.head_branch }}", path: candidate, fetch-depth: 0, persist-credentials: false }
      - name: Aktuellen vertrauenswürdigen main-Stand importieren
        working-directory: candidate
        run: git fetch --no-tags ../policy main:refs/remotes/origin/main
      - name: Produktions-Baseline vor PR-Erstellung prüfen
        id: baseline
        working-directory: candidate
        env: { PR_BASE_REF: origin/main, PR_HEAD_REF: HEAD, PR_BASELINE_OUTPUT: artifacts/pr/production-baseline.json, CAPITAL_AI_PRODUCTION_HEALTH_URL: "https://capital-ai.online/healthz" }
        run: node ../policy/scripts/pr/productionPreflight.mjs
      - name: Work-Claim und Überschneidungen mit offenen PRs prüfen
        working-directory: candidate
        env: { GITHUB_TOKEN: "${{ github.token }}", PR_BASE_REF: origin/main, PR_HEAD_REF: HEAD, PR_BASELINE_OUTPUT: artifacts/pr/production-baseline.json }
        run: node ../policy/scripts/pr/validateWorkClaim.mjs
      - name: Kanonischen deutschen Lern-PR-Text automatisch erzeugen
        id: render
        working-directory: candidate
        env: { PR_BASE_REF: origin/main, PR_HEAD_REF: HEAD, PR_HEAD_BRANCH: "${{ inputs.head_branch }}", PR_BASELINE_OUTPUT: artifacts/pr/production-baseline.json, PR_TEMPLATE_PATH: ../policy/.github/pull_request_template.md, PR_BODY_OUTPUT: artifacts/pr/pull-request-body.md }
        run: node ../policy/scripts/pr/renderPullRequestBody.mjs
      - name: Draft-PR öffnen oder Body für aktuellen Head aktualisieren
        working-directory: candidate
        env: { GH_TOKEN: "${{ github.token }}", HEAD_BRANCH: "${{ inputs.head_branch }}", PR_TITLE: "${{ steps.render.outputs.pr_title }}" }
        run: |
          set -euo pipefail
          existing="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --head "$HEAD_BRANCH" --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --repo "$GITHUB_REPOSITORY" --title "$PR_TITLE" --body-file artifacts/pr/pull-request-body.md
            echo "PR #$existing wurde für den aktuellen Head neu klassifiziert und aktualisiert."
            exit 0
          fi
          gh pr create --repo "$GITHUB_REPOSITORY" --draft --base main --head "$HEAD_BRANCH" --title "$PR_TITLE" --body-file artifacts/pr/pull-request-body.md
