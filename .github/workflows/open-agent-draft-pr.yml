name: Agenten-Draft-PR öffnen
run-name: >-
  ${{ inputs.head_branch != ''
      && format('Agenten-Draft-PR für {0} korrelieren und öffnen', inputs.head_branch)
      || format('Kanonische Projektlabels auf main@{0} konvergieren', github.sha) }}

on:
  push:
    branches: [main]
    paths:
      - 'docs/projects/README.md'
      - 'scripts/pr/prLabelClassification.mjs'
      - '.github/workflows/open-agent-draft-pr.yml'
  workflow_call:
    inputs:
      head_branch:
        description: 'Agenten-Branch mit genau einem neuen .ai/work-claims/*.json-Claim'
        required: true
        type: string
      trusted_handoff:
        description: 'Repository-interner trusted-main Handoff: documentary-autosync, agent-autocreate oder self-healing-recovery'
        required: false
        type: string
        default: ''
    secrets:
      CAPITAL_AI_GITHUB_APP_PRIVATE_KEY:
        description: 'Private key for the existing repository-installed CAPITAL-AI GitHub App'
        required: true
  workflow_dispatch:
    inputs:
      head_branch:
        description: 'Agenten-Branch mit genau einem neuen .ai/work-claims/*.json-Claim'
        required: true
        type: string

permissions: {}

concurrency:
  group: open-agent-draft-pr-${{ inputs.head_branch }}
  cancel-in-progress: false

jobs:
  converge-project-labels:
    name: Kanonische Projektlabel-Provider-Metadaten konvergieren
    permissions:
      contents: read
      pull-requests: write
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      inputs.head_branch == ''
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Exakten CURRENT_MAIN-Stand auschecken
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0 / Node 24
        with:
          ref: ${{ github.sha }}
          path: label-policy
          fetch-depth: 1
          persist-credentials: false

      - name: Node.js einrichten
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0 / Node 24 action runtime
        with:
          node-version: '24.18.0'

      - name: Kanonischen Projektlabel-Katalog konvergieren und Provider-Readback prüfen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          live_main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          policy_main_sha="$(git -C label-policy rev-parse HEAD)"
          event_sha="${GITHUB_SHA,,}"
          if [ "$live_main_sha" != "$event_sha" ] || [ "$policy_main_sha" != "$event_sha" ]; then
            echo "Projektlabel-Konvergenz ist stale: event=$event_sha checkout=$policy_main_sha live=$live_main_sha. Keine Provider-Mutation." >&2
            exit 1
          fi

          catalog="$RUNNER_TEMP/canonical-project-labels.json"
          PR_LABEL_CLASSIFICATION_SCOPE=ALL_PROJECTS \
          PR_PROJECT_MAPPING_PATH=label-policy/docs/projects/README.md \
            node label-policy/scripts/pr/prLabelClassification.mjs > "$catalog"

          jq -e '.state == "CANONICAL_PROJECT_LABEL_SET_CLASSIFIED" and (.labels | length > 0)' "$catalog" >/dev/null

          while IFS= read -r row; do
            name="$(jq -r '.name' <<<"$row")"
            color="$(jq -r '.color' <<<"$row")"
            description="$(jq -r '.description' <<<"$row")"
            project_id="$(jq -r '.projectId' <<<"$row")"

            gh label create "$name" \
              --repo "$GITHUB_REPOSITORY" \
              --color "$color" \
              --description "$description" \
              --force

            encoded="$(jq -rn --arg value "$name" '$value | @uri')"
            observed="$(gh api "repos/${GITHUB_REPOSITORY}/labels/$encoded")"
            observed_name="$(jq -r '.name' <<<"$observed")"
            observed_color="$(jq -r '.color' <<<"$observed")"
            observed_description="$(jq -r '.description // ""' <<<"$observed")"

            if [ "$observed_name" != "$name" ] || \
               [ "${observed_color^^}" != "${color^^}" ] || \
               [ "$observed_description" != "$description" ]; then
              echo "Provider-Readback FAIL für $project_id: expected=$name/$color/$description observed=$observed_name/$observed_color/$observed_description" >&2
              exit 1
            fi
            echo "Provider-Readback PASS für $project_id: $name #${observed_color^^}"
          done < <(jq -c '.labels[]' "$catalog")

  precreate-sync:
    name: Agenten-Branch vor Draft-PR auf CURRENT_MAIN konvergieren
    permissions:
      contents: write
      pull-requests: read
    if: >-
      (inputs.head_branch != '' &&
       inputs.trusted_handoff == 'documentary-autosync' &&
       github.event_name == 'push' &&
       github.ref == 'refs/heads/main') ||
      (inputs.head_branch != '' &&
       inputs.trusted_handoff == 'agent-autocreate' &&
       github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository) ||
      (inputs.head_branch != '' &&
       inputs.trusted_handoff == 'self-healing-recovery' &&
       github.event_name == 'schedule' &&
       github.ref == 'refs/heads/main') ||
      (inputs.head_branch != '' &&
       inputs.trusted_handoff == '' &&
       github.triggering_actor == 'SvenKulessa' &&
       github.actor == 'SvenKulessa')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      existing_pr: ${{ steps.sync.outputs.existing_pr }}
      main_sha: ${{ steps.sync.outputs.main_sha }}
      head_sha: ${{ steps.sync.outputs.head_sha }}

    steps:
      - name: Branch-Namespace und bounded Pre-create-Sync validieren
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ inputs.head_branch }}
          TRUSTED_HANDOFF: ${{ inputs.trusted_handoff }}
        run: |
          set -euo pipefail

          git check-ref-format --branch "$HEAD_BRANCH" >/dev/null
          case "$HEAD_BRANCH" in
            agent/*|claude/*|grok/*|ai/*) ;;
            *) echo "Agenten-Branch muss einen freigegebenen Präfix verwenden: agent/, claude/, grok/, ai/" >&2; exit 1 ;;
          esac
          if [ "$TRUSTED_HANDOFF" = "documentary-autosync" ]; then
            case "$HEAD_BRANCH" in
              agent/documentary-autosync-*) ;;
              *) echo "Trusted Documentary AUTO_SYNC darf nur agent/documentary-autosync-* übergeben." >&2; exit 1 ;;
            esac
          fi

          existing="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --head "$HEAD_BRANCH" \
            --json number \
            --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            head_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/$HEAD_BRANCH" --jq '.object.sha')"
            main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
            echo "existing_pr=true" >> "$GITHUB_OUTPUT"
            echo "main_sha=$main_sha" >> "$GITHUB_OUTPUT"
            echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
            echo "Für $HEAD_BRANCH existiert bereits PR #$existing; Pre-create-Sync führt keine Branch-Mutation aus. Post-create Sync bleibt bei sync-agent-pr-branches.yml."
            exit 0
          fi
          echo "existing_pr=false" >> "$GITHUB_OUTPUT"

          live_main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          head_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/$HEAD_BRANCH" --jq '.object.sha')"
          if ! printf '%s' "$live_main_sha" | grep -Eq '^[0-9a-f]{40}$' || \
             ! printf '%s' "$head_sha" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "Pre-create-Sync konnte keine gültigen Main-/Head-SHAs auflösen." >&2
            exit 1
          fi

          lineage="$(gh api "repos/${GITHUB_REPOSITORY}/compare/$live_main_sha...$head_sha" --jq '.status')"
          case "$lineage" in
            ahead|identical)
              echo "Agenten-Branch enthält CURRENT_MAIN bereits: main=$live_main_sha head=$head_sha lineage=$lineage"
              ;;
            behind|diverged)
              echo "Agenten-Branch ist stale: main=$live_main_sha head=$head_sha lineage=$lineage; bounded Merge wird ausgeführt."
              if ! gh api --method POST \
                -H 'Accept: application/vnd.github+json' \
                "repos/${GITHUB_REPOSITORY}/merges" \
                -f "base=$HEAD_BRANCH" \
                -f "head=$live_main_sha" \
                -f "commit_message=chore(pr): synchronize $HEAD_BRANCH with current main" \
                > "$RUNNER_TEMP/precreate-branch-merge.json"; then
                echo "Pre-create-Sync konnte CURRENT_MAIN nicht konfliktfrei in $HEAD_BRANCH mergen; keine PR-Erstellung." >&2
                exit 1
              fi
              ;;
            *)
              echo "Unerwarteter Compare-Status '$lineage'; Pre-create-Sync fail-closed." >&2
              exit 1
              ;;
          esac

          after_main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          after_head_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/$HEAD_BRANCH" --jq '.object.sha')"
          if [ "$after_main_sha" != "$live_main_sha" ]; then
            echo "CURRENT_MAIN bewegte sich während Pre-create-Sync: before=$live_main_sha after=$after_main_sha. Frischer Workflow-Run erforderlich." >&2
            exit 1
          fi

          after_lineage="$(gh api "repos/${GITHUB_REPOSITORY}/compare/$after_main_sha...$after_head_sha" --jq '.status')"
          if [ "$after_lineage" != 'ahead' ] && [ "$after_lineage" != 'identical' ]; then
            echo "Pre-create-Sync Readback beweist keine CURRENT_MAIN-Ancestry: main=$after_main_sha head=$after_head_sha lineage=$after_lineage." >&2
            exit 1
          fi

          echo "main_sha=$after_main_sha" >> "$GITHUB_OUTPUT"
          echo "head_sha=$after_head_sha" >> "$GITHUB_OUTPUT"
          echo "Pre-create-Sync PASS: main=$after_main_sha head=$after_head_sha lineage=$after_lineage"

  preflight-and-open:
    name: Vertrauenswürdige Korrelation und Draft-PR-Erstellung
    needs: [precreate-sync]
    permissions:
      contents: read
      pull-requests: write
    if: >-
      needs.precreate-sync.result == 'success' &&
      needs.precreate-sync.outputs.existing_pr != 'true' &&
      ((inputs.head_branch != '' &&
       inputs.trusted_handoff == 'documentary-autosync' &&
       github.event_name == 'push' &&
       github.ref == 'refs/heads/main') ||
      (inputs.head_branch != '' &&
       inputs.trusted_handoff == 'agent-autocreate' &&
       github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository) ||
      (inputs.head_branch != '' &&
       inputs.trusted_handoff == 'self-healing-recovery' &&
       github.event_name == 'schedule' &&
       github.ref == 'refs/heads/main') ||
      (inputs.head_branch != '' &&
       inputs.trusted_handoff == '' &&
       github.triggering_actor == 'SvenKulessa' &&
       github.actor == 'SvenKulessa'))
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Vertrauenswürdige Richtlinie aus main auschecken
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0 / Node 24
        with:
          ref: main
          path: policy
          fetch-depth: 1
          persist-credentials: false

      - name: Node.js einrichten
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0 / Node 24 action runtime
        with:
          node-version: '24.18.0'

      - name: Angeforderten Agenten-Branch validieren
        working-directory: policy
        env:
          HEAD_BRANCH: ${{ inputs.head_branch }}
          TRUSTED_HANDOFF: ${{ inputs.trusted_handoff }}
        run: |
          set -euo pipefail
          git check-ref-format --branch "$HEAD_BRANCH" >/dev/null
          case "$HEAD_BRANCH" in
            agent/*|claude/*|grok/*|ai/*) ;;
            *) echo "Agenten-Branch muss einen freigegebenen Präfix verwenden: agent/, claude/, grok/, ai/" >&2; exit 1 ;;
          esac
          if [ "$TRUSTED_HANDOFF" = "documentary-autosync" ]; then
            case "$HEAD_BRANCH" in
              agent/documentary-autosync-*) ;;
              *) echo "Trusted Documentary AUTO_SYNC darf nur agent/documentary-autosync-* übergeben." >&2; exit 1 ;;
            esac
          fi

      - name: Angeforderten Agenten-Branch auschecken
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0 / Node 24
        with:
          ref: ${{ inputs.head_branch }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Aktuellen vertrauenswürdigen main-Stand importieren
        working-directory: candidate
        run: git fetch --no-tags ../policy main:refs/remotes/origin/main

      - name: Produktions-Baseline vor PR-Erstellung prüfen
        id: baseline
        working-directory: candidate
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_BASE_REF: origin/main
          PR_HEAD_REF: HEAD
          PR_BASELINE_OUTPUT: artifacts/pr/production-baseline.json
          CAPITAL_AI_PRODUCTION_HEALTH_URL: https://capital-ai.online/healthz
        run: node ../policy/scripts/pr/productionPreflight.mjs

      - name: Exklusiven Work-Claim und Überschneidungen fail-closed prüfen
        working-directory: candidate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_BASE_REF: origin/main
          PR_HEAD_REF: HEAD
          PR_HEAD_BRANCH: ${{ inputs.head_branch }}
          PR_TRUSTED_HANDOFF: ${{ inputs.trusted_handoff }}
          PR_BASELINE_OUTPUT: artifacts/pr/production-baseline.json
          PR_CORRELATION_OUTPUT: artifacts/pr/create-correlation.json
          PR_COORDINATION_FAIL_CLOSED: 'true'
        run: node ../policy/scripts/pr/validateWorkClaim.mjs

      - name: Kanonischen deutschen PR-Text aus trusted-main Vorlage erzeugen
        id: render
        working-directory: candidate
        env:
          PR_BASE_REF: origin/main
          PR_HEAD_REF: HEAD
          PR_HEAD_BRANCH: ${{ inputs.head_branch }}
          PR_BASELINE_OUTPUT: artifacts/pr/production-baseline.json
          PR_TEMPLATE_PATH: ../policy/.github/pull_request_template.md
          PR_BODY_OUTPUT: artifacts/pr/pull-request-body.md
        run: node ../policy/scripts/pr/renderPullRequestBody.mjs

      - name: Trusted main unmittelbar vor externer Create-Mutation neu auschecken
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0 / Node 24
        with:
          ref: main
          path: create-policy
          fetch-depth: 1
          persist-credentials: false

      - name: PR-Label vor der Create-Mutation klassifizieren
        id: pr-label
        working-directory: candidate
        env:
          PR_PROJECT_ID: ${{ steps.render.outputs.project_id }}
          PR_PROJECT_MAPPING_PATH: ../create-policy/docs/projects/README.md
        run: node ../create-policy/scripts/pr/prLabelClassification.mjs

      - name: GitHub-App-Token für kanonische PR-Autoridentität erzeugen
        id: pr_app_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.CAPITAL_AI_GITHUB_APP_CLIENT_ID }}
          private-key: ${{ secrets.CAPITAL_AI_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          # gh pr create resolves repository.defaultBranchRef through GraphQL before the REST mutation.
          # Read-only repository metadata/content access is therefore required in addition to PR write.
          permission-contents: read
          permission-pull-requests: write

      - name: Final korrelieren, Projekt-Lane triagieren und Draft-PR öffnen
        working-directory: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          PR_CREATE_TOKEN: ${{ steps.pr_app_token.outputs.token }}
          HEAD_BRANCH: ${{ inputs.head_branch }}
          PR_TITLE: ${{ steps.render.outputs.pr_title }}
          PR_BASE_REF: origin/main
          PR_HEAD_REF: HEAD
          PR_HEAD_BRANCH: ${{ inputs.head_branch }}
          PR_TRUSTED_HANDOFF: ${{ inputs.trusted_handoff }}
          PR_BASELINE_OUTPUT: artifacts/pr/final-production-baseline.json
          PR_CORRELATION_OUTPUT: artifacts/pr/final-create-correlation.json
          PR_COORDINATION_FAIL_CLOSED: 'true'
          CAPITAL_AI_PRODUCTION_HEALTH_URL: https://capital-ai.online/healthz
          PR_LABEL_NAME: ${{ steps.pr-label.outputs.label_name }}
          PR_LABEL_COLOR: ${{ steps.pr-label.outputs.label_color }}
          PR_LABEL_DESCRIPTION: ${{ steps.pr-label.outputs.label_description }}
          PR_PROJECT_ID: ${{ steps.render.outputs.project_id }}
        run: |
          set -euo pipefail

          existing="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --head "$HEAD_BRANCH" --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            echo "Für $HEAD_BRANCH existiert bereits der offene PR #$existing; es wird kein Duplikat erzeugt."
            exit 0
          fi

          live_main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          trusted_main_sha="$(git -C ../create-policy rev-parse HEAD)"
          if [ "$live_main_sha" != "$trusted_main_sha" ]; then
            echo "Trusted-main Checkout ist bereits stale: checkout=$trusted_main_sha live=$live_main_sha" >&2
            exit 1
          fi

          git fetch --no-tags ../create-policy main:refs/remotes/origin/main
          if [ "$(git rev-parse origin/main)" != "$live_main_sha" ]; then
            echo "Lokaler origin/main stimmt nicht mit dem unmittelbar gelesenen GitHub-main überein." >&2
            exit 1
          fi

          node ../create-policy/scripts/pr/productionPreflight.mjs
          node ../create-policy/scripts/pr/validateWorkClaim.mjs

          open_prs_json="$RUNNER_TEMP/open-agent-prs.json"
          gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --base main \
            --limit 100 \
            --json number,headRefName,createdAt,title,labels > "$open_prs_json"

          claim_path="$(git diff --name-only --diff-filter=A origin/main...HEAD -- '.ai/work-claims/*.json' | head -n 1)"
          pr_priority="P2"
          pr_started_at=""
          if [ -n "$claim_path" ] && [ -f "$claim_path" ]; then
            pr_priority="$(jq -r '.priority // "P2"' "$claim_path")"
            pr_started_at="$(jq -r '.startedAt // ""' "$claim_path")"
          fi

          PR_LANE_OPEN_PRS_PATH="$open_prs_json" \
          PR_LANE_TRIAGE_OUTPUT="artifacts/pr/agent-lane-triage.json" \
          PR_PROJECT_MAPPING_PATH="../create-policy/docs/projects/README.md" \
          PR_PROJECT_ID="$PR_PROJECT_ID" \
          PR_HEAD_BRANCH="$HEAD_BRANCH" \
          PR_PRIORITY="$pr_priority" \
          PR_STARTED_AT="$pr_started_at" \
            node ../create-policy/scripts/pr/agentLaneTriage.mjs

          lane_state="$(jq -r '.state' artifacts/pr/agent-lane-triage.json)"
          if [ "$lane_state" != "LANE_AVAILABLE" ]; then
            echo "Draft-PR deferred by deterministic project-lane triage: $lane_state"
            cat artifacts/pr/agent-lane-triage.json
            exit 0
          fi

          if [ -z "$PR_LABEL_NAME" ] || [ -z "$PR_LABEL_COLOR" ] || [ -z "$PR_LABEL_DESCRIPTION" ]; then
            echo "Pre-create PR label classification did not resolve complete metadata." >&2
            exit 1
          fi

          gh label create "$PR_LABEL_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --color "$PR_LABEL_COLOR" \
            --description "$PR_LABEL_DESCRIPTION" \
            --force

          test -n "$PR_CREATE_TOKEN"
          GH_TOKEN="$PR_CREATE_TOKEN" gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --base main \
            --head "$HEAD_BRANCH" \
            --title "$PR_TITLE" \
            --label "$PR_LABEL_NAME" \
            --body-file artifacts/pr/pull-request-body.md
