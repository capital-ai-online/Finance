name: Agenten-Draft-PR öffnen
run-name: >-
  Agenten-Draft-PR für ${{ inputs.head_branch }} vorbereiten

on:
  workflow_dispatch:
    inputs:
      head_branch:
        description: 'Agenten-Branch mit genau einem neuen .ai/work-claims/*.json-Claim'
        required: true
        type: string
      approval_envelope_json:
        description: 'Approval Envelope JSON (capital-ai-pr-approval-envelope/1.0.0)'
        required: true
        type: string
      owner_pr_create_approval:
        description: 'Exakte Owner-Freigabe. Nur gültig: PR Erstellung : Freigegeben'
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: open-agent-draft-pr-${{ inputs.head_branch }}
  cancel-in-progress: false

jobs:
  preflight-and-open:
    name: Vertrauenswürdige Vorprüfung und Draft-PR-Erstellung
    if: github.triggering_actor == 'SvenKulessa' && github.actor == 'SvenKulessa'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Vertrauenswürdige Richtlinie aus main auschecken
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0 / Node 24
        with:
          ref: main
          path: policy
          fetch-depth: 1
          persist-credentials: false

      - name: Node.js einrichten
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0 / Node 24 action runtime
        with:
          node-version: '24.18.0'

      - name: Angeforderten Agenten-Branch validieren
        working-directory: policy
        env:
          HEAD_BRANCH: ${{ inputs.head_branch }}
        run: |
          set -euo pipefail
          git check-ref-format --branch "$HEAD_BRANCH" >/dev/null
          case "$HEAD_BRANCH" in
            agent/*|claude/*|grok/*|ai/*) ;;
            *) echo "Agenten-Branch muss einen freigegebenen Präfix verwenden: agent/, claude/, grok/, ai/" >&2; exit 1 ;;
          esac

      - name: Kandidaten ohne persistierte Zugangsdaten auschecken
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0 / Node 24
        with:
          ref: ${{ inputs.head_branch }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Aktuellen vertrauenswürdigen main-Stand importieren
        working-directory: candidate
        run: git fetch --no-tags ../policy main:refs/remotes/origin/main

      - name: Produktions-Baseline vor PR-Erstellung prüfen
        id: baseline
        working-directory: candidate
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_BASE_REF: origin/main
          PR_HEAD_REF: HEAD
          PR_BASELINE_OUTPUT: artifacts/pr/production-baseline.json
          CAPITAL_AI_PRODUCTION_HEALTH_URL: https://capital-ai.online/healthz
        run: node ../policy/scripts/pr/productionPreflight.mjs

      - name: Exklusiven Work-Claim und Überschneidungen fail-closed prüfen
        working-directory: candidate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_BASE_REF: origin/main
          PR_HEAD_REF: HEAD
          PR_HEAD_BRANCH: ${{ inputs.head_branch }}
          PR_BASELINE_OUTPUT: artifacts/pr/production-baseline.json
          PR_CORRELATION_OUTPUT: artifacts/pr/create-correlation.json
          PR_COORDINATION_FAIL_CLOSED: 'true'
        run: node ../policy/scripts/pr/validateWorkClaim.mjs

      - name: Approval Envelope fail-closed vor Create-Mutation auswerten
        working-directory: candidate
        env:
          APPROVAL_ENVELOPE_JSON: ${{ inputs.approval_envelope_json }}
          OWNER_PR_CREATE_APPROVAL: ${{ inputs.owner_pr_create_approval }}
          PR_BASE_REF: origin/main
          PR_HEAD_REF: HEAD
          PR_HEAD_BRANCH: ${{ inputs.head_branch }}
          PR_CURRENT_MAIN_SHA: ${{ steps.baseline.outputs.main_sha }}
          PR_CURRENT_HEAD_SHA: ${{ steps.baseline.outputs.head_sha }}
          PR_CORRELATION_EVIDENCE_PATH: artifacts/pr/create-correlation.json
          PR_CREATE_GATE_OUTPUT: artifacts/pr/create-gate.json
        run: node ../policy/scripts/pr/evaluateApprovalEnvelopeCli.mjs

      - name: Kanonischen deutschen PR-Text aus trusted-main Vorlage erzeugen
        id: render
        working-directory: candidate
        env:
          PR_BASE_REF: origin/main
          PR_HEAD_REF: HEAD
          PR_HEAD_BRANCH: ${{ inputs.head_branch }}
          PR_BASELINE_OUTPUT: artifacts/pr/production-baseline.json
          PR_TEMPLATE_PATH: ../policy/.github/pull_request_template.md
          PR_BODY_OUTPUT: artifacts/pr/pull-request-body.md
        run: node ../policy/scripts/pr/renderPullRequestBody.mjs

      - name: Draft-PR öffnen, sofern noch keiner existiert
        working-directory: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ inputs.head_branch }}
          PR_TITLE: ${{ steps.render.outputs.pr_title }}
        run: |
          set -euo pipefail
          existing="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --head "$HEAD_BRANCH" --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            echo "Für $HEAD_BRANCH existiert bereits der offene PR #$existing; es wird kein Duplikat erzeugt."
            exit 0
          fi

          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --base main \
            --head "$HEAD_BRANCH" \
            --title "$PR_TITLE" \
            --body-file artifacts/pr/pull-request-body.md
