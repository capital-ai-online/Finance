name: Current-State Baseline Autofix
run-name: >-
  ${{ format('CI #{0} – Current-State-Baselines deterministisch reparieren', github.event.workflow_run.run_number) }}

# Privileged completion controller for one exact governance freshness failure class.
# Candidate code is never executed with write permission. Only trusted-main policy code
# may rewrite recognized docs/projects/<project>/(ROADMAP|TASK_REGISTER).md baseline fields.
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions: {}

concurrency:
  group: current-state-baseline-autofix-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  plan:
    name: Exact baseline failure read-only korrelieren
    if: >-
      github.event.workflow_run.repository.full_name == github.repository &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.path == '.github/workflows/ci.yml' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      eligible: ${{ steps.targets.outputs.eligible }}
      reason: ${{ steps.targets.outputs.reason }}
      pr_number: ${{ steps.pr.outputs.pr_number }}
      base_sha: ${{ steps.pr.outputs.base_sha }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
      head_ref: ${{ steps.pr.outputs.head_ref }}
      targets_json: ${{ steps.targets.outputs.targets_json }}

    steps:
      - name: Exakten offenen Same-Repo-PR auflösen
        id: pr
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0 / Node 24
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const repository = `${owner}/${repo}`;
            const run = context.payload.workflow_run;
            const headSha = String(run.head_sha || '').toLowerCase();
            let candidates = run.pull_requests ?? [];
            if (candidates.length === 0) {
              candidates = await github.paginate(
                github.rest.repos.listPullRequestsAssociatedWithCommit,
                { owner, repo, commit_sha: headSha, per_page: 100 },
              );
            }
            const open = [];
            for (const candidate of candidates) {
              if (!candidate.number) continue;
              const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: candidate.number });
              if (pr.state === 'open' && pr.base.ref === 'main' && pr.head.sha === headSha && pr.head.repo?.full_name === repository) open.push(pr);
            }
            if (open.length !== 1) {
              core.setOutput('pr_number', '');
              core.notice(`Baseline Autofix held: expected exactly one open same-repository PR for ${headSha}; observed=${open.length}.`);
              return;
            }
            const pr = open[0];
            const { data: main } = await github.rest.repos.getBranch({ owner, repo, branch: 'main' });
            if (main.commit.sha !== pr.base.sha) {
              core.setOutput('pr_number', '');
              core.notice(`Baseline Autofix held: current main drifted from PR base (${main.commit.sha} != ${pr.base.sha}).`);
              return;
            }
            const files = await github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number: pr.number, per_page: 100 });
            core.setOutput('pr_number', String(pr.number));
            core.setOutput('base_sha', pr.base.sha);
            core.setOutput('head_sha', pr.head.sha);
            core.setOutput('head_ref', pr.head.ref);
            core.setOutput('changed_files_json', JSON.stringify(files.map((entry) => entry.filename)));

      - name: Fehlgeschlagene CI-Logs begrenzt erfassen
        id: failure_log
        if: steps.pr.outputs.pr_number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          raw="$RUNNER_TEMP/current-state-baseline-failed.raw.log"
          safe="$RUNNER_TEMP/current-state-baseline-failed.safe.log"
          if ! gh run view "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed > "$raw" 2>/dev/null; then
            : > "$raw"
          fi
          bounded="$RUNNER_TEMP/current-state-baseline-failed.bounded.log"
          tail -n 700 "$raw" > "$bounded"
          head -c 120000 "$bounded" | \
            perl -pe 's/\e\[[0-9;]*[A-Za-z]//g; s/(gh[pousr]_|github_pat_)[A-Za-z0-9_]{20,}/[REDACTED_GITHUB_TOKEN]/g; s/sk-(?:proj-)?[A-Za-z0-9_-]{20,}/[REDACTED_API_TOKEN]/g' \
            > "$safe"
          echo "path=$safe" >> "$GITHUB_OUTPUT"

      - name: Nur exakte Current-State-Baseline-Fehler zulassen
        id: targets
        if: steps.pr.outputs.pr_number != ''
        env:
          FAILURE_LOG: ${{ steps.failure_log.outputs.path }}
          CHANGED_FILES_JSON: ${{ steps.pr.outputs.changed_files_json }}
        shell: bash
        run: |
          set -euo pipefail
          targets="$RUNNER_TEMP/current-state-baseline-targets.txt"
          grep -Eo 'ERROR CURRENT_STATE_PROJECTION_BASELINE_(MISSING|STALE): docs/projects/[^ :]+/(ROADMAP|TASK_REGISTER)\.md' "$FAILURE_LOG" \
            | sed -E 's/^ERROR CURRENT_STATE_PROJECTION_BASELINE_(MISSING|STALE): //' \
            | sort -u > "$targets" || true

          if [ ! -s "$targets" ]; then
            echo 'eligible=false' >> "$GITHUB_OUTPUT"
            echo 'reason=no-exact-current-state-baseline-failure' >> "$GITHUB_OUTPUT"
            echo 'targets_json=[]' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          targets_json="$(jq -R -s -c 'split("\n") | map(select(length > 0))' < "$targets")"
          TARGETS_JSON="$targets_json" node - <<'NODE'
          const changed = new Set(JSON.parse(process.env.CHANGED_FILES_JSON));
          const targets = JSON.parse(process.env.TARGETS_JSON);
          const exact = /^docs\/projects\/[^/]+\/(?:ROADMAP|TASK_REGISTER)\.md$/;
          if (!targets.length || targets.some((p) => !exact.test(p))) process.exit(2);
          if (targets.some((p) => !changed.has(p))) process.exit(3);
          NODE
          echo 'eligible=true' >> "$GITHUB_OUTPUT"
          echo 'reason=exact-current-state-baseline-failure' >> "$GITHUB_OUTPUT"
          echo "targets_json=$targets_json" >> "$GITHUB_OUTPUT"

  patch:
    name: Baseline-Patch read-only erzeugen und validieren
    needs: [plan]
    if: ${{ needs.plan.result == 'success' && fromJSON(needs.plan.outputs.eligible || 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    outputs:
      tree_sha: ${{ steps.bundle.outputs.tree_sha }}
      bundle_sha: ${{ steps.bundle.outputs.bundle_sha }}
    steps:
      - name: Trusted Base-Policy auschecken
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0 / Node 24
        with:
          ref: ${{ needs.plan.outputs.base_sha }}
          path: policy
          fetch-depth: 1
          persist-credentials: false

      - name: Exakten PR-Head ohne Write-Credential auschecken
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0 / Node 24
        with:
          ref: ${{ needs.plan.outputs.head_sha }}
          path: work
          fetch-depth: 0
          persist-credentials: false

      - name: Current main im Kandidaten-Repository exakt binden
        working-directory: work
        env:
          EXPECTED_MAIN_SHA: ${{ needs.plan.outputs.base_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags ../policy "$EXPECTED_MAIN_SHA:refs/remotes/origin/main"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN_SHA"
          git merge-base --is-ancestor "$EXPECTED_MAIN_SHA" HEAD

      - name: Baselinezeilen deterministisch mit trusted-main Script reparieren
        env:
          WORKTREE: work
          TARGET_FILES_JSON: ${{ needs.plan.outputs.targets_json }}
          EXPECTED_MAIN_SHA: ${{ needs.plan.outputs.base_sha }}
        run: node policy/scripts/pr/repairCurrentStateProjectionBaselines.mjs

      - name: Patch-Scope fail-closed prüfen
        env:
          TARGET_FILES_JSON: ${{ needs.plan.outputs.targets_json }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t expected < <(printf '%s' "$TARGET_FILES_JSON" | jq -r '.[]' | sort)
          mapfile -t observed < <(git -C work diff --name-only HEAD -- | sort)
          test "${#observed[@]}" -gt 0
          test "${#observed[@]}" -eq "${#expected[@]}"
          diff -u <(printf '%s\n' "${expected[@]}") <(printf '%s\n' "${observed[@]}")
          git -C work diff --check HEAD --
          while IFS= read -r file; do
            test -n "$file"
            git -C work diff --numstat HEAD -- "$file" | awk '{ if (($1 + $2) > 2) exit 1 }'
          done < <(printf '%s' "$TARGET_FILES_JSON" | jq -r '.[]')

      - name: Governance-Control-Plane mit trusted-main Validator revalidieren
        working-directory: work
        run: node ../policy/scripts/governance/validateGovernanceControlPlane.mjs

      - name: Validierte Dateien und exakten Git-Tree bündeln
        id: bundle
        env:
          TARGET_FILES_JSON: ${{ needs.plan.outputs.targets_json }}
        shell: bash
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/current-state-baseline-autofix"
          mkdir -p "$bundle/files"
          printf '%s' "$TARGET_FILES_JSON" > "$bundle/targets.json"
          while IFS= read -r file; do
            mkdir -p "$bundle/files/$(dirname "$file")"
            cp "work/$file" "$bundle/files/$file"
            git -C work add -- "$file"
          done < <(printf '%s' "$TARGET_FILES_JSON" | jq -r '.[]')
          tree="$(git -C work write-tree)"
          tar -C "$bundle" -cf "$RUNNER_TEMP/current-state-baseline-autofix.tar" targets.json files
          sha="$(sha256sum "$RUNNER_TEMP/current-state-baseline-autofix.tar" | awk '{print $1}')"
          echo "tree_sha=$tree" >> "$GITHUB_OUTPUT"
          echo "bundle_sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Kurzlebiges validiertes Bundle hochladen
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: current-state-baseline-autofix-${{ github.event.workflow_run.id }}
          path: ${{ runner.temp }}/current-state-baseline-autofix.tar
          if-no-files-found: error
          retention-days: 1

  write:
    name: Validierten Baseline-Tree atomar schreiben
    needs: [plan, patch]
    if: needs.plan.result == 'success' && needs.patch.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: write
      pull-requests: read
    concurrency:
      group: capital-ai-pr-writer-${{ needs.plan.outputs.pr_number }}
      cancel-in-progress: false
    steps:
      - name: Validiertes Bundle ohne PR-Checkout laden
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: current-state-baseline-autofix-${{ github.event.workflow_run.id }}
          path: ${{ runner.temp }}/bundle

      - name: Bundle-Hash prüfen
        env:
          EXPECTED_BUNDLE_SHA: ${{ needs.patch.outputs.bundle_sha }}
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/bundle/current-state-baseline-autofix.tar"
          test "$(sha256sum "$archive" | awk '{print $1}')" = "$EXPECTED_BUNDLE_SHA"
          mkdir -p "$RUNNER_TEMP/unpacked"
          tar -C "$RUNNER_TEMP/unpacked" -xf "$archive"

      - name: Exact-Head/Main revalidieren und ausschließlich validierte Dateien schreiben
        id: write
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0 / Node 24
        env:
          PR_NUMBER: ${{ needs.plan.outputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ needs.plan.outputs.head_sha }}
          EXPECTED_HEAD_REF: ${{ needs.plan.outputs.head_ref }}
          EXPECTED_BASE_SHA: ${{ needs.plan.outputs.base_sha }}
          EXPECTED_TREE_SHA: ${{ needs.patch.outputs.tree_sha }}
          BUNDLE_DIR: ${{ runner.temp }}/unpacked
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber = Number(process.env.PR_NUMBER);
            const exact = /^docs\/projects\/[^/]+\/(?:ROADMAP|TASK_REGISTER)\.md$/;
            const targets = JSON.parse(fs.readFileSync(path.join(process.env.BUNDLE_DIR, 'targets.json'), 'utf8'));
            if (!Array.isArray(targets) || targets.length === 0 || targets.some((p) => typeof p !== 'string' || !exact.test(p))) throw new Error('Invalid baseline target bundle.');

            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });
            const { data: main } = await github.rest.repos.getBranch({ owner, repo, branch: 'main' });
            if (pr.state !== 'open' || pr.base.ref !== 'main') throw new Error('PR is no longer open against main.');
            if (pr.head.sha !== process.env.EXPECTED_HEAD_SHA || pr.head.ref !== process.env.EXPECTED_HEAD_REF) throw new Error('PR head drift before baseline write.');
            if (pr.head.repo?.full_name !== `${owner}/${repo}`) throw new Error('PR head repository drift.');
            if (pr.base.sha !== process.env.EXPECTED_BASE_SHA || main.commit.sha !== process.env.EXPECTED_BASE_SHA) throw new Error('Current-main/base drift before baseline write.');

            const { data: ref } = await github.rest.git.getRef({ owner, repo, ref: `heads/${pr.head.ref}` });
            if (ref.object.sha !== process.env.EXPECTED_HEAD_SHA) throw new Error('Branch ref drift before baseline write.');
            const { data: headCommit } = await github.rest.git.getCommit({ owner, repo, commit_sha: process.env.EXPECTED_HEAD_SHA });
            const entries = [];
            for (const target of targets) {
              const content = fs.readFileSync(path.join(process.env.BUNDLE_DIR, 'files', target), 'utf8');
              const { data: blob } = await github.rest.git.createBlob({ owner, repo, content, encoding: 'utf-8' });
              entries.push({ path: target, mode: '100644', type: 'blob', sha: blob.sha });
            }
            const { data: tree } = await github.rest.git.createTree({ owner, repo, base_tree: headCommit.tree.sha, tree: entries });
            if (tree.sha !== process.env.EXPECTED_TREE_SHA) throw new Error(`Validated tree mismatch: expected=${process.env.EXPECTED_TREE_SHA} observed=${tree.sha}`);
            const { data: commit } = await github.rest.git.createCommit({
              owner,
              repo,
              message: `fix(baseline-autofix): repair current-state baselines after CI run ${process.env.SOURCE_RUN_ID}`,
              tree: tree.sha,
              parents: [process.env.EXPECTED_HEAD_SHA],
            });
            await github.rest.git.updateRef({ owner, repo, ref: `heads/${pr.head.ref}`, sha: commit.sha, force: false });
            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id: 'ci.yml',
              ref: pr.head.ref,
              inputs: {
                pr_number: String(prNumber),
                expected_head_sha: commit.sha,
                expected_head_ref: pr.head.ref,
                expected_base_sha: process.env.EXPECTED_BASE_SHA,
                source_autofix_run_id: String(context.runId),
              },
            });
            core.setOutput('new_head_sha', commit.sha);
            core.setOutput('ci_dispatched', 'true');

      - name: Ergebnis zusammenfassen
        env:
          PREVIOUS_HEAD: ${{ needs.plan.outputs.head_sha }}
          NEW_HEAD: ${{ steps.write.outputs.new_head_sha }}
          TARGETS: ${{ needs.plan.outputs.targets_json }}
          CI_DISPATCHED: ${{ steps.write.outputs.ci_dispatched }}
        shell: bash
        run: |
          {
            echo '## Current-State Baseline Autofix'
            echo
            echo "- previous head: \`$PREVIOUS_HEAD\`"
            echo "- new head: \`$NEW_HEAD\`"
            echo "- repaired projections: \`$TARGETS\`"
            echo '- source: exact CI baseline freshness errors only'
            echo '- policy/runtime: trusted current-main checkout only'
            echo '- write: exact validated Git tree, force=false'
            echo "- CI revalidation: workflow_dispatch for exact new head (`$CI_DISPATCHED`)"
            echo '- merge authority: unchanged, Human/CODEOWNER only'
          } >> "$GITHUB_STEP_SUMMARY"
