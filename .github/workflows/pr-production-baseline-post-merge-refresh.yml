name: PR Production Baseline Post-Merge Refresh
run-name: >-
  ${{ format('main@{0} – Post-Merge-Baseline über führende PR-Convergence beobachten', github.event.workflow_run.head_sha) }}

# Compatibility observer only. Branch synchronization causes fresh PR checks,
# and those exact-head completions are consumed by the single PR Decision
# Evidence Reconciler writer. This workflow intentionally owns no PR-body write,
# no template repair and no Governance rerun authority.
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: ['Agenten-PR-Branches synchronisieren']
    types: [completed]

permissions: {}

concurrency:
  group: pr-production-baseline-post-merge-observer-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
  cancel-in-progress: false

jobs:
  observe:
    name: Post-Merge-Sync an führende PR-Convergence übergeben
    if: >-
      github.event.action == 'completed' &&
      github.event.workflow_run.repository.full_name == github.repository &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.path == '.github/workflows/sync-agent-pr-branches.yml' &&
      github.event.workflow_run.event == 'workflow_run' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - name: Single-writer handoff bestätigen
        run: >-
          echo "No PR body mutation here. Any synchronized PR head starts fresh checks;
          their exact-head completion events are converged only by PR Decision Evidence Reconciler."
