name: M10 PR Event Boundary
run-name: >-
  PR #${{ github.event.pull_request.number }} – M10 PR-Event isoliert

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# This workflow is intentionally separate from ci.yml.
# A successful result means only that an ordinary PR lifecycle event is structurally isolated
# from the expensive CI path. It MUST NOT claim whether the current head has or has not already
# received an Owner-passkey authorization. The authoritative authorization evidence is the
# exact-head `build-and-test` produced by the M10 workflow_dispatch after OIDC/single-use redemption.
permissions: {}

concurrency:
  group: M10-PR-Boundary-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-event-boundary:
    name: m10-pr-event-boundary
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ordinary PR-Event vom autorisierten CI-Pfad isolieren
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = 'pull_request'
          test -n "$PR_NUMBER"
          test -n "$HEAD_SHA"
          echo "M10 BOUNDARY PASS: PR #${PR_NUMBER} auf Head ${HEAD_SHA} kann durch diesen PR-Event keine teure CI autorisieren oder starten."
          echo "Dieser Guard bewertet keinen Passkey-Autorisierungszustand. Maßgeblich ist ausschließlich build-and-test aus dem exakten autorisierten M10 workflow_dispatch."
