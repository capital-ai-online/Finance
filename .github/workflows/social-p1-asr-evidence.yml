name: SOCIAL-P1 ASR Evidence

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/social-p1-asr-evidence.yml"
      - "scripts/operations/socialP1AsrEvidence.py"
      - "docs/social-media/CAPITAL-AI-SOCIAL/reports/SOCIAL_P1_TTS_SAMPLE_MANIFEST_2026-09-11.json"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  asr:
    name: transcribe-8-runtime-samples
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
          && github.event.pull_request.base.ref == 'main'
          && startsWith(github.event.pull_request.head.ref, 'agent/operations-social-p1-asr-'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SOURCE_RUN_ID: "35472686350"
      SOURCE_ARTIFACT_NAME: "social-p1-modal-runtime-9b43849bb16be69ac93f95ca1ccc14eec8fd7920-35472686350-1"
      WHISPER_MODEL: "small"
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout exact ASR implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Install pinned ASR runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version >/dev/null
          python -m pip install --disable-pip-version-check "openai-whisper==20250625"

      - name: Download immutable SOCIAL-P1 runtime artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source-artifact
          gh run download "$SOURCE_RUN_ID" --repo "${GITHUB_REPOSITORY}" --name "$SOURCE_ARTIFACT_NAME" --dir source-artifact
          test "$(find source-artifact -type f -name '*.wav' | wc -l)" -eq 8

      - name: Run real ASR over all 8 WAV files
        shell: bash
        run: |
          set -euo pipefail
          python scripts/operations/socialP1AsrEvidence.py \
            --artifact-dir source-artifact \
            --manifest docs/social-media/CAPITAL-AI-SOCIAL/reports/SOCIAL_P1_TTS_SAMPLE_MANIFEST_2026-09-11.json \
            --output-dir asr-evidence \
            --model "$WHISPER_MODEL"

      - name: Upload ASR evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: social-p1-asr-evidence-${{ github.sha }}
          path: asr-evidence/
          if-no-files-found: error
          retention-days: 14

      - name: Enforce Required Terms gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("asr-evidence/social-p1-asr-evidence.json")
          value = json.loads(p.read_text(encoding="utf-8"))
          assert value["case_count"] == 8
          assert value["all_required_terms_pass"] is True, "one or more required terms were not observed by ASR"
          print("SOCIAL-P1 ASR: 8/8 cases transcribed; all required terms observed")
          PY
