name: Self-Heal CI — suspendiert / Diagnose
run-name: Manuelle Self-Heal-Diagnose

# S5B: Der frühere automatische workflow_run-Autofix ist suspendiert.
# Gründe: unnötige Failure-Fan-out-Kosten, write-capable AI runner, nicht-kanonische PR-Erstellung
# und damit Konflikt mit dem aktuellen AGENTS.md PR-/Claim-Vertrag.
# Eine spätere Reaktivierung erfordert einen eigenen Owner-reviewten Redesign-/Shadow-Cutover.
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Optional PR number to inspect"
        required: false
        type: string
      run_id:
        description: "Optional failed CI workflow run ID to inspect"
        required: false
        type: string

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: self-heal-diagnostic-${{ inputs.pr_number || inputs.run_id || github.run_id }}
  cancel-in-progress: true

jobs:
  diagnostic:
    name: Read-only CI Failure Diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Read-only Zielzustand prüfen
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          if [ -z "$PR_NUMBER" ] && [ -z "$RUN_ID" ]; then
            echo "Manual diagnostic requires pr_number or run_id." >&2
            exit 1
          fi

          echo "AUTONOMOUS_SELF_HEAL=SUSPENDED"
          echo "No branch, commit, PR, secret-bearing AI action or repository mutation will be created."

          if [ -n "$PR_NUMBER" ]; then
            gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
              --json number,title,state,isDraft,headRefName,headRefOid,baseRefName,url
          fi

          if [ -n "$RUN_ID" ]; then
            gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" \
              --json conclusion,event,headBranch,headSha,status,url,jobs
          fi
