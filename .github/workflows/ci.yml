name: CI
run-name: >-
  ${{ github.event_name == 'push'
      && format('main – CI-Prüfung für {0}', github.sha)
      || github.event_name == 'workflow_dispatch'
      && format('M10 PR #{0} – autorisierte CI für {1}', inputs.m10_pr_number, inputs.m10_head_sha)
      || format('PR #{0} – CI-Prüfung', github.event.pull_request.number) }}

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      m10_consumption_id:
        description: 'Single-use M10 CI consumption capability'
        required: true
        type: string
      m10_approval_id:
        description: 'Immutable M10 approval evidence id'
        required: true
        type: string
      m10_pr_number:
        description: 'Approved pull request number'
        required: true
        type: string
      m10_base_sha:
        description: 'Approved PR base SHA'
        required: true
        type: string
      m10_head_sha:
        description: 'Approved exact PR head SHA'
        required: true
        type: string
      m10_authorization_digest:
        description: 'Canonical M10 authorization digest'
        required: true
        type: string
      m10_action:
        description: 'M10 action'
        required: true
        type: choice
        options:
          - AUTHORIZE_PR_CI

permissions:
  contents: read
  pull-requests: read

concurrency:
  # PR synchronizations may cancel older cheap PR checks. Authorized M10 dispatches use their own
  # run id so an unrelated event cannot cancel a consumed one-time authorization mid-build.
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# M10 Controlled Cutover:
# - normal PR events fail before checkout/npm/build;
# - only a successfully redeemed Owner-Passkey M10 consumption may enter expensive PR CI;
# - PR #429 is the unique one-time bootstrap used to validate this cutover before the new endpoint
#   can exist on the default branch; it has no authority for any future PR after Human merge;
# - main push build/deploy remains separate from PR-head CI authorization;
# - Human Merge is always separate.
jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: M10 CI-Autorisierung vor teuren Schritten prüfen
        id: m10_authorization
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          M10_BOOTSTRAP_PR: '429'
          M10_CONSUMPTION_ID: ${{ inputs.m10_consumption_id }}
          M10_APPROVAL_ID: ${{ inputs.m10_approval_id }}
          M10_PR_NUMBER: ${{ inputs.m10_pr_number }}
          M10_BASE_SHA: ${{ inputs.m10_base_sha }}
          M10_HEAD_SHA: ${{ inputs.m10_head_sha }}
          M10_AUTHORIZATION_DIGEST: ${{ inputs.m10_authorization_digest }}
          M10_ACTION: ${{ inputs.m10_action }}
        run: |
          set -euo pipefail

          case "$EVENT_NAME" in
            push)
              test "$GITHUB_REF" = 'refs/heads/main'
              echo 'mode=main-push' >> "$GITHUB_OUTPUT"
              ;;

            pull_request)
              if [ "$PR_NUMBER" = "$M10_BOOTSTRAP_PR" ]; then
                echo 'M10 Controlled-Cutover bootstrap: PR #429 darf einmalig den vollständigen Pre-Cutover-CI-Pfad validieren.'
                echo 'mode=cutover-bootstrap' >> "$GITHUB_OUTPUT"
                exit 0
              fi

              echo 'M10 DENY: normaler PR-Event ist keine Autorisierung für teure CI. Owner-Passkey AUTHORIZE_PR_CI erforderlich.' >&2
              exit 1
              ;;

            workflow_dispatch)
              test "$GITHUB_REPOSITORY" = 'SvenKulessa/Finance'
              test "$M10_ACTION" = 'AUTHORIZE_PR_CI'
              test -n "$M10_CONSUMPTION_ID"
              test -n "$M10_APPROVAL_ID"
              test -n "$M10_PR_NUMBER"
              test -n "$M10_BASE_SHA"
              test -n "$M10_HEAD_SHA"
              test -n "$M10_AUTHORIZATION_DIGEST"
              test "$GITHUB_SHA" = "$M10_HEAD_SHA"
              test "$GITHUB_REF_TYPE" = 'branch'

              # The consumption id is a live one-time capability. Mask it before any command that
              # could accidentally include it in runner output; the server audit stores only its hash.
              echo "::add-mask::$M10_CONSUMPTION_ID"

              gate_payload="$RUNNER_TEMP/m10-workflow-gate-${GITHUB_RUN_ID}.json"
              cleanup_gate_payload() { rm -f "$gate_payload"; }
              trap cleanup_gate_payload EXIT
              umask 077
              python3 - <<'PY' > "$gate_payload"
          import json
          import os
          print(json.dumps({
              'consumptionId': os.environ['M10_CONSUMPTION_ID'],
              'approvalId': os.environ['M10_APPROVAL_ID'],
              'repository': os.environ['GITHUB_REPOSITORY'],
              'prNumber': os.environ['M10_PR_NUMBER'],
              'baseSha': os.environ['M10_BASE_SHA'],
              'headSha': os.environ['M10_HEAD_SHA'],
              'authorizationDigest': os.environ['M10_AUTHORIZATION_DIGEST'],
              'action': os.environ['M10_ACTION'],
              'workflowRunId': os.environ['GITHUB_RUN_ID'],
              'workflowRef': os.environ['GITHUB_REF'],
          }))
          PY

              curl --fail-with-body --silent --show-error \
                --connect-timeout 10 --max-time 30 \
                --request POST \
                --header 'Content-Type: application/json' \
                --data-binary "@$gate_payload" \
                'https://capital-ai.online/api/m10/credential-enrollment/authorize/workflow-gate'

              echo 'mode=m10-authorized' >> "$GITHUB_OUTPUT"
              ;;

            *)
              echo "M10 DENY: unsupported CI event $EVENT_NAME" >&2
              exit 1
              ;;
          esac

      - name: Repository auschecken
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.m10_head_sha || github.event_name == 'push' && github.sha || github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prüfumfang klassifizieren (D/C/R)
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.m10_base_sha || github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.m10_head_sha || github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.m10_base_sha || github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.m10_head_sha || github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          node scripts/pr/classifyPrScope.mjs

      - name: Scope-Zusammenfassung
        run: |
          echo "m10_mode=${{ steps.m10_authorization.outputs.mode }}"
          echo "class=${{ steps.scope.outputs.class }}"
          echo "node=${{ steps.scope.outputs.node }} lint=${{ steps.scope.outputs.lint }} unit=${{ steps.scope.outputs.unit }}"
          echo "build=${{ steps.scope.outputs.build }} audit=${{ steps.scope.outputs.audit }} predeploy=${{ steps.scope.outputs.predeploy }}"
          echo "docker=${{ steps.scope.outputs.docker }} docker_image=${{ steps.scope.outputs.docker_image }}"

      - name: Repository-Integrität prüfen
        if: steps.scope.outputs.integrity == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse --verify 'HEAD^{commit}' >/dev/null
          git fsck --strict --no-dangling

      - name: Dokumentations-Fast-Path (Klasse D)
        if: steps.scope.outputs.class == 'D'
        run: |
          echo "Klasse D: nur Dokumentation/.ai/Markdown — Software-Build und Tests sind nicht erforderlich."

      - name: Node.js einrichten
        if: steps.scope.outputs.node == 'true'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24.18.0'
          cache: 'npm'

      - name: Abhängigkeiten installieren
        if: steps.scope.outputs.node == 'true'
        run: npm ci

      - name: Produktionsabhängigkeiten prüfen
        if: steps.scope.outputs.audit == 'true'
        run: npm audit --omit=dev --audit-level=high

      - name: TypeScript prüfen
        if: steps.scope.outputs.lint == 'true'
        run: npm run lint

      - name: Unit-Tests ausführen
        if: steps.scope.outputs.unit == 'true'
        run: npm test

      - name: Produktions-Build erstellen
        if: steps.scope.outputs.build == 'true'
        run: npm run build

      - name: Produktions-CSP-Auslieferung nach Build prüfen
        if: steps.scope.outputs.build == 'true'
        env:
          NODE_ENV: production
          CSP_MODE: report-only
        run: npx vitest run tests/unit/securityResponse.production.test.ts

      - name: Produktionskonfiguration und Deployment-Bereitschaft prüfen
        if: steps.scope.outputs.predeploy == 'true'
        run: |
          npx tsx scripts/security/verifyProductionConfigInvariants.ts
          npm run predeploy:check

      - name: Docker-Hardening prüfen
        if: steps.scope.outputs.docker == 'true'
        run: node scripts/security/verifyDockerHardening.mjs

      - name: Produktions-Docker-Image bauen und prüfen
        if: steps.scope.outputs.docker_image == 'true'
        run: |
          docker build --tag capital-ai-ci:${{ github.sha }} .
          test "$(docker image inspect capital-ai-ci:${{ github.sha }} --format '{{.Config.User}}')" = "capitalai"
          test "$(docker image inspect capital-ai-ci:${{ github.sha }} --format '{{json .Config.Cmd}}')" = '["node","dist/server.cjs"]'
          docker image inspect capital-ai-ci:${{ github.sha }} --format '{{json .Config.Healthcheck.Test}}' | grep -q '/healthz'

  deploy-production:
    name: Deployment verifiziert / Render-Produktion
    needs: [build-and-test, supply-chain-attestation]
    if: ${{ needs.build-and-test.result == 'success' && needs.supply-chain-attestation.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Render-Deployment für verifizierten main-Commit auslösen
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          VERIFIED_COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$RENDER_DEPLOY_HOOK_URL"
          separator='?'
          case "$RENDER_DEPLOY_HOOK_URL" in *\?*) separator='&' ;; esac
          curl --fail-with-body --silent --show-error --location \
            --request POST \
            "${RENDER_DEPLOY_HOOK_URL}${separator}ref=${VERIFIED_COMMIT_SHA}"

  verify-deployment-identity:
    name: Deployment-Identität post-verifizieren
    needs: [deploy-production]
    if: ${{ needs.deploy-production.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Repository auschecken
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Node.js einrichten
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24.18.0'
          cache: 'npm'

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Deployte Commit-Identität und Health gegen erwarteten main-Commit verifizieren
        env:
          VERIFIED_COMMIT_SHA: ${{ github.sha }}
        run: npx tsx scripts/deployment/verifyDeploymentIdentity.ts

      - name: Deployment-Identitäts-Evidence als Workflow-Artefakt ablegen
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deployment-identity-evidence-${{ github.sha }}
          path: artifacts/deployment/deployment-identity-evidence.json
          retention-days: 90
          if-no-files-found: error

  supply-chain-attestation:
    name: Supply-Chain-Provenance / Attestation
    needs: [build-and-test]
    if: ${{ needs.build-and-test.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Vertrauenswürdigen main-Stand auschecken
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Node.js einrichten
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24.18.0'
          cache: 'npm'

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Produktions-Build und Supply-Chain-Kette erzeugen
        run: |
          npm run build
          npm run predeploy:check

      - name: Provenance-Bindung an gehosteten Build-Pfad erzwingen
        run: npx tsx scripts/security/verifySupplyChainProvenance.ts --require-ci

      - name: cosign installieren
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Provenance keyless signieren (Sigstore/Fulcio/Rekor)
        run: |
          cosign sign-blob --yes \
            --bundle dist/security/provenance.json.sigstore.json \
            dist/security/provenance.json

      - name: Signatur gegen erwartete Workflow-Identität verifizieren
        run: |
          cosign verify-blob \
            --bundle dist/security/provenance.json.sigstore.json \
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/ci.yml@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            dist/security/provenance.json

      - name: Supply-Chain-Artefakte als Workflow-Artefakt ablegen
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: supply-chain-provenance-${{ github.sha }}
          path: |
            dist/security/sbom.cdx.json
            dist/security/provenance.json
            dist/security/provenance.json.sigstore.json
            dist/control-plane/release-manifest.json
          retention-days: 90
          if-no-files-found: error
