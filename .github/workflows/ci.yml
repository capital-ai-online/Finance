name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  statuses: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # External SCA/CVE gate backed by the npm advisory service. This complements the local
      # CycloneDX/SBOM + lockfile policy in predeploy:check; it is intentionally fail-closed for
      # HIGH/CRITICAL findings in production dependencies and does not silently suppress findings.
      - name: Production dependency vulnerability gate (npm audit)
        run: npm audit --omit=dev --audit-level=high

      - name: Verify production configuration invariants
        run: npx tsx scripts/security/verifyProductionConfigInvariants.ts

      - name: Typecheck (tsc --noEmit)
        run: npm run lint

      - name: Unit tests (Vitest)
        run: npm test

      - name: Production build (vite + esbuild)
        run: npm run build

      - name: Deployment-Readiness-Pruefung (H7)
        run: npm run predeploy:check

  render-deploy-gate:
    name: Render deployment gate
    if: ${{ always() }}
    needs: [build-and-test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Publish explicit commit status for Render checksPass
        env:
          CI_RESULT: ${{ needs.build-and-test.result }}
          COMMIT_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$CI_RESULT" = "success" ]; then
            state="success"
            description="CAPITAL-AI CI gate passed; commit is deployable"
          else
            state="failure"
            description="CAPITAL-AI CI gate failed; deployment blocked"
          fi

          payload=$(printf '{"state":"%s","context":"capital-ai/ci-gate","description":"%s"}' "$state" "$description")

          curl --fail-with-body --silent --show-error --location \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${COMMIT_SHA}" \
            --data "$payload"

          if [ "$state" != "success" ]; then
            exit 1
          fi
