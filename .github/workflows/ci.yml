name: CI
run-name: >-
  ${{ github.event_name == 'push'
      && format('main – CI-Prüfung für {0}', github.sha)
      || format('PR #{0} – CI-Prüfung', github.event.pull_request.number) }}

on:
  push:
    branches: [main]
  pull_request:
    types: [edited]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  owner-gate:
    name: Human-/Owner-Vorprüfung
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      approved: ${{ steps.gate.outputs.approved }}
    steps:
      - name: main-Push zulassen
        if: ${{ github.event_name == 'push' }}
        run: |
          echo "main-Push: vollständige CI ist verpflichtend."

      - name: Owner-Freigabe prüfen
        if: ${{ github.event_name != 'push' }}
        id: gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body || '' }}
          EXPECTED_OWNER: SvenKulessa
        run: |
          set -euo pipefail

          # Attestations aus dem Body-Snapshot dieses edited-Events.
          # IDs: HTML-Kommentar (kanonisch) ODER sichtbare Fallback-Zeile `CAPITAL_AI_*`.
          read -r diff_attested files_attested <<< "$(
            python3 - <<'PY'
          import os
          import re

          COMMENT_TO_KEY = {
              '<!-- CAPITAL_AI_OWNER_DIFF_ATTESTATION -->': 'diff',
              '<!-- CAPITAL_AI_OWNER_FILES_ATTESTATION -->': 'files',
          }
          VISIBLE_TO_KEY = {
              '`CAPITAL_AI_OWNER_DIFF_ATTESTATION`': 'diff',
              'CAPITAL_AI_OWNER_DIFF_ATTESTATION': 'diff',
              '`CAPITAL_AI_OWNER_FILES_ATTESTATION`': 'files',
              'CAPITAL_AI_OWNER_FILES_ATTESTATION': 'files',
          }

          def parse(body: str):
              values = {'diff': False, 'files': False}
              seen = set()
              pending = None
              in_fence = False

              for raw in body.replace('\r\n', '\n').replace('\r', '\n').split('\n'):
                  line = raw.strip()
                  if re.match(r'^(?:```|~~~)', line):
                      in_fence = not in_fence
                      pending = None
                      continue
                  if in_fence or line.startswith('>'):
                      continue
                  key = COMMENT_TO_KEY.get(line) or VISIBLE_TO_KEY.get(line)
                  if key:
                      if key in seen:
                          return False, False
                      seen.add(key)
                      pending = key
                      continue
                  if pending and line:
                      match = re.fullmatch(r'-\s*\[\s*([xX]?)\s*\]\s+.+', line)
                      if not match:
                          return False, False
                      values[pending] = bool(match.group(1))
                      pending = None

              return (
                  seen == {'diff', 'files'} and values['diff'],
                  seen == {'diff', 'files'} and values['files'],
              )

          canonical_comment = '''<!-- CAPITAL_AI_OWNER_DIFF_ATTESTATION -->
          - [x] beliebiger sichtbarer Text
          <!-- CAPITAL_AI_OWNER_FILES_ATTESTATION -->
          - [X] ebenfalls frei formulierbar'''
          canonical_visible = '''`CAPITAL_AI_OWNER_DIFF_ATTESTATION`
          - [x] beliebiger sichtbarer Text
          `CAPITAL_AI_OWNER_FILES_ATTESTATION`
          - [X] ebenfalls frei formulierbar'''
          unchecked = canonical_comment.replace('- [x] beliebiger', '- [ ] beliebiger')
          missing_id = '- [x] vollständigen Diff geprüft\n- [x] alle Dateien geprüft'
          duplicate_id = canonical_comment + '\n<!-- CAPITAL_AI_OWNER_DIFF_ATTESTATION -->\n- [x] doppelt'
          fenced = '```text\n' + canonical_comment + '\n```'

          assert parse(canonical_comment) == (True, True)
          assert parse(canonical_visible) == (True, True)
          assert parse(unchecked) == (False, True)
          assert parse(missing_id) == (False, False)
          assert parse(duplicate_id) == (False, False)
          assert parse(fenced) == (False, False)

          diff_ok, files_ok = parse(os.environ.get('PR_BODY', ''))
          print(f'{str(diff_ok).lower()} {str(files_ok).lower()}')
          PY
          )"

          body_ok=false
          if [ "$diff_attested" = "true" ] && [ "$files_attested" = "true" ]; then
            body_ok=true
          fi

          # Kein `| head -n 1`: head schliesst die Pipe nach der ersten Zeile,
          # gh --paginate erhaelt beim Schreiben der zweiten Zeile SIGPIPE und
          # endet mit 141. Mit `set -o pipefail` + `set -e` bricht der Step dann
          # ab, BEVOR das Gate ausgewertet wird — bei genau einem passenden
          # Review unauffaellig, ab dem zweiten reproduzierbar fatal.
          # Gebraucht wird ohnehin nur "mindestens ein passendes Review".
          review_ids="$(
            gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews?per_page=100" \
              --jq '.[] | select(.user.login == env.EXPECTED_OWNER and .commit_id == env.PR_HEAD_SHA and (((((.body // "") | gsub("^[[:space:]]+|[[:space:]]+$"; "")) | ascii_downcase) == "okay") or (((.body // "") | gsub("^[[:space:]]+|[[:space:]]+$"; "")) == "💪"))) | .id'
          )"

          review_ok=false
          if [ -n "${review_ids//[[:space:]]/}" ]; then
            review_ok=true
          fi

          if [ "$body_ok" = "true" ] && [ "$review_ok" = "true" ]; then
            echo "approved=true" >> "$GITHUB_OUTPUT"
            echo "Owner-Gate erfüllt. Genau ein build-and-test-Lauf darf starten."
          else
            echo "approved=false" >> "$GITHUB_OUTPUT"
            echo "Owner-Gate nicht erfüllt. Build/Test wird nicht gestartet."
            echo "PR-Diff-Attestation: $diff_attested"
            echo "Files-changed-Attestation: $files_attested"
            echo "Current-Head-Owner-Review: $review_ok"
            echo "Reihenfolge: aktuellen Head reviewen (💪/okay), danach beide Owner-Checkboxen setzen/speichern."
            exit 1
          fi

  build-and-test:
    name: build-and-test
    needs: [owner-gate]
    if: ${{ github.event_name == 'push' || needs.owner-gate.outputs.approved == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Repository auschecken
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.event_name == 'push' && github.sha || github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prüfumfang klassifizieren (D/C/R)
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          node scripts/pr/classifyPrScope.mjs

      - name: Scope-Zusammenfassung
        run: |
          echo "class=${{ steps.scope.outputs.class }}"
          echo "node=${{ steps.scope.outputs.node }} lint=${{ steps.scope.outputs.lint }} unit=${{ steps.scope.outputs.unit }}"
          echo "build=${{ steps.scope.outputs.build }} audit=${{ steps.scope.outputs.audit }} predeploy=${{ steps.scope.outputs.predeploy }}"
          echo "docker=${{ steps.scope.outputs.docker }} docker_image=${{ steps.scope.outputs.docker_image }}"

      - name: Repository-Integrität prüfen
        if: steps.scope.outputs.integrity == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse --verify 'HEAD^{commit}' >/dev/null
          git fsck --strict --no-dangling

      - name: Dokumentations-Fast-Path (Klasse D)
        if: steps.scope.outputs.class == 'D'
        run: |
          echo "Klasse D: nur Dokumentation/.ai/Markdown — Software-Build und Tests sind nicht erforderlich."

      - name: Node.js einrichten
        if: steps.scope.outputs.node == 'true'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24.18.0'
          cache: 'npm'

      - name: Abhängigkeiten installieren
        if: steps.scope.outputs.node == 'true'
        run: npm ci

      - name: Produktionsabhängigkeiten prüfen
        if: steps.scope.outputs.audit == 'true'
        run: npm audit --omit=dev --audit-level=high

      - name: TypeScript prüfen
        if: steps.scope.outputs.lint == 'true'
        run: npm run lint

      - name: Unit-Tests ausführen
        if: steps.scope.outputs.unit == 'true'
        run: npm test

      - name: Produktions-Build erstellen
        if: steps.scope.outputs.build == 'true'
        run: npm run build

      - name: Produktions-CSP-Auslieferung nach Build prüfen
        if: steps.scope.outputs.build == 'true'
        env:
          NODE_ENV: production
          CSP_MODE: report-only
        run: npx vitest run tests/unit/securityResponse.production.test.ts

      - name: Produktionskonfiguration und Deployment-Bereitschaft prüfen
        if: steps.scope.outputs.predeploy == 'true'
        run: |
          npx tsx scripts/security/verifyProductionConfigInvariants.ts
          npm run predeploy:check

      - name: Docker-Hardening prüfen
        if: steps.scope.outputs.docker == 'true'
        run: node scripts/security/verifyDockerHardening.mjs

      - name: Produktions-Docker-Image bauen und prüfen
        if: steps.scope.outputs.docker_image == 'true'
        run: |
          docker build --tag capital-ai-ci:${{ github.sha }} .
          test "$(docker image inspect capital-ai-ci:${{ github.sha }} --format '{{.Config.User}}')" = "capitalai"
          test "$(docker image inspect capital-ai-ci:${{ github.sha }} --format '{{json .Config.Cmd}}')" = '["node","dist/server.cjs"]'
          docker image inspect capital-ai-ci:${{ github.sha }} --format '{{json .Config.Healthcheck.Test}}' | grep -q '/healthz'

  deploy-production:
    name: Deployment verifiziert / Render-Produktion
    needs: [build-and-test, supply-chain-attestation]
    if: ${{ needs.build-and-test.result == 'success' && needs.supply-chain-attestation.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Render-Deployment für verifizierten main-Commit auslösen
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          VERIFIED_COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$RENDER_DEPLOY_HOOK_URL"
          separator='?'
          case "$RENDER_DEPLOY_HOOK_URL" in *\?*) separator='&' ;; esac
          curl --fail-with-body --silent --show-error --location \
            --request POST \
            "${RENDER_DEPLOY_HOOK_URL}${separator}ref=${VERIFIED_COMMIT_SHA}"

  verify-deployment-identity:
    name: Deployment-Identität post-verifizieren
    needs: [deploy-production]
    if: ${{ needs.deploy-production.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Repository auschecken
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Node.js einrichten
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24.18.0'
          cache: 'npm'

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Deployte Commit-Identität und Health gegen erwarteten main-Commit verifizieren
        env:
          VERIFIED_COMMIT_SHA: ${{ github.sha }}
        run: npx tsx scripts/deployment/verifyDeploymentIdentity.ts

      - name: Deployment-Identitäts-Evidence als Workflow-Artefakt ablegen
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deployment-identity-evidence-${{ github.sha }}
          path: artifacts/deployment/deployment-identity-evidence.json
          retention-days: 90
          if-no-files-found: error

  supply-chain-attestation:
    name: Supply-Chain-Provenance / Attestation
    needs: [build-and-test]
    if: ${{ needs.build-and-test.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Vertrauenswürdigen main-Stand auschecken
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Node.js einrichten
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24.18.0'
          cache: 'npm'

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Produktions-Build und Supply-Chain-Kette erzeugen
        run: |
          npm run build
          npm run predeploy:check

      - name: Provenance-Bindung an gehosteten Build-Pfad erzwingen
        run: npx tsx scripts/security/verifySupplyChainProvenance.ts --require-ci

      - name: cosign installieren
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Provenance keyless signieren (Sigstore/Fulcio/Rekor)
        run: |
          cosign sign-blob --yes \
            --bundle dist/security/provenance.json.sigstore.json \
            dist/security/provenance.json

      - name: Signatur gegen erwartete Workflow-Identität verifizieren
        run: |
          cosign verify-blob \
            --bundle dist/security/provenance.json.sigstore.json \
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/ci.yml@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            dist/security/provenance.json

      - name: Supply-Chain-Artefakte als Workflow-Artefakt ablegen
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: supply-chain-provenance-${{ github.sha }}
          path: |
            dist/security/sbom.cdx.json
            dist/security/provenance.json
            dist/security/provenance.json.sigstore.json
            dist/control-plane/release-manifest.json
          retention-days: 90
          if-no-files-found: error
