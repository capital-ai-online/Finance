name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Production dependency vulnerability gate (npm audit)
        run: npm audit --omit=dev --audit-level=high

      - name: Verify production configuration invariants
        run: npx tsx scripts/security/verifyProductionConfigInvariants.ts

      - name: Docker hardening policy gate
        run: node scripts/security/verifyDockerHardening.mjs

      - name: Typecheck (tsc --noEmit)
        run: npm run lint

      - name: Unit tests (Vitest)
        run: npm test

      - name: Production build (vite + esbuild)
        run: npm run build

      - name: Deployment-Readiness-Pruefung (H7)
        run: npm run predeploy:check

      - name: Build production Docker image
        run: docker build --tag capital-ai-ci:${{ github.sha }} .

      - name: Verify runtime image metadata
        run: |
          test "$(docker image inspect capital-ai-ci:${{ github.sha }} --format '{{.Config.User}}')" = "capitalai"
          test "$(docker image inspect capital-ai-ci:${{ github.sha }} --format '{{json .Config.Cmd}}')" = '["node","dist/server.cjs"]'
          docker image inspect capital-ai-ci:${{ github.sha }} --format '{{json .Config.Healthcheck.Test}}' | grep -q '/healthz'

  deploy-production:
    name: Deployment verification / Render production deploy
    needs: [build-and-test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify deployment is intentionally not executed for pull requests
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          echo "Pull-request CI passed. Production deployment is intentionally disabled until the verified commit is pushed to main."

      - name: Trigger Render deploy for exact verified commit
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          VERIFIED_COMMIT_SHA: ${{ github.sha }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL is not configured" >&2
            exit 1
          fi

          separator='?'
          case "$RENDER_DEPLOY_HOOK_URL" in
            *\?*) separator='&' ;;
          esac

          curl --fail-with-body --silent --show-error --location \
            --request POST \
            "${RENDER_DEPLOY_HOOK_URL}${separator}ref=${VERIFIED_COMMIT_SHA}"
