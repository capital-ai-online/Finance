name: CI
run-name: >-
  ${{ github.event_name == 'push'
      && format('main – CI-Prüfung für {0}', github.sha)
      || format('PR #{0} – CI-Prüfung', github.event.pull_request.number) }}

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  owner-gate:
    name: Human-/Owner-Vorprüfung
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      approved: ${{ steps.gate.outputs.approved }}
    steps:
      - name: main-Push ohne erneute PR-Freigabe zulassen
        if: ${{ github.event_name == 'push' }}
        id: push-gate
        run: echo "approved=true" >> "$GITHUB_OUTPUT"

      - name: Owner-Checkliste und aktuellen Review prüfen
        if: ${{ github.event_name != 'push' }}
        id: gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_OWNER: SvenKulessa
        run: |
          set -euo pipefail

          required_diff='- [x] Human/Owner: vollständigen PR-Diff geprüft.'
          required_files='- [x] Human/Owner: alle geänderten Dateien im Tab Files changed als Viewed markiert.'
          current_body="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.body // ""')"

          body_ok=true
          printf '%s\n' "$current_body" | grep -Fqx -- "$required_diff" || body_ok=false
          printf '%s\n' "$current_body" | grep -Fqx -- "$required_files" || body_ok=false

          review_id="$(
            gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews?per_page=100" \
              --jq '.[] | select(.user.login == env.EXPECTED_OWNER and .commit_id == env.PR_HEAD_SHA and (((.body // "") | ascii_downcase | gsub("^[[:space:]]+|[[:space:]]+$"; "")) == "okay" or ((.body // "") | contains("💪")))) | .id' \
              | head -n 1
          )"

          if [ "$body_ok" = "true" ] && [ -n "$review_id" ]; then
            echo "approved=true" >> "$GITHUB_OUTPUT"
            echo "Owner-Gate erfüllt. Technische Validierung darf starten."
          else
            echo "approved=false" >> "$GITHUB_OUTPUT"
            echo "Owner-Gate noch nicht erfüllt. Teure CI wird absichtlich nicht gestartet."
            [ "$body_ok" = "true" ] || echo "Fehlend: beide Owner-Checkboxen im PR-Body."
            [ -n "$review_id" ] || echo "Fehlend: aktueller Review von SvenKulessa mit 💪 oder okay für ${PR_HEAD_SHA}."
          fi

  technical-validation:
    name: Technische Validierung
    needs: [owner-gate]
    if: ${{ github.event_name == 'push' || needs.owner-gate.outputs.approved == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Quellcode ohne persistierte Zugangsdaten auschecken
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0 / Node 24
        with:
          ref: ${{ github.event_name == 'push' && github.sha || github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: CI-Validierungsumfang bestimmen
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "push" ]; then
            echo "full_validation=true" >> "$GITHUB_OUTPUT"
            echo "main-Push: vollständige Validierung ist verpflichtend."
            exit 0
          fi

          changed_files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          printf '%s\n' "$changed_files"

          docs_only=true
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              docs/*|.ai/*|*.md)
                ;;
              *)
                docs_only=false
                break
                ;;
            esac
          done <<< "$changed_files"

          if [ "$docs_only" = "true" ]; then
            echo "full_validation=false" >> "$GITHUB_OUTPUT"
            echo "Reiner Dokumentations-PR: Fast Path aktiviert."
          else
            echo "full_validation=true" >> "$GITHUB_OUTPUT"
            echo "Code-/Workflow-/Dependency-/Konfigurationsänderung erkannt: vollständige Validierung."
          fi

      - name: Ausgecheckten Commit verifizieren
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse --verify 'HEAD^{commit}' >/dev/null

      - name: Dokumentations-PR Fast Path bestätigen
        if: steps.scope.outputs.full_validation != 'true'
        run: |
          echo "Nur Dokumentation betroffen. Teurer Toolchain-Build, npm-Installation, Tests, Build und Docker werden in diesem PR-Lauf übersprungen."
          echo "Repository-/Workflow-Governance läuft weiterhin in den separaten Governance-Workflows."

      - name: Git 2.55.0 kryptografisch verifiziert bereitstellen
        if: steps.scope.outputs.full_validation == 'true'
        shell: bash
        run: |
          set -euo pipefail
          current="$(git --version | awk '{print $3}')"
          required="2.55.0"
          expected_sha256="457fdb04dc8728e007d4688695e6912e6f680727920f2a40bf11eacc17505357"
          archive="/tmp/git-${required}.tar.xz"

          if [ "$current" != "$required" ]; then
            sudo apt-get update
            sudo apt-get install --yes build-essential libssl-dev libcurl4-gnutls-dev libexpat1-dev gettext zlib1g-dev
            curl --fail --silent --show-error --location \
              --retry 3 --retry-all-errors \
              --connect-timeout 10 --max-time 120 \
              "https://www.kernel.org/pub/software/scm/git/git-${required}.tar.xz" \
              --output "$archive"

            printf '%s  %s\n' "$expected_sha256" "$archive" | sha256sum --check --strict
            xz --test "$archive"
            tar -xJf "$archive" -C /tmp
            make -C "/tmp/git-${required}" -j2 \
              prefix=/opt/git-${required} \
              NO_TCLTK=YesPlease \
              NO_RUST=YesPlease \
              all
            sudo make -C "/tmp/git-${required}" \
              prefix=/opt/git-${required} \
              NO_TCLTK=YesPlease \
              NO_RUST=YesPlease \
              install
            echo "/opt/git-${required}/bin" >> "$GITHUB_PATH"
            export PATH="/opt/git-${required}/bin:$PATH"
          fi

          test "$(git --version | awk '{print $3}')" = "$required"
          git --version

      - name: Node.js einrichten
        if: steps.scope.outputs.full_validation == 'true'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0 / Node 24 action runtime
        with:
          node-version: '24.18.0'
          cache: 'npm'

      - name: Toolchain-Versionen verifizieren
        if: steps.scope.outputs.full_validation == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git --version | awk '{print $3}')" = "2.55.0"
          test "$(node --version)" = "v24.18.0"
          git --version
          node --version
          npm --version

      - name: Git-Repository-Integrität verifizieren
        if: steps.scope.outputs.full_validation == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse --verify 'HEAD^{commit}' >/dev/null
          git fsck --strict --no-dangling

      - name: Abhängigkeiten installieren
        if: steps.scope.outputs.full_validation == 'true'
        run: npm ci

      - name: Produktionsabhängigkeiten auf Schwachstellen prüfen
        if: steps.scope.outputs.full_validation == 'true'
        run: npm audit --omit=dev --audit-level=high

      - name: Produktionskonfiguration prüfen
        if: steps.scope.outputs.full_validation == 'true'
        run: npx tsx scripts/security/verifyProductionConfigInvariants.ts

      - name: Docker-Hardening-Richtlinie prüfen
        if: steps.scope.outputs.full_validation == 'true'
        run: node scripts/security/verifyDockerHardening.mjs

      - name: TypeScript prüfen
        if: steps.scope.outputs.full_validation == 'true'
        run: npm run lint

      - name: Unit-Tests ausführen
        if: steps.scope.outputs.full_validation == 'true'
        run: npm test

      - name: Produktions-Build erstellen
        if: steps.scope.outputs.full_validation == 'true'
        run: npm run build

      - name: Gebauten CSP-Auslieferungspfad prüfen
        if: steps.scope.outputs.full_validation == 'true'
        env:
          NODE_ENV: production
          CSP_MODE: report-only
        run: npx vitest run tests/unit/securityResponse.production.test.ts

      - name: Deployment-Bereitschaft prüfen (H7)
        if: steps.scope.outputs.full_validation == 'true'
        run: npm run predeploy:check

      - name: Docker-Relevanz für diesen Lauf bestimmen
        if: steps.scope.outputs.full_validation == 'true'
        id: docker-scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ]; then
            echo "required=true" >> "$GITHUB_OUTPUT"
            echo "main-Push: Docker-Build ist vor Production-Deploy verpflichtend."
            exit 0
          fi

          changed_files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          printf '%s\n' "$changed_files"

          required=false
          while IFS= read -r file; do
            case "$file" in
              Dockerfile|.dockerignore|package.json|package-lock.json|server.ts|server/*|render.yaml|render.yml|scripts/security/*Docker*|scripts/security/*docker*|scripts/security/*Runtime*|scripts/security/*runtime*|.github/workflows/ci.yml|.github/workflows/*render*)
                required=true
                break
                ;;
            esac
          done <<< "$changed_files"

          echo "required=$required" >> "$GITHUB_OUTPUT"
          if [ "$required" = "true" ]; then
            echo "Docker-/Runtime-/Dependency-/Deployment-relevante Änderung erkannt."
          else
            echo "Kein Docker-relevanter PR-Scope; teurer Image-Build wird gemäß Budgetrichtlinie übersprungen."
          fi

      - name: Produktions-Docker-Image bauen
        if: steps.scope.outputs.full_validation == 'true' && steps.docker-scope.outputs.required == 'true'
        run: docker build --tag capital-ai-ci:${{ github.sha }} .

      - name: Laufzeit-Metadaten des Images prüfen
        if: steps.scope.outputs.full_validation == 'true' && steps.docker-scope.outputs.required == 'true'
        run: |
          test "$(docker image inspect capital-ai-ci:${{ github.sha }} --format '{{.Config.User}}')" = "capitalai"
          test "$(docker image inspect capital-ai-ci:${{ github.sha }} --format '{{json .Config.Cmd}}')" = '["node","dist/server.cjs"]'
          docker image inspect capital-ai-ci:${{ github.sha }} --format '{{json .Config.Healthcheck.Test}}' | grep -q '/healthz'

  build-and-test:
    needs: [technical-validation]
    if: ${{ always() && needs.technical-validation.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Technische Validierung bestätigen
        run: echo "Owner-freigegebene technische Validierung erfolgreich abgeschlossen."

  deploy-production:
    name: Deployment verifiziert / Render-Produktion
    needs: [build-and-test]
    if: ${{ always() && needs.build-and-test.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Bestätigen, dass Pull Requests nicht produktiv deployen
        if: ${{ github.event_name != 'push' }}
        run: |
          echo "Die Pull-Request-CI ist erfolgreich. Ein Produktions-Deployment ist absichtlich deaktiviert, bis der verifizierte Commit nach main übernommen wurde."

      - name: Render-Deployment für den exakt verifizierten Commit auslösen
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          VERIFIED_COMMIT_SHA: ${{ github.sha }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL ist nicht konfiguriert" >&2
            exit 1
          fi

          separator='?'
          case "$RENDER_DEPLOY_HOOK_URL" in
            *\?*) separator='&' ;;
          esac

          curl --fail-with-body --silent --show-error --location \
            --request POST \
            "${RENDER_DEPLOY_HOOK_URL}${separator}ref=${VERIFIED_COMMIT_SHA}"
