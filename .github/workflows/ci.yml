name: CI
run-name: "main – CI-Prüfung für ${{ github.sha }}"

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build-and-test
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Repository auschecken
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Repository-Integrität prüfen
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse --verify 'HEAD^{commit}' >/dev/null
          git fsck --strict --no-dangling

      - name: Node.js einrichten
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24.18.0'
          cache: 'npm'

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Repository-Konventionen blocking prüfen
        run: npm run repository:validate

      - name: Produktionsabhängigkeiten prüfen
        run: npm audit --omit=dev --audit-level=high

      - name: TypeScript prüfen
        run: npm run lint

      - name: Unit-Tests ausführen
        run: npm test

      - name: Produktions-Build erstellen
        run: npm run build

      - name: Produktions-CSP-Auslieferung nach Build prüfen
        env:
          NODE_ENV: production
          CSP_MODE: report-only
        run: npx vitest run tests/unit/securityResponse.production.test.ts

      - name: Produktionskonfiguration und Deployment-Bereitschaft prüfen
        run: |
          npx tsx scripts/security/verifyProductionConfigInvariants.ts
          npm run predeploy:check

      - name: Docker-Hardening prüfen
        run: node scripts/security/verifyDockerHardening.mjs

      - name: Produktions-Docker-Image bauen und prüfen
        shell: bash
        env:
          IMAGE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker build --tag "capital-ai-ci:${IMAGE_SHA}" .
          test "$(docker image inspect "capital-ai-ci:${IMAGE_SHA}" --format '{{.Config.User}}')" = "capitalai"
          test "$(docker image inspect "capital-ai-ci:${IMAGE_SHA}" --format '{{json .Config.Cmd}}')" = '["node","dist/server.cjs"]'
          docker image inspect "capital-ai-ci:${IMAGE_SHA}" --format '{{json .Config.Healthcheck.Test}}' | grep -q '/healthz'

      - name: Produktions-Docker-Container starten und /healthz prüfen
        shell: bash
        env:
          IMAGE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          container_name="capital-ai-ci-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            docker logs "$container_name" 2>/dev/null || true
            docker rm -f "$container_name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run -d \
            --name "$container_name" \
            -p 127.0.0.1::3000 \
            -e PORT=3000 \
            -e SUPABASE_SECRET_KEY=ci-smoke-nonsecret \
            -e STRIPE_SECRET_KEY=sk_test_ci_runtime_smoke \
            -e STRIPE_WEBHOOK_SECRET=whsec_ci_runtime_smoke \
            -e TOTP_ENCRYPTION_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef \
            "capital-ai-ci:${IMAGE_SHA}" >/dev/null

          host_port="$(docker port "$container_name" 3000/tcp | sed -E 's/.*:([0-9]+)$/\1/' | head -n 1)"
          test -n "$host_port"

          health_ok=false
          for _attempt in $(seq 1 30); do
            if curl --fail --silent --show-error "http://127.0.0.1:${host_port}/healthz" >/dev/null; then
              health_ok=true
              break
            fi
            if [ "$(docker inspect --format '{{.State.Running}}' "$container_name")" != 'true' ]; then
              break
            fi
            sleep 1
          done

          test "$health_ok" = 'true'
          echo "Docker Runtime Smoke Test PASS: /healthz antwortet mit HTTP 2xx für Image capital-ai-ci:${IMAGE_SHA}."

  deploy-production:
    name: Deployment verifiziert / Render-Produktion
    needs: [build-and-test]
    if: ${{ always() && needs.build-and-test.result == 'success' }}
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Render-Deployment für verifizierten main-Commit auslösen
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          VERIFIED_COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$RENDER_DEPLOY_HOOK_URL"
          separator='?'
          case "$RENDER_DEPLOY_HOOK_URL" in *\?*) separator='&' ;; esac
          curl --fail-with-body --silent --show-error --location \
            --request POST \
            "${RENDER_DEPLOY_HOOK_URL}${separator}ref=${VERIFIED_COMMIT_SHA}"
