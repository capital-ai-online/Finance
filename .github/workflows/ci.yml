name: CI
run-name: >-
  ${{ github.event_name == 'pull_request'
      && format('PR #{0} – CI-Prüfung', github.event.pull_request.number)
      || format('main – CI-Prüfung für {0}', github.sha) }}

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build und Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Quellcode ohne persistierte Zugangsdaten auschecken
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Node.js einrichten
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Produktionsabhängigkeiten auf Schwachstellen prüfen
        run: npm audit --omit=dev --audit-level=high

      - name: Produktionskonfiguration prüfen
        run: npx tsx scripts/security/verifyProductionConfigInvariants.ts

      - name: Docker-Hardening-Richtlinie prüfen
        run: node scripts/security/verifyDockerHardening.mjs

      - name: TypeScript prüfen
        run: npm run lint

      - name: Unit-Tests ausführen
        run: npm test

      - name: Produktions-Build erstellen
        run: npm run build

      - name: Gebauten CSP-Auslieferungspfad prüfen
        env:
          NODE_ENV: production
          CSP_MODE: report-only
        run: npx vitest run tests/unit/securityResponse.production.test.ts

      - name: Deployment-Bereitschaft prüfen (H7)
        run: npm run predeploy:check

      - name: Docker-Relevanz für diesen Lauf bestimmen
        id: docker-scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ]; then
            echo "required=true" >> "$GITHUB_OUTPUT"
            echo "main-Push: Docker-Build ist vor Production-Deploy verpflichtend."
            exit 0
          fi

          git fetch --no-tags --depth=1 origin "$BASE_REF"
          changed_files="$(git diff --name-only FETCH_HEAD HEAD)"
          printf '%s\n' "$changed_files"

          required=false
          while IFS= read -r file; do
            case "$file" in
              Dockerfile|.dockerignore|package.json|package-lock.json|server.ts|server/*|render.yaml|render.yml|scripts/security/*Docker*|scripts/security/*docker*|scripts/security/*Runtime*|scripts/security/*runtime*|.github/workflows/ci.yml|.github/workflows/*render*)
                required=true
                break
                ;;
            esac
          done <<< "$changed_files"

          echo "required=$required" >> "$GITHUB_OUTPUT"
          if [ "$required" = "true" ]; then
            echo "Docker-/Runtime-/Dependency-/Deployment-relevante Änderung erkannt."
          else
            echo "Kein Docker-relevanter PR-Scope; teurer Image-Build wird gemäß Budgetrichtlinie übersprungen."
          fi

      - name: Produktions-Docker-Image bauen
        if: steps.docker-scope.outputs.required == 'true'
        run: docker build --tag capital-ai-ci:${{ github.sha }} .

      - name: Laufzeit-Metadaten des Images prüfen
        if: steps.docker-scope.outputs.required == 'true'
        run: |
          test "$(docker image inspect capital-ai-ci:${{ github.sha }} --format '{{.Config.User}}')" = "capitalai"
          test "$(docker image inspect capital-ai-ci:${{ github.sha }} --format '{{json .Config.Cmd}}')" = '["node","dist/server.cjs"]'
          docker image inspect capital-ai-ci:${{ github.sha }} --format '{{json .Config.Healthcheck.Test}}' | grep -q '/healthz'

  deploy-production:
    name: Deployment verifiziert / Render-Produktion
    needs: [build-and-test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Bestätigen, dass Pull Requests nicht produktiv deployen
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          echo "Die Pull-Request-CI ist erfolgreich. Ein Produktions-Deployment ist absichtlich deaktiviert, bis der verifizierte Commit nach main übernommen wurde."

      - name: Render-Deployment für den exakt verifizierten Commit auslösen
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          VERIFIED_COMMIT_SHA: ${{ github.sha }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL ist nicht konfiguriert" >&2
            exit 1
          fi

          separator='?'
          case "$RENDER_DEPLOY_HOOK_URL" in
            *\?*) separator='&' ;;
          esac

          curl --fail-with-body --silent --show-error --location \
            --request POST \
            "${RENDER_DEPLOY_HOOK_URL}${separator}ref=${VERIFIED_COMMIT_SHA}"
