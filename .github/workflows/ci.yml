name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # External SCA/CVE gate backed by the npm advisory service. This complements the local
      # CycloneDX/SBOM + lockfile policy in predeploy:check; it is intentionally fail-closed for
      # HIGH/CRITICAL findings in production dependencies and does not silently suppress findings.
      - name: Production dependency vulnerability gate (npm audit)
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck (tsc --noEmit)
        run: npm run lint

      - name: Unit tests (Vitest)
        run: npm test

      - name: Production build (vite + esbuild)
        run: npm run build

      - name: Deployment-Readiness-Pruefung (H7)
        run: npm run predeploy:check
