name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # External SCA/CVE gate backed by the npm advisory service. This complements the local
      # CycloneDX/SBOM + lockfile policy in predeploy:check; it is intentionally fail-closed for
      # HIGH/CRITICAL findings in production dependencies and does not silently suppress findings.
      - name: Production dependency vulnerability gate (npm audit)
        run: npm audit --omit=dev --audit-level=high

      - name: Verify production configuration invariants
        run: npx tsx scripts/security/verifyProductionConfigInvariants.ts

      - name: Typecheck (tsc --noEmit)
        run: npm run lint

      - name: Unit tests (Vitest)
        run: npm test

      - name: Production build (vite + esbuild)
        run: npm run build

      - name: Deployment-Readiness-Pruefung (H7)
        run: npm run predeploy:check

  deploy-production:
    name: Deploy verified commit to Render
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [build-and-test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger Render deploy for exact verified commit
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          VERIFIED_COMMIT_SHA: ${{ github.sha }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL is not configured" >&2
            exit 1
          fi

          curl --fail-with-body --silent --show-error --location \
            --request POST \
            "${RENDER_DEPLOY_HOOK_URL}&ref=${VERIFIED_COMMIT_SHA}"
