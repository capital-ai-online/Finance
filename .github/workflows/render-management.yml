name: Render Management

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Bounded Render management action'
        required: true
        default: inventory
        type: choice
        options:
          - inventory
          - delete-suspended-validation-services
          - delete-exact-stale-static-site
          - delete-unused-registry-credential
          - disable-finance-pr-previews
          - spend-limit-capability
      confirmation:
        description: 'Exact confirmation phrase required only for destructive actions'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: render-management-${{ inputs.action }}
  cancel-in-progress: false

jobs:
  render-management:
    name: Bounded Render management
    if: github.ref == 'refs/heads/main' && github.actor == 'SvenKulessa'
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Repository auschecken
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false

      - name: Node.js 24 einrichten
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'

      - name: Render Management-Konfiguration fail-closed prüfen
        env:
          RENDER_API_KEY: ${{ secrets.CAPITAL_AI_RENDER_API_KEY }}
          RENDER_WORKSPACE_ID: ${{ vars.CAPITAL_AI_RENDER_WORKSPACE_ID }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${RENDER_API_KEY}" ]] || { echo "::error::CAPITAL_AI_RENDER_API_KEY fehlt."; exit 1; }
          [[ -n "${RENDER_WORKSPACE_ID}" ]] || { echo "::error::CAPITAL_AI_RENDER_WORKSPACE_ID fehlt."; exit 1; }

      - name: Begrenzte Render Management-Aktion ausführen
        env:
          CAPITAL_AI_RENDER_API_KEY: ${{ secrets.CAPITAL_AI_RENDER_API_KEY }}
          CAPITAL_AI_RENDER_WORKSPACE_ID: ${{ vars.CAPITAL_AI_RENDER_WORKSPACE_ID }}
          CAPITAL_AI_RENDER_WORKSPACE_PLAN: ${{ vars.CAPITAL_AI_RENDER_WORKSPACE_PLAN }}
          RENDER_ACTION: ${{ inputs.action }}
          RENDER_CONFIRMATION: ${{ inputs.confirmation }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/operations/renderManagementAdapter.mjs             --action "${RENDER_ACTION}"             --confirm "${RENDER_CONFIRMATION}"
