name: CAPITAL-AI CI Shadow
run-name: dependency lock resolver – PR #${{ github.event.pull_request.number }}

# TEMPORARY branch-only resolver for PR #1043. This file is restored to the exact
# current-main shadow workflow before PR readiness; it is never intended to merge.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: dependency-lock-resolver-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  capital-ai-ci:
    if: github.head_ref == 'agent/operations-runtime-deps-20260917'
    name: dependency-lock-resolver
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Repository auschecken
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Node.js einrichten
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24.20.0'
          cache: npm

      - name: Lockfile deterministisch neu auflösen
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts
          npm ci --ignore-scripts
          npm ls --all
          npm run lint
          npm run build:raw

      - name: Aufgelösten Lockfile als Evidence hochladen
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-lock-slice-1-${{ github.event.pull_request.head.sha }}
          path: package-lock.json
          retention-days: 1
          if-no-files-found: error
