name: AUD4 Charts Syntax Fix

on:
  push:
    branches:
      - feature/audit4-final-screening-hardening

permissions:
  contents: write

jobs:
  fix:
    if: "!contains(github.event.head_commit.message, 'fix Charts remediation syntax')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/audit4-final-screening-hardening
      - name: Remove stale fallback closure
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/components/Charts.tsx')
          text = p.read_text()
          bad = """          });\n            setIsScoring(false);\n          });\n      }\n"""
          good = """          });\n      }\n"""
          if bad not in text:
              raise SystemExit('Expected stale closure not found')
          p.write_text(text.replace(bad, good, 1))
          PY
      - name: Commit syntax fix
        shell: bash
        run: |
          git config user.name "capital-ai-ci"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/Charts.tsx
          git commit -m "fix: fix Charts remediation syntax"
          git push origin HEAD:feature/audit4-final-screening-hardening
