name: Systemadmin Work-Package Runner
run-name: >-
  Work-Package-Host für Issue #${{ github.event.issue.number }}

on:
  issues:
    types: [opened]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

concurrency:
  group: systemadmin-work-package-runner-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  run-catalog-work-package:
    name: Audit-gebundener generalisierter Work-Package-Host (ADR-0074)
    # Trigger aktiviert 2026-08-15 auf explizite Owner-Anweisung ("aktiviere den Work-Package-
    # Runner") — identisches Prinzip wie die SA3B/SA4-Reaktivierung 2026-08-14. Dies ist
    # ausdrücklich nur Schritt 1 von 2: der Host kann jetzt bei einem passenden Issue anlaufen,
    # aber jede tatsächliche Ausführung schlägt weiterhin fehl, solange das gebundene Mandat
    # (.ai/mandates/REM-WORKPACKAGE-GEN-PROOF-001.json) `status: DRAFT` bleibt — SA1 REM_SCOPE
    # verweigert das unabhängig von diesem Trigger (mandate.status !== 'OWNER_APPROVED' → deny).
    # Der auditierte Vertrag bleibt dabei unveraendert nachweisbar (siehe
    # tests/unit/systemadminWorkPackageCatalogContracts.test.ts).
    #
    # Anders als SA3B/SA4 ist dieser Workflow selbst generisch: er ruft keinen pro-Arbeitspaket
    # geschriebenen Trigger-Flip auf, sondern liest den zu bindenden workPackageId aus dem
    # validierten Issue-Request und schlaegt ihn im Katalog nach. Jedes einzelne Arbeitspaket
    # (Zielpfad, Inhalt, Mandat) bleibt dabei trusted, bereits auf main gemergter Code — der
    # Issue-Body waehlt nur, WELCHES bereits genehmigte Arbeitspaket laeuft, nie WAS geschrieben
    # wird.
    #
    # STILLGELEGT 2026-08-24 auf ausdrueckliche Owner-Anweisung ("bitte deaktiviere die aktiven
    # GitHub bot ... diese erstellen jeweils Projekte, die ich erstmal beiseite gelegt habe").
    # Die betroffenen Arbeitspakete sind zurueckgestellt; ein Host, der bei jedem passenden Issue
    # autonom anlaeuft, soll waehrenddessen nicht scharf bleiben.
    #
    # Die urspruengliche Sicherheitsannahme dieses Kommentars ist ausserdem veraltet: das gebundene
    # Mandat .ai/mandates/REM-WORKPACKAGE-GEN-PROOF-001.json traegt heute `status: OWNER_APPROVED`,
    # nicht `DRAFT`. Der beschriebene REM_SCOPE-Deny greift also nicht mehr; die Ausfuehrung war
    # zuletzt nur noch durch `expiresAt: 2026-08-22` blockiert. Umso mehr ist die Stilllegung hier
    # explizit und nicht implizit.
    #
    # Stillgelegt per `false &&` — identisch zu systemadmin-sa4-pilot.yml, damit der auditierte
    # Vertrag (siehe tests/unit/systemadminWorkPackageCatalogContracts.test.ts) unveraendert
    # nachweisbar bleibt. Reaktivierung ist ein eigener, dokumentierter Human/Owner-Change.
    if: >-
      false &&
      github.event.issue.user.login == 'SvenKulessa' &&
      startsWith(github.event.issue.title, '[SYSTEMADMIN-WORK-PACKAGE]')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Vertrauenswürdigen main-Stand auschecken
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Node.js einrichten
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24.18.0'

      - name: Untrusted Issue-Request strikt gegen den Katalog validieren
        env:
          SYSTEMADMIN_ISSUE_BODY: ${{ github.event.issue.body }}
          SYSTEMADMIN_REQUEST_OUTPUT: ${{ runner.temp }}/systemadmin-workpackage-request.json
        run: node scripts/systemadmin/validateWorkPackageIssue.mjs

      - name: Audit-gebundenen Work-Package-Host ausführen
        env:
          SYSTEMADMIN_REQUEST_FILE: ${{ runner.temp }}/systemadmin-workpackage-request.json
          SYSTEMADMIN_BROKER_BASE_URL: https://capital-ai.online
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/systemadmin/runWorkPackage.mjs
