name: OPS BB-2E Conditional Workflow Trigger
run-name: >-
  ${{ format('BB-2E Dispatch nach trusted main sync @{0}', github.event.workflow_run.head_sha) }}

# Privileged completion trigger for the bounded BB-2E cutover.
# This workflow never checks out or executes FE/PR code. It consumes only trusted
# GitHub metadata/content APIs, re-reads the exact FE head, and dispatches the
# existing fail-closed BB-2E source-patch workflow when all conditions still hold.
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: ['Agenten-PR-Branches synchronisieren']
    types: [completed]
    branches: [main]

permissions: {}

concurrency:
  group: ops-bb2e-workflow-run-trigger-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

env:
  SOURCE_WORKFLOW_PATH: .github/workflows/sync-agent-pr-branches.yml
  DOWNSTREAM_WORKFLOW: ops-ast-grep-source-patch.yml
  TARGET_BRANCH: agent/frontend-bb-2e-dashboard-drawer-20260910
  TARGET_FILE: src/components/Dashboard.tsx

jobs:
  dispatch:
    name: BB-2E Bedingungen korrelieren und Dispatch auslösen
    if: >-
      github.event.workflow_run.repository.full_name == github.repository &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.path == '.github/workflows/sync-agent-pr-branches.yml' &&
      github.event.workflow_run.event == 'workflow_run' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
      pull-requests: read

    steps:
      - name: Trusted main, FE-Head und Einmaligkeit fail-closed korrelieren
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0 / Node 24
        env:
          SOURCE_WORKFLOW_PATH: ${{ env.SOURCE_WORKFLOW_PATH }}
          DOWNSTREAM_WORKFLOW: ${{ env.DOWNSTREAM_WORKFLOW }}
          TARGET_BRANCH: ${{ env.TARGET_BRANCH }}
          TARGET_FILE: ${{ env.TARGET_FILE }}
        with:
          retries: 3
          retry-exempt-status-codes: 400,401,403,404,422
          script: |
            const normalizeSha = (value) => String(value || '').trim().toLowerCase();
            const sourceRun = context.payload.workflow_run;
            const sourceWorkflowPath = process.env.SOURCE_WORKFLOW_PATH;
            const downstreamWorkflow = process.env.DOWNSTREAM_WORKFLOW;
            const targetBranch = process.env.TARGET_BRANCH;
            const targetFile = process.env.TARGET_FILE;
            const repoFullName = `${context.repo.owner}/${context.repo.repo}`;
            const fail = (message) => { throw new Error(message); };
            const decodeContent = (payload, label) => {
              if (!payload || Array.isArray(payload) || payload.type !== 'file' || payload.encoding !== 'base64') {
                fail(`${label} konnte nicht als UTF-8-Datei gelesen werden.`);
              }
              return Buffer.from(payload.content || '', 'base64').toString('utf8');
            };

            if (sourceRun?.repository?.full_name !== repoFullName || sourceRun?.head_repository?.full_name !== repoFullName) {
              fail('workflow_run stammt nicht aus dem kanonischen Repository.');
            }
            if (sourceRun?.path !== sourceWorkflowPath || sourceRun?.event !== 'workflow_run' || sourceRun?.head_branch !== 'main' || sourceRun?.conclusion !== 'success') {
              fail('workflow_run erfüllt die gebundene trusted-main Triggerbedingung nicht.');
            }

            const sourceSha = normalizeSha(sourceRun.head_sha);
            const { data: main } = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: 'main',
            });
            const mainSha = normalizeSha(main.commit?.sha);
            if (!/^[0-9a-f]{40}$/.test(sourceSha) || !/^[0-9a-f]{40}$/.test(mainSha)) {
              fail('Source- oder current-main-SHA ist ungültig.');
            }
            if (sourceSha !== mainSha) {
              core.notice(`Source-Workflow ${sourceSha.slice(0, 12)} ist nicht mehr current main ${mainSha.slice(0, 12)}; kein BB-2E Dispatch.`);
              return;
            }

            let target;
            try {
              ({ data: target } = await github.rest.repos.getBranch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                branch: targetBranch,
              }));
            } catch (error) {
              const status = Number(error?.status || error?.response?.status || 0);
              if (status === 404) {
                core.notice(`BB-2E Zielbranch ${targetBranch} existiert nicht mehr; terminaler No-op, kein Dispatch.`);
                return;
              }
              throw error;
            }
            const feHead = normalizeSha(target.commit?.sha);
            if (!/^[0-9a-f]{40}$/.test(feHead)) fail('FE-Branch liefert keinen gültigen exakten Head-SHA.');

            const openTargetPrs = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${context.repo.owner}:${targetBranch}`,
              per_page: 100,
            });
            if (openTargetPrs.length > 0) {
              core.notice(`FE-Branch hat bereits offene PR(s): ${openTargetPrs.map((pr) => `#${pr.number}`).join(', ')}; kein automatischer Cutover.`);
              return;
            }

            const { data: downstreamFile } = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: `.github/workflows/${downstreamWorkflow}`,
              ref: mainSha,
            });
            const downstreamText = decodeContent(downstreamFile, 'Downstream-Workflow');
            const requiredTokens = [
              'workflow_dispatch:',
              'expected_head_sha:',
              'confirm_apply:',
              `TARGET_BRANCH: ${targetBranch}`,
              'inputs.confirm_apply == true',
            ];
            for (const token of requiredTokens) {
              if (!downstreamText.includes(token)) fail(`Downstream-Workflow driftet; Pflichtbindung fehlt: ${token}`);
            }

            const { data: targetSourceFile } = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: targetFile,
              ref: feHead,
            });
            const targetSource = decodeContent(targetSourceFile, 'FE-Target-Datei');
            const legacyMarkers = [
              'menuOpen',
              'setMenuOpen',
              'DashboardExpandedSection',
              'Slide-out Retractable Hamburger Drawer Navigation',
            ];
            if (!legacyMarkers.some((marker) => targetSource.includes(marker))) {
              core.notice(`BB-2E Legacy-Marker sind auf FE ${feHead.slice(0, 12)} bereits entfernt; kein erneuter Dispatch.`);
              return;
            }

            const activeStatuses = ['queued', 'in_progress'];
            for (const status of activeStatuses) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: downstreamWorkflow,
                branch: 'main',
                status,
                per_page: 100,
              });
              if ((data.workflow_runs || []).length > 0) {
                core.notice(`BB-2E Downstream hat bereits ${status} Run(s); kein doppelter Dispatch.`);
                return;
              }
            }

            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: downstreamWorkflow,
              ref: 'main',
              inputs: {
                expected_head_sha: feHead,
                confirm_apply: 'true',
              },
            });

            core.notice(`BB-2E workflow_dispatch ausgelöst: main=${mainSha.slice(0, 12)} FE=${feHead}.`);
