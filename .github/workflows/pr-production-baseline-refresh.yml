name: PR Production Baseline Auto-Refresh
run-name: >-
  ${{ github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'
      && format('main@{0} – Produktions-Baseline an führende PR-Convergence delegieren', github.event.workflow_run.head_sha)
      || format('PR #{0} – Baseline-Ereignis durch führende PR-Convergence beobachten', github.event.workflow_run.pull_requests[0].number || 'N/A') }}

# Compatibility relay only. PR-body write authority was superseded by the
# PR Decision Evidence Reconciler, which is the single leading PR self-healing
# body chain (structure -> production baseline -> Decision/Evidence -> one PATCH).
# This workflow must never mutate PR bodies, repair templates, or rerun Governance.
# It only relays a verified post-deploy main event because the leading reconciler
# already subscribes directly to PR Governance/CI/Container/check events.
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: ['PR Governance', 'CI']
    types: [completed]

permissions: {}

concurrency:
  group: pr-production-baseline-relay-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}-${{ github.event.action }}
  cancel-in-progress: false

jobs:
  observe-pr-governance:
    name: PR Governance completion is owned by leading PR convergence
    if: >-
      github.event.action == 'completed' &&
      github.event.workflow_run.repository.full_name == github.repository &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.path == '.github/workflows/pr-governance.yml' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Single-writer authority bestätigen
        run: >-
          echo "PR Governance completion is observed only. PR Decision Evidence Reconciler
          owns all PR-body convergence and already receives this completion event directly."

  relay-post-deploy:
    name: Verifiziertes main-Deploy an führende PR-Convergence delegieren
    if: >-
      github.event.action == 'completed' &&
      github.event.workflow_run.repository.full_name == github.repository &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.path == '.github/workflows/ci.yml' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: write
      contents: read
    steps:
      - name: Abgeschlossenen CI-Deploy-Run exakt binden
        id: source
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0 / Node 24
        with:
          script: |
            const sourceRun = context.payload.workflow_run;
            if (
              context.payload.action !== 'completed' ||
              sourceRun.status !== 'completed' ||
              sourceRun.event !== 'push' ||
              sourceRun.head_branch !== 'main' ||
              sourceRun.path !== '.github/workflows/ci.yml' ||
              sourceRun.repository?.full_name !== context.repo.owner + '/' + context.repo.repo ||
              sourceRun.head_repository?.full_name !== context.repo.owner + '/' + context.repo.repo
            ) {
              core.setFailed('Post-deploy relay source identity mismatch.');
              return;
            }
            if (!Number.isInteger(Number(sourceRun.run_attempt)) || Number(sourceRun.run_attempt) < 1) {
              core.setFailed('CI source run has no valid run_attempt.');
              return;
            }

            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: sourceRun.id,
              per_page: 100,
            });
            const deployJob = jobs.find((job) => job.name === 'Deployment verifiziert / Render-Produktion');
            if (!deployJob || deployJob.status !== 'completed' || deployJob.conclusion !== 'success') {
              core.notice('CI completed without a verified production deployment; no PR convergence dispatch.');
              core.setOutput('verified_deploy', 'false');
              return;
            }
            core.setOutput('verified_deploy', 'true');

      - name: Führende PR-Convergence für alle offenen PRs auslösen
        if: steps.source.outputs.verified_deploy == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0 / Node 24
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'pr-decision-reconciler.yml',
              ref: 'main',
              inputs: { pr_number: '' },
            });
            core.info('Verified post-deploy event delegated to the single PR Decision Evidence Reconciler writer.');
