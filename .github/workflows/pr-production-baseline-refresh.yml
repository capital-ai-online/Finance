name: PR Production Baseline Auto-Refresh
run-name: >-
  ${{ github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'
      && format('main@{0} – Produktions-Baselines nach verifiziertem Deploy korrelieren', github.event.workflow_run.head_sha)
      || format('PR #{0} – Produktions-Baseline korrelieren und Governance revalidieren', github.event.workflow_run.pull_requests[0].number || 'N/A') }}

# Trusted default-branch writer:
# - PR Governance remains read-only and fail-closed.
# - The workflow source allowlist is defined by on.workflow_run.workflows; dynamic run-name labels are never identity.
# - The workflow reacts to either completed PR Governance or a successfully completed main CI run.
# - A main-CI trigger is accepted only when the exact main SHA also has a successful
#   "Deployment verifiziert / Render-Produktion" job and /healthz reports that same SHA.
# - Candidate code is checked out as data but never executed; all executed policy scripts come from main.
# - The updater may repair only explicitly allowlisted, deterministic PR-body shapes; otherwise it replaces only the canonical baseline block and is idempotent.
# - Baseline writes and first-attempt stale-baseline races are rebound to an exact completed
#   PR Governance run for the same PR/head/base. Race recovery is limited to run_attempt == 1,
#   so a real Governance failure cannot create an automatic rerun loop.
# Reviewed privileged completion trigger: exact source path/repository/event guards,
# trusted-main policy only, no PR code/artifacts/caches executed, isolated output.
# Regression coverage: scripts/pr/productionBaselineRefreshWorkflow.test.mjs.
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: ['PR Governance', 'CI']
    # completed remains primary. in_progress materializes a trusted fallback only for
    # re-run attempts, because requested is not emitted for re-runs.
    types: [in_progress, completed]

permissions: {}

concurrency:
  # Keep duplicate suppression within one source workflow only. PR Governance repair and
  # CI completion events intentionally use different groups so a completed CI run cannot
  # cancel an in-flight Governance baseline/template repair for the same PR.
  group: >-
    pr-production-baseline-${{ github.event.workflow_run.path }}-${{ github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && 'main-deploy' || github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  refresh-baseline:
    permissions:
      actions: write # Re-run exact-head/base PR Governance after a baseline update.
      contents: read # Read trusted policy and PR Git data; never push.
      pull-requests: write # Replace only the canonical production-baseline body block.
    name: Atomare Produktions-Baseline vertrauenswürdig nachziehen
    if: >-
      github.event.workflow_run.repository.full_name == github.repository &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.path == '.github/workflows/pr-governance.yml' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0].number != null &&
      (github.event.action == 'completed' ||
       (github.event.action == 'in_progress' && github.event.workflow_run.run_attempt > 1))
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Governance-Source-Run bis zum Abschluss exakt binden
        id: source
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0 / Node 24
        with:
          script: |
            const normalizeSha = (value) => String(value || '').trim().toLowerCase();
            const payloadRun = context.payload.workflow_run;
            const expectedId = Number(payloadRun.id);
            const expectedHead = normalizeSha(payloadRun.head_sha);
            const expectedPath = String(payloadRun.path || '');
            let sourceRun = payloadRun;

            if (context.payload.action === 'in_progress') {
              const deadline = Date.now() + 240_000;
              while (sourceRun.status !== 'completed' && Date.now() < deadline) {
                await new Promise((resolve) => setTimeout(resolve, 5_000));
                const { data } = await github.rest.actions.getWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: expectedId,
                });
                if (
                  Number(data.id) !== expectedId ||
                  normalizeSha(data.head_sha) !== expectedHead ||
                  String(data.path || '') !== expectedPath
                ) {
                  throw new Error('Governance-Source-Run-Identität änderte sich während des Re-Run-Fallbacks.');
                }
                sourceRun = data;
              }
            }

            if (sourceRun.status !== 'completed') {
              throw new Error(
                `Governance-Source-Run ${expectedId} wurde innerhalb des gebundenen Fallback-Fensters nicht abgeschlossen.`,
              );
            }

            core.setOutput('conclusion', String(sourceRun.conclusion || ''));
            core.setOutput('run_attempt', String(sourceRun.run_attempt || payloadRun.run_attempt || 1));
            core.notice(
              `Governance-Source-Run ${expectedId} gebunden: conclusion=${sourceRun.conclusion}, attempt=${sourceRun.run_attempt || payloadRun.run_attempt || 1}, trigger=${context.payload.action}.`,
            );

      - name: Vertrauenswürdigen Policy-Stand aus main auschecken
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0 / Node 24
        with:
          ref: main
          path: policy
          fetch-depth: 1
          persist-credentials: false

      - name: Exakten trusted-main SHA binden
        id: policy_main
        working-directory: policy
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Node.js einrichten
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0 / Node 24 action runtime
        with:
          node-version: '24.18.0'

      - name: Aktuellen PR-Snapshot für den Write-Pfad autorisieren
        id: pr
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0 / Node 24
        with:
          script: |
            const number = context.payload.workflow_run.pull_requests?.[0]?.number;
            if (!number) {
              core.setOutput('eligible', 'false');
              return;
            }

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: number,
            });

            const sameRepo = pr.head.repo?.full_name === `${context.repo.owner}/${context.repo.repo}`;
            const eligible = pr.state === 'open' && pr.base.ref === 'main' && sameRepo;

            core.info(
              `PR #${number}: state=${pr.state}, base=${pr.base.ref}, headRepo=${pr.head.repo?.full_name || 'missing'}, eligible=${eligible}`,
            );
            core.setOutput('eligible', eligible ? 'true' : 'false');
            core.setOutput('pr_number', String(number));
            core.setOutput('head_sha', pr.head.sha || '');

      - name: Kandidaten-Head ohne persistierte Zugangsdaten auschecken
        if: steps.pr.outputs.eligible == 'true'
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0 / Node 24
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Aktuellen main-Stand in Kandidaten-Repository importieren
        if: steps.pr.outputs.eligible == 'true'
        working-directory: candidate
        run: git fetch --no-tags ../policy main:refs/remotes/origin/main

      - name: Produktions-Baseline mit trusted-main Policy neu erzeugen
        if: steps.pr.outputs.eligible == 'true'
        working-directory: candidate
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          PR_BASE_REF: origin/main
          PR_HEAD_REF: HEAD
          PR_BASELINE_OUTPUT: ${{ runner.temp }}/production-baseline.json
          CAPITAL_AI_PRODUCTION_HEALTH_URL: https://capital-ai.online/healthz
        run: node ../policy/scripts/pr/productionPreflight.mjs

      - name: PR-Scope für deterministischen Template-Fix klassifizieren
        id: body_scope
        if: steps.pr.outputs.eligible == 'true' && steps.source.outputs.conclusion == 'failure'
        working-directory: candidate
        env:
          PR_BASE_SHA: ${{ steps.policy_main.outputs.sha }}
          PR_HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: node ../policy/scripts/pr/classifyPrScope.mjs

      - name: Fehlende kanonische PR-Abschnitte deterministisch reparieren
        id: body_repair
        if: steps.pr.outputs.eligible == 'true' && steps.source.outputs.conclusion == 'failure'
        working-directory: candidate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          EXPECTED_MAIN_SHA: ${{ steps.policy_main.outputs.sha }}
          PR_CHECK_CLASS: ${{ steps.body_scope.outputs.class }}
        run: node ../policy/scripts/pr/repairLegacyPrBodyStructure.mjs

      - name: Nur kanonischen Produktions-Baseline-Block aktualisieren
        id: refresh
        if: steps.pr.outputs.eligible == 'true'
        working-directory: candidate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          PR_BASELINE_OUTPUT: ${{ runner.temp }}/production-baseline.json
        run: node ../policy/scripts/pr/updatePrProductionBaseline.mjs

      - name: Baseline-/Template-Write oder Race-Recovery an exakte PR-Governance binden
        if: steps.pr.outputs.eligible == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0 / Node 24
        env:
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          EXPECTED_MAIN_SHA: ${{ steps.policy_main.outputs.sha }}
          BASELINE_CHANGED: ${{ steps.refresh.outputs.changed }}
          PR_BODY_REPAIRED: ${{ steps.body_repair.outputs.changed }}
          PR_BODY_REPAIR_ELIGIBLE: ${{ steps.body_repair.outputs.eligible }}
          PR_BODY_REPAIR_REASON: ${{ steps.body_repair.outputs.reason }}
          SOURCE_CONCLUSION: ${{ steps.source.outputs.conclusion }}
        with:
          script: |
            const normalizeSha = (value) => String(value || '').trim().toLowerCase();
            const fail = (message) => { throw new Error(message); };
            const prNumber = Number(process.env.PR_NUMBER);
            const expectedHeadSha = normalizeSha(process.env.EXPECTED_HEAD_SHA);
            const expectedMainSha = normalizeSha(process.env.EXPECTED_MAIN_SHA);
            const baselineChanged = String(process.env.BASELINE_CHANGED || '').toLowerCase() === 'true';
            const bodyRepaired = String(process.env.PR_BODY_REPAIRED || '').toLowerCase() === 'true';
            const bodyRepairEligible = String(process.env.PR_BODY_REPAIR_ELIGIBLE || '').toLowerCase() === 'true';
            const bodyRepairReason = String(process.env.PR_BODY_REPAIR_REASON || '').trim();
            const sourceConclusion = String(process.env.SOURCE_CONCLUSION || '').trim();
            const sourceRun = context.payload.workflow_run;

            if (!Number.isInteger(prNumber) || prNumber <= 0) fail('PR-Nummer für Governance-Re-Run ist ungültig.');
            if (!/^[0-9a-f]{40}$/.test(expectedHeadSha)) fail('Gebundener PR-Head-SHA ist ungültig.');
            if (!/^[0-9a-f]{40}$/.test(expectedMainSha)) fail('Gebundener main-SHA ist ungültig.');
            if (sourceRun.event !== 'pull_request') fail(`Unerwartetes Workflow-Run-Event: ${sourceRun.event}`);
            if (Number(sourceRun.pull_requests?.[0]?.number) !== prNumber) {
              fail('Triggering Workflow Run ist nicht an denselben Pull Request gebunden.');
            }

            const bodyAlreadyCanonical = bodyRepairReason === 'already-canonical';
            const bodyRepairBlocked =
              sourceConclusion === 'failure' &&
              !bodyRepaired &&
              !bodyAlreadyCanonical;
            if (bodyRepairBlocked) {
              fail(
                `PR #${prNumber}: PR-Body-Reparatur konnte nicht deterministisch konvergieren ` +
                `(eligible=${bodyRepairEligible}, reason=${bodyRepairReason || 'missing-repair-result'}). ` +
                'Governance bleibt fail-closed; der Body darf nicht als bereits korrekt gemeldet werden.',
              );
            }

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            const liveHeadSha = normalizeSha(pr.head?.sha);
            const sameRepo = pr.head?.repo?.full_name === `${context.repo.owner}/${context.repo.repo}`;
            if (pr.state !== 'open' || pr.base?.ref !== 'main' || !sameRepo) {
              fail('PR-Grenze änderte sich während der Baseline-Revalidierung; Governance wird nicht erneut gestartet.');
            }
            if (liveHeadSha !== expectedHeadSha) {
              fail(`PR-Head änderte sich während der Baseline-Revalidierung (${liveHeadSha.slice(0, 12)} != ${expectedHeadSha.slice(0, 12)}).`);
            }

            const { data: main } = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: 'main',
            });
            const liveMainSha = normalizeSha(main.commit?.sha);
            if (liveMainSha !== expectedMainSha) {
              fail(`main änderte sich während der Baseline-Revalidierung (${liveMainSha.slice(0, 12)} != ${expectedMainSha.slice(0, 12)}).`);
            }

            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              event: 'pull_request',
              head_sha: expectedHeadSha,
              status: 'completed',
              per_page: 100,
            });
            const exactRun = runs
              .filter((run) => run.path === '.github/workflows/pr-governance.yml')
              .filter((run) => (run.pull_requests || []).some((item) =>
                Number(item.number) === prNumber &&
                normalizeSha(item.head?.sha) === expectedHeadSha &&
                normalizeSha(item.base?.sha) === expectedMainSha))
              .sort((a, b) => Number(b.id) - Number(a.id))[0];

            if (!exactRun) {
              core.notice(
                `PR #${prNumber}: ${baselineChanged ? 'Baseline aktualisiert' : 'Baseline bereits korrekt'}, aber noch keine abgeschlossene exact-head/base Governance vorhanden; deren Completion-Event übernimmt die weitere Revalidierung.`,
              );
              return;
            }

            const firstFailedAttempt =
              exactRun.conclusion === 'failure' && Number(exactRun.run_attempt || 1) === 1;
            const shouldRerun = bodyRepaired || baselineChanged || firstFailedAttempt;

            if (!shouldRerun) {
              const bodyState = bodyAlreadyCanonical ? 'canonical' : 'repair-not-applicable';
              core.info(
                `PR #${prNumber}: Baseline unverändert; PR-Body-Status=${bodyState}; latest Governance ${exactRun.id} conclusion=${exactRun.conclusion} attempt=${exactRun.run_attempt || 1}; kein automatischer Re-Run.`,
              );
              return;
            }

            await github.request('POST /repos/{owner}/{repo}/actions/runs/{run_id}/rerun', {
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: exactRun.id,
            });
            core.notice(
              bodyRepaired
                ? `PR #${prNumber}: kanonische PR-Body-Struktur deterministisch repariert; exact-head/base Governance Run ${exactRun.id} wird erneut ausgeführt.`
                : baselineChanged
                  ? `PR #${prNumber}: Baseline-Write an exact-head/base Governance Run ${exactRun.id} gebunden; Governance wird erneut ausgeführt.`
                  : `PR #${prNumber}: Race-Recovery für bereits korrekte Baseline; fehlgeschlagener Governance Run ${exactRun.id} wird einmalig von attempt 1 erneut ausgeführt.`,
            );

      - name: Baseline-Status bestätigen
        if: steps.pr.outputs.eligible == 'true'
        run: echo "Baseline-Korrelation abgeschlossen; etwaige Governance-Revalidierung ist exact-head/base gebunden und gegen Rerun-Schleifen begrenzt."

      - name: Nicht autorisierten PR ohne Mutation überspringen
        if: steps.pr.outputs.eligible != 'true'
        run: echo "Kein offener same-repository PR gegen main; Baseline-Write bleibt deaktiviert."

  discover_post_deploy_prs:
    name: Verifiziertes Production/Main korrelieren und synchronisierte PRs bestimmen
    if: >-
      github.event.workflow_run.repository.full_name == github.repository &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.path == '.github/workflows/ci.yml' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success'
    permissions:
      actions: read
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.reconcile.outputs.matrix }}
      count: ${{ steps.reconcile.outputs.count }}
      main_sha: ${{ steps.reconcile.outputs.main_sha }}
      production_sha: ${{ steps.reconcile.outputs.production_sha }}

    steps:
      - name: Vertrauenswürdigen aktuellen main-Stand auschecken
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0 / Node 24
        with:
          ref: main
          path: policy
          fetch-depth: 1
          persist-credentials: false

      - name: Exakten aktuellen main-SHA binden
        id: policy_main
        working-directory: policy
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Production/Main/Deploy korrelieren und PR-Matrix bilden
        id: reconcile
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0 / Node 24
        env:
          TRUSTED_MAIN_SHA: ${{ steps.policy_main.outputs.sha }}
        with:
          script: |
            const normalizeSha = (value) => String(value || '').trim().toLowerCase();
            const fail = (message) => { throw new Error(message); };
            const sourceRun = context.payload.workflow_run;
            const mainSha = normalizeSha(process.env.TRUSTED_MAIN_SHA);
            const sourceHeadSha = normalizeSha(sourceRun.head_sha);

            if (!/^[0-9a-f]{40}$/.test(mainSha)) fail('Aktueller trusted-main SHA ist ungültig.');
            if (!/^[0-9a-f]{40}$/.test(sourceHeadSha)) fail('Triggering CI head_sha ist ungültig.');
            if (sourceRun.event !== 'push' || sourceRun.head_branch !== 'main') {
              fail('Post-Deploy-Reconciliation akzeptiert ausschließlich den CI push/main Pfad.');
            }
            if (sourceRun.conclusion !== 'success') fail(`Triggering CI ist nicht erfolgreich: ${sourceRun.conclusion}`);

            if (sourceHeadSha !== mainSha) {
              core.notice(
                `CI-Deploy ${sourceHeadSha.slice(0, 12)} ist nicht mehr aktueller main ${mainSha.slice(0, 12)}; keine PR-Baseline wird aus einem überholten Deploy-Event geschrieben.`,
              );
              core.setOutput('matrix', JSON.stringify({ include: [] }));
              core.setOutput('count', '0');
              core.setOutput('main_sha', mainSha);
              core.setOutput('production_sha', 'stale-source-run');
              return;
            }

            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: sourceRun.id,
              per_page: 100,
            });
            const deployJob = jobs.find((job) => job.name === 'Deployment verifiziert / Render-Produktion');
            if (!deployJob || deployJob.status !== 'completed' || deployJob.conclusion !== 'success') {
              fail('Triggering main-CI besitzt keinen erfolgreich abgeschlossenen verifizierten Produktions-Deploy-Job.');
            }

            const healthResponse = await fetch('https://capital-ai.online/healthz', {
              headers: { Accept: 'application/json' },
              signal: AbortSignal.timeout(15_000),
            });
            if (!healthResponse.ok) fail(`Production /healthz antwortet mit HTTP ${healthResponse.status}.`);
            const health = await healthResponse.json();
            if (health?.status !== 'ok') fail(`Production /healthz meldet status=${String(health?.status)}.`);

            const payloadSha = normalizeSha(health?.deployment?.commitSha);
            const headerSha = normalizeSha(healthResponse.headers.get('x-capital-ai-commit'));
            if (payloadSha && headerSha && payloadSha !== headerSha) {
              fail(`Production-Identität widerspricht sich zwischen JSON und Header (${payloadSha} != ${headerSha}).`);
            }
            const productionSha = payloadSha || headerSha;
            if (!/^[0-9a-f]{40}$/.test(productionSha)) fail('Production /healthz liefert keinen gültigen immutable Commit-SHA.');
            if (productionSha !== mainSha || productionSha !== sourceHeadSha) {
              fail(
                `Post-Deploy-Korrelation fehlgeschlagen: production=${productionSha.slice(0, 12)}, main=${mainSha.slice(0, 12)}, source=${sourceHeadSha.slice(0, 12)}.`,
              );
            }

            const pulls = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              base: 'main',
              per_page: 100,
            });

            const include = [];
            const skipped = [];
            for (const pr of pulls) {
              const sameRepo = pr.head?.repo?.full_name === `${context.repo.owner}/${context.repo.repo}`;
              const headSha = normalizeSha(pr.head?.sha);
              if (!sameRepo || !/^[0-9a-f]{40}$/.test(headSha)) {
                skipped.push(`#${pr.number}:cross-repo-or-invalid-head`);
                continue;
              }

              const compare = await github.request('GET /repos/{owner}/{repo}/compare/{basehead}', {
                owner: context.repo.owner,
                repo: context.repo.repo,
                basehead: `${mainSha}...${headSha}`,
              });
              const containsMain = compare.data.status === 'ahead' || compare.data.status === 'identical';
              if (!containsMain) {
                skipped.push(`#${pr.number}:not-synced(${compare.data.status})`);
                continue;
              }

              include.push({
                pr_number: Number(pr.number),
                head_sha: headSha,
                base_sha: mainSha,
              });
            }

            core.setOutput('matrix', JSON.stringify({ include }));
            core.setOutput('count', String(include.length));
            core.setOutput('main_sha', mainSha);
            core.setOutput('production_sha', productionSha);
            core.notice(
              `Post-Deploy-Korrelation PASS: production=main=${mainSha.slice(0, 12)}; ${include.length} synchronisierte offene PR(s), ${skipped.length} fail-closed übersprungen.`,
            );
            await core.summary
              .addHeading('Production/Main/PR Korrelation')
              .addRaw(`Production = main = \`${mainSha}\`. Synchronisierte PRs: ${include.length}. Übersprungen: ${skipped.length ? skipped.join(', ') : 'keine'}.`)
              .write();

  refresh_post_deploy_baselines:
    permissions:
      actions: write # Re-run exact-head/base PR Governance after a baseline update.
      contents: read # Read trusted policy and PR Git data; never push.
      pull-requests: write # Replace only the canonical production-baseline body block.
    name: PR #${{ matrix.pr_number }} nach verifiziertem Production-Deploy nachziehen
    needs: discover_post_deploy_prs
    if: ${{ needs.discover_post_deploy_prs.result == 'success' && needs.discover_post_deploy_prs.outputs.count != '0' }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.discover_post_deploy_prs.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Gebundenen trusted-main Policy-Stand auschecken
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0 / Node 24
        with:
          ref: ${{ matrix.base_sha }}
          path: policy
          fetch-depth: 1
          persist-credentials: false

      - name: Exakten Kandidaten-Head ohne persistierte Zugangsdaten auschecken
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0 / Node 24
        with:
          ref: ${{ matrix.head_sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Gebundenen main-Stand in Kandidaten-Repository importieren
        working-directory: candidate
        env:
          EXPECTED_MAIN_SHA: ${{ matrix.base_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags ../policy "$EXPECTED_MAIN_SHA:refs/remotes/origin/main"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN_SHA"
          git merge-base --is-ancestor "$EXPECTED_MAIN_SHA" HEAD

      - name: Node.js einrichten
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0 / Node 24 action runtime
        with:
          node-version: '24.18.0'

      - name: Produktions-Baseline mit gebundener trusted-main Policy neu erzeugen
        working-directory: candidate
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ matrix.pr_number }}
          PR_BASE_REF: origin/main
          PR_HEAD_REF: HEAD
          PR_BASELINE_OUTPUT: ${{ runner.temp }}/production-baseline.json
          CAPITAL_AI_PRODUCTION_HEALTH_URL: https://capital-ai.online/healthz
        run: node ../policy/scripts/pr/productionPreflight.mjs

      - name: Nur kanonischen Produktions-Baseline-Block aktualisieren
        id: refresh
        working-directory: candidate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ matrix.pr_number }}
          PR_BASELINE_OUTPUT: ${{ runner.temp }}/production-baseline.json
        run: node ../policy/scripts/pr/updatePrProductionBaseline.mjs

      - name: Geänderte Baseline an exakte vorhandene PR-Governance binden und erneut ausführen
        if: steps.refresh.outputs.changed == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0 / Node 24
        env:
          PR_NUMBER: ${{ matrix.pr_number }}
          EXPECTED_HEAD_SHA: ${{ matrix.head_sha }}
          EXPECTED_MAIN_SHA: ${{ matrix.base_sha }}
        with:
          script: |
            const normalizeSha = (value) => String(value || '').trim().toLowerCase();
            const fail = (message) => { throw new Error(message); };
            const prNumber = Number(process.env.PR_NUMBER);
            const expectedHeadSha = normalizeSha(process.env.EXPECTED_HEAD_SHA);
            const expectedMainSha = normalizeSha(process.env.EXPECTED_MAIN_SHA);

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            const sameRepo = pr.head?.repo?.full_name === `${context.repo.owner}/${context.repo.repo}`;
            if (pr.state !== 'open' || pr.base?.ref !== 'main' || !sameRepo) {
              fail(`PR #${prNumber} verließ die erlaubte open/same-repo/main-Grenze nach dem Baseline-Write.`);
            }
            if (normalizeSha(pr.head?.sha) !== expectedHeadSha) {
              fail(`PR #${prNumber} Head änderte sich nach dem Baseline-Write.`);
            }

            const { data: main } = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: 'main',
            });
            if (normalizeSha(main.commit?.sha) !== expectedMainSha) {
              fail(`main änderte sich nach dem Baseline-Write für PR #${prNumber}; Governance-Re-Run wird verweigert.`);
            }

            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              event: 'pull_request',
              head_sha: expectedHeadSha,
              status: 'completed',
              per_page: 100,
            });
            const exactRun = runs
              .filter((run) => run.path === '.github/workflows/pr-governance.yml')
              .filter((run) => (run.pull_requests || []).some((item) =>
                Number(item.number) === prNumber &&
                normalizeSha(item.head?.sha) === expectedHeadSha &&
                normalizeSha(item.base?.sha) === expectedMainSha))
              .sort((a, b) => Number(b.id) - Number(a.id))[0];

            if (!exactRun) {
              fail(`Keine abgeschlossene PR-Governance für PR #${prNumber} auf exakt head/base ${expectedHeadSha.slice(0, 12)}/${expectedMainSha.slice(0, 12)} gefunden.`);
            }

            await github.request('POST /repos/{owner}/{repo}/actions/runs/{run_id}/rerun', {
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: exactRun.id,
            });
            core.notice(
              `PR #${prNumber}: Post-Deploy-Baseline aktualisiert; exact-head/base Governance Run ${exactRun.id} wird erneut ausgeführt.`,
            );

      - name: Unveränderte Post-Deploy-Baseline bestätigen
        if: steps.refresh.outputs.changed != 'true'
        env:
          BASELINE_PR_NUMBER: ${{ matrix.pr_number }}
        run: echo "PR #$BASELINE_PR_NUMBER Baseline bereits korrekt; kein Body-Write und kein Governance-Re-Run."
