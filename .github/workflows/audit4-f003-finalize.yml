name: AUD4 F003 Finalize

on:
  push:
    branches:
      - feature/audit4-enterprise-hardening-next

permissions:
  contents: write

jobs:
  remediate:
    if: "!contains(github.event.head_commit.message, 'finalize AUD4-F-003 code remediation')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/audit4-enterprise-hardening-next
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply targeted fail-closed transformations
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          dashboard = Path('src/components/Dashboard.tsx')
          text = dashboard.read_text()
          old = """  // Testauslösung Helper
  const handleTriggerTestScoreEvent = (symbol: string, type: 'crash' | 'rally') => {
    // Look up asset name or fallback
    const mockNames: Record<string, string> = {
      BTC: 'Bitcoin', ETH: 'Ethereum', TSLA: 'Tesla Inc.', AAPL: 'Apple Inc.', EURUSD: 'Euro / US Dollar', GLD: 'Gold Spot'
    };
    const name = mockNames[symbol] || symbol;
    
    const isRally = type === 'rally';
    const score = isRally ? Number((7.1 + Math.random() * 2.5).toFixed(1)) : Number((1.2 + Math.random() * 1.5).toFixed(1));
    const oldScore = isRally ? Number((5.5 + Math.random() * 1.2).toFixed(1)) : Number((4.5 + Math.random() * 1.5).toFixed(1));
    const headline = isRally 
      ? `📈 EILMELDUNG: Gewaltiger Momentum-Schub bei ${symbol}! Algorithmen melden Bullish Breakout.`
      : `📉 WARNUNG: Starker Abwärtsdruck auf ${symbol}! Liquidations-Welle drückt Score in kritischen Bereich.`;
    
    triggerPushNotification({
      symbol,
      name,
      score,
      oldScore,
      headline,
      sentiment: isRally ? 'bullish' : 'bearish',
      impact: 'high',
      isOnWatchlist: watchlist.includes(symbol),
      type: 'crypto'
    });
  };
"""
          new = """  // ARCH-AUDIT-0004 / AUD4-F-003: produktive Test-Score-Fabrikation ist deaktiviert.
  // Testevents dürfen keine erfundenen Finanzscores oder Marktbewegungen erzeugen.
  const handleTriggerTestScoreEvent = (_symbol: string, _type: 'crash' | 'rally') => {
    console.warn('Synthetic score test events are disabled in production. Use verified screening evidence instead.');
  };
"""
          if old not in text:
              raise SystemExit('Dashboard target block not found')
          dashboard.write_text(text.replace(old, new, 1))

          charts = Path('src/components/Charts.tsx')
          text = charts.read_text()
          old_volume = """      // Simulate realistic daily trading volume based on price changes
      const priceDiffRatio = i > 0 ? Math.abs((closes[i] - closes[i - 1]) / closes[i - 1]) : 0.01;
      const baseVol = activeSymbol === 'BTC' ? 8000 : activeSymbol === 'ETH' ? 4000 : 250;
      const simulatedVol = baseVol * (1 + priceDiffRatio * 15) * (0.8 + Math.random() * 0.4);

"""
          if old_volume not in text:
              raise SystemExit('Charts volume block not found')
          text = text.replace(old_volume, """      // AUD4-F-003: keine erfundene Trading-Volume-Evidence.
      // Die History-API liefert derzeit nur belegte Close-Werte; Volume bleibt daher undefined.

""", 1)
          text = text.replace("        volume: Number(simulatedVol.toFixed(1))", "        volume: undefined", 1)

          old_fallback = """          .catch(err => {
            console.error('Error fetching charts scoring:', err);
            // Fallback score
            setScoreResult({
              symbol: activeSymbol,
              score: activeSymbol === 'BTC' ? 8.5 : 6.2,
              recommendation: activeSymbol === 'BTC' ? 'BUY (BULLISH ENGULFING)' : 'HOLD',
              rsiSignal: 'Neutral',
              maSignal: 'Neutral',
              summary: 'KI-Schnittstelle temporär im Fallback-Modus. Die Chartindikatoren deuten auf ein stabiles Niveau hin.',
              timestamp: new Date().toISOString()
            });
            setIsScoring(false);
          });
"""
          new_fallback = """          .catch(err => {
            console.error('Error fetching charts scoring:', err);
            // Fail closed: kein Ersatzscore, keine erfundene Empfehlung.
            setScoreResult(null);
            setIsScoring(false);
          });
"""
          if old_fallback not in text:
              raise SystemExit('Charts scoring fallback block not found')
          charts.write_text(text.replace(old_fallback, new_fallback, 1))
          PY
      - name: Commit remediation
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No remediation changes required"
            exit 0
          fi
          git config user.name "capital-ai-ci"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/Dashboard.tsx src/components/Charts.tsx
          git commit -m "fix: finalize AUD4-F-003 code remediation"
          git push origin HEAD:feature/audit4-enterprise-hardening-next
