name: IONOS DNS Administration
run-name: IONOS DNS ${{ inputs.action }} – ${{ inputs.zone }}

on:
  workflow_dispatch:
    inputs:
      action:
        description: read = live zone, plan = dry-run diff, apply = exact owner-approved plan
        required: true
        type: choice
        default: read
        options:
          - read
          - plan
          - apply
      zone:
        description: Managed IONOS DNS zone
        required: true
        default: capital-ai.online
        type: string
      plan_sha256:
        description: Required for apply; copy the exact sha256 value from a preceding plan run
        required: false
        type: string
      confirmation:
        description: Required for apply; must equal APPLY capital-ai.online
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ionos-dns-production-${{ inputs.zone }}
  cancel-in-progress: false

jobs:
  dns-admin:
    name: Read / plan / owner-gated DNS apply
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: dns-production

    steps:
      - name: Checkout trusted main without persisted credentials
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Configure pinned Node.js runtime
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.18.0

      - name: Validate trusted invocation boundary
        shell: bash
        env:
          DNS_ACTION: ${{ inputs.action }}
          DNS_ZONE: ${{ inputs.zone }}
          DNS_PLAN_SHA256: ${{ inputs.plan_sha256 }}
          DNS_CONFIRMATION: ${{ inputs.confirmation }}
          OWNER_ACTOR: SvenKulessa
          CURRENT_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "SvenKulessa/Finance"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$DNS_ZONE" = "capital-ai.online"
          case "$DNS_ACTION" in
            read|plan) ;;
            apply)
              test "$CURRENT_ACTOR" = "$OWNER_ACTOR"
              test "$DNS_CONFIRMATION" = "APPLY capital-ai.online"
              [[ "$DNS_PLAN_SHA256" =~ ^sha256:[a-f0-9]{64}$ ]]
              ;;
            *) exit 1 ;;
          esac

      - name: Execute IONOS DNS action
        id: dns
        shell: bash
        env:
          IONOS_DNS_API_KEY: ${{ secrets.IONOS_DNS_API_KEY }}
          DNS_ACTION: ${{ inputs.action }}
          DNS_ZONE: ${{ inputs.zone }}
          DNS_PLAN_SHA256: ${{ inputs.plan_sha256 }}
          DNS_CONFIRMATION: ${{ inputs.confirmation }}
          DNS_ACTOR: ${{ github.actor }}
          DNS_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          test -n "$IONOS_DNS_API_KEY"
          args=(
            --action "$DNS_ACTION"
            --zone "$DNS_ZONE"
            --desired config/dns/ionos-capital-ai.desired.json
            --actor "$DNS_ACTOR"
            --ref "$DNS_REF"
            --json
          )
          if [ "$DNS_ACTION" = "apply" ]; then
            args+=(--plan-sha256 "$DNS_PLAN_SHA256" --confirmation "$DNS_CONFIRMATION")
          fi
          node scripts/systemadmin/ionosDnsAdmin.mjs "${args[@]}" > ionos-dns-result.json
          cat ionos-dns-result.json

      - name: Publish sanitized execution summary
        if: always()
        shell: bash
        run: |
          {
            echo '## IONOS DNS Administration'
            echo
            echo "- Repository: \`$GITHUB_REPOSITORY\`"
            echo "- Ref: \`$GITHUB_REF\`"
            echo "- Actor: \`$GITHUB_ACTOR\`"
            echo "- Action: \`${{ inputs.action }}\`"
            if [ -f ionos-dns-result.json ]; then
              echo
              echo '```json'
              cat ionos-dns-result.json
              echo '```'
            else
              echo
              echo 'Execution stopped before a result artifact was produced.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
