name: SLO Propagate Once
on:
  push:
    branches: [feature/audit4-final-screening-hardening]
permissions:
  contents: write
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, 'propagate SLO evidence into bulk screening')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/audit4-final-screening-hardening
      - name: Patch registry route
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/features/registry/registryRoutes.ts')
          t=p.read_text()
          a="import { evaluateScreeningEligibility } from '../../services/screeningEligibility';\n"
          b=a+"import { buildScreeningOperationsReport } from '../../services/screeningOperations';\nimport { buildScreeningSlaReport } from '../../services/screeningSla';\nimport { buildScreeningSloEvidenceRecord } from '../../services/screeningSloEvidence';\nimport { getMarketDataProviderTelemetry } from '../../services/marketDataProviderRouter';\n"
          if a not in t: raise SystemExit('import anchor missing')
          t=t.replace(a,b,1)
          old="""  const evaluations = await Promise.all(symbols.map(symbol => evaluateVerifiedTraditionalSymbol(symbol, `${rootCorrelationId}:${symbol}`)));
  const results = evaluations.map(item => {
    const providers = Array.isArray(item.payload.providers) ? item.payload.providers.filter((v): v is string => typeof v === 'string') : [];
    const evidenceIds = Array.isArray(item.payload.evidenceIds) ? item.payload.evidenceIds.filter((v): v is string => typeof v === 'string') : [];
    const score = typeof item.payload.score === 'number' && Number.isFinite(item.payload.score) ? item.payload.score : null;
    const scoreStatus = typeof item.payload.status === 'string' ? item.payload.status : 'SCORE_NOT_COMPUTABLE';
    const eligibility = evaluateScreeningEligibility({
      scoreStatus,
      score,
      providers,
      evidenceIds,
      observedAt: latestObservedAt(item.payload),
      minimumEvidence: 1,
      minimumProviders: 1,
    });
    return { httpStatus: item.httpStatus, ...item.payload, screeningEligibility: eligibility };
  });
"""
          new="""  const evaluations = await Promise.all(symbols.map(symbol => evaluateVerifiedTraditionalSymbol(symbol, `${rootCorrelationId}:${symbol}`)));
  const screeningSla = buildScreeningSlaReport(getMarketDataProviderTelemetry());
  const results = evaluations.map(item => {
    const providers = Array.isArray(item.payload.providers) ? item.payload.providers.filter((v): v is string => typeof v === 'string') : [];
    const evidenceIds = Array.isArray(item.payload.evidenceIds) ? item.payload.evidenceIds.filter((v): v is string => typeof v === 'string') : [];
    const score = typeof item.payload.score === 'number' && Number.isFinite(item.payload.score) ? item.payload.score : null;
    const scoreStatus = typeof item.payload.status === 'string' ? item.payload.status : 'SCORE_NOT_COMPUTABLE';
    const observedAt = latestObservedAt(item.payload);
    const eligibility = evaluateScreeningEligibility({ scoreStatus, score, providers, evidenceIds, observedAt, minimumEvidence: 1, minimumProviders: 1 });
    const screeningOperations = buildScreeningOperationsReport({ eligibility, sla: screeningSla });
    const itemCorrelationId = typeof item.payload.correlationId === 'string' ? item.payload.correlationId : rootCorrelationId;
    const itemSymbol = typeof item.payload.symbol === 'string' ? item.payload.symbol : undefined;
    const itemAssetClass = typeof item.payload.assetType === 'string' ? item.payload.assetType : undefined;
    const screeningSloEvidence = buildScreeningSloEvidenceRecord({ correlationId: itemCorrelationId, report: screeningOperations, symbol: itemSymbol, assetClass: itemAssetClass });
    return { httpStatus: item.httpStatus, ...item.payload, screeningEligibility: eligibility, screeningOperations, screeningSloEvidence };
  });
"""
          if old not in t: raise SystemExit('bulk block missing')
          t=t.replace(old,new,1)
          old2="""    eligibilityContractVersion: 'screening-eligibility/1.0.0',
    results,
"""
          new2="""    eligibilityContractVersion: 'screening-eligibility/1.0.0',
    screeningOperationsContractVersion: 'screening-operations/1.0.0',
    screeningSloEvidenceContractVersion: 'screening-slo-evidence/1.0.0',
    providerSlaState: screeningSla.state,
    results,
"""
          if old2 not in t: raise SystemExit('summary anchor missing')
          p.write_text(t.replace(old2,new2,1))
          PY
      - name: Commit
        run: |
          git config user.name capital-ai-ci
          git config user.email actions@users.noreply.github.com
          git add src/features/registry/registryRoutes.ts
          git commit -m "feat: propagate SLO evidence into bulk screening"
          git push origin HEAD:feature/audit4-final-screening-hardening
