name: Google-Marketing-Schutzprüfung
run-name: >-
  ${{ github.event_name == 'pull_request'
      && format('PR #{0} – Google-Marketing-Schutzprüfung', github.event.pull_request.number)
      || 'Google-Marketing-Schutzprüfung' }}

on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'public/cookiehub-init.js'
      - 'public/google-analytics-consent.js'
      - 'server/securityResponse.ts'
      - 'server/logger.ts'
      - 'src/platform/Security/**'
      - 'scripts/security/verifyGoogleMarketingInvariants.ts'
      - 'tests/unit/googleMarketingConsent.test.ts'
      - 'tests/unit/securityResponse.test.ts'
      - 'tests/unit/securityResponse.production.test.ts'
      - '.github/workflows/google-marketing-protected-change.yml'
      - '.github/CODEOWNERS'
      - '.dockerignore'
      - 'CLAUDE.md'
      - '.ai/skills/ESS-0014-*'
      - '.ai/registry/ess-registry.json'
      - 'docs/adr/ADR-0035-*'
      - 'docs/adr/ADR-0040-*'
      - 'docs/adr/ADR-0042-*'
      - 'docs/architecture/CAPITAL_AI_GOOGLE_MARKETING_MCP_ARCHITECTURE.md'
      - 'docs/runbooks/GOOGLE_ANALYTICS_SETUP.md'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'public/cookiehub-init.js'
      - 'public/google-analytics-consent.js'
      - 'server/securityResponse.ts'
      - 'server/logger.ts'
      - 'src/platform/Security/**'
      - 'scripts/security/verifyGoogleMarketingInvariants.ts'
      - 'tests/unit/googleMarketingConsent.test.ts'
      - 'tests/unit/securityResponse.test.ts'
      - 'tests/unit/securityResponse.production.test.ts'
      - '.github/workflows/google-marketing-protected-change.yml'
      - '.github/CODEOWNERS'
      - '.dockerignore'
      - 'CLAUDE.md'
      - '.ai/skills/ESS-0014-*'
      - '.ai/registry/ess-registry.json'
      - 'docs/adr/ADR-0035-*'
      - 'docs/adr/ADR-0040-*'
      - 'docs/adr/ADR-0042-*'
      - 'docs/architecture/CAPITAL_AI_GOOGLE_MARKETING_MCP_ARCHITECTURE.md'
      - 'docs/runbooks/GOOGLE_ANALYTICS_SETUP.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: google-marketing-guard-${{ github.ref }}
  cancel-in-progress: true

# Die vollständige technische Validierung liegt ausschließlich in ci.yml.
# Dieser spezialisierte Guard darf keine zweite npm-ci/Test/Build-Pipeline erzeugen.
jobs:
  protected-change-guard:
    name: Geschützte Marketing-Konfiguration prüfen
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Quellcode ohne persistierte Zugangsdaten auschecken
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Schutzvertrag und zentrale CI-Evidence statisch prüfen
        shell: bash
        run: |
          set -euo pipefail
          grep -Fxq '.github/*' .dockerignore
          grep -Fxq '!.github/workflows/' .dockerignore
          grep -Fxq '.github/workflows/*' .dockerignore
          grep -Fxq '!.github/workflows/google-marketing-protected-change.yml' .dockerignore
          grep -Fq 'verifyGoogleMarketingInvariants.ts' package.json
          grep -Fq 'tests/unit/securityResponse.production.test.ts' .github/workflows/ci.yml
          grep -Fq 'npm run predeploy:check' .github/workflows/ci.yml
