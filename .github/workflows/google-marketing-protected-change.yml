name: Google Marketing Protected Change Guard

on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'public/cookiehub-init.js'
      - 'public/google-analytics-consent.js'
      - 'server/securityResponse.ts'
      - 'server/logger.ts'
      - 'src/platform/Security/**'
      - 'scripts/security/verifyGoogleMarketingInvariants.ts'
      - 'tests/unit/securityResponse.test.ts'
      - 'tests/unit/securityResponse.production.test.ts'
      - '.github/workflows/google-marketing-protected-change.yml'
      - '.github/CODEOWNERS'
      - 'CLAUDE.md'
      - '.ai/skills/ESS-0014-*'
      - '.ai/registry/ess-registry.json'
      - 'docs/adr/ADR-0035-*'
      - 'docs/adr/ADR-0040-*'
      - 'docs/architecture/CAPITAL_AI_GOOGLE_MARKETING_MCP_ARCHITECTURE.md'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'public/cookiehub-init.js'
      - 'public/google-analytics-consent.js'
      - 'server/securityResponse.ts'
      - 'server/logger.ts'
      - 'src/platform/Security/**'
      - 'scripts/security/verifyGoogleMarketingInvariants.ts'
      - 'tests/unit/securityResponse.test.ts'
      - 'tests/unit/securityResponse.production.test.ts'
      - '.github/workflows/google-marketing-protected-change.yml'
      - '.github/CODEOWNERS'
      - 'CLAUDE.md'
      - '.ai/skills/ESS-0014-*'
      - '.ai/registry/ess-registry.json'
      - 'docs/adr/ADR-0035-*'
      - 'docs/adr/ADR-0040-*'
      - 'docs/architecture/CAPITAL_AI_GOOGLE_MARKETING_MCP_ARCHITECTURE.md'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: google-marketing-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protected-change-guard:
    name: Protected Marketing Guard
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify protected invariants
        run: npx tsx scripts/security/verifyGoogleMarketingInvariants.ts

      - name: Test CSP policy and nonce modes
        run: npx vitest run tests/unit/securityResponse.test.ts

      - name: Type check
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Test built SPA CSP delivery path
        env:
          NODE_ENV: production
          CSP_MODE: report-only
        run: npx vitest run tests/unit/securityResponse.production.test.ts
