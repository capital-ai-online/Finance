name: Google-Marketing-Schutzprüfung
run-name: Manuelle Google-Marketing-Schutzdiagnose

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: google-marketing-guard-manual-${{ github.ref }}
  cancel-in-progress: true

# S5 Cost-Control:
# - Der automatische PR-/main-Runner ist stillgelegt, um die GitHub-Minutenrundung für einen
#   wenige Sekunden langen statischen Guard zu vermeiden.
# - Für Pull Requests läuft dieselbe Schutzverdrahtung im bereits allokierten pr-governance Runner.
# - Die vollständige technische Google-Marketing-Validierung bleibt zentral in ci.yml / npm build /
#   predeploy:check. Dieser Workflow ist nur noch ein manueller Diagnose-Fallback.
jobs:
  protected-change-guard:
    name: Geschützte Marketing-Konfiguration manuell prüfen
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Quellcode ohne persistierte Zugangsdaten auschecken
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Schutzvertrag und zentrale CI-Evidence statisch prüfen
        run: node scripts/security/verifyGoogleMarketingProtectedWiring.mjs --force
