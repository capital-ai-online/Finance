name: Agenten-PR-Branches synchronisieren
run-name: >-
  ${{ github.event_name == 'pull_request'
      && format('Agenten-PR #{0} bei Review-Bereitschaft mit main synchronisieren', github.event.pull_request.number)
      || github.event_name == 'workflow_run'
      && format('Post-Merge-Korrelation @{0} – nächsten Agenten-PR freigeben', github.event.workflow_run.head_sha)
      || 'Agenten-PR-Branches manuell mit main synchronisieren' }}

# ADR-0036 / productionPreflight.mjs requires the current main commit to be an ancestor of a
# merge-ready PR head. That invariant remains strict. Automatic synchronization is sequenced behind
# the trusted post-merge Production/Main correlation so PR checks do not race ahead of correlation:
# - successful Post-Merge Production Correlation: sync exactly one next eligible review-ready PR;
# - ready_for_review: sync exactly the PR that just left draft state;
# - approved review: perform the mandatory immediately-before-merge current-main synchronization for that exact PR;
# - workflow_dispatch: explicit recovery/maintenance path that may sync drafts as well.
#
# Trusted work branches are same-repository PRs against main and either:
# - active provider prefixes agent/*, claude/*, grok/*, ai/*; or
# - conventional work prefixes created by the repository owner (feat/fix/hotfix/chore/refactor/docs/test/perf/security).
# This covers ChatGPT-created conventional branches without treating a collaborator-chosen generic prefix as agent identity.
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: ['Post-Merge Production Correlation']
    types: [completed]
    branches: [main]
  pull_request:
    branches: [main]
    types: [ready_for_review]
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Optional exact open same-repository PR number. Empty keeps the manual all-PR maintenance lane.
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  # Exact PR events and exact workflow-dispatch requests share the canonical PR writer lease.
  # Post-correlation and intentionally unscoped manual maintenance remain globally serialized.
  group: >-
    ${{ github.event_name == 'pull_request'
        && format('capital-ai-pr-writer-{0}', github.event.pull_request.number)
        || github.event_name == 'workflow_dispatch' && inputs.pr_number != ''
        && format('capital-ai-pr-writer-{0}', inputs.pr_number)
        || 'capital-ai-post-merge-continuation-main' }}
  cancel-in-progress: false

jobs:
  sync-branches:
    name: Agenten-PRs kontrolliert auf main aktualisieren
    # The privileged workflow_run lane accepts only the exact trusted default-branch correlation.
    # Fork ready_for_review events never receive a write-capable runner.
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.repository.full_name == github.repository &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.path == '.github/workflows/post-merge-production-correlation.yml' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.conclusion == 'success') ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'pull_request_review' &&
       github.event.review.state == 'approved' &&
       github.event.pull_request.base.ref == 'main' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Trusted-main Convergence-Policy auschecken
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0 / Node 24
        with:
          ref: main
          path: policy
          fetch-depth: 1
          persist-credentials: false

      - name: Node.js für kanonische PR-Generation einrichten
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24.18.0'

      - name: GitHub-App-Token für automatischen Post-Korrelations-Sync erzeugen
        id: app_token
        if: github.event_name == 'workflow_run' || github.event_name == 'pull_request_review' || (github.event_name == 'workflow_dispatch' && inputs.pr_number != '')
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.CAPITAL_AI_GITHUB_APP_CLIENT_ID }}
          private-key: ${{ secrets.CAPITAL_AI_GITHUB_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Review-bereite Agenten-PRs per Update-Branch-API synchronisieren
        env:
          GH_TOKEN: ${{ (github.event_name == 'workflow_run' || github.event_name == 'pull_request_review' || (github.event_name == 'workflow_dispatch' && inputs.pr_number != '')) && steps.app_token.outputs.token || github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          DISPATCH_PR_NUMBER: ${{ inputs.pr_number }}
          SOURCE_MAIN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = 'pull_request' ] || [ "$EVENT_NAME" = 'pull_request_review' ]; then
            # ready_for_review is a single-PR transition. Keep the operation scoped to that PR.
            prs="$(gh pr view "$EVENT_PR_NUMBER" --repo "$REPO" \
              --json number,headRefName,headRefOid,baseRefName,isCrossRepository,isDraft,author \
              | jq -c '[.]')"
          else
            prs="$(gh pr list --repo "$REPO" --state open \
              --json number,headRefName,headRefOid,baseRefName,isCrossRepository,isDraft,author \
              --limit 200)"
          fi

          current_main_sha="$(gh api "repos/$REPO/branches/main" --jq '.commit.sha')"
          policy_main_sha="$(git -C policy rev-parse HEAD)"
          if ! printf '%s' "$current_main_sha" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "CURRENT_MAIN liefert keinen gueltigen SHA." >&2
            exit 1
          fi
          if [ "$policy_main_sha" != "$current_main_sha" ]; then
            echo "Trusted-main Policy ist stale: policy=$policy_main_sha current_main=$current_main_sha" >&2
            exit 1
          fi

          if [ "$EVENT_NAME" = 'workflow_run' ]; then
            if ! printf '%s' "$SOURCE_MAIN_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
              echo "Post-Merge-Korrelation liefert keinen gueltigen Source-main-SHA." >&2
              exit 1
            fi
            if [ "$current_main_sha" != "$SOURCE_MAIN_SHA" ]; then
              echo "Korrelations-Run fuer $SOURCE_MAIN_SHA ist stale; CURRENT_MAIN ist $current_main_sha. Kein PR wird synchronisiert."
              exit 0
            fi
            prs="$(echo "$prs" | jq -c 'sort_by(.number)')"
          fi

          generation_for() {
            local number="$1" head_sha="$2" main_sha="$3"
            local output="$RUNNER_TEMP/pr-generation-$number.out"
            : > "$output"
            REPOSITORY="$REPO" PR_NUMBER="$number" HEAD_SHA="$head_sha" BASE_SHA="$main_sha" \
              CURRENT_MAIN_SHA="$main_sha" AGENTS_PATH="policy/AGENTS.md" GITHUB_OUTPUT="$output" \
              node policy/scripts/pr/prConvergenceGeneration.mjs >/dev/null
            sed -n 's/^generation_id=//p' "$output" | tail -n 1
          }

          count="$(echo "$prs" | jq 'length')"
          repo_owner="${REPO%%/*}"
          echo "Zu bewertende PRs: $count (event=$EVENT_NAME, repo_owner=$repo_owner)"

          while read -r pr; do
            number="$(echo "$pr" | jq -r '.number')"
            head="$(echo "$pr" | jq -r '.headRefName')"
            head_sha="$(echo "$pr" | jq -r '.headRefOid')"
            base="$(echo "$pr" | jq -r '.baseRefName')"
            cross="$(echo "$pr" | jq -r '.isCrossRepository')"
            draft="$(echo "$pr" | jq -r '.isDraft')"
            author="$(echo "$pr" | jq -r '.author.login // ""')"

            if [ "$base" != 'main' ]; then
              echo "PR #$number ($head): Base ist $base statt main, uebersprungen."
              continue
            fi

            if [ "$cross" = 'true' ]; then
              echo "PR #$number ($head): Fork-PR, kein Auto-Sync moeglich."
              continue
            fi

            case "$head" in
              agent/*|claude/*|grok/*|ai/*)
                ;;
              feat/*|fix/*|hotfix/*|chore/*|refactor/*|docs/*|test/*|perf/*|security/*)
                if [ "$author" != "$repo_owner" ]; then
                  echo "PR #$number ($head): konventioneller Work-Branch, aber Autor $author ist nicht Repository-Owner $repo_owner; fail-closed uebersprungen."
                  continue
                fi
                ;;
              *)
                echo "PR #$number ($head): weder aktiver Provider-Branch noch Owner-erstellter Standard-Work-Branch, uebersprungen."
                continue
                ;;
            esac

            if [ "$EVENT_NAME" = 'workflow_run' ] && [ "$draft" = 'true' ]; then
              echo "PR #$number ($head): Draft bleibt nach Post-Merge-Korrelation bewusst unsynchronisiert."
              continue
            fi

            if { [ "$EVENT_NAME" = 'pull_request' ] || [ "$EVENT_NAME" = 'pull_request_review' ]; } && [ "$draft" = 'true' ]; then
              echo "PR #$number ($head): ready_for_review Event meldet weiterhin Draft; fail-closed uebersprungen."
              continue
            fi

            if ! printf '%s' "$head_sha" | grep -Eq '^[0-9a-f]{40}$'; then
              echo "PR #$number ($head): ungueltiger Head-SHA, fail-closed uebersprungen."
              continue
            fi

            generation="$(generation_for "$number" "$head_sha" "$current_main_sha")"
            live_main_sha="$(gh api "repos/$REPO/branches/main" --jq '.commit.sha')"
            live_pr="$(gh pr view "$number" --repo "$REPO" --json state,headRefName,headRefOid,baseRefName,isCrossRepository)"
            live_head="$(echo "$live_pr" | jq -r '.headRefName')"
            live_head_sha="$(echo "$live_pr" | jq -r '.headRefOid')"
            live_base="$(echo "$live_pr" | jq -r '.baseRefName')"
            live_state="$(echo "$live_pr" | jq -r '.state')"
            live_cross="$(echo "$live_pr" | jq -r '.isCrossRepository')"
            live_generation="$(generation_for "$number" "$live_head_sha" "$live_main_sha")"

            if [ "$live_main_sha" != "$current_main_sha" ] || [ "$live_head_sha" != "$head_sha" ] || \
               [ "$live_head" != "$head" ] || [ "$live_base" != 'main' ] || [ "$live_state" != 'OPEN' ] || \
               [ "$live_cross" = 'true' ] || [ "$live_generation" != "$generation" ]; then
              echo "PR #$number ($head): Continuation Generation drifted before mutation; expected=$generation observed=$live_generation. Fail-closed." >&2
              exit 1
            fi

            lineage_status="$(gh api "repos/$REPO/compare/$current_main_sha...$head_sha" --jq '.status')"
            if [ "$lineage_status" = 'ahead' ] || [ "$lineage_status" = 'identical' ]; then
              echo "PR #$number ($head): generation=$generation enthaelt CURRENT_MAIN bereits; kein Branch-Write erforderlich."
              [ "$EVENT_NAME" = 'workflow_run' ] && break
              continue
            fi

            if [ "$EVENT_NAME" = 'workflow_run' ]; then
              echo "Post-Korrelation: PR #$number ($head) ist der naechste eligible FIFO-PR; generation=$generation wird atomar synchronisiert."
            fi
            if gh api --method PUT \
              -H 'Accept: application/vnd.github+json' \
              "repos/$REPO/pulls/$number/update-branch" \
              -f "expected_head_sha=$head_sha" >/dev/null 2>err.log; then
              echo "PR #$number ($head): Update-Branch angestossen."
              if [ "$EVENT_NAME" = 'workflow_run' ]; then
                rm -f err.log
                break
              fi
            elif grep -q '"status": *"422"' err.log 2>/dev/null || grep -qi '422' err.log 2>/dev/null; then
              # 422 is ambiguous: accept it only after exact CURRENT_MAIN ancestry readback.
              after_main_sha="$(gh api "repos/$REPO/branches/main" --jq '.commit.sha')"
              after_head_sha="$(gh pr view "$number" --repo "$REPO" --json headRefOid --jq '.headRefOid')"
              after_lineage='unknown'
              if [ "$after_main_sha" = "$current_main_sha" ]; then
                after_lineage="$(gh api "repos/$REPO/compare/$current_main_sha...$after_head_sha" --jq '.status')"
              fi
              if [ "$after_main_sha" = "$current_main_sha" ] && { [ "$after_lineage" = 'ahead' ] || [ "$after_lineage" = 'identical' ]; }; then
                echo "PR #$number ($head): 422, aber Readback beweist Konvergenz: main=$current_main_sha head=$after_head_sha lineage=$after_lineage."
                if [ "$EVENT_NAME" = 'workflow_run' ]; then
                  rm -f err.log
                  break
                fi
              else
                echo "PR #$number ($head): 422 ohne beweisbare Konvergenz; main=$after_main_sha head=$after_head_sha lineage=$after_lineage. Fail-closed." >&2
                cat err.log
                rm -f err.log
                exit 1
              fi
            elif grep -qi "Updating a stacked PR's branch via this endpoint is not supported" err.log 2>/dev/null \
              && grep -qi '403' err.log 2>/dev/null; then
              # GitHub intentionally refuses update-branch while the PR is still represented as a stack.
              # This is not a permission failure and must not masquerade as a broken baseline. We also do
              # not invent a second merge/rebase path here: ADR-0036 remains the final current-main gate.
              echo "PR #$number ($head): Stacked PR erkannt; GitHub update-branch ist fuer diesen Zustand nicht unterstuetzt (403). Kein Auto-Sync ausgefuehrt; current-main ancestry bleibt vor Merge durch die bestehende PR-Governance fail-closed erzwungen."
              if [ "$EVENT_NAME" = 'workflow_run' ]; then
                rm -f err.log
                echo "Post-Korrelation stoppt fail-closed beim ausgewaehlten PR; kein spaeterer PR wird uebersprungen."
                exit 0
              fi
            else
              echo "PR #$number ($head): Sync fehlgeschlagen:"
              cat err.log
              rm -f err.log
              exit 1
            fi
            rm -f err.log
          done < <(echo "$prs" | jq -c '.[]')
