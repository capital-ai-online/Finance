name: PR Governance
run-name: >-
  ${{ github.event_name == 'pull_request'
      && format('PR #{0} – Governance-Prüfung', github.event.pull_request.number)
      || 'Merge-Gruppe – Governance-Prüfung' }}

on:
  pull_request:
    branches: [main]
    # `edited` re-runs the template contract after body fixes without a new code push.
    # Without this, agents had to force empty commits solely to re-validate the PR body.
    types: [opened, reopened, synchronize, ready_for_review, edited]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: pr-governance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Kostenrichtlinie: Der vollständige Build/Test-Lauf liegt ausschließlich in ci.yml.
# Dieser Workflow darf keine zweite npm-ci/Test/Build-Pipeline für denselben PR-SHA erzeugen.
jobs:
  # CLAUDE.md "CI cost / test-minutes budget policy": darf NUR nicht-blockierende Jobs gaten.
  # repository-conventions-advisory ist bereits continue-on-error und hat nie einen Merge
  # blockiert - dieses Gate spart Minuten, macht aber Merges nicht "regelfrei". workflow-security
  # und pr-template-contract unten bleiben absichtlich ungated.
  check-cost-gate:
    name: Kosten-Gate (nur advisory Job)
    if: github.event_name == 'pull_request' && github.event.action != 'edited'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
    outputs:
      gate_active: ${{ steps.gate.outputs.gate_active }}
    steps:
      - name: Datum- und Monats-Minutenbudget prüfen
        id: gate
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v8.0.0
        env:
          BUDGET_MINUTES: '3000'
          REACTIVATE_AT: '2026-09-01T00:00:00Z'
        with:
          script: |
            const budgetMinutes = Number(process.env.BUDGET_MINUTES);
            const reactivateAt = new Date(process.env.REACTIVATE_AT);
            const now = new Date();

            if (now < reactivateAt) {
              core.info(`Vor ${process.env.REACTIVATE_AT}: advisory Job pausiert (Kostenpolicy CLAUDE.md).`);
              core.setOutput('gate_active', 'true');
              return;
            }

            const monthStart = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), 1)).toISOString();
            let usedMs = 0;
            for await (const response of github.paginate.iterator(
              github.rest.actions.listWorkflowRunsForRepo,
              { owner: context.repo.owner, repo: context.repo.repo, created: `>=${monthStart}`, per_page: 100 }
            )) {
              for (const run of response.data) {
                if (!run.run_started_at || !run.updated_at) continue;
                usedMs += new Date(run.updated_at) - new Date(run.run_started_at);
              }
            }
            const usedMinutes = usedMs / 60000;
            core.info(`Actions-Laufzeit seit Monatsbeginn (alle Workflows, Naeherung): ${usedMinutes.toFixed(1)} / ${budgetMinutes} Minuten.`);
            core.setOutput('gate_active', usedMinutes >= budgetMinutes ? 'true' : 'false');

  repository-conventions-advisory:
    name: Repository-Konventionen – Hinweis
    needs: [check-cost-gate]
    if: needs.check-cost-gate.outputs.gate_active != 'true' && github.event_name == 'pull_request' && github.event.action != 'edited'
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Kandidaten ohne persistierte Zugangsdaten auschecken
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0 / Node 24
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Scope klassifizieren
        id: scope
        env:
          EVENT_NAME: pull_request
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/pr/classifyPrScope.mjs

      - name: Docs-only — npm ci überspringen
        if: steps.scope.outputs.npm_advisory != 'true'
        run: |
          echo "Klasse D / kein App-Scope: advisory npm-Validierung entfällt (Kostensparpfad)."

      - name: Node.js einrichten
        if: steps.scope.outputs.npm_advisory == 'true'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0 / Node 24 action runtime
        with:
          node-version: '24.18.0'
          cache: npm

      - name: Abhängigkeiten installieren
        if: steps.scope.outputs.npm_advisory == 'true'
        env:
          GITHUB_TOKEN: ''
          GH_TOKEN: ''
        run: npm ci --ignore-scripts

      - name: Repository-Konventionen beratend prüfen
        if: steps.scope.outputs.npm_advisory == 'true'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ''
          GH_TOKEN: ''
        run: npm run repository:validate:advisory

  workflow-security:
    name: Sicherheit geänderter Workflows
    if: github.event_name == 'pull_request' && github.event.action != 'edited'
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Kandidaten-Head auschecken (für Scope)
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0 / Node 24
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Scope klassifizieren
        id: scope
        env:
          EVENT_NAME: pull_request
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/pr/classifyPrScope.mjs

      - name: Keine Workflow-Änderung — Prüfung entfällt
        if: steps.scope.outputs.workflow_security != 'true'
        run: echo "Keine .github/workflows/**-Änderung im Diff — Workflow-Security-Check nicht erforderlich."

      - name: Vertrauenswürdige Sicherheitsrichtlinie aus main auschecken
        if: steps.scope.outputs.workflow_security == 'true'
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0 / Node 24
        with:
          ref: main
          path: policy
          fetch-depth: 1
          persist-credentials: false

      - name: Kandidaten ohne persistierte Zugangsdaten auschecken
        if: steps.scope.outputs.workflow_security == 'true'
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0 / Node 24
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Aktuellen vertrauenswürdigen main-Stand importieren
        if: steps.scope.outputs.workflow_security == 'true'
        working-directory: candidate
        run: git fetch --no-tags ../policy main:refs/remotes/origin/main

      - name: Sicherheit geänderter Workflows validieren
        if: steps.scope.outputs.workflow_security == 'true'
        working-directory: candidate
        env:
          POLICY_ROOT: ../policy
          PR_BASE_REF: origin/main
          PR_HEAD_REF: HEAD
        run: node "$POLICY_ROOT/scripts/security/verifyChangedWorkflowSecurity.mjs"

  pr-template-contract:
    name: PR-Vorlagenvertrag (kanonisch)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Vertrauenswürdigen Policy-Stand aus main auschecken
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0 / Node 24
        with:
          ref: main
          path: policy
          fetch-depth: 1
          persist-credentials: false

      - name: Kandidaten-Head ohne Credentials auschecken
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0 / Node 24
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: main-Referenz für Claim-Diff importieren
        working-directory: candidate
        run: git fetch --no-tags ../policy main:refs/remotes/origin/main

      - name: Node.js einrichten
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0 / Node 24 action runtime
        with:
          node-version: '24.18.0'

      # On body-only edits, skip the expensive production preflight rebase gate so agents can
      # fix the template without first rebasing. Code pushes (synchronize) still run full preflight.
      - name: Produktions-Baseline erzeugen
        if: github.event.action != 'edited'
        working-directory: candidate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_BASE_REF: origin/main
          PR_HEAD_REF: HEAD
          PR_BASELINE_OUTPUT: artifacts/pr/production-baseline.json
          CAPITAL_AI_PRODUCTION_HEALTH_URL: https://capital-ai.online/healthz
        run: node scripts/pr/productionPreflight.mjs

      - name: Minimal-Baseline für Body-only Edit (ohne Rebase-Gate)
        if: github.event.action == 'edited'
        working-directory: candidate
        env:
          PR_BASELINE_OUTPUT: artifacts/pr/production-baseline.json
        run: |
          mkdir -p artifacts/pr
          node -e "
            const fs = require('fs');
            const { execFileSync } = require('child_process');
            const git = (a) => execFileSync('git', a, { encoding: 'utf8' }).trim();
            const mainSha = git(['rev-parse', 'origin/main']);
            const headSha = git(['rev-parse', 'HEAD']);
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const baseline = {
              schemaVersion: '1.0.0',
              generatedAt: new Date().toISOString(),
              productionUrl: 'https://capital-ai.online/healthz',
              bootstrap: false,
              bodyEditOnly: true,
              production: { status: 'ok', version: pkg.version || '', commitSha: '', branch: 'main' },
              main: { sha: mainSha },
              head: { sha: headSha, version: pkg.version || '' },
              drift: { productionToMainCommits: 0, mainToHeadCommits: 0 },
              checks: { productionHealthy: true, branchContainsCurrentMain: false, bodyEditOnly: true },
            };
            fs.writeFileSync(process.env.PR_BASELINE_OUTPUT, JSON.stringify(baseline, null, 2) + '\n');
            console.log('[PR-PREFLIGHT] body-edit path: minimal baseline written (rebase gate skipped).');
          "

      # Prefer the trusted main policy validator when available so a PR cannot weaken the contract.
      # Fall back to candidate script only if main policy is missing (bootstrap).
      - name: Kanonische PR-Vorlage fail-closed prüfen
        working-directory: candidate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE_REF: origin/main
          PR_HEAD_REF: HEAD
          PR_BASELINE_OUTPUT: artifacts/pr/production-baseline.json
        run: |
          if [ -f ../policy/scripts/pr/validatePrBody.mjs ]; then
            echo "[PR-VORLAGE] Using trusted validator from main policy."
            node ../policy/scripts/pr/validatePrBody.mjs
          else
            echo "[PR-VORLAGE] Policy validator missing; using candidate script."
            node scripts/pr/validatePrBody.mjs
          fi
