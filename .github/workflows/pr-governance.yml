name: PR Technical Validation

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, edited, ready_for_review]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: pr-technical-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# ADR-0039: this workflow proves technical candidate integrity only.
# It MUST NOT decide whether a Pull Request may be created, whether production
# drift is acceptable, or whether concurrent work may proceed. Those are
# pre-PR / release governance decisions with explicit human authorization.
jobs:
  candidate-validation:
    name: Candidate validation
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        env:
          GITHUB_TOKEN: ''
          GH_TOKEN: ''
        run: npm ci

      - name: Production dependency vulnerability gate
        env:
          GITHUB_TOKEN: ''
          GH_TOKEN: ''
        run: npm audit --omit=dev --audit-level=high

      - name: Type check
        env:
          GITHUB_TOKEN: ''
          GH_TOKEN: ''
        run: npm run lint

      - name: Tests
        env:
          GITHUB_TOKEN: ''
          GH_TOKEN: ''
        run: npm test

      - name: Production build
        env:
          GITHUB_TOKEN: ''
          GH_TOKEN: ''
        run: npm run build

      - name: Deployment readiness
        env:
          GITHUB_TOKEN: ''
          GH_TOKEN: ''
        run: npm run verify:deployment-readiness

      - name: Changed workflow security
        env:
          PR_BASE_REF: origin/main
          PR_HEAD_REF: HEAD
        run: node scripts/security/verifyChangedWorkflowSecurity.mjs
