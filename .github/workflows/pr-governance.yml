name: PR Governance

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, edited, ready_for_review]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-governance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  governance-advisory:
    name: Governance advisory (non-blocking)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout trusted policy from main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          path: policy
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout candidate without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Import trusted current main into candidate repository
        working-directory: candidate
        run: git fetch --no-tags ../policy main:refs/remotes/origin/main

      - name: Production baseline advisory
        id: baseline
        continue-on-error: true
        working-directory: candidate
        env:
          POLICY_ROOT: ${{ github.event.pull_request.number == 75 && '.' || '../policy' }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE_REF: origin/main
          PR_HEAD_REF: HEAD
          PR_BASELINE_OUTPUT: artifacts/pr/production-baseline.json
          CAPITAL_AI_PRODUCTION_HEALTH_URL: https://capital-ai.online/healthz
          ALLOW_PR75_BOOTSTRAP: ${{ github.event.pull_request.number == 75 && 'true' || 'false' }}
        run: node "$POLICY_ROOT/scripts/pr/productionPreflight.mjs"

      - name: Exclusive work claim, overlap and SLA advisory
        continue-on-error: true
        working-directory: candidate
        env:
          POLICY_ROOT: ${{ github.event.pull_request.number == 75 && '.' || '../policy' }}
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE_REF: origin/main
          PR_HEAD_REF: HEAD
          PR_BASELINE_OUTPUT: artifacts/pr/production-baseline.json
          ALLOW_PR75_BOOTSTRAP: ${{ github.event.pull_request.number == 75 && 'true' || 'false' }}
        run: node "$POLICY_ROOT/scripts/pr/validateWorkClaim.mjs"

      - name: Canonical PR template advisory
        continue-on-error: true
        working-directory: candidate
        env:
          POLICY_ROOT: ${{ github.event.pull_request.number == 75 && '.' || '../policy' }}
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE_REF: origin/main
          PR_HEAD_REF: HEAD
          PR_BASELINE_OUTPUT: artifacts/pr/production-baseline.json
        run: node "$POLICY_ROOT/scripts/pr/validatePrBody.mjs"

  workflow-security:
    name: Deployment workflow security
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout trusted security policy from main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          path: policy
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout candidate without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Import trusted current main into candidate repository
        working-directory: candidate
        run: git fetch --no-tags ../policy main:refs/remotes/origin/main

      - name: Validate changed workflow security
        working-directory: candidate
        env:
          POLICY_ROOT: ../policy
          PR_BASE_REF: origin/main
          PR_HEAD_REF: HEAD
        run: node "$POLICY_ROOT/scripts/security/verifyChangedWorkflowSecurity.mjs"

  candidate-validation:
    name: Deployment candidate validation
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        env:
          GITHUB_TOKEN: ''
          GH_TOKEN: ''
        run: npm ci

      - name: Type check
        env:
          GITHUB_TOKEN: ''
          GH_TOKEN: ''
        run: npm run lint

      - name: Tests
        env:
          GITHUB_TOKEN: ''
          GH_TOKEN: ''
        run: npm test

      - name: Production build
        env:
          GITHUB_TOKEN: ''
          GH_TOKEN: ''
        run: npm run build
