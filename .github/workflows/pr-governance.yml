name: PR Technische Validierung
run-name: >-
  ${{ github.event_name == 'pull_request'
      && format('PR #{0} – Technische Validierung', github.event.pull_request.number)
      || 'Merge-Gruppe – Technische Validierung' }}

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, edited, ready_for_review]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: pr-technical-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# ADR-0039: Dieser Workflow belegt ausschließlich die technische Integrität eines Kandidaten.
# Produktionsdrift, PR-Erstellungsfreigabe und Koordination paralleler Arbeiten sind
# menschliche Prozessentscheidungen und dürfen nicht aus einem grünen Build abgeleitet werden.
jobs:
  candidate-validation:
    name: Kandidatenvalidierung
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Kandidaten auschecken
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Node.js einrichten
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      - name: Abhängigkeiten installieren
        env:
          GITHUB_TOKEN: ''
          GH_TOKEN: ''
        run: npm ci

      - name: Produktionsabhängigkeiten auf Schwachstellen prüfen
        env:
          GITHUB_TOKEN: ''
          GH_TOKEN: ''
        run: npm audit --omit=dev --audit-level=high

      - name: TypeScript prüfen
        env:
          GITHUB_TOKEN: ''
          GH_TOKEN: ''
        run: npm run lint

      - name: Tests ausführen
        env:
          GITHUB_TOKEN: ''
          GH_TOKEN: ''
        run: npm test

      - name: Produktions-Build erstellen
        env:
          GITHUB_TOKEN: ''
          GH_TOKEN: ''
        run: npm run build

      - name: Deployment-Bereitschaft prüfen
        env:
          GITHUB_TOKEN: ''
          GH_TOKEN: ''
        run: npm run predeploy:check

  repository-conventions-advisory:
    name: Repository-Konventionen – Hinweis
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Kandidaten ohne persistierte Zugangsdaten auschecken
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Node.js einrichten
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      - name: Abhängigkeiten installieren
        env:
          GITHUB_TOKEN: ''
          GH_TOKEN: ''
        run: npm ci

      - name: Repository-Konventionen beratend prüfen
        continue-on-error: true
        env:
          GITHUB_TOKEN: ''
          GH_TOKEN: ''
        run: npm run repository:validate:advisory

  workflow-security:
    name: Sicherheit geänderter Workflows
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Vertrauenswürdige Sicherheitsrichtlinie aus main auschecken
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          path: policy
          fetch-depth: 1
          persist-credentials: false

      - name: Kandidaten ohne persistierte Zugangsdaten auschecken
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Aktuellen vertrauenswürdigen main-Stand importieren
        working-directory: candidate
        run: git fetch --no-tags ../policy main:refs/remotes/origin/main

      - name: Sicherheit geänderter Workflows validieren
        working-directory: candidate
        env:
          POLICY_ROOT: ../policy
          PR_BASE_REF: origin/main
          PR_HEAD_REF: HEAD
        run: node "$POLICY_ROOT/scripts/security/verifyChangedWorkflowSecurity.mjs"
