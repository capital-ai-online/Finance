name: PR Governance
run-name: >-
  ${{ github.event_name == 'pull_request'
      && format('PR #{0} – Governance-Prüfung', github.event.pull_request.number)
      || 'Merge-Gruppe – Governance-Prüfung' }}

on:
  pull_request:
    branches: [main]
    # `edited` re-runs the complete template/baseline contract after body fixes.
    types: [opened, reopened, synchronize, ready_for_review, edited]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  # Event action is part of the key so a body-only `edited` run cannot cancel code-validation for the same snapshot.
  group: >-
    ${{ github.event_name == 'pull_request'
        && format('pr-governance-pr-{0}-{1}-{2}-{3}', github.event.pull_request.number, github.event.pull_request.head.sha, github.event.pull_request.base.sha, github.event.action)
        || format('pr-governance-{0}', github.ref) }}
  cancel-in-progress: true

# Kostenrichtlinie:
# - Der vollständige Build/Test-Lauf liegt ausschließlich in ci.yml.
# - Governance-/Template-/Workflow-Security-/Google-Wiring-Prüfungen teilen sich einen Ubuntu-Runner,
#   damit GitHub Actions kurze Einzeljobs nicht separat auf volle billable minutes aufrunden muss.
# - Das 3000-Minuten-Gate steuert ausschließlich das optionale Repository-Advisory und erzeugt
#   keine CI-/Merge-Autorisierung. M10 bleibt davon vollständig getrennt.
jobs:
  governance:
    name: PR Governance (Kosten / Workflow / Vorlage)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      actions: read
      contents: read
      pull-requests: read

    steps:
      - name: PR-Snapshot gegen Live-Head/Base korrelieren
        id: snapshot
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0 / Node 24
        env:
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        with:
          script: |
            const normalizeSha = (value) => String(value || '').trim().toLowerCase();
            const prNumber = Number(process.env.EVENT_PR_NUMBER);
            const eventHead = normalizeSha(process.env.EVENT_HEAD_SHA);
            const eventBase = normalizeSha(process.env.EVENT_BASE_SHA);
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            const liveHead = normalizeSha(pr.head?.sha);
            const liveBase = normalizeSha(pr.base?.sha);
            const currentSnapshot = pr.state === 'open' && liveHead === eventHead && liveBase === eventBase;
            core.setOutput('current_snapshot', currentSnapshot ? 'true' : 'false');
            if (!currentSnapshot) {
              core.notice(`Stale Governance event ignored before checkout/npm work: event head/base=${eventHead.slice(0, 12)}/${eventBase.slice(0, 12)}, live=${liveHead.slice(0, 12)}/${liveBase.slice(0, 12)}.`);
            }

      - name: Stale PR-Event kostensparend beenden
        if: steps.snapshot.outputs.current_snapshot == 'false'
        run: echo 'Stale PR-Snapshot erkannt; keine Candidate-/Policy-Checkouts oder npm-Arbeit für veraltete Evidence.'

      - name: Vertrauenswürdigen Policy-Stand aus main auschecken
        if: steps.snapshot.outputs.current_snapshot == 'true'
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0 / Node 24
        with:
          ref: main
          path: policy
          fetch-depth: 1
          persist-credentials: false

      - name: Kandidaten-Head ohne Credentials auschecken
        if: steps.snapshot.outputs.current_snapshot == 'true'
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0 / Node 24
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Aktuellen main-Stand in Kandidaten-Repository importieren
        if: steps.snapshot.outputs.current_snapshot == 'true'
        working-directory: candidate
        run: git fetch --no-tags ../policy main:refs/remotes/origin/main

      - name: Node.js einmalig für Governance-Prüfungen einrichten
        if: steps.snapshot.outputs.current_snapshot == 'true'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0 / Node 24 action runtime
        with:
          node-version: '24.18.0'

      - name: PR-Scope mit trusted-main Klassifikator bestimmen
        id: scope
        if: steps.snapshot.outputs.current_snapshot == 'true' && github.event.action != 'edited'
        working-directory: candidate
        env:
          EVENT_NAME: pull_request
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node ../policy/scripts/pr/classifyPrScope.mjs

      - name: Project Value Chain und Projektordner mit trusted-main Validator prüfen
        if: steps.snapshot.outputs.current_snapshot == 'true'
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          validator='../policy/scripts/governance/validateProjectValueChain.mjs'
          if [ ! -f "$validator" ]; then
            echo 'Bootstrap: trusted main enthält den PVC-Konsistenzvalidator noch nicht. Candidate-Policy wird im Governance-Runner nicht ausgeführt; die Candidate-Implementierung wird durch die normale CI/Test-Stufe validiert.'
            exit 0
          fi
          node "$validator" --root .

      - name: Kosten-Gate für optionales Repository-Advisory prüfen
        id: cost_gate
        if: steps.snapshot.outputs.current_snapshot == 'true' && github.event.action != 'edited'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0 / Node 24
        env:
          BUDGET_MINUTES: '3000'
          REACTIVATE_AT: '2026-09-01T00:00:00Z'
        with:
          script: |
            const budgetMinutes = Number(process.env.BUDGET_MINUTES);
            const reactivateAt = new Date(process.env.REACTIVATE_AT);
            const now = new Date();

            if (now < reactivateAt) {
              core.info(`Vor ${process.env.REACTIVATE_AT}: Repository-Advisory pausiert (Kostenpolicy).`);
              core.setOutput('gate_active', 'true');
              return;
            }

            const monthStart = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), 1)).toISOString();
            let usedMs = 0;
            for await (const response of github.paginate.iterator(
              github.rest.actions.listWorkflowRunsForRepo,
              { owner: context.repo.owner, repo: context.repo.repo, created: `>=${monthStart}`, per_page: 100 }
            )) {
              for (const run of response.data) {
                if (!run.run_started_at || !run.updated_at) continue;
                usedMs += new Date(run.updated_at) - new Date(run.run_started_at);
              }
            }
            const usedMinutes = usedMs / 60000;
            core.info(`Actions-Laufzeit seit Monatsbeginn (alle Workflows, Naeherung): ${usedMinutes.toFixed(1)} / ${budgetMinutes} Minuten.`);
            core.setOutput('gate_active', usedMinutes >= budgetMinutes ? 'true' : 'false');

      - name: Keine Workflow-Änderung — Workflow-Security entfällt
        if: steps.snapshot.outputs.current_snapshot == 'true' && github.event.action != 'edited' && steps.scope.outputs.workflow_security != 'true'
        run: echo "Keine .github/workflows/**-Änderung im Diff — Workflow-Security-Validierung ist nicht erforderlich."

      - name: Sicherheit geänderter Workflows gegen trusted main validieren
        if: steps.snapshot.outputs.current_snapshot == 'true' && github.event.action != 'edited' && steps.scope.outputs.workflow_security == 'true'
        working-directory: candidate
        env:
          POLICY_ROOT: ../policy
          PR_BASE_REF: origin/main
          PR_HEAD_REF: HEAD
        run: node "$POLICY_ROOT/scripts/security/verifyChangedWorkflowSecurity.mjs"

      - name: Google-Marketing Schutzverdrahtung im bestehenden Governance-Runner prüfen
        if: steps.snapshot.outputs.current_snapshot == 'true' && github.event.action != 'edited'
        working-directory: candidate
        env:
          PR_BASE_REF: origin/main
          PR_HEAD_REF: HEAD
        run: |
          set -euo pipefail
          if [ -f ../policy/scripts/security/verifyGoogleMarketingProtectedWiring.mjs ]; then
            node ../policy/scripts/security/verifyGoogleMarketingProtectedWiring.mjs
          else
            echo "Bootstrap: trusted main enthält den neuen Wiring-Validator noch nicht; der bisherige separate Google-Marketing-Workflow auf main bleibt für diesen Cutover die unabhängige Kontrolle."
            node scripts/security/verifyGoogleMarketingProtectedWiring.mjs
          fi

      - name: Repository-Konventionen — Advisory wegen Kostenpolicy überspringen
        if: steps.snapshot.outputs.current_snapshot == 'true' && github.event.action != 'edited' && steps.cost_gate.outputs.gate_active == 'true'
        run: echo "Repository-Advisory ist durch die bestehende Kostenpolicy pausiert; Pflicht-Governance und build-and-test bleiben unberührt."

      - name: Repository-Konventionen — Docs-/No-App-Fast-Path
        if: steps.snapshot.outputs.current_snapshot == 'true' && github.event.action != 'edited' && steps.cost_gate.outputs.gate_active != 'true' && steps.scope.outputs.npm_advisory != 'true'
        run: 'echo "Klasse D / kein App-Scope: advisory npm-Validierung entfällt (Kostensparpfad)."'

      - name: Repository-Advisory Abhängigkeiten installieren
        if: steps.snapshot.outputs.current_snapshot == 'true' && github.event.action != 'edited' && steps.cost_gate.outputs.gate_active != 'true' && steps.scope.outputs.npm_advisory == 'true'
        working-directory: candidate
        env:
          GITHUB_TOKEN: ''
          GH_TOKEN: ''
        run: npm ci --ignore-scripts

      - name: Repository-Konventionen beratend prüfen
        if: steps.snapshot.outputs.current_snapshot == 'true' && github.event.action != 'edited' && steps.cost_gate.outputs.gate_active != 'true' && steps.scope.outputs.npm_advisory == 'true'
        working-directory: candidate
        continue-on-error: true
        env:
          GITHUB_TOKEN: ''
          GH_TOKEN: ''
        run: npm run repository:validate:advisory

      - name: Produktions-Baseline über trusted-main Policy erzeugen
        if: steps.snapshot.outputs.current_snapshot == 'true'
        working-directory: candidate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE_REF: origin/main
          PR_HEAD_REF: HEAD
          PR_BASELINE_OUTPUT: artifacts/pr/production-baseline.json
          CAPITAL_AI_PRODUCTION_HEALTH_URL: https://capital-ai.online/healthz
        run: node ../policy/scripts/pr/productionPreflight.mjs

      - name: Kanonische PR-Vorlage fail-closed prüfen
        if: steps.snapshot.outputs.current_snapshot == 'true'
        working-directory: candidate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE_REF: origin/main
          PR_HEAD_REF: HEAD
          PR_BASELINE_OUTPUT: artifacts/pr/production-baseline.json
        run: node ../policy/scripts/pr/validatePrBody.mjs