name: PR Governance
run-name: >-
  ${{ github.event_name == 'pull_request'
      && format('PR #{0} – Governance-Prüfung', github.event.pull_request.number)
      || 'Merge-Gruppe – Governance-Prüfung' }}

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: pr-governance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Kostenrichtlinie: Der vollständige Build/Test-Lauf liegt ausschließlich in ci.yml.
# Dieser Workflow darf keine zweite npm-ci/Test/Build-Pipeline für denselben PR-SHA erzeugen.
# Reine PR-Metadatenänderungen (Titel/Beschreibung) lösen bewusst keinen neuen
# Governance-Lauf aus; unveränderte Head-SHAs verwenden bestehende Evidence weiter.
jobs:
  repository-conventions-advisory:
    name: Repository-Konventionen – Hinweis
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Kandidaten ohne persistierte Zugangsdaten auschecken
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0 / Node 24
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Node.js einrichten
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0 / Node 24 action runtime
        with:
          node-version: '22'
          cache: npm

      - name: Abhängigkeiten installieren
        env:
          GITHUB_TOKEN: ''
          GH_TOKEN: ''
        run: npm ci --ignore-scripts

      - name: Repository-Konventionen beratend prüfen
        continue-on-error: true
        env:
          GITHUB_TOKEN: ''
          GH_TOKEN: ''
        run: npm run repository:validate:advisory

  workflow-security:
    name: Sicherheit geänderter Workflows
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Vertrauenswürdige Sicherheitsrichtlinie aus main auschecken
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0 / Node 24
        with:
          ref: main
          path: policy
          fetch-depth: 1
          persist-credentials: false

      - name: Kandidaten ohne persistierte Zugangsdaten auschecken
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0 / Node 24
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Aktuellen vertrauenswürdigen main-Stand importieren
        working-directory: candidate
        run: git fetch --no-tags ../policy main:refs/remotes/origin/main

      - name: Sicherheit geänderter Workflows validieren
        working-directory: candidate
        env:
          POLICY_ROOT: ../policy
          PR_BASE_REF: origin/main
          PR_HEAD_REF: HEAD
        run: node "$POLICY_ROOT/scripts/security/verifyChangedWorkflowSecurity.mjs"
