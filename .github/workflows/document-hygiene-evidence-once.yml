name: Document Hygiene Evidence Migration Once

on:
  push:
    branches: [feature/external-market-data-providers]
    paths:
      - '.github/workflows/document-hygiene-evidence-once.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/external-market-data-providers
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply evidence migration
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('server/documentHygiene.ts')
          s = p.read_text()

          s = s.replace(
            "import { retrieveRelevantChunks, formatChunksForPrompt } from '../src/services/rag/retrieval';",
            "import { retrieveRelevantChunksWithEvidence, formatChunksForPrompt } from '../src/services/rag/retrieval';\nimport { getPromptGovernanceEntry, recordAiEvaluation, type AiProvider } from '../src/services/aiGovernance';",
            1,
          )

          old = """    const relevantChunks = await retrieveRelevantChunks(`${filePath}\\n${diff.slice(0, 1000)}`);\n    const ragContext = relevantChunks.length > 0\n      ? `\\n\\n--- RELEVANTE INTERNE RICHTLINIEN (zur Einordnung von \"conflict_candidate\") ---\\n${formatChunksForPrompt(relevantChunks)}`\n      : '';"""
          new = """    const promptEntry = getPromptGovernanceEntry('document-hygiene-change-classification');\n    const retrieval = await retrieveRelevantChunksWithEvidence(`${filePath}\\n${diff.slice(0, 1000)}`, {\n      promptId: 'document-hygiene-change-classification',\n      promptVersion: promptEntry?.version,\n      topK: 5,\n      minScore: 0.5,\n    });\n    const relevantChunks = retrieval.chunks;\n    const ragContext = relevantChunks.length > 0\n      ? `\\n\\n--- RELEVANTE INTERNE RICHTLINIEN (zur Einordnung von \"conflict_candidate\") ---\\n${formatChunksForPrompt(relevantChunks)}`\n      : '';"""
          if old not in s:
            raise SystemExit('retrieval anchor missing')
          s = s.replace(old, new, 1)

          old2 = """    const parsed = result.data;\n    return {\n      classification: parsed.classification || 'content_update',"""
          new2 = """    const parsed = result.data;\n    const modelProvider: AiProvider = result.provider.startsWith('anthropic:')\n      ? 'anthropic'\n      : result.provider.startsWith('openai:')\n        ? 'openai'\n        : 'gemini';\n    const model = result.provider.includes(':') ? result.provider.split(':').slice(1).join(':') : result.provider;\n    const evidenceIds = retrieval.evidence.evidence.map(item => item.evidenceId);\n    recordAiEvaluation({\n      promptId: 'document-hygiene-change-classification',\n      promptVersion: promptEntry?.version ?? 'unregistered',\n      modelProvider,\n      model,\n      evidenceIds,\n      checks: { schemaValid: true, grounded: evidenceIds.length > 0 },\n      outcome: evidenceIds.length > 0 ? 'PASS' : 'WARN',\n      notes: evidenceIds.length > 0\n        ? `Documentary RAG evidence quality: ${retrieval.evidence.evaluation.quality}.`\n        : 'Dokumenten-Hygiene-Klassifikation ohne Repository-RAG-Evidence; manuelle Review-Regeln bleiben maßgeblich.',\n    });\n    return {\n      classification: parsed.classification || 'content_update',"""
          if old2 not in s:
            raise SystemExit('evaluation anchor missing')
          s = s.replace(old2, new2, 1)
          p.write_text(s)
          PY
      - name: Validate TypeScript
        run: npm ci && npx tsc --noEmit
      - name: Commit migration
        run: |
          if git diff --quiet -- server/documentHygiene.ts; then
            echo 'No document-hygiene change required.'
            exit 0
          fi
          git config user.name 'capital-ai-documentary-bot'
          git config user.email 'documentary-bot@capital-ai.online'
          git add server/documentHygiene.ts
          git commit -m 'feat(documentary): record RAG evidence and AI evaluation'
          git push origin HEAD:feature/external-market-data-providers
