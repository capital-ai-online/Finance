name: Self-Healing Package Continuation
run-name: >-
  Post-Merge Self-Healing continuation for ${{ github.event.workflow_run.head_sha }}

# Non-authorizing continuation handoff for the already active OPS-08-B-SH-02 package.
# It runs only after the canonical Post-Merge Production Correlation succeeded for current main.
# It selects the next dependency-ready SH-02 slice and records one deduplicated issue.
# It does not create implementation, mutate a work branch, approve, enable auto-merge or merge.
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: ['Post-Merge Production Correlation']
    types: [completed]
    branches: [main]

permissions: {}

concurrency:
  group: self-healing-package-continuation-main
  cancel-in-progress: false

jobs:
  handoff:
    name: Next Self-Healing slice deterministically hand off
    if: >-
      github.event.workflow_run.repository.full_name == github.repository &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.path == '.github/workflows/post-merge-production-correlation.yml' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      issues: write

    steps:
      - name: Post-merge Roadmap and work-package closure drift correlate
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0 / Node 24
        with:
          script: |
            const crypto = require('crypto');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const source = context.payload.workflow_run;
            const sourceSha = String(source.head_sha || '').toLowerCase();
            const marker = '<!-- CAPITAL_AI_ROADMAP_CLOSURE_V1 -->';
            const leadingRoadmapPath = 'docs/architecture/ROADMAP.md';
            const workPackagePattern = /^docs\/projects\/[^/]+\/work-packages\/[^/]+\.md$/;
            const claimPattern = /^\.ai\/work-claims\/[^/]+\.json$/;
            const tick = String.fromCharCode(96);

            if (!/^[0-9a-f]{40}$/.test(sourceSha)) {
              throw new Error('Roadmap closure source did not provide an immutable main SHA.');
            }

            async function currentMainSha() {
              const { data } = await github.rest.repos.getBranch({ owner, repo, branch: 'main' });
              return String(data.commit.sha || '').toLowerCase();
            }

            async function readText(path) {
              const response = await github.rest.repos.getContent({
                owner, repo, path, ref: sourceSha,
              });
              const data = response.data;
              if (Array.isArray(data) || data.type !== 'file' || !data.content) {
                throw new Error('Roadmap closure source is not a readable file: ' + path);
              }
              return Buffer.from(data.content, data.encoding || 'base64').toString('utf8');
            }

            if (await currentMainSha() !== sourceSha) {
              core.notice('Roadmap closure source is stale before correlation; no evidence mutation.');
              return;
            }

            const associated = await github.paginate(
              github.rest.repos.listPullRequestsAssociatedWithCommit,
              { owner, repo, commit_sha: sourceSha, per_page: 100 },
            );
            const merged = [];
            for (const candidate of associated) {
              if (!candidate.number) continue;
              const { data: pr } = await github.rest.pulls.get({
                owner, repo, pull_number: candidate.number,
              });
              if (
                pr.state === 'closed' &&
                pr.merged_at &&
                String(pr.merge_commit_sha || '').toLowerCase() === sourceSha
              ) merged.push(pr);
            }

            if (merged.length !== 1) {
              core.notice(
                'Roadmap closure requires exactly one merged PR for CURRENT_MAIN; observed=' +
                  merged.length +
                  '.',
              );
              return;
            }

            const mergedPr = merged[0];
            const files = await github.paginate(
              github.rest.pulls.listFiles,
              { owner, repo, pull_number: mergedPr.number, per_page: 100 },
            );
            const changedPaths = files.map(file => String(file.filename || ''));
            const directPackages = changedPaths.filter(path => workPackagePattern.test(path));
            const claimPaths = changedPaths.filter(path => claimPattern.test(path));

            const claims = [];
            for (const claimPath of claimPaths) {
              let claim;
              try {
                claim = JSON.parse(await readText(claimPath));
              } catch (error) {
                claims.push({
                  path: claimPath,
                  parseError: error instanceof Error ? error.message : String(error),
                  claimedPaths: [],
                  projectId: null,
                  status: null,
                  exclusive: null,
                  closureSync: false,
                });
                continue;
              }
              claims.push({
                path: claimPath,
                parseError: null,
                claimedPaths: Array.isArray(claim.claimedPaths) ? claim.claimedPaths : [],
                projectId:
                  typeof claim.projectId === 'string' && /^CAPITAL-AI-[A-Z0-9-]+$/.test(claim.projectId)
                    ? claim.projectId
                    : null,
                status: typeof claim.status === 'string' ? claim.status : null,
                exclusive: typeof claim.exclusive === 'boolean' ? claim.exclusive : null,
                closureSync: claim.closureSync === true,
              });
            }

            if (claims.some(claim => claim.closureSync)) {
              core.notice(
                'Roadmap closure synchronization PR detected; recursion suppressed for this generation.',
              );
              return;
            }

            const packagePaths = new Set(directPackages);
            for (const claim of claims) {
              for (const claimedPath of claim.claimedPaths) {
                if (typeof claimedPath === 'string' && workPackagePattern.test(claimedPath)) {
                  packagePaths.add(claimedPath);
                }
              }
            }

            if (packagePaths.size === 0) {
              core.notice(
                'Merged PR #' +
                  mergedPr.number +
                  ' carries no canonical work-package identity; no Roadmap closure mutation is inferred.',
              );
              return;
            }

            const leadingRoadmap = await readText(leadingRoadmapPath);
            const findings = [];

            function packageStatus(markdown) {
              const field =
                markdown.match(/^\*\*(?:Status|State):\*\*\s*[\x60]?([^\x60\n]+)[\x60]?\s*$/im);
              if (field) return field[1].trim();

              const heading = markdown.match(/^##\s+Status\s*$/im);
              if (heading && typeof heading.index === 'number') {
                const afterHeading = markdown.slice(heading.index + heading[0].length);
                const nextHeadingIndex = afterHeading.search(/^##\s+/m);
                const section =
                  nextHeadingIndex >= 0 ? afterHeading.slice(0, nextHeadingIndex) : afterHeading;
                const code = section.match(/\x60([^\x60\n]+)\x60/);
                if (code) return code[1].trim();
              }
              return null;
            }

            const terminalOrPostMerge =
              /\bDONE_MAIN\b|\bTERMINAL\b|\bMERGED_MAIN\b|\bEVIDENCE_GATE\b|\bPARTIAL_MAIN\b/i;
            const staleBranchState =
              /IMPLEMENTED_ON_BRANCH|VALIDATION_PENDING|HUMAN_MERGE_REQUIRED|IMPLEMENTATION_NOT_STARTED/i;

            for (const workPackagePath of [...packagePaths].sort()) {
              let markdown;
              try {
                markdown = await readText(workPackagePath);
              } catch (error) {
                findings.push({
                  workPackagePath,
                  code: 'WORK_PACKAGE_DOCUMENTATION_MISSING',
                  detail: error instanceof Error ? error.message : String(error),
                  projectId: null,
                });
                continue;
              }

              const status = packageStatus(markdown);
              const relatedClaims = claims.filter(claim =>
                claim.claimedPaths.includes(workPackagePath),
              );
              const projectFromDoc =
                markdown.match(/^\*\*Project:\*\*\s*[\x60]?(CAPITAL-AI-[A-Z0-9-]+)[\x60]?\s*$/im)?.[1] ||
                null;
              const projectId =
                relatedClaims.find(claim => claim.projectId)?.projectId || projectFromDoc;
              const claimOpen = relatedClaims.some(
                claim =>
                  claim.parseError ||
                  claim.status === 'active' ||
                  claim.exclusive === true,
              );
              const roadmapPresent = leadingRoadmap.includes(workPackagePath);
              const statusConverged =
                Boolean(status) &&
                terminalOrPostMerge.test(status) &&
                !staleBranchState.test(status);

              if (!statusConverged) {
                findings.push({
                  workPackagePath,
                  code: 'WORK_PACKAGE_POST_MERGE_STATE_DRIFT',
                  detail: 'Observed status=' + (status || 'MISSING'),
                  projectId,
                });
              }
              if (claimOpen) {
                findings.push({
                  workPackagePath,
                  code: 'WORK_CLAIM_LIFECYCLE_DRIFT',
                  detail: 'Merged work package still has active/exclusive or unreadable claim metadata.',
                  projectId,
                });
              }
              if (!roadmapPresent) {
                findings.push({
                  workPackagePath,
                  code: 'LEADING_ROADMAP_CLOSURE_MISSING',
                  detail:
                    'Leading Roadmap does not reference the merged work-package documentation path.',
                  projectId,
                });
              }
            }

            const canonical = [
              'schema=capital-ai-roadmap-closure-generation/1.0.0',
              'repository=' + owner.toLowerCase() + '/' + repo.toLowerCase(),
              'main=' + sourceSha,
              'pr=' + mergedPr.number,
              'merge=' + String(mergedPr.merge_commit_sha || '').toLowerCase(),
              ...findings
                .map(
                  finding =>
                    finding.workPackagePath +
                    '|' +
                    finding.code +
                    '|' +
                    String(finding.projectId || 'UNRESOLVED'),
                )
                .sort(),
            ].join('\n') + '\n';
            const fingerprint =
              'sha256:' + crypto.createHash('sha256').update(canonical, 'utf8').digest('hex');

            const issues = await github.paginate(
              github.rest.issues.listForRepo,
              { owner, repo, state: 'all', per_page: 100 },
            );
            // A package can be touched by several merged PRs. Match the open
            // handoff to its canonical finding paths, not only the latest PR.
            function findingPaths(issue) {
              const body = String(issue.body || '');
              const matches = body.matchAll(
                /^- \\x60[A-Z_]+\\x60 — \\x60(docs\\/projects\\/[^/]+\\/work-packages\\/[^\\x60\\n]+\\.md)\\x60/gm,
              );
              return [...new Set([...matches].map(match => match[1]))].sort();
            }
            const findingPackagePaths =
              [...new Set(findings.map(finding => finding.workPackagePath))].sort();
            const closureIssues = issues.filter(
              issue => !issue.pull_request && String(issue.body || '').includes(marker),
            );
            const samePaths = (left, right) =>
              left.length === right.length && left.every((path, index) => path === right[index]);
            const existing = closureIssues.find(
              issue => String(issue.body || '').includes('- Merged PR: #' + mergedPr.number),
            ) || closureIssues.find(
              issue =>
                issue.state === 'open' &&
                findingPackagePaths.length > 0 &&
                samePaths(findingPaths(issue), findingPackagePaths),
            ) || null;

            if (await currentMainSha() !== sourceSha) {
              core.notice(
                'Roadmap closure generation drifted before issue mutation; no evidence handoff written.',
              );
              return;
            }

            if (findings.length === 0) {
              const converged = closureIssues.filter(issue => {
                const paths = findingPaths(issue);
                return issue.state === 'open' && paths.length > 0 &&
                  paths.every(path => packagePaths.has(path));
              });
              for (const issue of converged) {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: issue.number,
                  body:
                    '✅ Roadmap closure re-correlation PASS for PR #' +
                    mergedPr.number +
                    ' on CURRENT_MAIN ' +
                    tick +
                    sourceSha +
                    tick +
                    '. Work-package documentation, claim lifecycle and leading Roadmap reference are converged.',
                });
                await github.rest.issues.update({
                  owner, repo, issue_number: issue.number, state: 'closed',
                });
              }
              core.notice(
                'Roadmap closure PASS for PR #' +
                  mergedPr.number +
                  ': package documentation and leading Roadmap are converged.',
              );
              return;
            }

            if (
              existing &&
              existing.state === 'open' &&
              String(existing.body || '').includes(
                '- Closure fingerprint: ' + tick + fingerprint + tick,
              )
            ) {
              core.notice(
                'Identical Roadmap closure fingerprint already recorded; duplicate handoff suppressed.',
              );
              return;
            }

            const projects = [...new Set(findings.map(item => item.projectId).filter(Boolean))];
            const issuePrefix = projects.length === 1 ? '[' + projects[0] + '] ' : '';
            const issueTitle =
              issuePrefix + 'Roadmap-Abschluss nach PR #' + mergedPr.number + ' korrelieren';
            const findingRows = findings
              .map(
                finding =>
                  '- ' +
                  tick +
                  finding.code +
                  tick +
                  ' — ' +
                  tick +
                  finding.workPackagePath +
                  tick +
                  ' — Owner: ' +
                  tick +
                  String(finding.projectId || 'UNRESOLVED') +
                  tick +
                  ' — ' +
                  finding.detail,
              )
              .join('\n');
            const foreignOwners = projects.filter(projectId => projectId !== 'CAPITAL-AI-OPS');

            const body = [
              marker,
              '# DevelopmentChain Roadmap closure — DRIFT',
              '',
              '- Merged PR: #' + mergedPr.number,
              '- Merge / CURRENT_MAIN SHA: ' + tick + sourceSha + tick,
              '- Closure fingerprint: ' + tick + fingerprint + tick,
              '- Finding class: ' + tick + 'REPOSITORY_CURRENT_STATE_PROJECTION_DRIFT' + tick,
              '- Existing action: ' + tick + 'RECONCILE_REPOSITORY_PROJECTION' + tick,
              '- Leading Roadmap: ' + tick + leadingRoadmapPath + tick,
              '- Foreign-owner handoff: ' +
                tick +
                (foreignOwners.length ? foreignOwners.join(', ') : 'none') +
                tick,
              '',
              '## Findings',
              findingRows,
              '',
              '## Required convergence',
              'Every processed canonical work package must finish with the same evidence-bound post-merge state in:',
              '1. its owner-correct work-package documentation;',
              '2. the repository leading Live Roadmap;',
              '3. its merged work-claim lifecycle (' + tick + 'released / exclusive=false' + tick + ').',
              '',
              'Owner-local deterministic drift may use the existing bounded ' +
                tick +
                'RECONCILE_REPOSITORY_PROJECTION' +
                tick +
                ' lane. Foreign-owner files remain an ' +
                tick +
                'OWNER_CORRECT_HANDOFF' +
                tick +
                '; this workflow does not mutate them.',
              '',
              'This issue is non-authorizing evidence/orchestration only. It creates no repository writer, no direct-main mutation, no provider mutation, no approval and no merge authority.',
              '',
            ].join('\n');

            if (existing) {
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: existing.number,
                state: 'open',
                title: issueTitle,
                body,
              });
            } else {
              await github.rest.issues.create({ owner, repo, title: issueTitle, body });
            }
            core.warning(
              'Roadmap/work-package closure drift recorded for PR #' + mergedPr.number + '.',
            );

      - name: Current-main Self-Healing work graph correlate and hand off
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0 / Node 24
        with:
          script: |
            const crypto = require('crypto');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const source = context.payload.workflow_run;
            const sourceSha = String(source.head_sha || '').toLowerCase();
            const marker = '<!-- CAPITAL_AI_SH_CONTINUATION_V1 -->';
            const issueTitle = '[SELF-HEALING-CONTINUATION] OPS-08-B-SH-02';
            const workPackagePath = 'docs/projects/operations/work-packages/OPS_08_B_SH_02_AUTONOMOUS_SELF_HEALING_PLATFORM_2026-09-20.md';

            if (!/^[0-9a-f]{40}$/.test(sourceSha)) {
              throw new Error('Post-merge correlation did not provide an immutable head SHA.');
            }

            const { data: main } = await github.rest.repos.getBranch({ owner, repo, branch: 'main' });
            const currentMainSha = String(main.commit.sha || '').toLowerCase();
            if (currentMainSha !== sourceSha) {
              core.notice(`Continuation source ${sourceSha} is stale; CURRENT_MAIN=${currentMainSha}. No handoff is written.`);
              return;
            }

            const agentsResponse = await github.rest.repos.getContent({
              owner,
              repo,
              path: 'AGENTS.md',
              ref: currentMainSha,
            });
            const agentsData = agentsResponse.data;
            if (Array.isArray(agentsData) || agentsData.type !== 'file' || !agentsData.content) {
              throw new Error('AGENTS.md could not be read for continuation generation.');
            }
            const agentsText = Buffer.from(agentsData.content, agentsData.encoding || 'base64').toString('utf8');
            const controlPlaneMatch = agentsText.match(/^\*\*Control Plane Version:\*\*\s+`([^`]+)`\s*$/m);
            if (!controlPlaneMatch) throw new Error('AGENTS.md Control Plane Version is missing.');
            const controlPlaneVersion = controlPlaneMatch[1].trim();

            function buildContinuationGeneration(state, nextId, mergedPrNumber, completedId) {
              const canonical = [
                'schema=capital-ai-self-healing-continuation-generation/1.0.0',
                `repository=${owner.toLowerCase()}/${repo.toLowerCase()}`,
                `source_main=${currentMainSha}`,
                `source_run=${source.id}`,
                `merged_pr=${mergedPrNumber}`,
                `completed=${completedId}`,
                `next=${nextId}`,
                `state=${state}`,
                `control_plane=${controlPlaneVersion}`,
              ].join('\n') + '\n';
              return `sha256:${crypto.createHash('sha256').update(canonical, 'utf8').digest('hex')}`;
            }

            async function revalidateContinuationGeneration(expectedGeneration, state, nextId, mergedPrNumber, completedId) {
              const { data: liveMain } = await github.rest.repos.getBranch({ owner, repo, branch: 'main' });
              const liveMainSha = String(liveMain.commit.sha || '').toLowerCase();
              if (liveMainSha !== currentMainSha) {
                core.notice(`Continuation Generation drifted before handoff mutation: source_main=${currentMainSha} current_main=${liveMainSha}. No handoff is written.`);
                return false;
              }
              const observedGeneration = buildContinuationGeneration(state, nextId, mergedPrNumber, completedId);
              if (observedGeneration !== expectedGeneration) {
                throw new Error(`Continuation Generation mismatch: expected=${expectedGeneration} observed=${observedGeneration}`);
              }
              return true;
            }

            const associated = await github.paginate(
              github.rest.repos.listPullRequestsAssociatedWithCommit,
              { owner, repo, commit_sha: sourceSha, per_page: 100 },
            );

            const merged = [];
            for (const candidate of associated) {
              if (!candidate.number) continue;
              const { data: pr } = await github.rest.pulls.get({
                owner,
                repo,
                pull_number: candidate.number,
              });
              if (
                pr.state === 'closed' &&
                pr.merged_at &&
                String(pr.merge_commit_sha || '').toLowerCase() === sourceSha
              ) {
                merged.push(pr);
              }
            }

            if (merged.length !== 1) {
              core.notice(`Expected one merged PR for exact main SHA ${sourceSha}; observed=${merged.length}. This push is not an unambiguous SH continuation source.`);
              return;
            }

            const mergedPr = merged[0];
            const files = await github.paginate(
              github.rest.pulls.listFiles,
              { owner, repo, pull_number: mergedPr.number, per_page: 100 },
            );

            const shClaims = files
              .filter(file => file.status === 'added')
              .map(file => file.filename)
              .map(path => ({
                path,
                match: path.match(/^\.ai\/work-claims\/OPS-08-B-SH-02-(\d+)-[A-Z0-9-]+\.json$/),
              }))
              .filter(item => item.match);

            if (shClaims.length === 0) {
              core.notice(`Merged PR #${mergedPr.number} is not an atomic SH-02 slice; no Self-Healing continuation handoff.`);
              return;
            }
            if (shClaims.length !== 1) {
              throw new Error(`Merged PR #${mergedPr.number} contains ${shClaims.length} new SH-02 atomic claims; continuation fails closed.`);
            }

            const completedNumber = Number(shClaims[0].match[1]);
            const completedId = `SH-02.${completedNumber}`;

            const contentResponse = await github.rest.repos.getContent({
              owner,
              repo,
              path: workPackagePath,
              ref: currentMainSha,
            });
            const data = contentResponse.data;
            if (Array.isArray(data) || data.type !== 'file' || !data.content) {
              throw new Error('Canonical SH-02 work package could not be read as a file.');
            }
            const markdown = Buffer.from(data.content, data.encoding || 'base64').toString('utf8');

            const rows = [];
            for (const line of markdown.split(/\r?\n/)) {
              const match = line.match(/^\|\s*(SH-02\.(\d+))\s*\|\s*([^|]+?)\s*\|\s*([^|]+?)\s*\|\s*([^|]+?)\s*\|\s*([^|]+?)\s*\|\s*([^|]+?)\s*\|$/);
              if (!match) continue;
              rows.push({
                id: match[1],
                number: Number(match[2]),
                scope: match[3].trim(),
                owner: match[4].trim(),
                dependencies: match[5].trim(),
                exitGate: match[6].trim(),
                state: match[7].trim(),
              });
            }
            if (rows.length === 0) {
              throw new Error('Canonical SH-02 work graph contains no parseable rows.');
            }

            const byNumber = new Map(rows.map(row => [row.number, row]));
            const completed = new Set(
              rows
                .filter(row => /IMPLEMENTED_ON_MAIN|VALIDATED|CLOSED|COMPLETE/.test(row.state))
                .map(row => row.number),
            );
            completed.add(completedNumber);

            function parseDependencies(text) {
              const refs = new Set();
              let residual = String(text || '');

              residual = residual.replace(/02\.(\d+)\.\.02\.(\d+)/g, (_, startText, endText) => {
                const start = Number(startText);
                const end = Number(endText);
                for (let value = start; value <= end; value += 1) refs.add(value);
                return ' ';
              });
              residual = residual.replace(/02\.(\d+)/g, (_, valueText) => {
                refs.add(Number(valueText));
                return ' ';
              });
              residual = residual
                .replace(/current\s+main/gi, ' ')
                .replace(/[,+]/g, ' ')
                .replace(/\s+/g, ' ')
                .trim();

              return { refs: [...refs], unresolved: residual };
            }

            const staleQueuedCompleted = rows
              .filter(row => row.state === 'QUEUED' && completed.has(row.number))
              .map(row => row.id);
            if (staleQueuedCompleted.length > 0) {
              core.notice(`Ignoring stale QUEUED rows already completed by current merge/state: ${staleQueuedCompleted.join(', ')}.`);
            }

            const queued = rows
              .filter(row => row.state === 'QUEUED' && !completed.has(row.number))
              .sort((a, b) => a.number - b.number);

            let next = null;
            const blocked = [];
            for (const row of queued) {
              const parsed = parseDependencies(row.dependencies);
              const missing = parsed.refs.filter(number => !completed.has(number));
              if (parsed.unresolved || missing.length > 0) {
                blocked.push({
                  id: row.id,
                  unresolved: parsed.unresolved || null,
                  missing: missing.map(number => `SH-02.${number}`),
                });
                continue;
              }
              next = row;
              break;
            }

            const issues = await github.paginate(
              github.rest.issues.listForRepo,
              { owner, repo, state: 'all', per_page: 100 },
            );
            const existing = issues.find(issue =>
              !issue.pull_request &&
              issue.title === issueTitle &&
              String(issue.body || '').includes(marker)
            ) || null;

            const now = new Date().toISOString();

            if (!next) {
              if (queued.length === 0) {
                const continuationGeneration = buildContinuationGeneration('COMPLETE', 'NONE', mergedPr.number, completedId);
                if (!(await revalidateContinuationGeneration(continuationGeneration, 'COMPLETE', 'NONE', mergedPr.number, completedId))) return;
                if (existing && existing.state === 'open') {
                  await github.rest.issues.createComment({
                    owner,
                    repo,
                    issue_number: existing.number,
                    body: `✅ ${now}: SH-02 has no remaining QUEUED slice after ${completedId} / PR #${mergedPr.number}. Continuation generation \`${continuationGeneration}\`. Handoff closed.`,
                  });
                  await github.rest.issues.update({
                    owner,
                    repo,
                    issue_number: existing.number,
                    state: 'closed',
                  });
                }
                core.notice('SH-02 continuation complete: no QUEUED slice remains.');
                return;
              }

              const continuationGeneration = buildContinuationGeneration('BLOCKED', 'NONE', mergedPr.number, completedId);
              if (!(await revalidateContinuationGeneration(continuationGeneration, 'BLOCKED', 'NONE', mergedPr.number, completedId))) return;

              const body = `${marker}
            # Self-Healing package continuation — BLOCKED

            - Observed at: \`${now}\`
            - Merged PR: #${mergedPr.number}
            - Merge / CURRENT_MAIN SHA: \`${currentMainSha}\`
            - Completed slice: \`${completedId}\`
            - State: \`BLOCKED\`
            - Continuation generation: \`${continuationGeneration}\`

            No dependency-ready QUEUED SH-02 slice can be activated automatically.

