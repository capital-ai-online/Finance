name: PR Autofix Controller
run-name: >-
  ${{ format('{0} #{1} – PR-Convergence fail-closed klassifizieren', github.event.workflow_run.name, github.event.workflow_run.run_number) }}

# Privileged convergence controller for explicitly bounded repair classes only.
# The controller never executes candidate code with write permission.
# Every mutation is bound to one immutable PR generation derived from repository/PR/head/base/current-main/control-plane identity.
# Existing specialist writers remain single-owner:
# - Current-State Baseline Autofix owns CURRENT_STATE_PROJECTION_BASELINE_* repository writes.
# - PR Production Baseline Auto-Refresh owns production-baseline and bounded legacy-template writes.
# - PR Decision Evidence Reconciler owns the canonical v1.8 Decision/Evidence projection.
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: [CI, PR Governance]
    # completed is emitted for initial runs and re-runs. Avoid in_progress polling/races.
    types: [completed]

permissions: {}

concurrency:
  group: pr-autofix-controller-${{ github.event.workflow_run.path }}-${{ github.event.workflow_run.head_sha }}-${{ github.event.workflow_run.run_attempt }}-${{ github.event.action }}
  cancel-in-progress: true

jobs:
  classify:
    name: Failure-Klasse fail-closed bestimmen
    if: >-
      github.event.workflow_run.repository.full_name == github.repository &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.action == 'completed' &&
      ((github.event.workflow_run.path == '.github/workflows/ci.yml' &&
        (github.event.workflow_run.event == 'pull_request' ||
         github.event.workflow_run.event == 'workflow_dispatch')) ||
       (github.event.workflow_run.path == '.github/workflows/pr-governance.yml' &&
        github.event.workflow_run.event == 'pull_request'))
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      eligible: ${{ steps.pr.outputs.eligible }}
      sync_required: ${{ steps.pr.outputs.sync_required }}
      pr_number: ${{ steps.pr.outputs.pr_number }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
      head_ref: ${{ steps.pr.outputs.head_ref }}
      base_sha: ${{ steps.pr.outputs.base_sha }}
      current_main_sha: ${{ steps.pr.outputs.current_main_sha }}
      generation_id: ${{ steps.generation.outputs.generation_id }}
      writer_lease_key: ${{ steps.generation.outputs.writer_lease_key }}
      control_plane_version: ${{ steps.generation.outputs.control_plane_version }}
      generation_schema: ${{ steps.generation.outputs.generation_schema }}
      pr_metadata_shape: ${{ steps.pr.outputs.pr_metadata_shape }}
      source_workflow_path: ${{ steps.pr.outputs.source_workflow_path }}
      classification: ${{ steps.classifier.outputs.classification }}
      decision: ${{ steps.classifier.outputs.decision }}
      reason: ${{ steps.classifier.outputs.reason }}
      failure_signature: ${{ steps.classifier.outputs.failure_signature }}
      repairer_id: ${{ steps.classifier.outputs.repairer_id }}
      repairer_path: ${{ steps.classifier.outputs.repairer_path }}
      allowed_paths_json: ${{ steps.classifier.outputs.allowed_paths_json }}
      self_healing_finding_class: ${{ steps.classifier.outputs.self_healing_finding_class }}
      self_healing_action_id: ${{ steps.classifier.outputs.self_healing_action_id }}

    steps:
      - name: Abgeschlossenen Source-Run exakt binden
        id: source
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0 / Node 24
        with:
          script: |
            const sourceRun = context.payload.workflow_run;
            if (context.payload.action !== 'completed' || sourceRun.status !== 'completed') {
              throw new Error('PR Autofix verarbeitet ausschließlich abgeschlossene Source-Runs.');
            }
            if (!Number.isInteger(Number(sourceRun.run_attempt)) || Number(sourceRun.run_attempt) < 1) {
              throw new Error('Source-Run besitzt keinen gültigen run_attempt.');
            }

            core.setOutput('conclusion', String(sourceRun.conclusion || ''));
            core.setOutput('run_attempt', String(sourceRun.run_attempt));
            core.notice(
              `Source-Run ${sourceRun.id} gebunden: conclusion=${sourceRun.conclusion}, attempt=${sourceRun.run_attempt}.`,
            );
      - name: Exakten offenen Same-Repo-PR und aktuellen main binden
        if: steps.source.outputs.conclusion == 'failure'
        id: pr
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0 / Node 24
        with:
          script: |
            const normalizeSha = (value) => String(value || '').trim().toLowerCase();
            const run = context.payload.workflow_run;
            const repository = `${context.repo.owner}/${context.repo.repo}`;
            const headSha = normalizeSha(run.head_sha);
            const supportedPath = new Set([
              '.github/workflows/ci.yml',
              '.github/workflows/pr-governance.yml',
            ]);

            const held = (reason) => {
              core.notice(`PR Autofix held: ${reason}`);
              core.setOutput('eligible', 'false');
              core.setOutput('pr_number', '');
              core.setOutput('pr_metadata_shape', 'UNAVAILABLE');
              core.setOutput('previous_autofix_signature', '');
            };

            if (!supportedPath.has(run.path)) {
              held(`unsupported source path ${run.path}`);
              return;
            }
            if (!/^[0-9a-f]{40}$/.test(headSha)) {
              held('source head SHA is invalid');
              return;
            }

            let candidates = run.pull_requests ?? [];
            if (candidates.length === 0) {
              candidates = await github.paginate(
                github.rest.repos.listPullRequestsAssociatedWithCommit,
                { owner: context.repo.owner, repo: context.repo.repo, commit_sha: headSha, per_page: 100 },
              );
            }

            const open = [];
            for (const candidate of candidates) {
              if (!candidate.number) continue;
              const { data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: candidate.number,
              });
              if (
                pr.state === 'open' &&
                pr.base.ref === 'main' &&
                normalizeSha(pr.head.sha) === headSha &&
                pr.head.repo?.full_name === repository
              ) open.push(pr);
            }

            if (open.length !== 1) {
              held(`expected exactly one open same-repository PR for ${headSha}; observed=${open.length}`);
              return;
            }

            const pr = open[0];
            if (run.event === 'workflow_dispatch') {
              if (run.path !== '.github/workflows/ci.yml' || String(run.head_branch || '') !== pr.head.ref) {
                held(`workflow_dispatch identity mismatch: path=${run.path}, head_branch=${run.head_branch || 'missing'}, pr_head_ref=${pr.head.ref}`);
                return;
              }
            }
            const body = String(pr.body || '');
            const headingCount = (pattern) => (body.match(pattern) || []).length;
            const occurrenceCount = (needle) => body.split(needle).length - 1;
            const currentV18 = /CAPITAL_AI_PR_TEMPLATE_VERSION:\s*1\.8\.0/.test(body);
            const v18Headings = body.match(/^## .+$/gm) || [];
            const expectedV18Headings = [
              '## 1. 🧭 Entscheidung',
              '## 2. ✅ Evidence',
              '## 3. 🔍 Technical Evidence',
            ];
            const currentV18Canonical =
              currentV18 &&
              v18Headings.length === 3 &&
              expectedV18Headings.every((heading, index) => v18Headings[index] === heading) &&
              occurrenceCount('{{PRODUCTION_BASELINE_BLOCK}}') === 0 &&
              headingCount(/^## 7\. Maschinenlesbare Baseline\s*$/gm) === 0;
            const currentV18LegacyBaselineSection =
              currentV18 &&
              v18Headings.length === 4 &&
              expectedV18Headings.every((heading, index) => v18Headings[index] === heading) &&
              v18Headings[3] === '## 7. Maschinenlesbare Baseline' &&
              occurrenceCount('{{PRODUCTION_BASELINE_BLOCK}}') === 1 &&
              occurrenceCount('<!-- CAPITAL_AI_PRODUCTION_BASELINE_START -->') === 1 &&
              occurrenceCount('<!-- CAPITAL_AI_PRODUCTION_BASELINE_END -->') === 1;

            const currentV16 = /CAPITAL_AI_PR_TEMPLATE_VERSION:\s*1\.6\.0/.test(body);
            const exactSecurityBoundary =
              currentV16 &&
              headingCount(/^## 4\. 🔐 Security Boundary\s*$/gm) === 1 &&
              headingCount(/^## 5\. ✅ Prüfung & Merge\s*$/gm) === 1 &&
              headingCount(/^## 6\. 🔢 Version\s*$/gm) === 1;
            const securityBoundaryLike =
              currentV16 && /^## 4\. 🔐 Security Boundar.*$/m.test(body);
            const genericMissingSections =
              currentV16 &&
              headingCount(/^## 4\. 📌 Priorität & Roadmap\s*$/gm) === 0 &&
              headingCount(/^## 5\. 🔢 Version & PR-Klasse\s*$/gm) === 0 &&
              headingCount(/^## 6\. ✅ Prüfung & Merge\s*$/gm) === 0 &&
              headingCount(/^## 7\. Maschinenlesbare Baseline\s*$/gm) === 1 &&
              !securityBoundaryLike;
            const prMetadataShape = currentV18LegacyBaselineSection
              ? 'CURRENT_V18_LEGACY_BASELINE_SECTION'
              : currentV18Canonical
                ? 'CURRENT_V18_CANONICAL'
                : currentV18
                  ? 'CURRENT_V18_OTHER'
                  : exactSecurityBoundary
                    ? 'CURRENT_V16_SECURITY_BOUNDARY_EXACT'
                    : securityBoundaryLike
                      ? 'CURRENT_V16_SECURITY_BOUNDARY_LOOKALIKE'
                      : genericMissingSections
                        ? 'CURRENT_V16_GENERIC_MISSING_SECTIONS'
                        : 'OTHER';

            const { data: main } = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: 'main',
            });
            const mainSha = normalizeSha(main.commit.sha);
            if (!/^[0-9a-f]{40}$/.test(mainSha)) {
              held('current main SHA is invalid');
              return;
            }
            const baseSha = mainSha;
            const lineage = await github.request('GET /repos/{owner}/{repo}/compare/{basehead}', {
              owner: context.repo.owner,
              repo: context.repo.repo,
              basehead: `${mainSha}...${headSha}`,
            });
            const containsMain = lineage.data.status === 'ahead' || lineage.data.status === 'identical';
            if (!containsMain) {
              core.notice(`PR Autofix deferred: PR #${pr.number} does not contain CURRENT_MAIN ${mainSha}; canonical Update Branch is required first.`);
              core.setOutput('eligible', 'false');
              core.setOutput('sync_required', 'true');
              core.setOutput('pr_number', String(pr.number));
              core.setOutput('head_sha', headSha);
              core.setOutput('head_ref', pr.head.ref);
              core.setOutput('base_sha', mainSha);
              core.setOutput('current_main_sha', mainSha);
              core.setOutput('pr_metadata_shape', prMetadataShape);
              core.setOutput('source_workflow_path', run.path);
              core.setOutput('previous_autofix_signature', '');
              return;
            }
            core.setOutput('sync_required', 'false');

            const { data: headCommit } = await github.rest.repos.getCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: headSha,
            });
            const previousSignature = String(headCommit.commit?.message || '')
              .match(/^CAPITAL_AI_AUTOFIX_SIGNATURE:([A-Z0-9][A-Z0-9_.:-]{0,127})$/m)?.[1] || '';

            core.setOutput('eligible', 'true');
            core.setOutput('pr_number', String(pr.number));
            core.setOutput('head_sha', headSha);
            core.setOutput('head_ref', pr.head.ref);
            core.setOutput('base_sha', baseSha);
            core.setOutput('current_main_sha', mainSha);
            core.setOutput('pr_metadata_shape', prMetadataShape);
            core.setOutput('source_workflow_path', run.path);
            core.setOutput('previous_autofix_signature', previousSignature);

      - name: Trusted Base-Policy auschecken
        if: steps.pr.outputs.eligible == 'true'
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0 / Node 24
        with:
          ref: ${{ steps.pr.outputs.base_sha }}
          path: policy
          fetch-depth: 1
          persist-credentials: false

      - name: Node.js einrichten
        if: steps.pr.outputs.eligible == 'true'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24.18.0'

      - name: Kanonische PR-Generation aus Trusted Main materialisieren
        id: generation
        if: steps.pr.outputs.eligible == 'true'
        working-directory: policy
        env:
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          BASE_SHA: ${{ steps.pr.outputs.base_sha }}
          CURRENT_MAIN_SHA: ${{ steps.pr.outputs.current_main_sha }}
          AGENTS_PATH: AGENTS.md
        run: node scripts/pr/prConvergenceGeneration.mjs

      - name: Fehlgeschlagene Source-Logs begrenzt und redigiert erfassen
        id: failure_log
        if: steps.pr.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          raw="$RUNNER_TEMP/pr-autofix-failed.raw.log"
          bounded="$RUNNER_TEMP/pr-autofix-failed.bounded.log"
          safe="$RUNNER_TEMP/pr-autofix-failed.safe.log"
          if ! gh run view "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed > "$raw" 2>/dev/null; then
            : > "$raw"
          fi
          tail -n 700 "$raw" > "$bounded"
          head -c 120000 "$bounded" |             perl -pe 's/\e\[[0-9;]*[A-Za-z]//g; s/(gh[pousr]_|github_pat_)[A-Za-z0-9_]{20,}/[REDACTED_GITHUB_TOKEN]/g; s/sk-(?:proj-)?[A-Za-z0-9_-]{20,}/[REDACTED_API_TOKEN]/g; s/(?:sk|rk)_(?:live|test)_[A-Za-z0-9]{16,}/[REDACTED_STRIPE_TOKEN]/g; s/sb_(?:secret|publishable)_[A-Za-z0-9_-]{16,}/[REDACTED_SUPABASE_TOKEN]/g; s/Bearer\s+[A-Za-z0-9._~+\/-]{16,}/Bearer [REDACTED]/g'             > "$safe"
          echo "path=$safe" >> "$GITHUB_OUTPUT"

      - name: Trusted-main Classifier ausführen
        id: classifier
        if: steps.pr.outputs.eligible == 'true'
        working-directory: policy
        env:
          FAILURE_LOG: ${{ steps.failure_log.outputs.path }}
          SOURCE_WORKFLOW_PATH: ${{ steps.pr.outputs.source_workflow_path }}
          PR_METADATA_SHAPE: ${{ steps.pr.outputs.pr_metadata_shape }}
          PREVIOUS_AUTOFIX_SIGNATURE: ${{ steps.pr.outputs.previous_autofix_signature }}
        run: node scripts/pr/classifyPrAutofixFailure.mjs

      - name: Klassifikation dokumentieren
        if: steps.pr.outputs.eligible == 'true'
        env:
          REPORT_CLASSIFICATION: ${{ steps.classifier.outputs.classification }}
          REPORT_DECISION: ${{ steps.classifier.outputs.decision }}
          REPORT_REASON: ${{ steps.classifier.outputs.reason }}
          REPORT_FINDING_CLASS: ${{ steps.classifier.outputs.self_healing_finding_class }}
          REPORT_ACTION_ID: ${{ steps.classifier.outputs.self_healing_action_id }}
          REPORT_METADATA_SHAPE: ${{ steps.pr.outputs.pr_metadata_shape }}
          REPORT_PR: ${{ steps.pr.outputs.pr_number }}
          REPORT_HEAD: ${{ steps.pr.outputs.head_sha }}
          REPORT_GENERATION: ${{ steps.generation.outputs.generation_id }}
          REPORT_CONTROL_PLANE: ${{ steps.generation.outputs.control_plane_version }}
          REPORT_WRITER_LEASE: ${{ steps.generation.outputs.writer_lease_key }}
        shell: bash
        run: |
          {
            echo '## PR Autofix Controller'
            echo
            printf -- '- PR: #%s\n' "$REPORT_PR"
            printf -- '- head: `%s`\n' "$REPORT_HEAD"
            printf -- '- generation: `%s`\n' "$REPORT_GENERATION"
            printf -- '- control plane: `%s`\n' "$REPORT_CONTROL_PLANE"
            printf -- '- writer lease: `%s`\n' "$REPORT_WRITER_LEASE"
            printf -- '- revalidation: `%s`\n' "${REPORT_REVALIDATION:-sync-deferred}"
            printf -- '- classification: `%s`\n' "$REPORT_CLASSIFICATION"
            printf -- '- decision: `%s`\n' "$REPORT_DECISION"
            printf -- '- metadata shape: `%s`\n' "$REPORT_METADATA_SHAPE"
            printf -- '- reason: `%s`\n' "$REPORT_REASON"
            if [ -n "$REPORT_FINDING_CLASS" ]; then printf -- '- self-healing finding: `%s`\n' "$REPORT_FINDING_CLASS"; fi
            if [ -n "$REPORT_ACTION_ID" ]; then printf -- '- preferred fix action: `%s`\n' "$REPORT_ACTION_ID"; fi
            echo '- merge authority: unchanged, Human/CODEOWNER only'
          } >> "$GITHUB_STEP_SUMMARY"


  sync-before-fix:
    name: PR vor Governance-/Testfix auf CURRENT_MAIN korrelieren
    needs: [classify]
    if: needs.classify.result == 'success' && needs.classify.outputs.sync_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: write
      contents: read
      pull-requests: read
    concurrency:
      group: capital-ai-pr-writer-${{ needs.classify.outputs.pr_number }}
      cancel-in-progress: false
    steps:
      - name: Kanonischen Update-Branch für exakt diesen PR anstoßen
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0 / Node 24
        env:
          PR_NUMBER: ${{ needs.classify.outputs.pr_number }}
        with:
          script: |
            const prNumber = String(process.env.PR_NUMBER || '').trim();
            if (!/^[1-9][0-9]*$/.test(prNumber)) throw new Error('Exact PR number required for current-main correlation.');
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'sync-agent-pr-branches.yml',
              ref: 'main',
              inputs: { pr_number: prNumber },
            });
            core.notice(`PR #${prNumber}: CURRENT_MAIN correlation dispatched before any Governance/test fix.`);

  delegate_pr_metadata:
    name: PR-Metadata-Spezialistenpfad bestätigen
    needs: [classify]
    if: needs.classify.result == 'success' && needs.classify.outputs.decision == 'DELEGATE_PR_PRODUCTION_BASELINE_REFRESH'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - name: Direkte Specialist-Subscription bestätigen
        env:
          PR_NUMBER: ${{ needs.classify.outputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ needs.classify.outputs.head_sha }}
          EXPECTED_BASE_SHA: ${{ needs.classify.outputs.base_sha }}
          PR_METADATA_SHAPE: ${{ needs.classify.outputs.pr_metadata_shape }}
          PR_GENERATION: ${{ needs.classify.outputs.generation_id }}
        shell: bash
        run: |
          set -euo pipefail
          printf 'PR #%s metadata drift on generation %s head %s/base %s with semantic shape %s is owned by the independently subscribed PR Production Baseline Auto-Refresh workflow. No second writer or rerun dispatch is created by the controller.\n' \
            "$PR_NUMBER" "$PR_GENERATION" "$EXPECTED_HEAD_SHA" "$EXPECTED_BASE_SHA" "$PR_METADATA_SHAPE"


  delegate_pr_decision_evidence:
    name: Decision/Evidence-Reconciler bestätigen
    needs: [classify]
    if: needs.classify.result == 'success' && needs.classify.outputs.decision == 'DELEGATE_PR_DECISION_EVIDENCE_RECONCILER'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - name: Exklusive Reconciler-Subscription bestätigen
        env:
          PR_NUMBER: ${{ needs.classify.outputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ needs.classify.outputs.head_sha }}
          EXPECTED_BASE_SHA: ${{ needs.classify.outputs.base_sha }}
          PR_GENERATION: ${{ needs.classify.outputs.generation_id }}
        shell: bash
        run: |
          set -euo pipefail
          printf 'PR #%s Decision/Evidence drift on generation %s head %s/base %s is exclusively owned by the already subscribed PR Decision Evidence Reconciler. The Autofix Controller creates no PR-body write and no Governance rerun.\n' \
            "$PR_NUMBER" "$PR_GENERATION" "$EXPECTED_HEAD_SHA" "$EXPECTED_BASE_SHA"


  repair:
    name: Registrierten Patch ohne Write-Credential erzeugen
    needs: [classify]
    if: needs.classify.result == 'success' && needs.classify.outputs.decision == 'REGISTERED_TEST_REPAIR'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    outputs:
      tree_sha: ${{ steps.bundle.outputs.tree_sha }}
      bundle_sha: ${{ steps.bundle.outputs.bundle_sha }}
      changed_paths_json: ${{ steps.repair.outputs.changed_paths_json }}
      allowed_paths_json: ${{ steps.repair.outputs.allowed_paths_json }}

    steps:
      - name: Trusted Base-Policy auschecken
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0 / Node 24
        with:
          ref: ${{ needs.classify.outputs.base_sha }}
          path: policy
          fetch-depth: 1
          persist-credentials: false

      - name: Kandidaten-Head ohne persistierte Credentials auschecken
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0 / Node 24
        with:
          ref: ${{ needs.classify.outputs.head_sha }}
          path: work
          fetch-depth: 0
          persist-credentials: false

      - name: Node.js einrichten
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24.18.0'

      - name: Candidate ancestry an exact current main binden
        working-directory: work
        env:
          EXPECTED_MAIN_SHA: ${{ needs.classify.outputs.base_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags ../policy "$EXPECTED_MAIN_SHA:refs/remotes/origin/main"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN_SHA"
          git merge-base --is-ancestor "$EXPECTED_MAIN_SHA" HEAD

      - name: Exakt registrierten trusted-main Repairer anwenden
        id: repair
        env:
          WORKTREE: work
          REPAIRER_ID: ${{ needs.classify.outputs.repairer_id }}
          SOURCE_WORKFLOW_PATH: ${{ needs.classify.outputs.source_workflow_path }}
          FAILURE_SIGNATURE: ${{ needs.classify.outputs.failure_signature }}
        run: node policy/scripts/pr/applyRegisteredPrAutofix.mjs

      - name: Validierten Patch als kurzlebiges Bundle materialisieren
        id: bundle
        env:
          CHANGED_PATHS_JSON: ${{ steps.repair.outputs.changed_paths_json }}
          ALLOWED_PATHS_JSON: ${{ steps.repair.outputs.allowed_paths_json }}
        shell: bash
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/pr-autofix-bundle"
          mkdir -p "$bundle/files"
          printf '%s' "$CHANGED_PATHS_JSON" > "$bundle/changed-paths.json"
          printf '%s' "$ALLOWED_PATHS_JSON" > "$bundle/allowed-paths.json"
          while IFS= read -r file; do
            test -n "$file"
            mkdir -p "$bundle/files/$(dirname "$file")"
            cp -- "work/$file" "$bundle/files/$file"
            git -C work add -- "$file"
          done < <(printf '%s' "$CHANGED_PATHS_JSON" | jq -r '.[]')
          tree="$(git -C work write-tree)"
          tar -C "$bundle" -cf "$RUNNER_TEMP/pr-autofix-bundle.tar" changed-paths.json allowed-paths.json files
          sha="$(sha256sum "$RUNNER_TEMP/pr-autofix-bundle.tar" | awk '{print $1}')"
          echo "tree_sha=$tree" >> "$GITHUB_OUTPUT"
          echo "bundle_sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Kurzlebiges validiertes Bundle hochladen
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-autofix-${{ github.event.workflow_run.id }}
          path: ${{ runner.temp }}/pr-autofix-bundle.tar
          if-no-files-found: error
          retention-days: 1

  write:
    name: Exakt validierten Tree atomar schreiben
    needs: [classify, repair]
    if: needs.classify.result == 'success' && needs.repair.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: write
      pull-requests: read
    concurrency:
      group: ${{ needs.classify.outputs.writer_lease_key }}
      cancel-in-progress: false

    steps:
      - name: Validiertes Bundle ohne Candidate-Checkout laden
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pr-autofix-${{ github.event.workflow_run.id }}
          path: ${{ runner.temp }}/bundle

      - name: Bundle-Hash prüfen
        env:
          EXPECTED_BUNDLE_SHA: ${{ needs.repair.outputs.bundle_sha }}
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/bundle/pr-autofix-bundle.tar"
          test "$(sha256sum "$archive" | awk '{print $1}')" = "$EXPECTED_BUNDLE_SHA"
          mkdir -p "$RUNNER_TEMP/unpacked"
          tar -C "$RUNNER_TEMP/unpacked" -xf "$archive"

      - name: Exact-Head/Main revalidieren und einen non-force Commit schreiben
        id: write
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0 / Node 24
        env:
          PR_NUMBER: ${{ needs.classify.outputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ needs.classify.outputs.head_sha }}
          EXPECTED_HEAD_REF: ${{ needs.classify.outputs.head_ref }}
          EXPECTED_BASE_SHA: ${{ needs.classify.outputs.base_sha }}
          EXPECTED_TREE_SHA: ${{ needs.repair.outputs.tree_sha }}
          BUNDLE_DIR: ${{ runner.temp }}/unpacked
          FAILURE_SIGNATURE: ${{ needs.classify.outputs.failure_signature }}
          REPAIRER_ID: ${{ needs.classify.outputs.repairer_id }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          EXPECTED_GENERATION_ID: ${{ needs.classify.outputs.generation_id }}
          EXPECTED_CONTROL_PLANE_VERSION: ${{ needs.classify.outputs.control_plane_version }}
        with:
          script: |
            const crypto = require('crypto');
            const fs = require('fs');
            const path = require('path');
            const normalizeSha = (value) => String(value || '').trim().toLowerCase();
            const fail = (message) => { throw new Error(message); };
            const prNumber = Number(process.env.PR_NUMBER);
            const expectedHead = normalizeSha(process.env.EXPECTED_HEAD_SHA);
            const expectedBase = normalizeSha(process.env.EXPECTED_BASE_SHA);
            const expectedTree = normalizeSha(process.env.EXPECTED_TREE_SHA);
            const failureSignature = String(process.env.FAILURE_SIGNATURE || '');
            const repairerId = String(process.env.REPAIRER_ID || '');
            const expectedGeneration = String(process.env.EXPECTED_GENERATION_ID || '').trim().toLowerCase();
            const expectedControlPlaneVersion = String(process.env.EXPECTED_CONTROL_PLANE_VERSION || '').trim();

            if (!Number.isInteger(prNumber) || prNumber <= 0) fail('Invalid PR number.');
            for (const [label, value] of [['head', expectedHead], ['base', expectedBase], ['tree', expectedTree]]) {
              if (!/^[0-9a-f]{40}$/.test(value)) fail(`Invalid expected ${label} SHA.`);
            }
            if (!/^[A-Z0-9][A-Z0-9_.:-]{0,127}$/.test(failureSignature)) fail('Invalid autofix failure signature.');
            if (!/^[A-Z0-9][A-Z0-9_.:-]{0,127}$/.test(repairerId)) fail('Invalid repairer id.');
            if (!/^sha256:[0-9a-f]{64}$/.test(expectedGeneration)) fail('Invalid PR convergence generation id.');
            if (!/^[0-9]+\.[0-9]+\.[0-9]+(?:[-+][A-Za-z0-9._-]+)?$/.test(expectedControlPlaneVersion)) {
              fail('Invalid expected Control Plane Version.');
            }

            const changed = JSON.parse(fs.readFileSync(path.join(process.env.BUNDLE_DIR, 'changed-paths.json'), 'utf8'));
            const allowed = JSON.parse(fs.readFileSync(path.join(process.env.BUNDLE_DIR, 'allowed-paths.json'), 'utf8'));
            const safePath = /^(?!\/)(?!.*(?:^|\/)\.\.(?:\/|$))(?!.*[\r\n])[A-Za-z0-9._/@+\-]+(?:\/[A-Za-z0-9._/@+\-]+)*$/;
            if (!Array.isArray(changed) || changed.length === 0 || !Array.isArray(allowed) || allowed.length === 0) {
              fail('Invalid registered autofix path bundle.');
            }
            const allow = new Set(allowed);
            if (changed.some((file) => typeof file !== 'string' || !safePath.test(file) || !allow.has(file))) {
              fail('Registered autofix bundle exceeds exact path allowlist.');
            }

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            const { data: main } = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: 'main',
            });
            if (pr.state !== 'open' || pr.base.ref !== 'main') fail('PR is no longer open against main.');
            if (pr.head.repo?.full_name !== `${context.repo.owner}/${context.repo.repo}`) fail('PR head repository drift.');
            if (normalizeSha(pr.head.sha) !== expectedHead || pr.head.ref !== process.env.EXPECTED_HEAD_REF) fail('PR head drift before autofix write.');
            if (normalizeSha(main.commit.sha) !== expectedBase) {
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'sync-agent-pr-branches.yml',
                ref: 'main',
                inputs: { pr_number: String(prNumber) },
              });
              core.notice(`PR #${prNumber}: CURRENT_MAIN moved before registered autofix write; Update Branch dispatched and stale fix abandoned.`);
              core.setOutput('deferred_to_sync', 'true');
              return;
            }
            const lineage = await github.request('GET /repos/{owner}/{repo}/compare/{basehead}', {
              owner: context.repo.owner,
              repo: context.repo.repo,
              basehead: `${expectedBase}...${expectedHead}`,
            });
            if (lineage.data.status !== 'ahead' && lineage.data.status !== 'identical') {
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'sync-agent-pr-branches.yml',
                ref: 'main',
                inputs: { pr_number: String(prNumber) },
              });
              core.notice(`PR #${prNumber}: exact head no longer contains CURRENT_MAIN; Update Branch dispatched before registered fix.`);
              core.setOutput('deferred_to_sync', 'true');
              return;
            }

            const { data: agentsFile } = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: 'AGENTS.md',
              ref: expectedBase,
            });
            if (Array.isArray(agentsFile) || typeof agentsFile.content !== 'string') {
              fail('Trusted AGENTS.md snapshot is unavailable.');
            }
            const agentsText = Buffer.from(agentsFile.content, agentsFile.encoding || 'base64').toString('utf8');
            const controlPlaneMatch = agentsText.match(/^\*\*Control Plane Version:\*\*\s+`([^`]+)`\s*$/m);
            if (!controlPlaneMatch) fail('Trusted AGENTS.md Control Plane Version is unavailable.');
            const observedControlPlaneVersion = controlPlaneMatch[1].trim();
            if (observedControlPlaneVersion !== expectedControlPlaneVersion) {
              fail(`Control-plane drift before autofix write: expected=${expectedControlPlaneVersion} observed=${observedControlPlaneVersion}`);
            }
            const canonicalGeneration = [
              'schema=capital-ai-pr-convergence-generation/1.0.0',
              `repository=${context.repo.owner.toLowerCase()}/${context.repo.repo.toLowerCase()}`,
              `pr=${prNumber}`,
              `head=${expectedHead}`,
              `base=${expectedBase}`,
              `current_main=${normalizeSha(main.commit.sha)}`,
              `control_plane=${observedControlPlaneVersion}`,
            ].join('\n') + '\n';
            const observedGeneration = `sha256:${crypto.createHash('sha256').update(canonicalGeneration, 'utf8').digest('hex')}`;
            if (observedGeneration !== expectedGeneration) {
              fail(`PR generation drift before autofix write: expected=${expectedGeneration} observed=${observedGeneration}`);
            }

            const { data: ref } = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `heads/${pr.head.ref}`,
            });
            if (normalizeSha(ref.object.sha) !== expectedHead) fail('Branch ref drift before autofix write.');

            const { data: headCommit } = await github.rest.git.getCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: expectedHead,
            });
            const entries = [];
            for (const file of changed) {
              const absolute = path.join(process.env.BUNDLE_DIR, 'files', file);
              const stat = fs.lstatSync(absolute);
              if (stat.isSymbolicLink() || !stat.isFile()) fail(`Unsafe bundled target: ${file}`);
              const content = fs.readFileSync(absolute, 'utf8');
              const { data: blob } = await github.rest.git.createBlob({
                owner: context.repo.owner,
                repo: context.repo.repo,
                content,
                encoding: 'utf-8',
              });
              entries.push({ path: file, mode: '100644', type: 'blob', sha: blob.sha });
            }

            const { data: tree } = await github.rest.git.createTree({
              owner: context.repo.owner,
              repo: context.repo.repo,
              base_tree: headCommit.tree.sha,
              tree: entries,
            });
            if (normalizeSha(tree.sha) !== expectedTree) {
              fail(`Validated tree mismatch: expected=${expectedTree} observed=${tree.sha}`);
            }

            const { data: commit } = await github.rest.git.createCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              message:
                `fix(pr-autofix): ${repairerId}\n\n` +
                `CAPITAL_AI_AUTOFIX_SIGNATURE:${failureSignature}\n` +
                `CAPITAL_AI_AUTOFIX_SOURCE_RUN:${process.env.SOURCE_RUN_ID}\n` +
                `CAPITAL_AI_PR_GENERATION:${expectedGeneration}`,
              tree: tree.sha,
              parents: [expectedHead],
            });
            await github.rest.git.updateRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `heads/${pr.head.ref}`,
              sha: commit.sha,
              force: false,
            });
            core.setOutput('new_head_sha', commit.sha);

            const { data: postMain } = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: 'main',
            });
            const postMainSha = normalizeSha(postMain.commit.sha);
            const postLineage = await github.request('GET /repos/{owner}/{repo}/compare/{basehead}', {
              owner: context.repo.owner,
              repo: context.repo.repo,
              basehead: `${postMainSha}...${commit.sha}`,
            });
            if (postLineage.data.status !== 'ahead' && postLineage.data.status !== 'identical') {
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'sync-agent-pr-branches.yml',
                ref: 'main',
                inputs: { pr_number: String(prNumber) },
              });
              core.setOutput('revalidation', 'branch-sync');
              core.notice(`PR #${prNumber}: CURRENT_MAIN moved during registered fix; Update Branch dispatched before new tests.`);
            } else {
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'ci.yml',
                ref: pr.head.ref,
                inputs: {
                  pr_number: String(prNumber),
                  expected_head_sha: commit.sha,
                  expected_head_ref: pr.head.ref,
                  expected_base_sha: postMainSha,
                  source_autofix_run_id: String(context.runId),
                },
              });
              core.setOutput('revalidation', 'ci');
              core.notice(`PR #${prNumber}: registered fix remains correlated with CURRENT_MAIN; exact-head CI dispatched.`);
            }

      - name: Ergebnis dokumentieren
        env:
          REPORT_PREVIOUS_HEAD: ${{ needs.classify.outputs.head_sha }}
          REPORT_NEW_HEAD: ${{ steps.write.outputs.new_head_sha }}
          REPORT_REPAIRER: ${{ needs.classify.outputs.repairer_id }}
          REPORT_SIGNATURE: ${{ needs.classify.outputs.failure_signature }}
          REPORT_GENERATION: ${{ needs.classify.outputs.generation_id }}
          REPORT_WRITER_LEASE: ${{ needs.classify.outputs.writer_lease_key }}
          REPORT_REVALIDATION: ${{ steps.write.outputs.revalidation }}
        shell: bash
        run: |
          {
            echo '## Registered PR Autofix'
            echo
            printf -- '- previous head: `%s`\n' "$REPORT_PREVIOUS_HEAD"
            printf -- '- new head: `%s`\n' "$REPORT_NEW_HEAD"
            printf -- '- repairer: `%s`\n' "$REPORT_REPAIRER"
            printf -- '- exact signature: `%s`\n' "$REPORT_SIGNATURE"
            printf -- '- generation: `%s`\n' "$REPORT_GENERATION"
            printf -- '- writer lease: `%s`\n' "$REPORT_WRITER_LEASE"
            echo '- write: validated exact Git tree, force=false'
            echo '- CI: exact new head dispatched for revalidation'
            echo '- merge authority: unchanged, Human/CODEOWNER only'
          } >> "$GITHUB_STEP_SUMMARY"
