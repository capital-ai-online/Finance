name: PR-Vorlage normalisieren
run-name: >-
  PR #${{ github.event.pull_request.number }} – kanonische Vorlage sicherstellen

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, edited]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-template-normalizer-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  normalize:
    name: Fehlende kanonische Vorlage ergänzen
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: PR-Body aus vertrauenswürdigem main-Template normalisieren
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v8.0.0
        with:
          script: |
            const pr = context.payload.pull_request;
            const marker = 'CAPITAL_AI_PR_TEMPLATE_VERSION: 1.4.0';
            const originalBody = String(pr.body || '').trim();

            if (originalBody.includes(marker)) {
              core.info(`PR #${pr.number} enthält bereits den kanonischen Marker; keine Mutation erforderlich.`);
              return;
            }

            // Sicherheitsinvariante: ausschließlich die Vorlage aus dem vertrauenswürdigen
            // Base-Commit lesen. Kein Checkout und keine Ausführung von PR-Head-Code.
            const templateResponse = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: '.github/pull_request_template.md',
              ref: pr.base.sha,
            });

            if (Array.isArray(templateResponse.data) || templateResponse.data.type !== 'file') {
              core.setFailed('Kanonische PR-Vorlage konnte nicht als Datei aus dem Base-Commit gelesen werden.');
              return;
            }

            const template = Buffer.from(templateResponse.data.content, 'base64').toString('utf8');
            if (!template.includes(marker)) {
              core.setFailed(`Vertrauenswürdige Base-Vorlage enthält nicht den erwarteten Marker: ${marker}`);
              return;
            }

            // Work-Claim-Nachweis nur übernehmen, wenn genau eine neu hinzugefügte Claim-Datei
            // im PR existiert. Der Inhalt wird ausschließlich als Text/Metadatum gelesen und
            // niemals ausgeführt.
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100,
            });
            const claimFiles = files.filter((file) =>
              file.status === 'added'
              && /^\.ai\/work-claims\/[^/]+\.json$/.test(file.filename)
            );

            let claimId = 'N/A (kein neuer Work-Claim im Diff)';
            let claimFile = 'N/A';
            let agentProvider = 'N/A (API/UI/Connector-Pfad)';
            let agentModel = 'N/A (API/UI/Connector-Pfad)';
            let agentSurface = 'GitHub API/UI/Connector';

            if (claimFiles.length === 1) {
              claimFile = claimFiles[0].filename;
              const claimResponse = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: claimFile,
                ref: pr.head.sha,
              });
              if (!Array.isArray(claimResponse.data) && claimResponse.data.type === 'file') {
                try {
                  const claim = JSON.parse(Buffer.from(claimResponse.data.content, 'base64').toString('utf8'));
                  claimId = String(claim.claimId || 'N/A (Claim-ID fehlt)');
                  agentProvider = String(claim.agent?.provider || agentProvider);
                  agentModel = String(claim.agent?.model || agentModel);
                  agentSurface = String(claim.agent?.executionSurface || agentSurface);
                } catch (error) {
                  core.warning(`Claim ${claimFile} ist nicht als JSON lesbar: ${error.message}`);
                }
              }
            } else if (claimFiles.length > 1) {
              core.warning(`Mehr als ein neuer Work-Claim gefunden (${claimFiles.length}); Validator bleibt für die Ablehnung zuständig.`);
            }

            let aheadBy = 'nicht-verfügbar';
            try {
              const comparison = await github.rest.repos.compareCommitsWithBasehead({
                owner: context.repo.owner,
                repo: context.repo.repo,
                basehead: `${pr.base.sha}...${pr.head.sha}`,
              });
              aheadBy = String(comparison.data.ahead_by ?? 'nicht-verfügbar');
            } catch (error) {
              core.warning(`Commit-Differenz konnte nicht ermittelt werden: ${error.message}`);
            }

            const replacements = {
              WORK_ITEM: pr.title || `Pull Request #${pr.number}`,
              CLAIM_ID: claimId,
              CLAIM_FILE: claimFile,
              HEAD_BRANCH: pr.head.ref,
              AGENT_PROVIDER: agentProvider,
              AGENT_MODEL: agentModel,
              AGENT_SURFACE: agentSurface,
              PRODUCTION_VERSION: 'nicht-verfügbar (CI-Preflight)',
              PRODUCTION_SHA: 'nicht-verfügbar (CI-Preflight)',
              PRODUCTION_BRANCH: 'nicht-verfügbar (CI-Preflight)',
              MAIN_SHA: pr.base.sha,
              HEAD_SHA: pr.head.sha,
              PROD_TO_MAIN_COMMITS: 'nicht-verfügbar (CI-Preflight)',
              MAIN_TO_HEAD_COMMITS: aheadBy,
              BASELINE_GENERATED_AT: new Date().toISOString(),
            };

            let normalizedBody = template;
            for (const [key, value] of Object.entries(replacements)) {
              normalizedBody = normalizedBody.split(`{{${key}}}`).join(String(value));
            }

            const unresolved = [...normalizedBody.matchAll(/\{\{([A-Z0-9_]+)\}\}/g)].map((match) => match[1]);
            if (unresolved.length > 0) {
              core.setFailed(`Kanonische Vorlage enthält unaufgelöste Platzhalter: ${[...new Set(unresolved)].join(', ')}`);
              return;
            }

            const summaryAnchor = 'Beschreibe präzise, was geändert wurde und warum. Nicht zusammenhängende Änderungen gehören nicht in diesen PR.';
            const preservedBody = originalBody || 'N/A – der ursprüngliche PR-Body war leer.';
            normalizedBody = normalizedBody.replace(
              summaryAnchor,
              `${summaryAnchor}\n\n### Ursprünglicher PR-Text (automatisch übernommen)\n\n${preservedBody}`,
            );

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              body: normalizedBody,
            });

            core.notice(`PR #${pr.number} wurde auf die kanonische Vorlage normalisiert. Der ursprüngliche Body wurde in Abschnitt 5 erhalten.`);
