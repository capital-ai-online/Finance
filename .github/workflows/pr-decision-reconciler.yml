name: PR Decision Evidence Reconciler
run-name: Decision Evidence gegen Live-Repository-State korrelieren

# Leading PR self-healing body chain.
# This workflow is the only mutable owner of open same-repository PR bodies.
# One per-PR writer lease converges, in order: structure -> production baseline ->
# Decision/Evidence -> auto-merge declaration, then performs at most one body PATCH.
# Other PR self-healing workflows may classify, observe or delegate, but must not
# mutate PR bodies or maintain a competing template/baseline contract.

on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: [CI, PR Governance, Container Security]
    types: [completed]
  check_run:
    types: [completed]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Optional open same-repository PR number; empty reconciles all open PRs.
        required: false
        type: string

permissions: {}

concurrency:
  group: pr-decision-reconciler-${{ github.event_name }}-${{ github.event.workflow_run.head_sha || github.event.check_run.head_sha || github.sha }}
  cancel-in-progress: true

jobs:
  resolve:
    name: Betroffene PRs fail-closed auflösen
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pr_numbers: ${{ steps.targets.outputs.pr_numbers }}
    steps:
      - name: Exakte offene Same-Repo-PRs bestimmen
        id: targets
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0 / Node 24
        env:
          DISPATCH_PR_NUMBER: ${{ inputs.pr_number }}
        with:
          script: |
            const repository = `${context.repo.owner}/${context.repo.repo}`;
            const normalizeSha = (value) => String(value || '').trim().toLowerCase();
            const numbers = new Set();

            async function addIfEligible(number, expectedHeadSha = '', expectedHeadRef = '') {
              if (!Number.isInteger(Number(number)) || Number(number) <= 0) return;
              const { data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: Number(number),
              });
              if (
                pr.state !== 'open' ||
                pr.base?.ref !== 'main' ||
                pr.head?.repo?.full_name !== repository
              ) return;
              if (expectedHeadSha && normalizeSha(pr.head?.sha) !== normalizeSha(expectedHeadSha)) return;
              if (expectedHeadRef && String(pr.head?.ref || '') !== String(expectedHeadRef)) return;
              numbers.add(Number(pr.number));
            }

            if (context.eventName === 'workflow_run') {
              const run = context.payload.workflow_run;
              const supportedRunEvent =
                run?.event === 'pull_request' ||
                (run?.event === 'workflow_dispatch' && run?.path === '.github/workflows/ci.yml');
              if (
                context.payload.action !== 'completed' ||
                run?.repository?.full_name !== repository ||
                run?.head_repository?.full_name !== repository ||
                !supportedRunEvent
              ) {
                core.setOutput('pr_numbers', '[]');
                return;
              }

              let candidates = run.pull_requests || [];
              if (candidates.length === 0 && /^[0-9a-f]{40}$/.test(normalizeSha(run.head_sha))) {
                candidates = await github.paginate(
                  github.rest.repos.listPullRequestsAssociatedWithCommit,
                  {
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    commit_sha: normalizeSha(run.head_sha),
                    per_page: 100,
                  },
                );
              }
              for (const candidate of candidates) {
                await addIfEligible(
                  candidate.number,
                  run.head_sha,
                  run.event === 'workflow_dispatch' ? run.head_branch : '',
                );
              }
            } else if (context.eventName === 'check_run') {
              const check = context.payload.check_run;
              // GitHub Actions checks are handled through workflow_run. This lane exists for
              // external required/security checks such as GitGuardian and license compliance.
              if (check?.app?.slug === 'github-actions') {
                core.setOutput('pr_numbers', '[]');
                return;
              }
              for (const candidate of check?.pull_requests || []) {
                await addIfEligible(candidate.number, check.head_sha);
              }
            } else if (context.eventName === 'push') {
              if (context.ref !== 'refs/heads/main') {
                core.setOutput('pr_numbers', '[]');
                return;
              }
              const pulls = await github.paginate(github.rest.pulls.list, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                base: 'main',
                per_page: 100,
              });
              for (const pr of pulls) await addIfEligible(pr.number);
            } else if (context.eventName === 'workflow_dispatch') {
              const requested = Number(process.env.DISPATCH_PR_NUMBER || 0);
              if (requested > 0) {
                await addIfEligible(requested);
              } else {
                const pulls = await github.paginate(github.rest.pulls.list, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  state: 'open',
                  base: 'main',
                  per_page: 100,
                });
                for (const pr of pulls) await addIfEligible(pr.number);
              }
            }

            const resolved = [...numbers].sort((a, b) => a - b);
            core.info(`Decision Evidence targets: ${resolved.length ? resolved.join(', ') : 'none'}`);
            core.setOutput('pr_numbers', JSON.stringify(resolved));

  reconcile:
    name: PR #${{ matrix.pr_number }} Decision Evidence aktualisieren
    needs: [resolve]
    if: needs.resolve.outputs.pr_numbers != '[]' && needs.resolve.outputs.pr_numbers != ''
    strategy:
      fail-fast: false
      matrix:
        pr_number: ${{ fromJSON(needs.resolve.outputs.pr_numbers) }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    concurrency:
      group: capital-ai-pr-writer-${{ matrix.pr_number }}
      cancel-in-progress: false
    permissions:
      actions: write
      checks: read
      # GitHub GraphQL enable/disablePullRequestAutoMerge requires repository
      # content write capability in addition to pull-request write for this
      # integration. Candidate code is never executed with these credentials.
      contents: write
      pull-requests: write

    steps:
      - name: Trusted CURRENT_MAIN Policy auschecken
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0 / Node 24
        with:
          ref: main
          path: policy
          fetch-depth: 1
          persist-credentials: false

      - name: Node.js einrichten
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0 / Node 24
        with:
          node-version: '24.18.0'

      - name: PR-v1.8-Struktur und exakten Bootstrap-Snapshot binden
        id: bootstrap_snapshot
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0 / Node 24
        env:
          PR_NUMBER: ${{ matrix.pr_number }}
        with:
          script: |
            const prNumber = Number(process.env.PR_NUMBER);
            const repository = `${context.repo.owner}/${context.repo.repo}`;
            const normalizeSha = (value) => String(value || '').trim().toLowerCase();
            const [{ data: pr }, { data: main }] = await Promise.all([
              github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
              }),
              github.rest.repos.getBranch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                branch: 'main',
              }),
            ]);
            if (
              pr.state !== 'open' ||
              pr.base?.ref !== 'main' ||
              pr.head?.repo?.full_name !== repository
            ) {
              core.setFailed('PR liegt außerhalb der sicheren Same-Repo/main-Bootstrap-Grenze.');
              return;
            }
            const body = String(pr.body || '');
            const currentV18 = /CAPITAL_AI_PR_TEMPLATE_VERSION:\s*1\.8\.0/.test(body);
            const headings = body.match(/^## .+$/gm) || [];
            const expected = [
              '## 1. 🧭 Entscheidung',
              '## 2. ✅ Evidence',
              '## 3. 🔍 Technical Evidence',
            ];
            const occurrenceCount = (needle) => body.split(needle).length - 1;
            const technicalDetailsSummary = '<summary>Technische Details & Traceability</summary>';
            const machineBaselineSummary = '<summary>🤖 Maschinenlesbare Produktions-Baseline</summary>';
            const canonical =
              headings.length === expected.length &&
              expected.every((heading, index) => headings[index] === heading) &&
              occurrenceCount(technicalDetailsSummary) === 1 &&
              occurrenceCount(machineBaselineSummary) === 1;
            core.setOutput('bootstrap_required', currentV18 && !canonical ? 'true' : 'false');
            core.setOutput('head_sha', normalizeSha(pr.head.sha));
            core.setOutput('head_ref', String(pr.head.ref || ''));
            core.setOutput('main_sha', normalizeSha(main.commit.sha));

      - name: Trusted Policy exakt an Live-CURRENT_MAIN binden
        working-directory: policy
        env:
          EXPECTED_MAIN_SHA: ${{ steps.bootstrap_snapshot.outputs.main_sha }}
        run: |
          set -euo pipefail
          observed="$(git rev-parse HEAD)"
          if [ "$observed" != "$EXPECTED_MAIN_SHA" ]; then
            echo "Trusted policy drift: checkout=$observed live=$EXPECTED_MAIN_SHA" >&2
            exit 1
          fi

      - name: Kandidaten-Head nur als Datenquelle auschecken
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0 / Node 24
        with:
          ref: ${{ steps.bootstrap_snapshot.outputs.head_sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Trusted CURRENT_MAIN in Kandidaten-Repository importieren
        working-directory: candidate
        run: git fetch --no-tags ../policy main:refs/remotes/origin/main

      - name: Main-Ancestry vor Production-Preflight prüfen
        id: bootstrap_lineage
        working-directory: candidate
        env:
          EXPECTED_MAIN_SHA: ${{ steps.bootstrap_snapshot.outputs.main_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if git merge-base --is-ancestor "$EXPECTED_MAIN_SHA" HEAD; then
            echo "branch_sync_required=false" >> "$GITHUB_OUTPUT"
            echo "PR-Head enthält CURRENT_MAIN $EXPECTED_MAIN_SHA; Production-Preflight ist zulässig."
          else
            echo "branch_sync_required=true" >> "$GITHUB_OUTPUT"
            echo "PR-Head enthält CURRENT_MAIN $EXPECTED_MAIN_SHA noch nicht; Preflight wird übersprungen und kanonischer Branch-Sync delegiert."
          fi

      - name: Stale Head vor Preflight an kanonischen Branch-Sync delegieren
        if: steps.bootstrap_lineage.outputs.branch_sync_required == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0 / Node 24
        env:
          PR_NUMBER: ${{ matrix.pr_number }}
        with:
          script: |
            const prNumber = String(process.env.PR_NUMBER || '').trim();
            if (!/^\d+$/.test(prNumber)) {
              core.setFailed('Branch-Sync dispatch requires an exact numeric PR number.');
              return;
            }
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'sync-agent-pr-branches.yml',
              ref: 'main',
              inputs: { pr_number: prNumber },
            });
            core.info(`PR #${prNumber}: stale generation delegated to canonical branch-sync before Production-Preflight.`);

      - name: PR-Scope mit trusted-main Klassifikator bestimmen
        if: steps.bootstrap_lineage.outputs.branch_sync_required != 'true'
        id: body_scope
        working-directory: candidate
        env:
          EVENT_NAME: pull_request
          PR_BASE_SHA: ${{ steps.bootstrap_snapshot.outputs.main_sha }}
          PR_HEAD_SHA: ${{ steps.bootstrap_snapshot.outputs.head_sha }}
        run: node ../policy/scripts/pr/classifyPrScope.mjs

      - name: Produktionsbaseline aus Trusted Main für die führende PR-Convergence erzeugen
        if: steps.bootstrap_lineage.outputs.branch_sync_required != 'true'
        working-directory: candidate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ matrix.pr_number }}
          PR_BASE_REF: origin/main
          PR_HEAD_REF: HEAD
          PR_BASELINE_OUTPUT: artifacts/pr/decision-reconciler-bootstrap-baseline.json
          CAPITAL_AI_PRODUCTION_HEALTH_URL: https://capital-ai.online/healthz
        run: node ../policy/scripts/pr/productionPreflight.mjs

      - name: Kanonischen v1.8-Body ausschließlich mit Trusted-Main-Renderer erzeugen
        if: steps.bootstrap_lineage.outputs.branch_sync_required != 'true' && steps.bootstrap_snapshot.outputs.bootstrap_required == 'true'
        working-directory: candidate
        env:
          PR_BASE_REF: origin/main
          PR_HEAD_REF: HEAD
          PR_HEAD_BRANCH: ${{ steps.bootstrap_snapshot.outputs.head_ref }}
          PR_BASELINE_OUTPUT: artifacts/pr/decision-reconciler-bootstrap-baseline.json
          PR_TEMPLATE_PATH: ../policy/.github/pull_request_template.md
          PR_PROJECT_MAPPING_PATH: ../policy/docs/projects/README.md
          PR_BODY_OUTPUT: artifacts/pr/decision-reconciler-bootstrap-body.md
          # Existing PRs may predate work-claim enforcement. This flag is scoped to
          # trusted-main body reconciliation only; new Agent PR creation remains
          # claim-required in open-agent-draft-pr.yml.
          PR_ALLOW_CLAIMLESS: 'true'
        run: node ../policy/scripts/pr/renderPullRequestBody.mjs

      - name: Evidence → Decision gegen Live-State reconciliieren
        if: steps.bootstrap_lineage.outputs.branch_sync_required != 'true'
        id: reconcile
        working-directory: policy
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ matrix.pr_number }}
          PR_CANONICAL_BOOTSTRAP_BODY: ../candidate/artifacts/pr/decision-reconciler-bootstrap-body.md
          PR_BASELINE_OUTPUT: ../candidate/artifacts/pr/decision-reconciler-bootstrap-baseline.json
          PR_CHECK_CLASS: ${{ steps.body_scope.outputs.class }}
          PR_CADENCE_REPO_ROOT: ../candidate
        run: node scripts/pr/reconcilePrDecisionEvidence.mjs

      - name: Main-Drift an kanonischen Branch-Sync delegieren
        if: steps.bootstrap_lineage.outputs.branch_sync_required != 'true' && steps.reconcile.outputs.branch_sync_required == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0 / Node 24
        env:
          PR_NUMBER: ${{ matrix.pr_number }}
        with:
          script: |
            const prNumber = String(process.env.PR_NUMBER || '').trim();
            if (!/^\d+$/.test(prNumber)) {
              core.setFailed('Branch-Sync dispatch requires an exact numeric PR number.');
              return;
            }
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'sync-agent-pr-branches.yml',
              ref: 'main',
              inputs: { pr_number: prNumber },
            });
            core.info(`PR #${prNumber}: canonical branch-sync workflow dispatched.`);

      - name: Decision-State ausgeben
        if: steps.bootstrap_lineage.outputs.branch_sync_required != 'true'
        env:
          PR_NUMBER: ${{ matrix.pr_number }}
          DECISION_STATUS: ${{ steps.reconcile.outputs.decision_status }}
          CHANGED: ${{ steps.reconcile.outputs.changed }}
          REASON: ${{ steps.reconcile.outputs.reason }}
          BRANCH_SYNC_REQUIRED: ${{ steps.reconcile.outputs.branch_sync_required }}
          AUTO_MERGE_STATE: ${{ steps.reconcile.outputs.auto_merge_state }}
          AUTO_MERGE_REASON: ${{ steps.reconcile.outputs.auto_merge_reason }}
          AUTO_MERGE_HEAD: ${{ steps.reconcile.outputs.auto_merge_head }}
          AUTO_MERGE_BASE: ${{ steps.reconcile.outputs.auto_merge_base }}
          AUTO_MERGE_CHECKS: ${{ steps.reconcile.outputs.auto_merge_required_checks }}
          AUTO_MERGE_EVALUATED_AT: ${{ steps.reconcile.outputs.auto_merge_evaluated_at }}
          AUTO_MERGE_ARMED_AT: ${{ steps.reconcile.outputs.auto_merge_armed_at }}
        run: |
          echo "PR #$PR_NUMBER decision_status=${DECISION_STATUS:-unchanged} changed=$CHANGED reason=$REASON"
          echo "branch_sync_required=${BRANCH_SYNC_REQUIRED:-false}"
          echo "auto_merge_state=${AUTO_MERGE_STATE:-n/a} reason=${AUTO_MERGE_REASON:-n/a}"
          echo "auto_merge_head=${AUTO_MERGE_HEAD:-n/a} base=${AUTO_MERGE_BASE:-n/a}"
          echo "auto_merge_checks=${AUTO_MERGE_CHECKS:-n/a}"
          echo "auto_merge_evaluated_at=${AUTO_MERGE_EVALUATED_AT:-n/a} armed_at=${AUTO_MERGE_ARMED_AT:-n/a}"
