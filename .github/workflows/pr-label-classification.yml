name: PR Label Classification
run-name: >-
  PR #${{ github.event.pull_request.number }} – classify complete label set

on:
  pull_request:
    types: [opened, reopened, synchronize, edited, labeled, unlabeled, ready_for_review, converted_to_draft]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-label-classification-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify PR labels
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: PR-Head ohne persistierte Zugangsdaten auschecken
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0 / Node 24
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Node.js einrichten
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0 / Node 24 action runtime
        with:
          node-version: '24.18.0'

      - name: Vollständiges Label-Set deterministisch klassifizieren
        id: labels
        env:
          PR_LABELS_JSON: ${{ toJSON(github.event.pull_request.labels) }}
        run: node scripts/pr/prLabelClassification.mjs --fail-on-drift
