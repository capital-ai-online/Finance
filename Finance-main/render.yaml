# Render Blueprint for AIF-CORE (v0.5.0)
# This file documents the required configuration; Render also lets you
# manage these manually in the dashboard under the service's "Environment"
# tab. If using this blueprint, all variables below get set in the
# dashboard and Render auto-forwards the ones matching Dockerfile ARG names
# (VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY, VITE_STRIPE_PUBLISHABLE_KEY)
# into the Docker build automatically.

services:
  - type: web
    name: aif-core
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter # free tier is not suitable for live Stripe keys / webhook reliability
    region: frankfurt
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # Supabase — REQUIRED both at build time (VITE_*) and runtime.
      # New key format (sb_publishable_/sb_secret_) is primary; legacy
      # anon/service_role JWTs only work if NOT disabled in the Supabase
      # dashboard under Project Settings -> API Keys.
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Stripe
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: VITE_STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_ID_STARTER
        sync: false
      - key: STRIPE_PRICE_ID_PRO
        sync: false
      - key: STRIPE_PRICE_ID_ENTERPRISE
        sync: false
      # Market / News data
      - key: ALPHA_VANTAGE_KEY
        sync: false
      - key: NEWS_API_KEY
        sync: false
      - key: COINMARKETCAP_API_KEY
        sync: false
